<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Legado Que Ensina · Gestão Psicopedagógica</title>
<link rel="icon" type="image/png" href="https://i.imgur.com/AUoGLEq.png">
<link href="https://cdn.jsdelivr.net/npm/tailwindcss@3.4.1/dist/tailwind.min.css" rel="stylesheet">
<script src="https://unpkg.com/lucide@latest"></script>
<script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;font-family:Inter,sans-serif;background:#f7f9f8;color:#263238}
body{overflow:hidden}
button,input,select,textarea{font-family:inherit}
button{cursor:pointer}
::-webkit-scrollbar{width:7px;height:7px}
::-webkit-scrollbar-thumb{background:#cbd5d1;border-radius:20px}
::-webkit-scrollbar-track{background:transparent}
:root{--sage:#5f8f7a;--sage-dark:#477363;--sage-light:#eaf3ee;--blue:#6288a8;--blue-light:#edf4f8;--ink:#263238;--muted:#718096;--line:#e6ece9;--surface:#fff}
@keyframes fadeIn{from{opacity:0;transform:translateY(15px)}to{opacity:1;transform:translateY(0)}}
@keyframes slideIn{from{opacity:0;transform:translateX(-20px)}to{opacity:1;transform:translateX(0)}}
@keyframes slideUp{from{opacity:0;transform:translateY(30px)}to{opacity:1;transform:translateY(0)}}
@keyframes pulse{0%{transform:scale(1)}50%{transform:scale(1.02)}100%{transform:scale(1)}}
@keyframes fade{from{opacity:.3;transform:translateY(8px)}to{opacity:1;transform:none}}
.card-animated{animation:fadeIn 0.4s ease forwards;opacity:0}
.stat-animated{animation:slideUp 0.5s ease forwards;opacity:0}
.btn-hover{transition:all 0.25s ease}
.btn-hover:hover{transform:translateY(-2px);box-shadow:0 4px 12px rgba(0,0,0,.06)}
.app{height:100vh;display:flex}
.sidebar{width:218px;background:#fff;border-right:1px solid var(--line);display:flex;flex-direction:column;padding:20px 14px;flex-shrink:0;z-index:20;overflow-y:auto}
.brand{height:52px;display:flex;align-items:center;gap:12px;color:var(--sage-dark);font-weight:700;padding:0 10px;white-space:nowrap;flex-shrink:0}
.brand-mark{width:36px;height:36px;border-radius:12px;overflow:hidden;flex-shrink:0}
.brand-mark img{width:100%;height:100%;object-fit:contain}
.brand-text{display:flex;flex-direction:column;line-height:1.2}
.brand-text .main{font-size:14px;font-weight:700;color:var(--sage-dark)}
.brand-text .sub{font-size:8px;color:#8a9892;letter-spacing:.03em}
.nav{margin-top:22px;display:flex;flex-direction:column;gap:2px}
.nav button{border:0;background:transparent;color:#718096;border-radius:12px;min-height:44px;padding:0 14px;display:flex;align-items:center;gap:13px;font-size:13px;font-weight:500;text-align:left;position:relative;transition:all .2s}
.nav button:hover{background:#f3f6f5;color:var(--ink)}
.nav button.active{background:var(--sage-light);color:var(--sage-dark);font-weight:600}
.nav svg{width:20px;min-width:20px}
.nav-badge{position:absolute;right:12px;top:50%;transform:translateY(-50%);background:#b85b5b;color:#fff;font-size:10px;font-weight:700;min-width:20px;height:20px;border-radius:10px;display:none;align-items:center;justify-content:center;padding:0 5px}
.side-bottom{margin-top:auto}
.main{min-width:0;flex:1;height:100vh;display:flex;flex-direction:column}
.topbar{height:72px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 30px;flex-shrink:0}
.page-title{display:flex;align-items:center;gap:10px;font-size:18px;font-weight:600}
.page-title svg{color:var(--sage);width:20px}
.user-mini{display:flex;align-items:center;gap:10px}
.avatar{width:38px;height:38px;border-radius:50%;background:var(--sage-light);color:var(--sage-dark);display:grid;place-items:center;font-weight:700;overflow:hidden;background-size:cover;background-position:center}
.content{padding:26px 30px 40px;overflow:auto;height:calc(100vh - 72px)}
.view{display:none;animation:fade .3s ease}
.view.active{display:block}
.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:20px;box-shadow:0 2px 8px rgba(30,50,40,.025);transition:all .25s}
.card:hover{box-shadow:0 6px 20px rgba(30,50,40,.06)}
.grid{display:grid;gap:16px}
.stats{grid-template-columns:repeat(4,minmax(0,1fr))}
.stat-label{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:#91a09a;font-weight:600}
.stat-value{font-size:25px;font-weight:700;margin-top:8px;color:#263238}
.stat-sub{font-size:11px;color:#8a9892;margin-top:5px}
.btn{border:0;border-radius:11px;padding:9px 15px;font-size:13px;font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:7px;transition:all .25s}
.btn svg{width:16px}
.btn-primary{background:var(--sage);color:#fff}
.btn-primary:hover{background:var(--sage-dark);transform:translateY(-2px)}
.btn-soft{background:var(--sage-light);color:var(--sage-dark)}
.btn-soft:hover{background:#d5e8df;transform:translateY(-2px)}
.btn-blue{background:var(--blue-light);color:#557994}
.btn-blue:hover{background:#d5e4ee;transform:translateY(-2px)}
.btn-danger{background:#fff0f0;color:#b85b5b}
.btn-danger:hover{background:#fdd;transform:translateY(-2px)}
.btn-outline{background:#fff;border:1px solid var(--line);color:#53615c}
.btn-outline:hover{background:#f7faf8;transform:translateY(-2px)}
.btn-outline:disabled{opacity:.5;cursor:not-allowed;transform:none}
.btn-sm{padding:7px 10px;font-size:12px}
.input,.select,.textarea{width:100%;border:1px solid #dfe7e3;background:#fbfcfc;border-radius:10px;padding:9px 11px;outline:0;font-size:13px;color:var(--ink)}
.input:focus,.select:focus,.textarea:focus{border-color:#8eb2a3;box-shadow:0 0 0 3px rgba(95,143,122,.09)}
.textarea{resize:vertical;min-height:100px}
.label{display:block;font-size:11px;font-weight:600;color:#66756f;margin-bottom:5px}
.field{margin-bottom:13px}
.form-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.form-grid.two{grid-template-columns:repeat(2,minmax(0,1fr))}
.form-actions{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap}
.section-head{display:flex;align-items:center;justify-content:space-between;gap:15px;margin-bottom:16px}
.section-title{font-size:15px;font-weight:700;color:#34413c}
.section-sub{font-size:12px;color:#89968f;margin-top:3px}
/* Sub-page tabs (inline navigation) */
.subpage-tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:18px;border-bottom:1px solid var(--line);padding-bottom:12px}
.subpage-tabs button{border:0;background:transparent;color:#718096;padding:8px 14px;border-radius:10px;font-size:12px;font-weight:600;display:inline-flex;align-items:center;gap:7px;transition:all .2s}
.subpage-tabs button:hover{background:#f3f6f5;color:var(--ink)}
.subpage-tabs button.active{background:var(--sage-light);color:var(--sage-dark)}
.subpage-tabs button svg{width:15px;height:15px}
.dash-hero{background:linear-gradient(135deg,#fff,#f3f8f5);border:1px solid var(--line);border-radius:24px;padding:28px 30px;margin-bottom:20px;display:flex;justify-content:space-between;align-items:flex-start;gap:20px;flex-wrap:wrap}
.dash-hero .greeting{font-size:24px;font-weight:800;letter-spacing:-.03em;color:#263832;margin:0}
.dash-hero .greeting span{color:var(--sage)}
.dash-hero .subtitle{font-size:13px;color:#74827c;margin:6px 0 0}
.dash-hero .badges{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.dash-stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:20px}
.dash-stat{background:#fff;border:1px solid var(--line);border-radius:18px;padding:18px 20px;position:relative}
.dash-stat:hover{transform:translateY(-2px);box-shadow:0 4px 12px rgba(0,0,0,.06)}
.dash-stat .ds-label{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:#91a09a;font-weight:700}
.dash-stat .ds-value{font-size:26px;font-weight:800;color:#263238;margin-top:6px}
.dash-stat .ds-sub{font-size:11px;color:#9aa6a1;margin-top:4px}
.dash-stat .ds-icon{position:absolute;top:16px;right:18px;width:36px;height:36px;border-radius:10px;display:grid;place-items:center;background:#f4f8f6;color:var(--sage)}
.dash-stat.blue .ds-icon{background:#edf4f8;color:var(--blue)}
.dash-stat.amber .ds-icon{background:#fff8ef;color:#b8732a}
.dash-stat.rose .ds-icon{background:#fff0f0;color:#b85b5b}
.dash-grid{display:grid;grid-template-columns:1.5fr 1fr;gap:18px}
.dash-card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:20px}
.dash-card .dc-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
.dash-card .dc-title{font-size:14px;font-weight:700;color:#34413c}
.dash-card .dc-sub{font-size:11px;color:#8a9892;margin-top:2px}
.today-list{display:flex;flex-direction:column;gap:8px}
.today-item{display:flex;align-items:center;gap:12px;padding:12px 14px;border:1px solid var(--line);border-radius:14px;cursor:pointer;background:#fff}
.today-item:hover{border-color:#c8ddd3;background:#fafcfb}
.today-item .ti-time{font-size:12px;font-weight:800;color:var(--sage-dark);min-width:44px}
.today-item .ti-info{flex:1}
.today-item .ti-name{font-size:13px;font-weight:700;color:#2e3d37}
.today-item .ti-type{font-size:10px;color:#8a9892;margin-top:1px}
.today-item .ti-actions{display:flex;gap:5px}
.workload-card{background:linear-gradient(135deg,#fff,#f8fbf9);border:1px solid var(--line);border-radius:18px;padding:20px}
.workload-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
.workload-header .wl-title{font-size:14px;font-weight:700;color:#34413c}
.workload-header .wl-percent{font-size:26px;font-weight:800;color:var(--sage)}
.workload-bar{height:10px;border-radius:10px;background:#edf1ef;overflow:hidden;display:flex}
.workload-segment{height:100%;transition:width .8s ease}
.workload-segment.occupied{background:linear-gradient(90deg,var(--sage),var(--sage-dark))}
.workload-segment.available{background:#d4e6dc}
.workload-legend{display:flex;gap:16px;margin-top:12px;font-size:11px;color:#8a9892}
.workload-legend span{display:flex;align-items:center;gap:5px}
.workload-legend .dot{width:10px;height:10px;border-radius:3px}
.workload-legend .dot.occ{background:var(--sage)}
.workload-legend .dot.avail{background:#d4e6dc}
.month-summary{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.ms-item{padding:14px;background:#f8faf9;border-radius:12px;text-align:center}
.ms-item .ms-label{font-size:10px;color:#89968f;text-transform:uppercase;font-weight:600}
.ms-item .ms-value{font-size:20px;font-weight:800;color:#34413c;margin-top:5px}
.agenda-toolbar{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:16px}
.toolbar-group{display:flex;gap:5px;align-items:center}
.month-label{font-size:15px;font-weight:700;min-width:140px;text-align:center;color:#34413c}
.week-grid{display:grid;grid-template-columns:60px repeat(5,minmax(100px,1fr));min-width:560px}
.week-head{background:#fafcfb;border-bottom:1px solid var(--line);padding:8px 4px;text-align:center;font-size:10px;font-weight:700;color:#68766f}
.time-cell{height:50px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);padding:4px 6px;font-size:9px;color:#97a39e;text-align:right}
.slot{height:50px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);padding:3px;background:#fff;cursor:pointer}
.slot:hover{background:#f8fbf9}
.slot .empty-slot{height:100%;display:grid;place-items:center;color:#d0d8d4;font-size:14px;opacity:0}
.slot:hover .empty-slot{opacity:1}
.event{padding:4px 6px;border-radius:7px;font-size:9px;line-height:1.25;cursor:pointer;overflow:hidden}
.event.psico{background:#edf4f8;color:#557792}
.event.psicopeg{background:#f0f5ec;color:#5d806c}
.event.aula{background:#f5f0f8;color:#80678c}
.event strong{display:block;font-size:9px;margin-bottom:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.event-actions{display:flex;gap:2px;margin-top:3px}
.event-actions button{border:0;background:rgba(255,255,255,.7);border-radius:4px;padding:1px 4px;font-size:8px;cursor:pointer}
.month-grid{display:grid;grid-template-columns:repeat(7,1fr);border:1px solid var(--line);border-radius:14px;overflow:hidden;background:#fff}
.month-day{min-height:72px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);padding:5px;cursor:pointer}
.month-day:hover{background:#fafcfb}
.month-day.other{background:#fafafa;color:#b9c2be}
.day-number{font-size:10px;font-weight:700}
.dot-row{display:flex;flex-wrap:wrap;gap:2px;margin-top:5px}
.dot{width:5px;height:5px;border-radius:50%}
.dot.psico{background:#8db0c8}
.dot.psicopeg{background:#8eb29d}
.dot.aula{background:#ad94b9}
.fin-hero{background:linear-gradient(135deg,#fff,#f3f8f5);border:1px solid var(--line);border-radius:24px;padding:24px 28px;margin-bottom:20px;display:flex;justify-content:space-between;align-items:center;gap:20px;flex-wrap:wrap}
.fin-hero .fh-title{font-size:20px;font-weight:800;color:#263832;margin:0}
.fin-hero .fh-sub{font-size:12px;color:#74827c;margin:4px 0 0}
.fin-month-nav{display:flex;align-items:center;gap:10px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:6px 10px}
.fin-month-nav button{border:0;background:transparent;color:#6b7a73;cursor:pointer;padding:4px 8px;border-radius:8px}
.fin-month-nav .month-text{font-size:13px;font-weight:700;color:#34413c;min-width:140px;text-align:center;text-transform:capitalize}
.fin-cards{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:20px}
.fin-card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:18px 20px;transition:all .25s}
.fin-card:hover{transform:translateY(-2px);box-shadow:0 4px 12px rgba(0,0,0,.06)}
.fin-card .fc-label{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:#91a09a;font-weight:700}
.fin-card .fc-value{font-size:24px;font-weight:800;margin-top:6px}
.fin-card .fc-sub{font-size:11px;color:#9aa6a1;margin-top:4px}
.fin-card .fc-bar{height:4px;border-radius:4px;background:#edf1ef;margin-top:10px;overflow:hidden}
.fin-card .fc-bar span{display:block;height:100%;border-radius:4px}
.fin-card.positive .fc-value{color:var(--sage-dark)}
.fin-card.positive .fc-bar span{background:var(--sage)}
.fin-card.negative .fc-value{color:#c0504d}
.fin-card.negative .fc-bar span{background:#e8a0a0}
.fin-card.neutral .fc-value{color:#34413c}
.fin-card.neutral .fc-bar span{background:#b8ccc2}
.fin-grid{display:grid;grid-template-columns:1.4fr 1fr;gap:18px}
.fin-panel{background:#fff;border:1px solid var(--line);border-radius:18px;padding:20px}
.fin-panel .fp-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
.fin-panel .fp-title{font-size:14px;font-weight:700;color:#34413c}
.fin-table{width:100%;border-collapse:collapse}
.fin-table th{text-align:left;font-size:10px;color:#87948e;text-transform:uppercase;padding:10px 8px;border-bottom:1px solid var(--line);font-weight:700}
.fin-table td{padding:12px 8px;border-bottom:1px solid #f0f3f2;font-size:12px}
.payment-method-badge{display:inline-flex;gap:4px;font-size:10px;font-weight:600;padding:3px 8px;border-radius:12px;background:#e8f0fe;color:#3a6cb8}
.fin-pending-item{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid #f0f3f2}
.fin-pending-item .fp-info{flex:1}
.fin-pending-item .fp-name{font-size:13px;font-weight:700}
.fin-pending-item .fp-date{font-size:10px;color:#8a9892;margin-top:2px}
.fin-pending-item .fp-value{font-size:14px;font-weight:800}
.assessment-shell{display:grid;gap:18px}
.assessment-hero{background:linear-gradient(135deg,#fff,#f4f8f6);border:1px solid var(--line);border-radius:24px;padding:24px;display:flex;justify-content:space-between;gap:18px;flex-wrap:wrap}
.assessment-hero h2{margin:0;font-size:22px;color:#263832}
.assessment-hero p{margin:7px 0 0;color:#74827c;font-size:12px;line-height:1.6;max-width:680px}
.assessment-metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.assessment-metric{background:#fff;border:1px solid var(--line);border-radius:16px;padding:15px 16px}
.assessment-metric .m-label{font-size:10px;text-transform:uppercase;color:#89968f;font-weight:700}
.assessment-metric .m-value{font-size:24px;font-weight:800;color:#263832;margin-top:6px}
.assessment-metric .m-sub{font-size:10px;color:#9aa6a1;margin-top:3px}
.instrument-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.instrument-card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:17px}
.instrument-card:hover{border-color:#c4d8ce;box-shadow:0 8px 24px rgba(30,50,40,.06)}
.instrument-card .instrument-head{display:flex;justify-content:space-between;gap:12px}
.instrument-card .instrument-title{font-size:14px;font-weight:800;color:#2e3d37}
.instrument-card .instrument-desc{font-size:11px;color:#7d8b85;line-height:1.55;margin-top:6px}
.instrument-card .instrument-meta{display:flex;gap:7px;flex-wrap:wrap;margin-top:12px}
.assessment-table{width:100%;border-collapse:collapse}
.assessment-table th{font-size:10px;text-transform:uppercase;color:#8b9892;text-align:left;padding:11px 12px;border-bottom:1px solid var(--line)}
.assessment-table td{padding:13px 12px;border-bottom:1px solid #edf1ef;font-size:12px;color:#52605a}
.assessment-status{display:inline-flex;padding:4px 8px;border-radius:7px;font-size:10px;font-weight:700;background:#edf5f0;color:#4b7863}
.aval-type-badge{display:inline-flex;gap:5px;font-size:10px;font-weight:600;padding:3px 9px;border-radius:20px;background:#eaf3ee;color:#3d8a6b}
.aval-type-badge.screening{background:#fef3e8;color:#b8732a}
.aval-type-badge.anamnese{background:#e8f0fe;color:#3a6cb8}
.aval-step{max-width:650px;margin:0 auto}
.step-card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:24px}
.step-question{font-size:16px;font-weight:700;margin:10px 0 16px;color:#263238;line-height:1.5}
.step-options{display:flex;flex-direction:column;gap:8px}
.step-options label{display:flex;align-items:center;gap:10px;padding:12px 14px;border:2px solid var(--line);border-radius:12px;cursor:pointer;font-size:13px}
.step-options label:hover{border-color:#b8ccc2;background:#f8fbf9}
.step-options label.selected{border-color:var(--sage);background:var(--sage-light)}
.step-nav{display:flex;justify-content:space-between;margin-top:20px}
.step-nav button{padding:10px 20px;border:0;border-radius:10px;font-weight:600;font-size:12px;cursor:pointer;background:var(--sage);color:#fff}
.step-progress-wide{height:5px;background:#edf1ef;border-radius:8px;overflow:hidden;margin:8px 0 18px}
.step-progress-wide span{display:block;height:100%;background:var(--sage);border-radius:8px;transition:width .25s ease}
.onboarding-content-page{max-width:900px;margin:0 auto}
.onboarding-block{background:#fff;border:1px solid var(--line);border-radius:18px;padding:24px;margin-bottom:16px}
.onboarding-block h3{margin:0 0 12px;font-size:16px;color:#34413c}
.onboarding-block ul{padding-left:20px;margin:0}
.onboarding-block li{font-size:13px;line-height:1.8;color:#68766f;margin-bottom:8px}
.onboarding-block li strong{color:#34413c}
.onboarding-step{display:flex;align-items:center;gap:16px;padding:16px;border:1px solid var(--line);border-radius:14px;margin-bottom:10px;background:#fff;cursor:pointer}
.onboarding-step:hover{border-color:#c8ddd3;transform:translateX(4px);box-shadow:0 4px 15px rgba(50,90,70,.08)}
.onboarding-step.completed{background:#f8fbf9;border-color:#c5e0d0}
.onboarding-icon{width:44px;height:44px;border-radius:12px;display:flex;align-items:center;justify-content:center;flex-shrink:0;background:var(--sage-light);color:var(--sage-dark)}
.onboarding-step.completed .onboarding-icon{background:#c5e0d0;color:#2d6a4f}
.onboarding-content{flex:1}

function defaultData(){ return { session:false, professor:{ nome:"Professor", especialidade:"Psicopedagogia Clínica", bio:"", foto:"", cargo:"Professor", ativo:true, plano:'mensal', observacoes:[], evolucoesPessoais:[], configuracoes:{ horarioTrabalho:{dias:[1,2,3,4,5],inicio:"08:00",fim:"18:00",pausaInicio:"12:00",pausaFim:"13:00"}, valorSessaoPadrao:0, formasPagamento:["pix","cartao"] } }, alunos:[], agenda:[], transacoes:[], listaEspera:[], equipe:[], onboarding:{} }; }
function weekStart(d){ const x=new Date(d); const day=x.getDay(); x.setDate(x.getDate()+(day===0?-6:1-day)); x.setHours(0,0,0,0); return x; }
function weekDates(d){ const s=weekStart(d); return WEEK.map((_,i)=>{ const x=new Date(s); x.setDate(s.getDate()+i); return x; }); }
function weekPending(){ const keys=weekDates(new Date()).map(dateISO); return activeAppointments().filter(a=>keys.includes(a.data)&&!a.pago).reduce((s,a)=>s+(getStudent(a.alunoId)?.valor||0),0); }
function monthPaid(){ const y=new Date().getFullYear(),m=new Date().getMonth(); return (data.transacoes||[]).filter(t=>{ const d=parseDate(t.data); return d.getFullYear()===y&&d.getMonth()===m&&(t.tipo||"receita")==="receita"; }).reduce((s,t)=>s+Number(t.valor),0); }
function monthDone(){ const y=new Date().getFullYear(),m=new Date().getMonth(); return activeAppointments().filter(a=>{ const d=parseDate(a.data); return d.getFullYear()===y&&d.getMonth()===m&&a.presente; }).length; }
function monthScheduled(){ const y=new Date().getFullYear(),m=new Date().getMonth(); return activeAppointments().filter(a=>{ const d=parseDate(a.data); return d.getFullYear()===y&&d.getMonth()===m; }).length; }
function attendanceRate(){ const arr=activeAppointments().filter(a=>a.presente||a.status==="falta"); return arr.length?Math.round(arr.filter(a=>a.presente).length/arr.length*100):0; }
function timeToMinutes(v){ const [h,m]=String(v||'00:00').split(':').map(Number); return (h||0)*60+(m||0); }
function getWorkSchedule(){ return data.professor?.configuracoes?.horarioTrabalho || {dias:[1,2,3,4,5],inicio:'08:00',fim:'18:00',pausaInicio:'12:00',pausaFim:'13:00'}; }
function scheduleDayHours(d){ const w=getWorkSchedule(); if(!(w.dias||[]).includes(d)) return 0; const g=Math.max(0,timeToMinutes(w.fim)-timeToMinutes(w.inicio)); const b=Math.max(0,timeToMinutes(w.pausaFim)-timeToMinutes(w.pausaInicio)); return Math.max(0,g-b)/60; }
const weeklyAvailableHours = () => (getWorkSchedule().dias||[]).reduce((s,d)=>s+scheduleDayHours(d),0);
const weeklyOccupiedHours = () => { const k=weekDates(new Date()).map(dateISO); return activeAppointments().filter(a=>k.includes(a.data)).length; };
const getSaudacao = () => { const h=new Date().getHours(); return h<12?"Bom dia":h<18?"Boa tarde":"Boa noite"; };
const getPlanLabel = p => ({mensal:'Mensal',trimestral:'Trimestral',semestral:'Semestral'}[p]||'Mensal');
function daysUntil(v){ if(!v)return null; return Math.ceil((new Date(v)-new Date())/(864e5)); }
function getTimeRemaining(v){ if(!v)return null; const d=new Date(v)-new Date(); if(d<=0)return{days:0,hours:0,minutes:0,seconds:0,total:0}; return {days:Math.floor(d/864e5),hours:Math.floor(d%864e5/36e5),minutes:Math.floor(d%36e5/6e4),seconds:Math.floor(d%6e4/1e3),total:d}; }
function isLicenseValid(p){ if(!p)return{ok:false,reason:'Cadastro não encontrado.',expired:true}; if(p.ativo===false)return{ok:false,reason:'Acesso bloqueado.',blocked:true}; if(p.licenca_fim){ const fim=new Date(p.licenca_fim); if(fim<new Date())return{ok:false,reason:'Plano expirou em '+fmtDateTime(p.licenca_fim),expired:true}; const t=getTimeRemaining(p.licenca_fim); if(t.days<=5)return{ok:true,warning:true,diasRestantes:t.days,reason:`Expira em ${t.days} dia(s).`}; } return {ok:true}; }
const getMetodoPagamentoLabel = m => ({dinheiro:'Dinheiro',pix:'PIX',cartao:'Cartão',cartao_parcelado:'Cartão Parcelado'}[m]||m||'Não informado');
const getMetodoPagamentoClass = m => (['dinheiro','pix','cartao','cartao_parcelado'].includes(m)?m:'');
const isMasterEmail = e => String(e||'').trim().toLowerCase()===MASTER_EMAIL;
const hideTeacherUI = () => document.querySelectorAll('.teacher-only-nav').forEach(el=>el.style.display='none');
const showTeacherUI = () => document.querySelectorAll('.teacher-only-nav').forEach(el=>el.style.display='');

function studentPager(items,page,size=5,onclick=""){

    return { slice, total, page, controls: total>1?`<div style="display:flex;justify-content:center;gap:8px;margin-top:16px;padding-top:12px;border-top:1px solid var(--line)"><button class="btn btn-outline btn-sm" ${page<=1?"disabled":""} onclick="${onclick}(${page-1})">Anterior</button><span style="font-size:11px;color:#718078">${page}/${total}</span><button class="btn btn-outline btn-sm" ${page>=total?"disabled":""} onclick="${onclick}(${page+1})">Próxima</button></div>`:"" };
}

async function getCurrentUserId(){ try{ const {data:u,error}=await supabaseClient.auth.getUser(); if(error)return null; if(u?.user?.id){currentUserId=u.user.id; return currentUserId;} return null; }catch(e){return null;} }
async function getUserId(){ if(currentUserId)return currentUserId; const id=await getCurrentUserId(); if(id){currentUserId=id; return id;} throw new Error('Não autenticado'); }
async function loginSupabase(email,password){ try{ const {data,error}=await supabaseClient.auth.signInWithPassword({email,password}); if(error)throw error; return data; }catch(e){ console.error(e); notify('Usuário ou senha inválidos.'); return null; } }
async function checkSession(){ try{ const {data,error}=await supabaseClient.auth.getSession(); if(error)throw error; return data.session!==null; }catch(e){ return false; } }
async function logoutSilent(){ if(licenseCheckInterval){clearInterval(licenseCheckInterval);licenseCheckInterval=null;} if(licenseTimerInterval){clearInterval(licenseTimerInterval);licenseTimerInterval=null;} try{ await supabaseClient.auth.signOut(); }catch(e){} data=defaultData(); data.session=false; isMaster=false; document.getElementById("masterNav").style.display="none"; showTeacherUI(); isDataLoaded=false; currentUserId=null; currentStudent=null; currentPage="dashboard"; }
function showExpiredScreen(reason){ document.getElementById('app').style.display='none'; document.getElementById('loginScreen').style.display='none'; document.getElementById('expiredScreen').style.display='grid'; try{lucide.createIcons();}catch(e){} }
function dismissLicenseBanner(){ bannerDismissed=true; const b=document.getElementById('licenseBanner'); if(b)b.style.display='none'; try{ localStorage.setItem('licenseBannerDismissed_'+(data.professor?.id||''),'true'); }catch(e){} }

async function login(){
    const user=document.getElementById("loginUser").value.trim();
    const pass=document.getElementById("loginPass").value;
    if(!user||!pass){notify("Preencha e-mail e senha.");return;}
    const btn=document.getElementById("loginBtn"); const orig=btn.innerHTML;
    btn.innerHTML='Entrando...'; btn.disabled=true;
    const result=await loginSupabase(user,pass);
    btn.innerHTML=orig; btn.disabled=false;
    try{lucide.createIcons();}catch(e){}
    if(!result)return;
    try{
        isMaster = isMasterEmail(result.user?.email||user);
        if(isMaster){
            data=defaultData(); data.session=true; isDataLoaded=true; currentUserId=result.user.id;
            try{ data.master=await loadMasterData(); }catch(e){ data.master={professores:[],pagamentos:[]}; }
            hideTeacherUI(); document.getElementById("masterNav").style.display="";
            document.getElementById("loginScreen").style.display="none";
            document.getElementById("expiredScreen").style.display="none";
            document.getElementById("app").style.display="flex";
            document.getElementById("topUserName").textContent="Suporte";
            document.getElementById("topAvatar").textContent="S";
            try{await loadRecados();}catch(e){}
            navigate("master"); notify("Acesso MASTER liberado."); return;
        }
        showTeacherUI(); document.getElementById("masterNav").style.display="none";
        const loaded=await loadData();
        if(!loaded){ await supabaseClient.auth.signOut(); notify("Cadastro não encontrado."); return; }
        data=loaded; data.session=true; isDataLoaded=true; loadWorkScheduleLocal();
        const lic=isLicenseValid(data.professor);
        if(!lic.ok){ await supabaseClient.auth.signOut(); data=defaultData(); data.session=false; isDataLoaded=false; showExpiredScreen(lic.reason); return; }
        try{await loadRecados();}catch(e){}
        document.getElementById("loginScreen").style.display="none";
        document.getElementById("expiredScreen").style.display="none";
        document.getElementById("app").style.display="flex";
        updateUser(); navigate("dashboard");
        notify(`Bem-vindo, ${data.professor?.nome||"Professor"}!`);
    }catch(err){ console.error(err); notify('Erro ao carregar dados.'); }
}

async function logout(){
    if(data&&data.session){ try{ await saveData(); }catch(e){} }
    try{ await supabaseClient.auth.signOut(); }catch(e){}
    data=defaultData(); data.session=false; isMaster=false;
    document.getElementById("masterNav").style.display="none";
    showTeacherUI(); isDataLoaded=false; currentUserId=null; currentStudent=null; currentPage="dashboard";
    dashboardSubPage="overview"; alunosSubPage="lista";
    recadosList=[]; recadosUnreadCount=0; updateRecadosBadge();
    document.getElementById("app").style.display="none";
    document.getElementById("loginScreen").style.display="grid";
    document.getElementById("expiredScreen").style.display="none";
    document.getElementById("loginPass").value="";
    document.querySelectorAll(".view").forEach(v=>{v.innerHTML='';v.classList.remove('active');});
    document.getElementById("page-dashboard").classList.add("active");
    document.getElementById("topUserName").textContent="";
    document.getElementById("topAvatar").textContent="?";
    document.getElementById("loginUser").value="";
    document.getElementById("loginUser").focus();
    notify("Logout realizado!");
}

function updateUser(){
    const p=data.professor; if(!p)return;
    document.getElementById("topUserName").textContent=p.nome;
    const a=document.getElementById("topAvatar");
    if(p.foto){ a.style.backgroundImage=`url('${p.foto}')`; a.textContent=""; }

function navigate(page){
    currentPage=page; currentStudent=null;
    document.querySelectorAll(".view").forEach(x=>x.classList.remove("active"));
    const target=document.getElementById("page-"+page);
    if(target)target.classList.add("active");
    document.querySelectorAll(".nav button").forEach(x=>x.classList.toggle("active",x.dataset.page===page));
    const info={ dashboard:["layout-dashboard","Dashboard"], alunos:["users","Alunos"], agenda:["calendar-days","Agenda"], avaliacoes:["clipboard-check","Avaliações"], financeiro:["wallet-cards","Financeiro"], master:["shield-check","Suporte"], prontuario:["notebook-tabs","Prontuário"] };
    if(info[page])document.getElementById("pageTitle").innerHTML=`<i data-lucide="${info[page][0]}"></i>${info[page][1]}`;
    if(page!=="avaliacoes"){ avalStepMode=null; avalStepQuestions=[]; avalStepCurrentIndex=0; avalStepResponses=[]; avalStepTemplateId=null; avalStepAlunoId=null; }
    if(page==="dashboard") dashboardSubPage="overview";
    if(page==="alunos") alunosSubPage="lista";
    renderPage(); try{lucide.createIcons();}catch(e){}
}

// Sub-navegação do Dashboard
function setDashboardSubPage(sub){
    dashboardSubPage=sub;
    if(sub==="recados") renderRecados();
    else if(sub==="perfil") renderPerfil();
    else renderDashboard();
    try{lucide.createIcons();}catch(e){}
}

// Sub-navegação de Alunos
function setAlunosSubPage(sub){
    alunosSubPage=sub;
    if(sub==="espera") renderListaEspera();
    else renderAlunos();
    try{lucide.createIcons();}catch(e){}
}

function renderPage(){
    if(currentPage==="master"&&!isMaster){navigate("dashboard");return;}
    if(!isDataLoaded||!data.session){ document.querySelectorAll(".view").forEach(v=>{ if(v.id!=="page-dashboard")v.innerHTML=`<div class="empty">Faça login.</div>`; }); return; }
    if(currentPage==="dashboard"){
        if(dashboardSubPage==="recados") renderRecados();
        else if(dashboardSubPage==="perfil") renderPerfil();
        else renderDashboard();
    }
    if(currentPage==="alunos"){
        if(alunosSubPage==="espera") renderListaEspera();
        else renderAlunos();
    }
    if(currentPage==="agenda")renderAgenda();
    if(currentPage==="avaliacoes")renderAvaliacoes();
    if(currentPage==="financeiro")renderFinanceiro();
    if(currentPage==="master"&&isMaster)renderMasterDashboard();
}

function filterStudents(){
    const term=(document.getElementById("studentSearch")?.value||"").toLowerCase();
    const list=(data.alunos||[]).filter(a=>`${a.nome} ${a.responsavel} ${(a.tags||[]).join(" ")}`.toLowerCase().includes(term));

    if(!list.length){ g.innerHTML=`<div class="card empty" style="grid-column:1/-1">Nenhum aluno.</div>`; return; }
    g.innerHTML=list.map(a=>`<div class="student card-animated" onclick="openStudent('${a.id}')"><div class="student-top">${avatarHTML(a)}<div><div class="student-name">${esc(a.nome)}</div><div class="student-meta">${a.idade?a.idade+" anos · ":""}${esc(a.serie||"Sem série")}</div></div></div><div class="student-meta" style="margin-top:11px">Resp: ${esc(a.responsavel||"—")}</div><div class="tags">${(a.tags||[]).slice(0,5).map(t=>`<span class="tag">${esc(t)}</span>`).join("")}</div><div style="display:flex;justify-content:space-between;margin-top:15px;padding-top:11px;border-top:1px solid #f0f3f2"><span style="font-size:10px;color:#8a9892">Sessão</span><strong style="font-size:12px">${money(a.valor)}</strong></div></div>`).join("");

function toggleStudentForm(force){
    const f=document.getElementById("newStudentForm"); if(!f)return;

async function saveStudent(){

function renderWaitlistRows(lista){
    if(!lista.length) return `<div class="waitlist-empty"><div class="waitlist-empty-icon"><i data-lucide="inbox"></i></div><div style="font-size:14px;font-weight:800;color:#34413c">Nenhum interessado encontrado</div><div style="font-size:11px;color:#8a9892;margin-top:5px">Ajuste os filtros ou cadastre um novo interessado.</div><button class="btn btn-primary btn-sm" style="margin-top:14px" onclick="openWaitlistForm(-1)">+ Novo interessado</button></div>`;
    return lista.map((w,i)=>`
      <div class="waitlist-row" onclick="openWaitlistDetail(${i})">
        <div class="waitlist-priority ${esc(w.prioridade||'media')}"></div>
        <div class="waitlist-row-avatar">${esc(initials(w.nome))}</div>
        <div style="min-width:0">
          <div class="waitlist-row-name">${esc(w.nome)}</div>
          <div class="waitlist-row-meta">
            <span>${esc(w.area||'Área não informada')}</span>
            ${w.idade?`<span>· ${w.idade} anos</span>`:''}
            ${w.horario?`<span>· ${esc(w.horario)}</span>`:''}
            ${w.telefone?`<span>· ${esc(w.telefone)}</span>`:''}
          </div>
        </div>
        <div class="waitlist-row-side">
          <span class="waitlist-priority-badge ${esc(w.prioridade||'media')}">${w.prioridade==='alta'?'Alta':w.prioridade==='baixa'?'Baixa':'Média'}</span>
          <button class="btn btn-outline btn-sm" onclick="event.stopPropagation();openWaitlistDetail(${i})"><i data-lucide="chevron-right"></i></button>
        </div>
      </div>`).join('');
}
function filterWaitlist(){
    const q=(document.getElementById('waitlistSearch')?.value||'').trim().toLowerCase();
    const pr=document.getElementById('waitlistPriorityFilter')?.value||'todos';
    const area=document.getElementById('waitlistAreaFilter')?.value||'todos';
    const list=(data.listaEspera||[]).filter(w=>{
        const hay=[w.nome,w.telefone,w.area,w.horario,w.observacoes].join(' ').toLowerCase();
        return (!q||hay.includes(q))&&(pr==='todos'||w.prioridade===pr)&&(area==='todos'||w.area===area);
    });
    const el=document.getElementById('waitlistList');
    if(el){el.innerHTML=renderWaitlistRows(list);try{lucide.createIcons();}catch(e){}}
}
function focusWaitlistSearch(){const el=document.getElementById('waitlistSearch');if(el){el.focus();el.scrollIntoView({behavior:'smooth',block:'center'});}}
function setWaitlistPriorityFilter(v){const el=document.getElementById('waitlistPriorityFilter');if(el){el.value=v;filterWaitlist();}}
function clearWaitlistFilters(){const q=document.getElementById('waitlistSearch'),p=document.getElementById('waitlistPriorityFilter'),a=document.getElementById('waitlistAreaFilter');if(q)q.value='';if(p)p.value='todos';if(a)a.value='todos';filterWaitlist();}

function openWaitlistForm(index=null){ waitlistEditIndex=index; waitlistDetailIndex=null; renderListaEspera(); }
function closeWaitlistForm(){ waitlistEditIndex=null; renderListaEspera(); }
function openWaitlistDetail(i){ waitlistDetailIndex=i; waitlistEditIndex=null; renderListaEspera(); }
function closeWaitlistDetail(){ waitlistDetailIndex=null; renderListaEspera(); }

function saveWaitlist(){
    const nome=document.getElementById('wlNome')?.value.trim(); if(!nome){notify('Informe o nome.');return;}
    if(!data.listaEspera)data.listaEspera=[];
    const idx=waitlistEditIndex;
    const previous=idx>=0?data.listaEspera[idx]:null;
    const item={id:previous?.id||uid(),nome,telefone:document.getElementById('wlTelefone').value.trim(),idade:Number(document.getElementById('wlIdade').value)||0,area:document.getElementById('wlArea').value,horario:document.getElementById('wlHorario').value.trim(),prioridade:document.getElementById('wlPrioridade').value,observacoes:document.getElementById('wlObs').value.trim(),criadoEm:previous?.criadoEm||today()};
    if(idx>=0)data.listaEspera[idx]=item;else data.listaEspera.push(item);
    try{localStorage.setItem('waitlist_'+currentUserId,JSON.stringify(data.listaEspera));}catch(e){}
    waitlistEditIndex=null; renderListaEspera(); notify(idx>=0?'Interessado atualizado.':'Interessado adicionado à lista.');
}
function promoteWaitlist(i){
    const w=(data.listaEspera||[])[i];if(!w)return;
    if(!confirm(`Transformar ${w.nome} em aluno?`))return;
    const st={id:uid(),nome:w.nome,idade:w.idade||0,serie:'',responsavel:'',telefone:w.telefone||'',valor:Number(data.professor?.configuracoes?.valorSessaoPadrao)||0,foto:'',tags:[],observacoes:w.observacoes||'',ativo:true};
    data.alunos.push(st);ensureStudentModules(st);data.listaEspera.splice(i,1);
    try{localStorage.setItem('waitlist_'+currentUserId,JSON.stringify(data.listaEspera));}catch(e){}
    waitlistDetailIndex=null;
    saveData().then(()=>{currentStudent=st.id;navigate('agenda');setTimeout(()=>{toggleAgendaForm();const s=document.getElementById('agAluno');if(s)s.value=st.id;},150);notify(`${st.nome} agora é aluno.`);});
}
function removeWaitlist(i){
    if(!confirm('Remover este interessado da lista de espera?'))return;
    data.listaEspera.splice(i,1);try{localStorage.setItem('waitlist_'+currentUserId,JSON.stringify(data.listaEspera));}catch(e){}
    waitlistDetailIndex=null; renderListaEspera();notify('Interessado removido.');
}

    p.especialidade=document.getElementById('profEspecialidade').value.trim();

    saveWorkScheduleLocal(); await saveData(); updateUser(); renderPerfil(); notify('Atualizado.');
}

async function loadRecados() {
    try {
        const userId = await getUserId(); if (!userId) return;
        const { data: recadosData, error } = await supabaseClient.from('recados').select('*').or(`destinatario_id.eq.${userId},para_todos.eq.true,user_id.eq.${userId}`).order('created_at', { ascending: false });
        if (error) throw error;
        recadosList = recadosData || [];
        recadosUnreadCount = recadosList.filter(r => !r.lido && (r.destinatario_id === userId || r.para_todos)).length;
        updateRecadosBadge();
        updateRecadosBadgeInline();
        return recadosList;
    } catch (error) { console.error(error); return []; }
}
async function saveRecado(recado) {
    try {
        const userId = await getUserId(); if (!userId) return null;
        const payload = { id: recado.id || uid(), user_id: userId, remetente_id: userId, destinatario_id: recado.destinatario_id || null, titulo: recado.titulo, mensagem: recado.mensagem, tipo: recado.tipo || 'comunicado', lido: false, para_todos: recado.para_todos || false, created_at: new Date().toISOString() };
        const { data, error } = await supabaseClient.from('recados').insert(payload).select().single();
        if (error) throw error;
        return data;
    } catch (error) { console.error(error); return null; }
}
async function markRecadoAsRead(id) { try { await supabaseClient.from('recados').update({ lido: true }).eq('id', id); const r = recadosList.find(x => x.id === id); if (r) r.lido = true; recadosUnreadCount = Math.max(0, recadosUnreadCount - 1); updateRecadosBadge(); updateRecadosBadgeInline(); return true; } catch(e) { return false; } }
async function deleteRecado(id) { try { await supabaseClient.from('recados').delete().eq('id', id); recadosList = recadosList.filter(r => r.id !== id); return true; } catch(e) { return false; } }
function updateRecadosBadge() { const badge = document.getElementById('recadosBadge'); if (!badge) return; if (recadosUnreadCount > 0) { badge.style.display = 'flex'; badge.textContent = recadosUnreadCount > 9 ? '9+' : recadosUnreadCount; } else badge.style.display = 'none'; }
function setRecadosFilter(filter) { recadosFilter = filter; recadosPage = 1; renderRecados(); }

function renderRecados() {
    const container=document.getElementById('dashboardSubContent'); if(!container)return;
    if (!isDataLoaded || !data.session) { container.innerHTML = `<div class="empty">Faça login.</div>`; return; }
    const userId = currentUserId, isM = isMaster;
    let filt = recadosList;
    if (recadosFilter === 'nao_lidos') filt = filt.filter(r => !r.lido && (r.destinatario_id === userId || r.para_todos));
    else if (recadosFilter === 'enviados') filt = filt.filter(r => r.user_id === userId);
    const size = 8, total = Math.max(1, Math.ceil(filt.length / size)), page = Math.min(Math.max(1, recadosPage), total);
    const slice = filt.slice((page - 1) * size, page * size);
    container.innerHTML = `
        <div class="embedded-page">
        ${renderHelpBox("recados")}
        <div class="section-head"><div><div class="section-title">Recados</div></div>${isM ? `<button class="btn btn-primary" onclick="openNewRecadoInline()">+ Comunicado</button>` : `<button class="btn btn-soft" onclick="openNewMessageInline()">Enviar mensagem</button>`}</div>
        <div id="recadoFormInline" style="display:none;margin-bottom:16px" class="inline-panel">
            <div class="inline-panel-head"><div><div class="inline-panel-title" id="recadoFormTitle">Novo Comunicado</div><div class="inline-panel-sub">Preencha os campos e envie.</div></div><button class="btn btn-outline btn-sm" onclick="closeRecadoInline()">Fechar</button></div>
            <div class="field"><label class="label">Título</label><input id="recadoTitulo" class="input"></div>
            <div class="field"><label class="label">Mensagem</label><textarea id="recadoMensagem" class="textarea" style="min-height:120px"></textarea></div>
            <div class="field" id="recadoDestWrap"><label class="label">Destinatário</label><select id="recadoDestinatario" class="select"><option value="todos">Todos</option></select></div>
            <div class="form-actions"><button class="btn btn-primary" id="recadoSendBtn" onclick="sendRecadoInline()">Enviar</button><button class="btn btn-outline" onclick="closeRecadoInline()">Cancelar</button></div>
        </div>
        <div class="card" style="margin-bottom:16px"><div style="display:flex;gap:10px;flex-wrap:wrap"><button class="btn ${recadosFilter === 'todos' ? 'btn-primary' : 'btn-outline'} btn-sm" onclick="setRecadosFilter('todos')">Todos (${recadosList.length})</button><button class="btn ${recadosFilter === 'nao_lidos' ? 'btn-primary' : 'btn-outline'} btn-sm" onclick="setRecadosFilter('nao_lidos')">Não lidos (${recadosUnreadCount})</button><button class="btn ${recadosFilter === 'enviados' ? 'btn-primary' : 'btn-outline'} btn-sm" onclick="setRecadosFilter('enviados')">Enviados</button><div style="flex:1"></div><button class="btn btn-outline btn-sm" onclick="loadRecados().then(()=>renderRecados())">Atualizar</button></div></div>
        <div class="card">${slice.length === 0 ? `<div class="empty">Nenhum recado.</div>` : slice.map(r => { const isOwn = r.user_id === userId, isToMe = r.destinatario_id === userId || r.para_todos, isUnread = !r.lido && isToMe && !isOwn; return `<div style="padding:14px 0;border-bottom:1px solid #f0f3f2;${isUnread ? 'background:#f8fbf9;margin:0 -20px;padding:14px 20px;border-left:3px solid var(--sage)' : ''}"><div style="display:flex;justify-content:space-between;gap:10px"><div style="flex:1"><div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap"><strong style="font-size:13px">${esc(r.titulo)}</strong>${isUnread ? `<span class="tag" style="background:#eaf3ee;color:var(--sage-dark)">Novo</span>` : ''}</div><div style="font-size:10px;color:#8a9892;margin-top:3px">${fmtDateTime(r.created_at)}</div><div style="font-size:12px;color:#596761;margin-top:8px;line-height:1.6;white-space:pre-wrap">${esc(r.mensagem)}</div></div><div style="display:flex;gap:5px">${isUnread ? `<button class="btn btn-soft btn-sm" onclick="markRecadoAsRead('${r.id}').then(()=>renderRecados())">Ler</button>` : ''}${isOwn || isM ? `<button class="btn btn-danger btn-sm" onclick="if(confirm('Excluir?')){deleteRecado('${r.id}').then(()=>renderRecados())}">X</button>` : ''}</div></div></div>`; }).join('')}${total > 1 ? `<div style="display:flex;justify-content:center;gap:8px;margin-top:16px"><button class="btn btn-outline btn-sm" ${page <= 1 ? "disabled" : ""} onclick="recadosPage=${page - 1};renderRecados();">Anterior</button><span style="font-size:11px;color:#718078">${page}/${total}</span><button class="btn btn-outline btn-sm" ${page >= total ? "disabled" : ""} onclick="recadosPage=${page + 1};renderRecados();">Próxima</button></div>` : ''}</div>
        </div>`;
    try{lucide.createIcons();}catch(e){}
}

function openNewRecadoInline(){
    const box=document.getElementById('recadoFormInline'); if(!box)return;
    box.style.display='block';
    document.getElementById('recadoFormTitle').textContent='Novo Comunicado';
    document.getElementById('recadoDestWrap').style.display='block';
    document.getElementById('recadoSendBtn').textContent='Enviar comunicado';
    document.getElementById('recadoSendBtn').onclick=()=>sendRecadoInline();
    box.scrollIntoView({behavior:'smooth'});
}
function openNewMessageInline(){
    const box=document.getElementById('recadoFormInline'); if(!box)return;
    box.style.display='block';
    document.getElementById('recadoFormTitle').textContent='Enviar Mensagem ao Suporte';
    document.getElementById('recadoDestWrap').style.display='none';
    document.getElementById('recadoSendBtn').textContent='Enviar mensagem';
    document.getElementById('recadoSendBtn').onclick=()=>sendMensagemInline();
    box.scrollIntoView({behavior:'smooth'});
}
function closeRecadoInline(){
    const box=document.getElementById('recadoFormInline'); if(box)box.style.display='none';
    const t=document.getElementById('recadoTitulo'); if(t)t.value='';
    const m=document.getElementById('recadoMensagem'); if(m)m.value='';
}
async function sendRecadoInline(){
    const titulo=document.getElementById('recadoTitulo').value.trim(), mensagem=document.getElementById('recadoMensagem').value.trim();
    const destino=document.getElementById('recadoDestinatario').value;
    if(!titulo||!mensagem){notify('Preencha tudo.');return;}
    const saved=await saveRecado({titulo,mensagem,tipo:'comunicado',para_todos:destino==='todos',destinatario_id:destino==='todos'?null:destino});
    if(saved){recadosList.unshift(saved);closeRecadoInline();renderRecados();notify('Enviado!');} else notify('Erro.');
}
async function sendMensagemInline(){
    const titulo=document.getElementById('recadoTitulo').value.trim(), mensagem=document.getElementById('recadoMensagem').value.trim();
    if(!titulo||!mensagem){notify('Preencha tudo.');return;}
    const recado={titulo,mensagem,tipo:'mensagem',para_todos:false,destinatario_id:null};
    const {data:masterData}=await supabaseClient.from('professores').select('user_id').eq('cargo','Master').maybeSingle();
    if(masterData) recado.destinatario_id=masterData.user_id;
    const saved=await saveRecado(recado);
    if(saved){closeRecadoInline();notify('Enviado!');} else notify('Erro.');
}
