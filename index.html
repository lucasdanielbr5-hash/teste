<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>ASAS · Gestão Psicopedagógica</title>

<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/lucide@latest"></script>
<script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;font-family:Inter,sans-serif;background:#f7f9f8;color:#263238}
body{overflow:hidden}
button,input,select,textarea{font-family:inherit}
button{cursor:pointer}
::-webkit-scrollbar{width:7px;height:7px}
::-webkit-scrollbar-thumb{background:#cbd5d1;border-radius:20px}
::-webkit-scrollbar-track{background:transparent}

:root{
 --sage:#5f8f7a;
 --sage-dark:#477363;
 --sage-light:#eaf3ee;
 --blue:#6288a8;
 --blue-light:#edf4f8;
 --ink:#263238;
 --muted:#718096;
 --line:#e6ece9;
 --surface:#fff;
}

.app{height:100vh;display:flex}
.sidebar{
 width:76px;background:#fff;border-right:1px solid var(--line);
 display:flex;flex-direction:column;align-items:center;padding:20px 10px;
 flex-shrink:0;transition:.25s;z-index:20
}
.sidebar:hover{width:218px;align-items:stretch}
.brand{height:52px;display:flex;align-items:center;gap:12px;color:var(--sage-dark);font-weight:700;padding:0 10px;white-space:nowrap;overflow:hidden}
.brand-mark{width:36px;height:36px;border-radius:12px;background:var(--sage-light);display:grid;place-items:center;flex-shrink:0}
.brand span{opacity:0;transition:.2s}
.sidebar:hover .brand span{opacity:1}
.nav{margin-top:22px;display:flex;flex-direction:column;gap:5px}
.nav button{
 border:0;background:transparent;color:#718096;border-radius:12px;
 min-height:44px;padding:0 12px;display:flex;align-items:center;gap:13px;
 font-size:13px;font-weight:500;text-align:left;white-space:nowrap;overflow:hidden
}
.nav button:hover{background:#f3f6f5;color:var(--ink)}
.nav button.active{background:var(--sage-light);color:var(--sage-dark);font-weight:600}
.nav svg{width:20px;min-width:20px}
.nav-label{opacity:0;transition:.2s}
.sidebar:hover .nav-label{opacity:1}
.side-bottom{margin-top:auto}
.main{min-width:0;flex:1;height:100vh;display:flex;flex-direction:column}
.topbar{
 height:72px;background:#fff;border-bottom:1px solid var(--line);
 display:flex;align-items:center;justify-content:space-between;padding:0 30px;flex-shrink:0
}
.page-title{display:flex;align-items:center;gap:10px;font-size:18px;font-weight:600}
.page-title svg{color:var(--sage);width:20px}
.user-mini{display:flex;align-items:center;gap:10px}
.avatar{width:38px;height:38px;border-radius:50%;background:var(--sage-light);color:var(--sage-dark);display:grid;place-items:center;font-weight:700;overflow:hidden;background-size:cover;background-position:center}
.content{padding:26px 30px 40px;overflow:auto;height:calc(100vh - 72px)}
.view{display:none;animation:fade .2s ease}
.view.active{display:block}
@keyframes fade{from{opacity:.3;transform:translateY(5px)}to{opacity:1;transform:none}}

.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:20px;box-shadow:0 2px 8px rgba(30,50,40,.025)}
.grid{display:grid;gap:16px}
.stats{grid-template-columns:repeat(4,minmax(0,1fr))}
.stat-label{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:#91a09a;font-weight:600}
.stat-value{font-size:25px;font-weight:700;margin-top:8px;color:#263238}
.stat-sub{font-size:11px;color:#8a9892;margin-top:5px}

.btn{border:0;border-radius:11px;padding:9px 15px;font-size:13px;font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:7px;transition:.15s}
.btn svg{width:16px}
.btn-primary{background:var(--sage);color:white}
.btn-primary:hover{background:var(--sage-dark)}
.btn-soft{background:var(--sage-light);color:var(--sage-dark)}
.btn-blue{background:var(--blue-light);color:#557994}
.btn-danger{background:#fff0f0;color:#b85b5b}
.btn-outline{background:#fff;border:1px solid var(--line);color:#53615c}
.btn-outline:hover{background:#f7faf8}
.btn-sm{padding:7px 10px;font-size:12px}

.input,.select,.textarea{
 width:100%;border:1px solid #dfe7e3;background:#fbfcfc;border-radius:10px;
 padding:9px 11px;outline:0;font-size:13px;color:var(--ink);transition:.15s
}
.input:focus,.select:focus,.textarea:focus{border-color:#8eb2a3;box-shadow:0 0 0 3px rgba(95,143,122,.09)}
.textarea{resize:vertical;min-height:100px}
.label{display:block;font-size:11px;font-weight:600;color:#66756f;margin-bottom:5px}
.field{margin-bottom:13px}
.form-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.form-grid.two{grid-template-columns:repeat(2,minmax(0,1fr))}
.form-actions{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap}

.section-head{display:flex;align-items:center;justify-content:space-between;gap:15px;margin-bottom:16px}
.section-title{font-size:15px;font-weight:700;color:#34413c}
.section-sub{font-size:12px;color:#89968f;margin-top:3px}

.student-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(235px,1fr));gap:14px}
.student{
 background:#fff;border:1px solid var(--line);border-radius:17px;padding:17px;
 transition:.18s;cursor:pointer
}
.student:hover{border-color:#c8ddd3;transform:translateY(-2px);box-shadow:0 10px 24px rgba(50,90,70,.07)}
.student-top{display:flex;gap:12px;align-items:center}
.student-avatar{width:48px;height:48px;border-radius:15px;background:var(--sage-light);color:var(--sage-dark);display:grid;place-items:center;font-weight:700;font-size:17px;overflow:hidden;background-size:cover;background-position:center}
.student-name{font-weight:700;font-size:14px}
.student-meta{font-size:11px;color:#89968f;margin-top:3px}
.tags{display:flex;flex-wrap:wrap;gap:5px;margin-top:13px}
.tag{font-size:10px;padding:4px 8px;border-radius:20px;background:#edf4f8;color:#597b96;font-weight:600}

.profile-cover{height:112px;border-radius:18px 18px 0 0;background:linear-gradient(135deg,#eaf3ee,#edf4f8)}
.profile-card{margin-top:-1px;border-radius:0 0 18px 18px}
.profile-head{display:flex;gap:20px;align-items:flex-end;margin-top:-42px;padding:0 24px}
.profile-avatar{width:92px;height:92px;border-radius:25px;background:#eaf3ee;border:5px solid white;display:grid;place-items:center;font-size:30px;font-weight:700;color:var(--sage-dark);overflow:hidden;background-size:cover;background-position:center;flex-shrink:0}
.profile-name{font-size:22px;font-weight:700}
.profile-meta{font-size:12px;color:#81908a;margin-top:4px}
.profile-actions{margin-left:auto;display:flex;gap:7px}
.profile-body{padding:20px 24px}
.profile-layout{display:grid;grid-template-columns:2fr 1fr;gap:18px;margin-top:18px}

.timeline{display:flex;flex-direction:column;gap:10px}
.evolution{border:1px solid var(--line);border-radius:13px;padding:14px;background:#fbfcfc}
.evolution-date{font-size:10px;color:#91a09a;font-weight:600}
.evolution-title{font-size:13px;font-weight:700;margin:5px 0}
.evolution-text{font-size:12px;line-height:1.65;color:#596761;white-space:pre-wrap}

.agenda-toolbar{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:15px}
.toolbar-group{display:flex;gap:5px;align-items:center}
.month-label{font-size:16px;font-weight:700;min-width:150px;text-align:center}
.week-grid{display:grid;grid-template-columns:70px repeat(5,minmax(130px,1fr));min-width:700px}
.week-head{background:#fafcfb;border-bottom:1px solid var(--line);padding:10px;text-align:center;font-size:11px;font-weight:700;color:#68766f}
.time-cell{height:72px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);padding:7px;font-size:10px;color:#97a39e;text-align:right}
.slot{height:72px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);padding:4px;background:#fff}
.slot:hover{background:#fbfdfc}
.event{padding:7px;border-radius:9px;font-size:10px;line-height:1.3;cursor:pointer;position:relative;min-height:58px}
.event.psico{background:#edf4f8;color:#557792}
.event.psicopeg{background:#f0f5ec;color:#5d806c}
.event.aula{background:#f5f0f8;color:#80678c}
.event strong{display:block;font-size:10px;margin-bottom:2px}
.event-actions{display:flex;gap:3px;margin-top:5px}
.event-actions button{border:0;background:rgba(255,255,255,.65);border-radius:5px;padding:2px 5px;font-size:9px}
.empty-slot{height:100%;display:grid;place-items:center;color:#c1ccc7;font-size:11px}

.month-grid{display:grid;grid-template-columns:repeat(7,1fr);border:1px solid var(--line);border-radius:15px;overflow:hidden;background:white}
.month-week{display:contents}
.month-day{
 min-height:105px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);
 padding:8px;cursor:pointer
}
.month-day:hover{background:#fafcfb}
.month-day.other{background:#fafafa;color:#b9c2be}
.day-number{font-size:11px;font-weight:700}
.dot-row{display:flex;flex-wrap:wrap;gap:3px;margin-top:9px}
.dot{width:7px;height:7px;border-radius:50%}
.dot.psico{background:#8db0c8}.dot.psicopeg{background:#8eb29d}.dot.aula{background:#ad94b9}
.day-events{margin-top:7px;display:flex;flex-direction:column;gap:3px}
.day-event{font-size:9px;padding:3px 5px;border-radius:5px;background:#edf4f8;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.finance-table{width:100%;border-collapse:collapse}
.finance-table th{text-align:left;font-size:10px;color:#87948e;text-transform:uppercase;padding:10px;border-bottom:1px solid var(--line)}
.finance-table td{padding:12px 10px;border-bottom:1px solid #f0f3f2;font-size:12px}
.paid{color:#5d8a70;font-weight:700}.pending{color:#a98058;font-weight:700}
.alert{padding:12px;border-radius:12px;background:#fff8ef;border:1px solid #f3e5d2}
.alert-title{font-size:12px;font-weight:700;color:#876f51}
.alert-text{font-size:11px;color:#8d8171;margin-top:3px}
.empty{padding:30px;text-align:center;color:#98a49f;font-size:13px}
.kpi-bar{height:6px;border-radius:10px;background:#edf1ef;overflow:hidden;margin-top:10px}
.kpi-fill{height:100%;background:var(--sage);border-radius:10px}

.clinical-alert{padding:13px;border-radius:13px;background:#fff8ef;border:1px solid #f1dfc8;margin-bottom:9px}
.clinical-alert.resolved{background:#f5faf7;border-color:#dcebe2;opacity:.8}
.clinical-alert-title{font-size:12px;font-weight:700;color:#795f42}
.clinical-alert.resolved .clinical-alert-title{color:#5d806c}
.clinical-alert-text{font-size:11px;color:#7d7368;line-height:1.5;margin-top:4px}
.clinical-alert-actions{display:flex;gap:6px;flex-wrap:wrap;margin-top:9px}
.clinical-alert-actions .btn{font-size:10px;padding:6px 8px}
.login-screen{height:100vh;display:grid;place-items:center;background:linear-gradient(135deg,#f4f8f6,#f1f5f8)}
.login-box{width:min(420px,calc(100% - 30px));background:#fff;border:1px solid var(--line);border-radius:24px;padding:34px;box-shadow:0 20px 60px rgba(40,70,55,.08)}
.login-brand{display:flex;justify-content:center;align-items:center;gap:10px;color:var(--sage-dark);font-weight:700;font-size:22px}
.login-sub{text-align:center;color:#87948e;font-size:12px;margin:8px 0 28px}

.toast{
 position:fixed;right:22px;bottom:22px;background:#263d35;color:#fff;padding:12px 16px;
 border-radius:12px;font-size:12px;z-index:100;opacity:0;transform:translateY(10px);pointer-events:none;transition:.25s
}
.toast.show{opacity:1;transform:none}

.profile-timeline-item{
 padding:14px 0;
 border-bottom:1px solid #f0f3f2;
 display:flex;
 gap:14px;
 align-items:flex-start;
}
.profile-timeline-item:last-child{border-bottom:0}
.profile-timeline-dot{
 width:10px;
 height:10px;
 border-radius:50%;
 margin-top:4px;
 flex-shrink:0;
}
.profile-timeline-dot.evolution{background:#8eb29d}
.profile-timeline-dot.observation{background:#8db0c8}
.profile-timeline-dot.alert{background:#c9a87c}
.profile-timeline-content{flex:1;min-width:0}
.profile-timeline-content .title{font-weight:700;font-size:13px}
.profile-timeline-content .meta{font-size:10px;color:#8a9892;margin:2px 0 5px}
.profile-timeline-content .text{font-size:12px;color:#596761;line-height:1.6;white-space:pre-wrap}
.profile-timeline-content .actions{display:flex;gap:6px;margin-top:6px;flex-wrap:wrap}

@media(max-width:950px){
 .stats{grid-template-columns:repeat(2,1fr)}
 .profile-layout{grid-template-columns:1fr}
 .form-grid{grid-template-columns:repeat(2,1fr)}
}
@media(max-width:680px){
 .sidebar{width:58px;padding:15px 6px}
 .sidebar:hover{width:58px}
 .sidebar:hover .brand span,.sidebar:hover .nav-label{opacity:0}
 .brand{padding:0 5px;justify-content:center}
 .nav button{justify-content:center;padding:0}
 .main{margin-left:0}
 .topbar{height:62px;padding:0 15px}
 .content{height:calc(100vh - 62px);padding:17px 13px}
 .form-grid,.form-grid.two{grid-template-columns:1fr}
 .stats{grid-template-columns:1fr 1fr}
 .profile-head{align-items:flex-start;flex-wrap:wrap;padding:0 14px}
 .profile-actions{width:100%;margin-left:0}
 .profile-body{padding:15px}
 .profile-avatar{width:75px;height:75px}
 .profile-name{font-size:18px}
 .month-grid{min-width:620px}
}
</style>
</head>

<script>
// ============================================================
// CONFIGURAÇÃO DO SUPABASE
// ============================================================

const SUPABASE_URL = 'https://teujmiojdyytzpavritf.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InRldWptaW9qZHl5dHpwYXZyaXRmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODc5NTYxMjUsImV4cCI6MjEwMzUzMjEyNX0.rGLzx-B1bdrlcaa9a_gAOHrDv52UGHQfg-dquLJtyIk';

const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

// ============================================================
// VARIÁVEIS GLOBAIS
// ============================================================

let data = {};
let currentPage = "dashboard";
let currentStudent = null;
let currentAssessment = null;
let calendarDate = new Date();
let calendarMode = "week";
let selectedDay = null;
let studentSectionPage = { overview: 1, avaliacoes: 1, escola: 1 };
let currentConsultation = null;
let financeYear = new Date().getFullYear();
let financeMonth = new Date().getMonth();
let currentUserId = null;

const TYPES = {
    psicologia: { label: "Psicologia", cls: "psico" },
    psicopedagogia: { label: "Psicopedagogia", cls: "psicopeg" },
    aula: { label: "Aula Particular", cls: "aula" }
};

const WEEK = ["Seg", "Ter", "Qua", "Qui", "Sex"];
const HOURS = [];
for (let h = 8; h <= 18; h++) HOURS.push(String(h).padStart(2, "0") + ":00");

// ============================================================
// FUNÇÕES AUXILIARES
// ============================================================

function uid() {
    return Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
}

function esc(v) {
    return String(v ?? "").replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
}

function money(v) {
    return Number(v || 0).toLocaleString("pt-BR", { style: "currency", currency: "BRL" });
}

function dateISO(d) {
    const x = new Date(d);
    return x.getFullYear() + "-" + String(x.getMonth() + 1).padStart(2, "0") + "-" + String(x.getDate()).padStart(2, "0");
}

function parseDate(s) {
    const [y, m, d] = s.split("-").map(Number);
    return new Date(y, m - 1, d);
}

function today() {
    return dateISO(new Date());
}

function fmtDate(s) {
    if (!s) return "";
    return parseDate(s).toLocaleDateString("pt-BR", { day: "2-digit", month: "2-digit", year: "numeric" });
}

function monthName(d) {
    return d.toLocaleDateString("pt-BR", { month: "long", year: "numeric" });
}

function initials(name) {
    return (name || "?").split(" ").slice(0, 2).map(x => x[0]).join("").toUpperCase();
}

function avatarHTML(person, cls = "student-avatar") {
    if (!person) return `<div class="${cls}">?</div>`;
    if (person.foto) {
        return `<div class="${cls}" style="background-image:url('${esc(person.foto)}')"></div>`;
    }
    return `<div class="${cls}">${esc(initials(person.nome))}</div>`;
}

function notify(message) {
    const t = document.getElementById("toast");
    t.textContent = message;
    t.classList.add("show");
    clearTimeout(window.toastTimer);
    window.toastTimer = setTimeout(() => t.classList.remove("show"), 2600);
}

function activeAppointments() {
    return data.agenda ? data.agenda.filter(x => x.status !== "cancelado") : [];
}

function getStudent(id) {
    return data.alunos ? data.alunos.find(a => a.id === id) : null;
}

function ensureStudentModules(s) {
    if (!s) return;
    s.consultas = s.consultas || [];
    s.avaliacoes = s.avaliacoes || [];
    s.escola = s.escola || { nome: "", professores: "", registros: [] };
    s.escola.registros = s.escola.registros || [];
}

function defaultData() {
    return {
        session: false,
        professor: {
            nome: "Professor ASAS",
            especialidade: "Psicopedagogia Clínica",
            bio: "Profissional dedicado ao desenvolvimento acadêmico, emocional e cognitivo.",
            foto: "",
            observacoes: [],
            evolucoesPessoais: [],
            configuracoes: { notificacoes: true, tema: "claro", lembretes: true }
        },
        alunos: [],
        agenda: [],
        transacoes: [],
        clinicalAlerts: []
    };
}

function monthAppointments(date) {
    const y = date.getFullYear();
    const m = date.getMonth();
    return activeAppointments().filter(a => {
        const d = parseDate(a.data);
        return d.getFullYear() === y && d.getMonth() === m;
    });
}

function monthPaid() {
    const y = calendarDate.getFullYear();
    const m = calendarDate.getMonth();
    return (data.transacoes || []).filter(t => {
        const d = parseDate(t.data);
        return d.getFullYear() === y && d.getMonth() === m;
    }).reduce((s, t) => s + Number(t.valor), 0);
}

function monthDone() {
    const y = new Date().getFullYear();
    const m = new Date().getMonth();
    return activeAppointments().filter(a => {
        const d = parseDate(a.data);
        return d.getFullYear() === y && d.getMonth() === m && a.presente;
    }).length;
}

function monthScheduled() {
    const y = new Date().getFullYear();
    const m = new Date().getMonth();
    return activeAppointments().filter(a => {
        const d = parseDate(a.data);
        return d.getFullYear() === y && d.getMonth() === m;
    }).length;
}

function attendanceRate() {
    const arr = activeAppointments().filter(a => a.presente || a.status === "falta");
    if (!arr.length) return 0;
    return Math.round(arr.filter(a => a.presente).length / arr.length * 100);
}

function weekStart(d) {
    const x = new Date(d);
    const day = x.getDay();
    const diff = day === 0 ? -6 : 1 - day;
    x.setDate(x.getDate() + diff);
    x.setHours(0, 0, 0, 0);
    return x;
}

function weekDates(d) {
    const s = weekStart(d);
    return WEEK.map((_, i) => {
        const x = new Date(s);
        x.setDate(s.getDate() + i);
        return x;
    });
}

function weekPending() {
    const dates = weekDates(new Date());
    const keys = dates.map(dateISO);
    return activeAppointments().filter(a => keys.includes(a.data) && !a.pago)
        .reduce((sum, a) => sum + (getStudent(a.alunoId)?.valor || 0), 0);
}

function studentPager(items, page, size = 5, onclick = "") {
    const total = Math.max(1, Math.ceil(items.length / size));
    page = Math.min(Math.max(1, page), total);
    const slice = items.slice((page - 1) * size, page * size);
    return {
        slice,
        total,
        page,
        controls: total > 1 ? `
            <div style="display:flex;justify-content:center;align-items:center;gap:8px;margin-top:16px;padding-top:12px;border-top:1px solid var(--line)">
                <button class="btn btn-outline btn-sm" ${page <= 1 ? "disabled" : ""} onclick="${onclick}(${page - 1})"><i data-lucide="chevron-left"></i>Anterior</button>
                <span style="font-size:11px;color:#718078">Página ${page} de ${total}</span>
                <button class="btn btn-outline btn-sm" ${page >= total ? "disabled" : ""} onclick="${onclick}(${page + 1})">Próxima<i data-lucide="chevron-right"></i></button>
            </div>` : ""
    };
}

function getClinicalAlerts() {
    return (data.clinicalAlerts || []).filter(a => a.status !== "resolved");
}

function clinicalAlertReason(a) {
    return a.text || "Registro clínico que merece revisão.";
}

async function getCurrentUserId() {
    try {
        const { data: userData, error } = await supabaseClient.auth.getUser();
        if (error) {
            console.warn('Erro ao buscar usuário:', error);
            return null;
        }
        if (userData?.user?.id) {
            currentUserId = userData.user.id;
            return currentUserId;
        }
        return null;
    } catch (error) {
        console.warn('Erro ao buscar usuário:', error);
        return null;
    }
}

async function loginSupabase(email, password) {
    try {
        const { data, error } = await supabaseClient.auth.signInWithPassword({
            email: email,
            password: password
        });
        if (error) throw error;
        return data;
    } catch (error) {
        console.error('Erro no login:', error);
        notify('Usuário ou senha inválidos.');
        return null;
    }
}

async function logoutSupabase() {
    try {
        const { error } = await supabaseClient.auth.signOut();
        if (error) throw error;
        return true;
    } catch (error) {
        console.error('Erro no logout:', error);
        return false;
    }
}

async function checkSession() {
    try {
        const { data, error } = await supabaseClient.auth.getSession();
        if (error) throw error;
        return data.session !== null;
    } catch (error) {
        console.warn('Erro ao verificar sessão:', error);
        return false;
    }
}

async function getUserId() {
    if (currentUserId) return currentUserId;
    const id = await getCurrentUserId();
    if (id) {
        currentUserId = id;
        return id;
    }
    throw new Error('Usuário não autenticado');
}

async function loadDataFromSupabase() {
    try {
        const userId = await getUserId();
        if (!userId) {
            console.warn('Usuário não autenticado');
            return null;
        }

        // Buscar professor do usuário atual
        const { data: professorData, error: profError } = await supabaseClient
            .from('professores')
            .select('*')
            .eq('user_id', userId)
            .maybeSingle();
        if (profError && profError.code !== 'PGRST116') throw profError;

        // Buscar alunos do usuário atual
        const { data: alunosData, error: alunosError } = await supabaseClient
            .from('alunos')
            .select('*')
            .eq('user_id', userId)
            .order('nome');
        if (alunosError) throw alunosError;

        // Buscar evoluções do usuário atual
        const { data: evolucoesData, error: evoError } = await supabaseClient
            .from('evolucoes')
            .select('*')
            .eq('user_id', userId);
        if (evoError && evoError.code !== '42703' && evoError.code !== 'PGRST116') throw evoError;

        // Buscar consultas do usuário atual
        const { data: consultasData, error: consError } = await supabaseClient
            .from('consultas')
            .select('*')
            .eq('user_id', userId);
        if (consError && consError.code !== '42703' && consError.code !== 'PGRST116') throw consError;

        // Buscar avaliações do usuário atual
        const { data: avaliacoesData, error: avError } = await supabaseClient
            .from('avaliacoes')
            .select('*')
            .eq('user_id', userId);
        if (avError && avError.code !== '42703' && avError.code !== 'PGRST116') throw avError;

        // Buscar resultados do usuário atual
        const { data: resultadosData, error: resError } = await supabaseClient
            .from('resultados_avaliacoes')
            .select('*')
            .eq('user_id', userId);
        if (resError && resError.code !== '42703' && resError.code !== 'PGRST116') throw resError;

        // Buscar escola do usuário atual
        const { data: escolaData, error: escError } = await supabaseClient
            .from('escola')
            .select('*')
            .eq('user_id', userId);
        if (escError && escError.code !== '42703' && escError.code !== 'PGRST116') throw escError;

        // Buscar registros escola do usuário atual
        const { data: registrosEscolaData, error: regError } = await supabaseClient
            .from('registros_escola')
            .select('*')
            .eq('user_id', userId);
        if (regError && regError.code !== '42703' && regError.code !== 'PGRST116') throw regError;

        // Buscar agenda do usuário atual
        const { data: agendaData, error: agendaError } = await supabaseClient
            .from('agenda')
            .select('*')
            .eq('user_id', userId)
            .order('data');
        if (agendaError) throw agendaError;

        // Buscar transações do usuário atual
        const { data: transacoesData, error: transError } = await supabaseClient
            .from('transacoes')
            .select('*')
            .eq('user_id', userId);
        if (transError) throw transError;

        // Buscar alertas do usuário atual
        const { data: alertasData, error: alertError } = await supabaseClient
            .from('alertas_clinicos')
            .select('*')
            .eq('user_id', userId);
        if (alertError) throw alertError;

        // Buscar observações do professor
        const { data: obsProfData, error: obsError } = await supabaseClient
            .from('observacoes_professor')
            .select('*')
            .eq('user_id', userId)
            .order('data', { ascending: false });
        if (obsError && obsError.code !== '42703' && obsError.code !== 'PGRST116') throw obsError;

        // Buscar evoluções do professor
        const { data: evoProfData, error: evoProfError } = await supabaseClient
            .from('evolucoes_professor')
            .select('*')
            .eq('user_id', userId)
            .order('data', { ascending: false });
        if (evoProfError && evoProfError.code !== '42703' && evoProfError.code !== 'PGRST116') throw evoProfError;

        const result = {
            session: true,
            professor: professorData || {
                nome: "Professor ASAS",
                especialidade: "Psicopedagogia Clínica",
                bio: "Profissional dedicado ao desenvolvimento acadêmico, emocional e cognitivo.",
                foto: "",
                observacoes: obsProfData || [],
                evolucoesPessoais: evoProfData || [],
                configuracoes: { notificacoes: true, tema: "claro", lembretes: true }
            },
            alunos: alunosData || [],
            agenda: agendaData || [],
            transacoes: transacoesData || [],
            clinicalAlerts: alertasData || []
        };

        result.alunos.forEach(aluno => {
            aluno.evolucoes = evolucoesData?.filter(e => e.aluno_id === aluno.id) || [];
            aluno.consultas = consultasData?.filter(c => c.aluno_id === aluno.id) || [];
            aluno.avaliacoes = avaliacoesData?.filter(a => a.aluno_id === aluno.id) || [];
            aluno.avaliacoes.forEach(av => {
                av.resultados = resultadosData?.filter(r => r.avaliacao_id === av.id) || [];
            });
            const escola = escolaData?.find(e => e.aluno_id === aluno.id);
            if (escola) {
                aluno.escola = {
                    ...escola,
                    registros: registrosEscolaData?.filter(r => r.escola_id === escola.id) || []
                };
            } else {
                aluno.escola = { nome: '', professores: '', registros: [] };
            }
            ensureStudentModules(aluno);
        });

        return result;
    } catch (error) {
        console.error('Erro ao carregar dados:', error);
        notify('Erro ao carregar dados do servidor.');
        return null;
    }
}

// ============================================================

async function loadData() {
    const loaded = await loadDataFromSupabase();
    if (loaded) {
        if (!loaded.professor.observacoes) loaded.professor.observacoes = [];
        if (!loaded.professor.evolucoesPessoais) loaded.professor.evolucoesPessoais = [];
        if (!loaded.professor.configuracoes) {
            loaded.professor.configuracoes = { notificacoes: true, tema: "claro", lembretes: true };
        }
        loaded.alunos.forEach(s => ensureStudentModules(s));
        return loaded;
    }
    return defaultData();
}

async function saveData() {
    try {
        if (data.professor) await saveProfessor(data.professor);

        for (const aluno of (data.alunos || [])) {
            await saveAluno(aluno);
            for (const evo of (aluno.evolucoes || [])) {
                await saveEvolucao({ ...evo, aluno_id: aluno.id });
            }
            for (const consulta of (aluno.consultas || [])) {
                await saveConsulta({ ...consulta, aluno_id: aluno.id });
            }
            for (const av of (aluno.avaliacoes || [])) {
                const savedAv = await saveAvaliacao({ ...av, aluno_id: aluno.id });
                if (savedAv && av.resultados) {
                    for (const res of av.resultados) {
                        await saveResultadoAvaliacao({ ...res, avaliacao_id: savedAv.id });
                    }
                }
            }
            if (aluno.escola) {
                const savedEscola = await saveEscola({
                    id: aluno.escola.id || uid(),
                    aluno_id: aluno.id,
                    nome: aluno.escola.nome || '',
                    professores: aluno.escola.professores || ''
                });
                if (savedEscola && aluno.escola.registros) {
                    for (const reg of aluno.escola.registros) {
                        await saveRegistroEscola({ ...reg, escola_id: savedEscola.id });
                    }
                }
            }
        }

        for (const item of (data.agenda || [])) await saveAgendaItem(item);
        for (const trans of (data.transacoes || [])) await saveTransacao(trans);
        for (const alerta of (data.clinicalAlerts || [])) await saveAlertaClinico(alerta);
        for (const obs of (data.professor?.observacoes || [])) await saveObservacaoProfessor(obs);
        for (const evo of (data.professor?.evolucoesPessoais || [])) await saveEvolucaoProfessor(evo);

        return true;
    } catch (error) {
        console.error('Erro ao salvar dados:', error);
        notify('Erro ao salvar dados no servidor.');
        return false;
    }
}

function navigate(page) {
    currentPage = page;
    currentStudent = null;

    document.querySelectorAll(".view").forEach(x => x.classList.remove("active"));
    const target = document.getElementById("page-" + page);
    if (target) target.classList.add("active");

    document.querySelectorAll(".nav button").forEach(x => {
        x.classList.toggle("active", x.dataset.page === page);
    });

    const info = {
        dashboard: ["layout-dashboard", "Dashboard"],
        alunos: ["users", "Alunos"],
        agenda: ["calendar-days", "Agenda"],
        financeiro: ["wallet-cards", "Financeiro"],
        perfil: ["user-round", "Meu Perfil"]
    };

    if (info[page]) {
        document.getElementById("pageTitle").innerHTML = `<i data-lucide="${info[page][0]}"></i>${info[page][1]}`;
    }

    renderPage();
    lucide.createIcons();
}

function renderPage() {
    if (currentPage === "dashboard") renderDashboard();
    if (currentPage === "alunos") renderAlunos();
    if (currentPage === "agenda") renderAgenda();
    if (currentPage === "financeiro") renderFinanceiro();
    if (currentPage === "perfil") renderPerfil();
}

function updateUser() {
    const p = data.professor;
    if (!p) return;
    document.getElementById("topUserName").textContent = p.nome;
    const a = document.getElementById("topAvatar");
    if (p.foto) {
        a.style.backgroundImage = `url('${p.foto}')`;
        a.textContent = "";
    } else {
        a.style.backgroundImage = "";
        a.textContent = initials(p.nome);
    }
}

function filterStudents() {
    const term = (document.getElementById("studentSearch")?.value || "").toLowerCase();
    const list = (data.alunos || []).filter(a =>
        `${a.nome} ${a.responsavel} ${(a.tags || []).join(" ")}`.toLowerCase().includes(term)
    );
    const grid = document.getElementById("studentGrid");
    if (!grid) return;
    if (!list.length) {
        grid.innerHTML = `<div class="card empty" style="grid-column:1/-1">Nenhum aluno encontrado.</div>`;
        return;
    }
    grid.innerHTML = list.map(a => `
        <div class="student" onclick="openStudent('${a.id}')">
            <div class="student-top">
                ${avatarHTML(a)}
                <div style="min-width:0">
                    <div class="student-name">${esc(a.nome)}</div>
                    <div class="student-meta">${a.idade ? esc(a.idade) + " anos · " : ""}${esc(a.serie || "Sem série")}</div>
                </div>
            </div>
            <div class="student-meta" style="margin-top:11px">Responsável: ${esc(a.responsavel || "Não informado")}</div>
            <div class="tags">${(a.tags || []).slice(0, 5).map(t => `<span class="tag">${esc(t)}</span>`).join("")}</div>
            <div style="display:flex;justify-content:space-between;margin-top:15px;padding-top:11px;border-top:1px solid #f0f3f2">
                <span style="font-size:10px;color:#8a9892">Sessão</span>
                <strong style="font-size:12px">${money(a.valor)}</strong>
            </div>
        </div>
    `).join("");
}

function toggleStudentForm() {
    const f = document.getElementById("newStudentForm");
    if (!f) return;
    f.style.display = f.style.display === "none" ? "block" : "none";
    if (f.style.display === "block") f.scrollIntoView({ behavior: "smooth", block: "start" });
}

async function saveStudent() {
    const nome = document.getElementById("fNome").value.trim();
    if (!nome) { notify("Informe o nome do aluno."); return; }

    const student = {
        id: uid(),
        nome: nome,
        idade: Number(document.getElementById("fIdade").value) || 0,
        serie: document.getElementById("fSerie").value.trim(),
        responsavel: document.getElementById("fResponsavel").value.trim(),
        telefone: document.getElementById("fTelefone").value.trim(),
        valor: Number(document.getElementById("fValor").value) || 0,
        foto: document.getElementById("fFoto").value.trim(),
        tags: document.getElementById("fTags").value.split(",").map(x => x.trim()).filter(Boolean),
        observacoes: document.getElementById("fObs").value.trim(),
        ativo: true
    };

    data.alunos.push(student);
    await saveData();
    notify("Aluno cadastrado com sucesso.");
    renderAlunos();
}

function openStudent(id) {
    currentStudent = id;
    document.querySelectorAll(".view").forEach(x => x.classList.remove("active"));
    document.getElementById("page-prontuario").classList.add("active");
    document.querySelectorAll(".nav button").forEach(x => x.classList.remove("active"));
    document.getElementById("pageTitle").innerHTML = `<i data-lucide="notebook-tabs"></i>Prontuário`;
    renderStudentProfile();
    lucide.createIcons();
}

function setStudentSectionPage(section, page) {
    studentSectionPage[section] = page;
    renderStudentProfile(section);
}

async function createAssessment() {
    const s = getStudent(currentStudent);
    if (!s) return;
    ensureStudentModules(s);

    const titulo = document.getElementById("avTitulo")?.value.trim();
    const objetivo = document.getElementById("avObjetivo")?.value.trim();
    const raw = document.getElementById("avQuestoes")?.value || "";
    const questoes = raw.split(/\n+/).map(x => x.trim()).filter(Boolean).map((texto, i) => ({ id: uid(), numero: i + 1, texto }));

async function saveAssessmentApplication() {
    const s = getStudent(currentStudent);
    if (!s) return;
    ensureStudentModules(s);
    const a = s.avaliacoes.find(x => x.id === currentAssessment);
    if (!a) return;

    const respostas = a.questoes.map((q, i) => document.getElementById("resp_" + i)?.value.trim() || "");

        id: uid(),
        data: today(),
        respostas,
        resumo: document.getElementById("avResumo")?.value.trim() || "Aplicação concluída."
    });
    a.finalizada = true;

    await saveData();
    notify("Aplicação registrada no histórico do aluno.");
    currentAssessment = null;
    renderStudentProfile("avaliacoes");
}

        monthName(calendarDate);

                    <div class="field"><label class="label">Aluno</label><select id="agAluno" class="select">${(data.alunos || []).map(a => `<option value="${a.id}" ${a.id === currentStudent ? "selected" : ""}>${esc(a.nome)}</option>`).join("")}</select></div>
                    <div class="field"><label class="label">Data</label><input id="agData" class="input" type="date" value="${selectedDay || today()}"></div>
                    <div class="field"><label class="label">Horário</label><input id="agHora" class="input" type="time" value="09:00"></div>

function toggleAgendaForm() {
    const f = document.getElementById("agendaForm");
    if (!f) return;
    f.style.display = f.style.display === "none" ? "block" : "none";
    if (f.style.display === "block") f.scrollIntoView({ behavior: "smooth", block: "center" });
}

function renderWeek() {
    const dates = weekDates(calendarDate);
    let html = `<div style="overflow:auto"><div class="week-grid"><div class="week-head"></div>`;

    dates.forEach(d => {
        html += `<div class="week-head">${d.toLocaleDateString("pt-BR", { weekday: "short" })}<br><span style="font-size:14px;color:#34413c">${d.getDate()}</span></div>`;
    });

    HOURS.forEach(hour => {
        html += `<div class="time-cell">${hour}</div>`;
        dates.forEach(d => {
            const iso = dateISO(d);
            const appointments = activeAppointments().filter(a => a.data === iso && a.hora === hour);

            if (!appointments.length) {
                html += `<div class="slot" onclick="quickSchedule('${iso}','${hour}')"><div class="empty-slot">+</div></div>`;
            } else {
                html += `<div class="slot">`;
                appointments.forEach(a => {
                    const s = getStudent(a.alunoId);
                    const t = TYPES[a.tipo];
                    html += `
                        <div class="event ${t?.cls || ''}" onclick="openStudent('${s?.id}')">
                            <strong>${esc(s?.nome || "Aluno removido")}</strong>
                            ${t?.label || a.tipo}
                            <div class="event-actions">
                                <button onclick="event.stopPropagation();togglePresence('${a.id}')">${a.presente ? "Presente" : "Presença"}</button>
                                <button onclick="event.stopPropagation();togglePayment('${a.id}')">${a.pago ? "Pago" : "Pagar"}</button>
                                <button onclick="event.stopPropagation();cancelAppointment('${a.id}')">Cancelar</button>
                            </div>
                        </div>`;
                });
                html += `</div>`;
            }
        });
    });

    html += `</div></div>`;
    return html;
}

function quickSchedule(date, hour) {
    const f = document.getElementById("agendaForm");
    if (!f) return;
    f.style.display = "block";
    document.getElementById("agData").value = date;
    document.getElementById("agHora").value = hour;
    f.scrollIntoView({ behavior: "smooth", block: "center" });
}

function renderMonth() {
    const y = calendarDate.getFullYear();
    const m = calendarDate.getMonth();
    const first = new Date(y, m, 1);
    const last = new Date(y, m + 1, 0);
    let start = first.getDay();
    start = start === 0 ? 6 : start - 1;
    const total = Math.ceil((start + last.getDate()) / 7) * 7;

    let html = `<div style="overflow:auto"><div class="month-grid">`;
    ["Seg", "Ter", "Qua", "Qui", "Sex", "Sáb", "Dom"].forEach(d => {
        html += `<div class="week-head">${d}</div>`;
    });

    for (let i = 0; i < total; i++) {
        const day = i - start + 1;
        let d = new Date(y, m, day);
        const inMonth = d.getMonth() === m;
        const iso = dateISO(d);
        const events = activeAppointments().filter(a => a.data === iso);

        html += `
            <div class="month-day ${inMonth ? "" : "other"}" onclick="${inMonth ? `selectMonthDay('${iso}')` : ""}">
                <div class="day-number">${d.getDate()}</div>
                <div class="dot-row">${events.slice(0, 7).map(a => `<span class="dot ${TYPES[a.tipo]?.cls || ''}"></span>`).join("")}</div>
                <div class="day-events">
                    ${events.slice(0, 3).map(a => { const s = getStudent(a.alunoId); return `<div class="day-event">${a.hora} · ${esc(s?.nome || "Aluno")}</div>`; }).join("")}
                    ${events.length > 3 ? `<div style="font-size:9px;color:#8a9892">+${events.length - 3} atendimentos</div>` : ""}
                </div>
            </div>`;
    }

    html += `</div></div>`;
    return html;
}

function selectMonthDay(day) {
    selectedDay = day;
    renderAgenda();
}

function renderDayPanel(day) {
    const events = activeAppointments().filter(a => a.data === day).sort((a, b) => a.hora.localeCompare(b.hora));

    return `
        <div class="card" style="margin-top:16px">
            <div class="section-head">
                <div><div class="section-title">Sessões de ${fmtDate(day)}</div><div class="section-sub">${events.length} atendimento(s)</div></div>
                <button class="btn btn-primary btn-sm" onclick="quickSchedule('${day}','09:00')"><i data-lucide="plus"></i>Adicionar</button>
            </div>
            ${events.length ? events.map(a => {
                const s = getStudent(a.alunoId);
                const t = TYPES[a.tipo];
                return `
                    <div style="display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid #f0f3f2">
                        <strong style="width:45px;font-size:12px">${a.hora}</strong>
                        ${avatarHTML(s, "student-avatar")}
                        <div style="flex:1"><div style="font-size:12px;font-weight:700;cursor:pointer" onclick="openStudent('${s?.id}')">${esc(s?.nome || "Aluno removido")}</div><div style="font-size:10px;color:#8a9892">${t?.label || a.tipo}</div></div>
                        <button class="btn btn-sm ${a.presente ? "btn-soft" : "btn-outline"}" onclick="togglePresence('${a.id}')">${a.presente ? "Presente" : "Presença"}</button>
                        <button class="btn btn-sm ${a.pago ? "btn-soft" : "btn-outline"}" onclick="togglePayment('${a.id}')">${a.pago ? "Pago" : "Pagamento"}</button>
                        <button class="btn btn-danger btn-sm" onclick="cancelAppointment('${a.id}')">Cancelar</button>
                    </div>`;
            }).join("") : `<div class="empty">Nenhuma sessão neste dia.</div>`}
        </div>`;
}

async function saveAppointment() {
    const alunoId = document.getElementById("agAluno").value;
    const dataValue = document.getElementById("agData").value;
    const hora = document.getElementById("agHora").value;
    const tipo = document.getElementById("agTipo").value;

    if (!alunoId || !dataValue || !hora) { notify("Preencha aluno, data e horário."); return; }

    const occupied = activeAppointments().some(a => a.data === dataValue && a.hora === hora);
    if (occupied) { notify("Este horário já possui atendimento."); return; }

    data.agenda.push({
        id: uid(),
        alunoId,
        data: dataValue,
        hora,
        tipo,
        status: "agendado",
        presente: false,
        pago: false
    });

    await saveData();
    notify("Atendimento agendado.");
    renderAgenda();
}

async function cancelAppointment(id) {
    const a = data.agenda.find(x => x.id === id);
    if (!a) return;
    if (!confirm("Cancelar este atendimento?")) return;
    a.status = "cancelado";
    await saveData();
    notify("Atendimento cancelado.");
    renderPage();
}

async function togglePresence(id) {
    const a = data.agenda.find(x => x.id === id);
    if (!a) return;
    a.presente = !a.presente;
    if (a.presente) a.status = "realizado";
    else a.status = "agendado";
    await saveData();
    notify(a.presente ? "Presença registrada." : "Presença removida.");
    renderPage();
}

async function togglePayment(id) {
    const a = data.agenda.find(x => x.id === id);
    if (!a) return;
    const s = getStudent(a.alunoId);
    if (!s) return;

    if (!a.pago) {
        a.pago = true;
        data.transacoes.push({
            id: uid(),
            data: a.data,
            agendaId: a.id,
            alunoId: s.id,
            descricao: `Sessão de ${s.nome}`,
            valor: Number(s.valor) || 0
        });
        notify(`Pagamento de ${money(s.valor)} registrado.`);
    } else {
        a.pago = false;
        data.transacoes = data.transacoes.filter(t => t.agendaId !== a.id);
        notify("Pagamento revertido.");
    }
    await saveData();
    renderPage();
}

function calendarPrev() {
    if (calendarMode === "week") calendarDate.setDate(calendarDate.getDate() - 7);
    else calendarDate.setMonth(calendarDate.getMonth() - 1);
    selectedDay = null;
    renderAgenda();
}

function calendarNext() {
    if (calendarMode === "week") calendarDate.setDate(calendarDate.getDate() + 7);
    else calendarDate.setMonth(calendarDate.getMonth() + 1);
    selectedDay = null;
    renderAgenda();
}

function calendarToday() {
    calendarDate = new Date();
    selectedDay = null;
    renderAgenda();
}

function setCalendarMode(mode) {
    calendarMode = mode;
    selectedDay = null;
    renderAgenda();
}

function renderFinanceiro() {
    const now = new Date();
    if (typeof financeYear !== "number") financeYear = now.getFullYear();
    if (typeof financeMonth !== "number") financeMonth = now.getMonth();

    const transactions = (data.transacoes || []).filter(t => {
        const d = parseDate(t.data);
        return d.getFullYear() === financeYear && d.getMonth() === financeMonth;
    }).sort((a, b) => b.data.localeCompare(a.data));

    const monthAppts = activeAppointments().filter(a => {
        const d = parseDate(a.data);
        return d.getFullYear() === financeYear && d.getMonth() === financeMonth;
    }).sort((a, b) => (a.data + a.hora).localeCompare(b.data + b.hora));

    const received = transactions.reduce((s, t) => s + Number(t.valor || 0), 0);
    const expected = monthAppts.reduce((s, a) => s + Number(getStudent(a.alunoId)?.valor || 0), 0);
    const pending = monthAppts.filter(a => !a.pago).reduce((s, a) => s + Number(getStudent(a.alunoId)?.valor || 0), 0);

    const rows = studentPager(transactions, window.financePage || 1, 10, "setFinancePage");
    const monthLabel = new Date(financeYear, financeMonth, 1).toLocaleDateString("pt-BR", { month: "long", year: "numeric" });

    document.getElementById("page-financeiro").innerHTML = `
        <div class="section-head">
            <div><div class="section-title">Financeiro</div><div class="section-sub">Consulte qualquer mês, de janeiro a dezembro, e mantenha cada período separado.</div></div>
            <div style="display:flex;gap:7px;flex-wrap:wrap"><button class="btn btn-blue btn-sm" onclick="generateFinancePDF()"><i data-lucide="file-down"></i>PDF do período</button><button class="btn btn-soft btn-sm" onclick="navigate('agenda')">Ver agenda</button></div>
        </div>

        <div class="card" style="margin-bottom:16px">
            <div style="display:flex;align-items:center;justify-content:space-between;gap:10px">
                <button class="btn btn-outline btn-sm" onclick="changeFinanceMonth(-1)">‹</button>
                <div style="text-align:center"><div class="section-title" style="text-transform:capitalize">${monthLabel}</div><div class="section-sub">Período selecionado</div></div>
                <button class="btn btn-outline btn-sm" onclick="changeFinanceMonth(1)">›</button>
            </div>
        </div>

        <div class="grid stats">
            <div class="card"><div class="stat-label">Recebido</div><div class="stat-value">${money(received)}</div><div class="stat-sub">No período</div></div>
            <div class="card"><div class="stat-label">A receber</div><div class="stat-value">${money(pending)}</div><div class="stat-sub">Pendências do período</div></div>
            <div class="card"><div class="stat-label">Previsto</div><div class="stat-value">${money(expected)}</div><div class="stat-sub">Atendimentos do período</div></div>
            <div class="card"><div class="stat-label">Taxa de recebimento</div><div class="stat-value">${expected ? Math.round(received / expected * 100) : 0}%</div></div>
        </div>

        <div class="card" style="margin-top:18px">
            <div class="section-head"><div><div class="section-title">Recebimentos</div><div class="section-sub">${rows.slice.length} registro(s) nesta página</div></div></div>
            ${rows.slice.length ? `
                <div style="overflow:auto"><table class="finance-table">
                    <thead><tr><th>Data</th><th>Aluno</th><th>Descrição</th><th>Valor</th><th>Status</th></tr></thead>
                    <tbody>${rows.slice.map(t => { const s = getStudent(t.alunoId); return `<tr><td>${fmtDate(t.data)}</td><td><strong>${esc(s?.nome || "Aluno removido")}</strong></td><td>${esc(t.descricao)}</td><td><strong>${money(t.valor)}</strong></td><td class="paid">Recebido</td></tr>`; }).join("")}</tbody>
                </table></div>${rows.controls}
            ` : `<div class="empty">Nenhum recebimento registrado em ${monthLabel}.</div>`}
        </div>

        <div class="card" style="margin-top:16px">
            <div class="section-title">Pendências do período</div>
            <div class="section-sub">Atendimentos deste mês ainda não pagos.</div>
            ${monthAppts.filter(a => !a.pago).slice(0, 10).map(a => {
                const s = getStudent(a.alunoId);
                return `<div style="display:flex;align-items:center;gap:10px;padding:11px 0;border-top:1px solid var(--line)">
                    <div style="flex:1;cursor:pointer" onclick="openStudent('${s?.id}')"><strong>${esc(s?.nome || "Aluno")}</strong><div class="section-sub">${fmtDate(a.data)} · ${a.hora}</div></div>
                    <strong>${money(s?.valor || 0)}</strong>
                    <button class="btn btn-primary btn-sm" onclick="togglePayment('${a.id}')">Registrar</button>
                </div>`;
            }).join("") || `<div class="empty" style="margin-top:12px">Nenhuma pendência neste período.</div>`}
        </div>
    `;
    lucide.createIcons();
}

function setFinancePage(page) { window.financePage = page; renderFinanceiro(); }

// ============================================================
// PDF
// ============================================================

function pdfSafe(v) { return String(v ?? "").replace(/[\r\n]+/g, " ").trim(); }

function pdfInstance() {
    if (!window.jspdf || !window.jspdf.jsPDF) { notify("A biblioteca de PDF não foi carregada."); return null; }
    return new window.jspdf.jsPDF({ unit: "mm", format: "a4" });
}

function pdfText(doc, text, x, y, maxWidth, lineHeight = 5) {
    const lines = doc.splitTextToSize(pdfSafe(text), maxWidth);
    lines.forEach(line => { if (y > 280) { doc.addPage(); y = 18; } doc.text(line, x, y); y += lineHeight; });
    return y;
}

function generateStudentPDF(id) {
    const s = getStudent(id);
    if (!s) return;
    ensureStudentModules(s);

    const doc = pdfInstance();
    if (!doc) return;
    const pageW = doc.internal.pageSize.getWidth();
    let y = 18;

    const heading = (title, size = 12) => {
        if (y > 270) { doc.addPage(); y = 18; }
        doc.setFont("helvetica", "bold");
        doc.setFontSize(size);
        doc.text(pdfSafe(title), 15, y);
        y += 6;
        doc.setFont("helvetica", "normal");
        doc.setFontSize(10);
    };
    const para = (value) => {
        y = pdfText(doc, String(value || "Não informado"), 15, y, pageW - 30);
        y += 4;
    };

    doc.setFont("helvetica", "bold");
    doc.setFontSize(18);
    doc.text("ASAS", 15, y);
    y += 8;
    doc.setFontSize(14);
    doc.text("Relatório clínico e pedagógico", 15, y);
    y += 8;
    doc.setFont("helvetica", "normal");
    doc.setFontSize(9);
    doc.text(`Gerado em ${fmtDate(today())}`, 15, y);
    y += 9;
    doc.setFont("helvetica", "bold");
    doc.setFontSize(13);
    doc.text(pdfSafe(s.nome), 15, y);
    y += 7;
    doc.setFont("helvetica", "normal");
    doc.setFontSize(10);
    para(`Idade: ${s.idade || "Não informada"} · Série/Ano: ${s.serie || "Não informado"}`);
    para(`Responsável: ${s.responsavel || "Não informado"}`);
    if ((s.tags || []).length) para(`Marcadores: ${s.tags.join(", ")}`);

    heading("Observações gerais");
    para(s.observacoes || "Nenhuma observação registrada.");

    heading("Histórico de evolução");
    const evs = (s.evolucoes || []).slice().sort((a, b) => a.data.localeCompare(b.data));
    if (!evs.length) para("Nenhuma evolução registrada.");
    evs.forEach(e => {
        heading(`${fmtDate(e.data)} · ${e.titulo || "Registro"}`, 10);
        para(e.texto);
    });

    heading("Comportamento observado nas consultas");
    const br = s.consultas.slice().sort((a, b) => a.data.localeCompare(b.data));
    if (!br.length) para("Nenhum registro de comportamento.");
    br.forEach(r => {
        heading(`Consulta de ${fmtDate(r.data)}`, 10);
        const labels = { participacao: "Participação", atencao: "Atenção", comunicacao: "Comunicação", autonomia: "Autonomia", comportamento: "Comportamento", emocional: "Aspecto emocional" };
        Object.entries(r.comportamentos || {}).forEach(([k, v]) => para(`${labels[k] || k}: ${v}`));
        if (r.observacoes) para(r.observacoes);
    });

    heading("Avaliações e atividades");
    const avs = s.avaliacoes || [];
    if (!avs.length) para("Nenhuma avaliação registrada.");
    avs.forEach(a => {
        heading(`${a.titulo} · ${fmtDate(a.data)}`, 10);
        if (a.objetivo) para(`Objetivo: ${a.objetivo}`);
        (a.resultados || []).forEach(r => {
            if (y > 260) { doc.addPage(); y = 18; }
            doc.setFont("helvetica", "bold");
            doc.setFontSize(9);
            doc.text(`Aplicação — ${fmtDate(r.data)}`, 15, y);
            y += 5;
            (a.questoes || []).forEach((q, i) => para(`${q.numero}. ${q.texto}\nResposta: ${r.respostas?.[i] || ""}`));
            if (r.resumo) para(`Resumo: ${r.resumo}`);
        });
    });

    heading("Informações recebidas da escola");
    if (s.escola.nome) para(`Escola: ${s.escola.nome}`);
    if (s.escola.professores) para(`Equipe/professora: ${s.escola.professores}`);
    const school = s.escola.registros.slice().sort((a, b) => a.data.localeCompare(b.data));
    if (!school.length) para("Nenhum contato com a escola registrado.");
    school.forEach(r => {
        heading(`${fmtDate(r.data)} · ${r.tipo || "Contato"} · ${r.assunto || "Registro escolar"}`, 10);
        para(`Contato: ${r.contato || "Não informado"}`);
        para(r.relato);
    });

    const safeName = (s.nome || "aluno").replace(/[^a-z0-9à-ÿ]+/gi, "-").replace(/^-|-$/g, "");
    doc.save(`relatorio-clinico-${safeName || "aluno"}.pdf`);
    notify("Relatório clínico e pedagógico salvo em PDF.");
}

function generateFinancePDF() {
    const doc = pdfInstance();
    if (!doc) return;
    const year = financeYear, m = financeMonth;

    const monthTx = (data.transacoes || []).filter(t => {
        const d = parseDate(t.data);
        return d.getFullYear() === year && d.getMonth() === m;
    }).sort((a, b) => (b.data + a.id).localeCompare(a.data + b.id));

    const monthAppts = activeAppointments().filter(a => {
        const d = parseDate(a.data);
        return d.getFullYear() === year && d.getMonth() === m;
    }).sort((a, b) => (a.data + a.hora).localeCompare(b.data + b.hora));

    const received = monthTx.reduce((sum, t) => sum + Number(t.valor || 0), 0);
    const expected = monthAppts.reduce((sum, a) => sum + Number(getStudent(a.alunoId)?.valor || 0), 0);
    const pending = monthAppts.filter(a => !a.pago).reduce((sum, a) => sum + Number(getStudent(a.alunoId)?.valor || 0), 0);

    const pageW = doc.internal.pageSize.getWidth();
    let cursor = 18;

    doc.setFont("helvetica", "bold");
    doc.setFontSize(18);
    doc.text("ASAS", 15, cursor);
    cursor += 8;
    doc.setFontSize(14);
    doc.text(`Relatório financeiro — ${new Date(year, m, 1).toLocaleDateString("pt-BR", { month: "long", year: "numeric" })}`, 15, cursor);
    cursor += 8;
    doc.setFont("helvetica", "normal");
    doc.setFontSize(10);
    cursor = pdfText(doc, `Gerado em ${fmtDate(today())}`, 15, cursor, pageW - 30);
    cursor += 4;
    doc.setFont("helvetica", "bold");
    doc.text("Resumo", 15, cursor);
    cursor += 6;
    doc.setFont("helvetica", "normal");
    cursor = pdfText(doc, `Recebido: ${money(received)} · Previsto: ${money(expected)} · Pendente: ${money(pending)}`, 15, cursor, pageW - 30);
    cursor += 6;
    doc.setFont("helvetica", "bold");
    doc.text("Recebimentos confirmados", 15, cursor);
    cursor += 6;
    doc.setFont("helvetica", "normal");
    if (!monthTx.length) cursor = pdfText(doc, "Nenhum recebimento confirmado neste mês.", 15, cursor, pageW - 30);
    monthTx.forEach(t => {
        const st = getStudent(t.alunoId);
        cursor = pdfText(doc, `${fmtDate(t.data)} · ${st?.nome || "Aluno removido"} · ${t.descricao || "Recebimento"} · ${money(t.valor)} · Recebido`, 15, cursor, pageW - 30);
    });
    if (cursor > 260) { doc.addPage(); cursor = 18; }
    cursor += 5;
    doc.setFont("helvetica", "bold");
    doc.text("Pendências do mês", 15, cursor);
    cursor += 6;
    doc.setFont("helvetica", "normal");
    const pendingRows = monthAppts.filter(a => !a.pago);
    if (!pendingRows.length) cursor = pdfText(doc, "Nenhuma pendência no mês.", 15, cursor, pageW - 30);
    pendingRows.forEach(a => {
        const st = getStudent(a.alunoId);
        cursor = pdfText(doc, `${fmtDate(a.data)} ${a.hora} · ${st?.nome || "Aluno removido"} · ${money(st?.valor || 0)} · Pendente`, 15, cursor, pageW - 30);
    });
    if (cursor > 260) { doc.addPage(); cursor = 18; }
    cursor += 5;
    doc.setFont("helvetica", "bold");
    doc.text("Histórico financeiro do mês", 15, cursor);
    cursor += 6;
    doc.setFont("helvetica", "normal");
    monthAppts.forEach(a => {
        const st = getStudent(a.alunoId);
        cursor = pdfText(doc, `${fmtDate(a.data)} ${a.hora} · ${st?.nome || "Aluno removido"} · ${money(st?.valor || 0)} · ${a.pago ? "Pago" : "Pendente"}`, 15, cursor, pageW - 30);
    });

    doc.save(`relatorio-financeiro-${year}-${String(m + 1).padStart(2, "0")}.pdf`);
    notify("Relatório financeiro do mês salvo em PDF.");
}

function renderPerfil() {

    const timeline = [];
    obsOrdenadas.forEach(o => timeline.push({ ...o, tipo: 'observacao' }));
    evoOrdenadas.forEach(e => timeline.push({ ...e, tipo: 'evolucao' }));
    timeline.sort((a, b) => b.data?.localeCompare(a.data) || 0);

    const totalAlunos = (data.alunos || []).length;
    const totalAtendimentos = activeAppointments().length;
    const totalEvolucoes = evoOrdenadas.length;
    const totalObservacoes = obsOrdenadas.length;

    document.getElementById("page-perfil").innerHTML = `
        <div class="section-head"><div><div class="section-title">Meu Perfil</div><div class="section-sub">Gerencie suas informações pessoais e acompanhe sua trajetória profissional.</div></div></div>

        <div class="grid stats">
            <div class="card"><div class="stat-label">Alunos</div><div class="stat-value">${totalAlunos}</div><div class="stat-sub">Ativos na base</div></div>
            <div class="card"><div class="stat-label">Atendimentos</div><div class="stat-value">${totalAtendimentos}</div><div class="stat-sub">Agendamentos totais</div></div>
            <div class="card"><div class="stat-label">Evoluções</div><div class="stat-value">${totalEvolucoes}</div><div class="stat-sub">Registros próprios</div></div>
            <div class="card"><div class="stat-label">Observações</div><div class="stat-value">${totalObservacoes}</div><div class="stat-sub">Anotações pessoais</div></div>
        </div>

        <div class="grid" style="grid-template-columns:1fr 1.6fr;margin-top:18px">
            <div class="card">
                <div style="display:flex;flex-direction:column;align-items:center;text-align:center;padding:15px">
                    ${avatarHTML(p, "profile-avatar")}
                    <div style="font-size:18px;font-weight:700;margin-top:12px">${esc(p.nome)}</div>
                    <div style="font-size:11px;color:#8a9892;margin-top:4px">${esc(p.especialidade)}</div>
                    <div style="font-size:11px;color:#8a9892;margin-top:4px">${p.bio ? esc(p.bio) : ""}</div>
                    <div style="margin-top:12px;display:flex;gap:6px;flex-wrap:wrap;justify-content:center">
                        <span class="tag">${totalAlunos} alunos</span>
                        <span class="tag">${totalAtendimentos} atendimentos</span>
                    </div>
                </div>
            </div>

            <div class="card">
                <div class="form-grid two">
                    <div class="field"><label class="label">Nome profissional</label><input id="profNome" class="input" value="${esc(p.nome)}"></div>
                    <div class="field"><label class="label">Especialidade</label><input id="profEspecialidade" class="input" value="${esc(p.especialidade)}"></div>
                    <div class="field" style="grid-column:1/-1"><label class="label">URL da foto</label><input id="profFoto" class="input" value="${esc(p.foto || "")}" placeholder="https://..."></div>
                    <div class="field" style="grid-column:1/-1"><label class="label">Bio profissional</label><textarea id="profBio" class="textarea">${esc(p.bio || "")}</textarea></div>
                    <div class="field" style="grid-column:1/-1">
                        <label class="label">Configurações</label>
                        <div style="display:flex;gap:15px;flex-wrap:wrap;padding-top:5px">
                            <label style="display:flex;align-items:center;gap:7px;font-size:12px;cursor:pointer"><input type="checkbox" id="cfgNotif" ${p.configuracoes?.notificacoes !== false ? "checked" : ""}> Notificações</label>
                            <label style="display:flex;align-items:center;gap:7px;font-size:12px;cursor:pointer"><input type="checkbox" id="cfgLembretes" ${p.configuracoes?.lembretes !== false ? "checked" : ""}> Lembretes</label>
                        </div>
                    </div>
                </div>
                <button class="btn btn-primary" onclick="saveProfile()"><i data-lucide="save"></i>Salvar perfil</button>
            </div>
        </div>

        <div class="card" style="margin-top:18px">
            <div class="section-head"><div><div class="section-title">Nova Observação</div><div class="section-sub">Registre anotações pessoais, reflexões ou lembretes sobre sua prática.</div></div></div>
            <div class="form-grid two">
                <div class="field"><label class="label">Título</label><input id="obsTitulo" class="input" placeholder="Ex.: Reflexão sobre atendimento"></div>
                <div class="field"><label class="label">Data</label><input id="obsData" class="input" type="date" value="${today()}"></div>

                ${timeline.map(item => {
                    const isEvolucao = item.tipo === 'evolucao';
                    const dotClass = isEvolucao ? 'evolution' : 'observation';
                    const label = isEvolucao ? 'Evolução' : 'Observação';
                    return `
                        <div class="profile-timeline-item">
                            <div class="profile-timeline-dot ${dotClass}"></div>
                            <div class="profile-timeline-content">
                                <div class="title">${esc(item.titulo || label)}</div>
                                <div class="meta">${fmtDate(item.data)} · ${label}<button style="border:0;background:none;color:#a3aea9;margin-left:10px;font-size:10px;cursor:pointer" onclick="deletarRegistroPessoal('${item.id}','${item.tipo}')">Excluir</button></div>
                                <div class="text">${esc(item.texto || item.descricao || "")}</div>
                            </div>
                        </div>`;
                }).join("")}
                </div>
            `}
        </div>
    `;
    lucide.createIcons();
}

// ============================================================

async function saveObservacao() {
    const titulo = document.getElementById("obsTitulo").value.trim() || "Observação";
    const dataVal = document.getElementById("obsData").value || today();
    const texto = document.getElementById("obsTexto").value.trim();

    if (!texto) { notify("Escreva a observação antes de salvar."); return; }

    if (!data.professor.observacoes) data.professor.observacoes = [];
    data.professor.observacoes.push({ id: uid(), data: dataVal, titulo, texto });

    await saveData();
    notify("Observação salva com sucesso.");
    renderPerfil();
}

async function saveEvolucaoPessoal() {
    const titulo = document.getElementById("evoPessoalTitulo").value.trim() || "Evolução pessoal";
    const dataVal = document.getElementById("evoPessoalData").value || today();
    const texto = document.getElementById("evoPessoalTexto").value.trim();

    if (!texto) { notify("Descreva sua evolução antes de salvar."); return; }

    if (!data.professor.evolucoesPessoais) data.professor.evolucoesPessoais = [];
    data.professor.evolucoesPessoais.push({ id: uid(), data: dataVal, titulo, texto });

    await saveData();
    notify("Evolução pessoal registrada.");
    renderPerfil();
}

async function deletarRegistroPessoal(id, tipo) {
    if (!confirm("Excluir este registro?")) return;

    if (tipo === 'observacao') {
        data.professor.observacoes = (data.professor.observacoes || []).filter(o => o.id !== id);
    } else if (tipo === 'evolucao') {
        data.professor.evolucoesPessoais = (data.professor.evolucoesPessoais || []).filter(e => e.id !== id);
    }

    await saveData();
    notify("Registro removido.");
    renderPerfil();
}

async function saveProfile() {
    const p = data.professor;
    if (!p) return;

    p.nome = document.getElementById("profNome").value.trim() || "Professor ASAS";
    p.especialidade = document.getElementById("profEspecialidade").value.trim();
    p.foto = document.getElementById("profFoto").value.trim();
    p.bio = document.getElementById("profBio").value.trim();

    p.configuracoes = p.configuracoes || {};
    p.configuracoes.notificacoes = document.getElementById("cfgNotif").checked;
    p.configuracoes.lembretes = document.getElementById("cfgLembretes").checked;

    await saveData();
    updateUser();
    notify("Perfil salvo com sucesso.");
    renderPerfil();
}

function resolveClinicalAlert(id) {
    const a = (data.clinicalAlerts || []).find(x => x.id === id);
    if (!a) return;
    a.status = "resolved";
    a.resolved_at = today();
    saveData();
    notify("Alerta arquivado como resolvido.");
    renderDashboard();
}

// ============================================================
// LOGIN/LOGOUT
// ============================================================

async function login() {
    const user = document.getElementById("loginUser").value.trim();
    const pass = document.getElementById("loginPass").value;

    if (!user || !pass) {
        notify("Preencha usuário e senha.");
        return;
    }

    const result = await loginSupabase(user, pass);

    if (result) {
        data.session = true;
        
        const loadedData = await loadData();
        if (loadedData) {
            data = loadedData;
        }
        
        await saveData();

        document.getElementById("loginScreen").style.display = "none";
        document.getElementById("app").style.display = "flex";

        updateUser();
        navigate("dashboard");
        notify(`Bem-vindo, ${data.professor?.nome || "Professor"}!`);
    }
}

async function logout() {
    await logoutSupabase();
    data.session = false;
    await saveData();

    document.getElementById("app").style.display = "none";
    document.getElementById("loginScreen").style.display = "grid";
    notify("Até logo!");
}

// ============================================================
// INICIALIZAÇÃO
// ============================================================

async function init() {
    lucide.createIcons();

    const isLoggedIn = await checkSession();

    if (isLoggedIn) {
        const loadedData = await loadData();
        if (loadedData) {
            data = loadedData;
            data.session = true;
        }
        
        document.getElementById("loginScreen").style.display = "none";
        document.getElementById("app").style.display = "flex";
        updateUser();
        navigate("dashboard");
        notify("Bem-vindo de volta!");
    } else {
        document.getElementById("loginScreen").style.display = "grid";
        document.getElementById("app").style.display = "none";
    }
}

document.querySelectorAll(".nav button[data-page]").forEach(btn => {
