</style>
<script>
// ============================================================
// REDESIGN PROFUNDO — FINANCEIRO + AGENDA
// ============================================================
function ensureFinanceGoals(){
  data.financeiro=data.financeiro||{};
  data.financeiro.metas=data.financeiro.metas||{receita:0,saldo:0,recebimentos:0};
  return data.financeiro.metas;
}
function agendaValue(a,s){ return Number(a?.valorFinal ?? a?.valor ?? s?.valor ?? 0); }
function agendaBaseValue(a,s){ return Number(a?.valorBase ?? s?.valor ?? 0); }
function agendaDiscount(a){ return Number(a?.desconto ?? 0); }
function agendaStatusLabel(st){return ({agendado:'Agendado',realizado:'Realizado',falta:'Falta',cancelado:'Cancelado',reposicao:'Reposição'})[st]||'Agendado'}
function statusClass(st){return 'status-'+(st||'agendado')}
function financeMonthTrans(year,month){return (data.transacoes||[]).filter(t=>{const d=parseDate(t.data);return d.getFullYear()===year&&d.getMonth()===month;})}
function financeMonthAppointments(year,month){return activeAppointments().filter(a=>{const d=parseDate(a.data);return d.getFullYear()===year&&d.getMonth()===month;})}
function monthShort(year,month){return new Date(year,month,1).toLocaleDateString('pt-BR',{month:'short'}).replace('.','').slice(0,3)}
function financeChartSvg(){
  const vals=[]; for(let i=0;i<12;i++){const tr=financeMonthTrans(financeYear,i);const rec=tr.filter(t=>(t.tipo||'receita')==='receita').reduce((s,t)=>s+Number(t.valor||0),0);const desp=tr.filter(t=>t.tipo==='despesa').reduce((s,t)=>s+Number(t.valor||0),0);vals.push({rec,desp});}
  const max=Math.max(1,...vals.flatMap(v=>[v.rec,v.desp])); const W=760,H=220,L=42,R=12,T=15,B=34,plotW=W-L-R,plotH=H-T-B;
  const y=v=>T+plotH-(v/max)*plotH; const x=i=>L+(i/(vals.length-1))*plotW;
  const grid=[0,.25,.5,.75,1].map(p=>{const yy=T+plotH-p*plotH;return `<line x1="${L}" y1="${yy}" x2="${W-R}" y2="${yy}" stroke="#edf1ef"/><text x="${L-7}" y="${yy+3}" text-anchor="end" font-size="8" fill="#9aa49f">${money(max*p).replace(',00','')}</text>`}).join('');
  const labels=vals.map((v,i)=>`<text x="${x(i)}" y="${H-10}" text-anchor="middle" font-size="8" fill="#8a9690">${monthShort(financeYear,i)}</text>`).join('');
  const line=(key)=>vals.map((v,i)=>`${i?'L':'M'} ${x(i).toFixed(1)} ${y(v[key]).toFixed(1)}`).join(' ');
  return `<svg class="chart-svg" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none">${grid}<path d="${line('rec')}" fill="none" stroke="#6f9483" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="${line('desp')}" fill="none" stroke="#b9857f" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="5 4"/>${vals.map((v,i)=>`<circle cx="${x(i)}" cy="${y(v.rec)}" r="3.2" fill="#6f9483"/><circle cx="${x(i)}" cy="${y(v.desp)}" r="3" fill="#b9857f"/>`).join('')}${labels}</svg>`;
}
function financeDistributionSvg(receitas,despesas){
  const by={pix:0,dinheiro:0,cartao:0,cartao_parcelado:0};receitas.forEach(t=>{by[t.metodo_pagamento||'pix']=(by[t.metodo_pagamento||'pix']||0)+Number(t.valor||0)});
  const total=Object.values(by).reduce((a,b)=>a+b,0)||1; const W=250,H=150,cx=75,cy=75,r=55;let angle=-Math.PI/2;let paths='';
  const entries=[['pix','PIX'],['cartao','Cartão'],['cartao_parcelado','Parcelado'],['dinheiro','Dinheiro']];
  entries.forEach(([k,l])=>{const portion=by[k]/total;if(!portion)return;const end=angle+portion*Math.PI*2;const x1=cx+r*Math.cos(angle),y1=cy+r*Math.sin(angle),x2=cx+r*Math.cos(end),y2=cy+r*Math.sin(end);const large=portion>.5?1:0;paths+=`<path d="M ${cx} ${cy} L ${x1} ${y1} A ${r} ${r} 0 ${large} 1 ${x2} ${y2} Z" fill="${k==='pix'?'#7d9c8e':k==='cartao'?'#91a7bc':k==='cartao_parcelado'?'#b29aa8':'#c0ad83'}"/>`;angle=end});
  return `<div style="display:flex;align-items:center;gap:14px"><svg width="150" height="150" viewBox="0 0 150 150"><circle cx="75" cy="75" r="55" fill="#f2f5f3"/>${paths.replaceAll(`cx="${cx}"`,`cx="75"`).replaceAll(`cy="${cy}"`,`cy="75"`)}</svg><div style="display:flex;flex-direction:column;gap:8px">${entries.map(([k,l])=>`<div style="font-size:10px"><span style="display:inline-block;width:8px;height:8px;border-radius:50%;background:${k==='pix'?'#7d9c8e':k==='cartao'?'#91a7bc':k==='cartao_parcelado'?'#b29aa8':'#c0ad83'};margin-right:5px"></span>${l} · <strong>${money(by[k])}</strong></div>`).join('')}</div></div>`;
}
function openFinanceGoalModal(){const g=ensureFinanceGoals();const body=`${uxHelp('Defina o que você quer alcançar','As metas ficam visíveis no Financeiro e mostram o avanço do mês.','target')}<div class="form-grid"><div class="field"><label class="label">Meta de receita</label><input id="goalReceita" class="input" type="number" min="0" step="0.01" value="${g.receita||''}" placeholder="Ex.: 5000"></div><div class="field"><label class="label">Meta de saldo</label><input id="goalSaldo" class="input" type="number" min="0" step="0.01" value="${g.saldo||''}" placeholder="Ex.: 3500"></div><div class="field"><label class="label">Meta de recebimentos</label><input id="goalRec" class="input" type="number" min="0" step="1" value="${g.recebimentos||''}" placeholder="Ex.: 20"></div></div>`;openUxModal({title:'Metas financeiras',subtitle:'Configure os objetivos deste mês.',body,foot:`<button class="btn btn-outline" onclick="closeUxModal()">Cancelar</button><button class="btn btn-primary" onclick="saveFinanceGoals()">Salvar metas</button>`})}
async function saveFinanceGoals(){const g=ensureFinanceGoals();g.receita=Number(document.getElementById('goalReceita')?.value||0);g.saldo=Number(document.getElementById('goalSaldo')?.value||0);g.recebimentos=Number(document.getElementById('goalRec')?.value||0);closeUxModal();const ok=await saveData();notify(ok?'Metas salvas.':'Não foi possível salvar.');renderFinanceiro()}
function goalBar(label,current,target){const pct=target>0?Math.min(100,Math.round(current/target*100)):0;return `<div class="goal-row"><div class="goal-top"><span class="goal-name">${label}</span><span class="goal-amount">${target?money(current)+' / '+money(target):'Sem meta definida'}</span></div><div class="goal-track"><div class="goal-fill" style="width:${pct}%"></div></div><div class="goal-meta"><span>${target?pct+'% alcançado':'Defina uma meta para acompanhar'}</span><span>${target&&pct>=100?'Meta atingida':''}</span></div></div>`}
function renderFinanceiro(){
  if(!isDataLoaded||!data){document.getElementById('page-financeiro').innerHTML='<div class="empty">Carregando...</div>';return;}
  const tr=financeMonthTrans(financeYear,financeMonth),rec=tr.filter(t=>(t.tipo||'receita')==='receita'),desp=tr.filter(t=>t.tipo==='despesa');
  const recebido=rec.reduce((s,t)=>s+Number(t.valor||0),0),despesas=desp.reduce((s,t)=>s+Number(t.valor||0),0),saldo=recebido-despesas;
  const aps=financeMonthAppointments(financeYear,financeMonth),pending=aps.filter(a=>!a.pago&&a.status!=='cancelado').reduce((s,a)=>s+agendaValue(a,getStudent(a.alunoId)),0),expected=recebido+pending;
  const g=ensureFinanceGoals(); const label=new Date(financeYear,financeMonth,1).toLocaleDateString('pt-BR',{month:'long',year:'numeric'});
  const receivedPct=expected?Math.round(recebido/expected*100):0;
  document.getElementById('page-financeiro').innerHTML=`<div class="fin-pro-page">
    <div class="pro-hero"><div><div class="pro-kicker">Gestão financeira</div><h1 class="pro-title">Financeiro</h1><p class="pro-sub">Veja o desempenho, acompanhe o caixa, identifique pendências e defina metas para o período.</p></div><div style="display:flex;gap:7px;align-items:center;flex-wrap:wrap"><div class="fin-month-nav"><button onclick="changeFinanceMonth(-1)">‹</button><span class="month-text">${label}</span><button onclick="changeFinanceMonth(1)">›</button></div><button class="btn btn-soft btn-sm" onclick="openFinanceGoalModal()">Metas</button><button class="btn btn-blue btn-sm" onclick="generateFinancePDF()">PDF</button></div></div>
    <div class="metric-strip"><div class="metric-box"><div class="metric-label">Receita realizada</div><div class="metric-value">${money(recebido)}</div><div class="metric-note">${rec.length} recebimento(s) registrados</div></div><div class="metric-box"><div class="metric-label">Saldo líquido</div><div class="metric-value">${money(saldo)}</div><div class="metric-note">Receitas menos despesas</div></div><div class="metric-box"><div class="metric-label">A receber</div><div class="metric-value">${money(pending)}</div><div class="metric-note">${aps.filter(a=>!a.pago&&a.status!=='cancelado').length} sessão(ões) pendente(s)</div></div><div class="metric-box"><div class="metric-label">Taxa de recebimento</div><div class="metric-value">${receivedPct}%</div><div class="metric-note">Do valor previsto no mês</div></div></div>
    <div class="pro-grid"><div class="pro-panel"><div class="pro-panel-head"><div><div class="pro-panel-title">Evolução financeira</div><div class="pro-panel-sub">Receitas e despesas ao longo de ${financeYear}</div></div></div><div class="pro-panel-body"><div class="chart-wrap">${financeChartSvg()}</div><div class="chart-legend"><span><i class="legend-dot"></i>Receitas</span><span><i class="legend-dot" style="background:#b9857f"></i>Despesas</span></div></div></div><div class="pro-panel"><div class="pro-panel-head"><div><div class="pro-panel-title">Metas do mês</div><div class="pro-panel-sub">Acompanhe o avanço dos seus objetivos</div></div><button class="btn btn-outline btn-sm" onclick="openFinanceGoalModal()">Editar</button></div><div class="pro-panel-body">${goalBar('Receita',recebido,g.receita)}${goalBar('Saldo',saldo,g.saldo)}${goalBar('Recebimentos',rec.length,g.recebimentos)}</div></div></div>
    <div class="pro-grid"><div class="pro-panel"><div class="pro-panel-head"><div><div class="pro-panel-title">Movimentações</div><div class="pro-panel-sub">Entradas e saídas registradas no período</div></div><button class="btn btn-soft btn-sm" onclick="showDespesaForm()">+ Despesa</button></div><div class="pro-panel-body">${tr.length?`<div style="overflow:auto"><table class="fin-table-pro"><thead><tr><th>Data</th><th>Descrição</th><th>Categoria</th><th>Valor</th></tr></thead><tbody>${tr.slice(0,15).map(t=>{const isR=(t.tipo||'receita')==='receita';const s=getStudent(t.alunoId);return `<tr><td>${fmtDate(t.data)}</td><td><strong>${esc(s?.nome||t.descricao||'Lançamento')}</strong></td><td>${esc(t.categoria||'—')}</td><td class="${isR?'amount-positive':'amount-negative'}">${isR?'+':'−'} ${money(t.valor)}</td></tr>`}).join('')}</tbody></table></div>`:'<div class="empty">Nenhuma movimentação neste mês.</div>'}</div></div><div class="pro-panel"><div class="pro-panel-head"><div><div class="pro-panel-title">Composição dos recebimentos</div><div class="pro-panel-sub">Por forma de pagamento</div></div></div><div class="pro-panel-body">${rec.length?financeDistributionSvg(rec,desp):'<div class="empty">Ainda não há recebimentos.</div>'}</div></div></div>
    <div class="pro-panel"><div class="pro-panel-head"><div><div class="pro-panel-title">Pendências de recebimento</div><div class="pro-panel-sub">Sessões realizadas/agendadas que ainda não possuem recebimento registrado</div></div></div><div class="pro-panel-body">${aps.filter(a=>!a.pago&&a.status!=='cancelado').length?`<div style="overflow:auto"><table class="fin-table-pro"><thead><tr><th>Data</th><th>Aluno</th><th>Sessão</th><th>Valor</th><th></th></tr></thead><tbody>${aps.filter(a=>!a.pago&&a.status!=='cancelado').slice(0,15).map(a=>{const s=getStudent(a.alunoId);return `<tr><td>${fmtDate(a.data)} · ${a.hora}</td><td><strong>${esc(s?.nome||'Aluno')}</strong></td><td>${esc(a.tipo||'Sessão')}</td><td class="amount-positive">${money(agendaValue(a,s))}</td><td><button class="btn btn-primary btn-sm" onclick="togglePayment('${a.id}')">Registrar</button></td></tr>`}).join('')}</tbody></table></div>`:'<div class="empty">Nenhuma pendência para este período.</div>'}</div></div>
  </div>`;try{lucide.createIcons()}catch(e){}}

function openAppointmentEditor(id){const a=data.agenda.find(x=>x.id===id);if(!a)return;const s=getStudent(a.alunoId);if(!s)return;const body=`${uxHelp('Ajuste o valor desta sessão','O valor definido aqui é específico deste atendimento. Você pode aplicar desconto sem alterar o valor padrão do aluno.','circle-dollar-sign')}<div class="form-grid"><div class="field"><label class="label">Aluno</label><div style="font-size:13px;font-weight:800">${esc(s.nome)}</div></div><div class="field"><label class="label">Valor padrão</label><input id="editValBase" class="input" type="number" min="0" step="0.01" value="${agendaBaseValue(a,s)}"></div><div class="field"><label class="label">Desconto</label><input id="editDiscount" class="input" type="number" min="0" step="0.01" value="${agendaDiscount(a)}"></div><div class="field"><label class="label">Valor final</label><input id="editValFinal" class="input" type="number" min="0" step="0.01" value="${agendaValue(a,s)}"></div></div><div class="discount-note">O valor final pode ser alterado livremente para registrar bolsa, desconto ou condição especial.</div>`;openUxModal({title:'Configurar valor da sessão',subtitle:`${fmtDate(a.data)} · ${a.hora}`,body,foot:`<button class="btn btn-outline" onclick="closeUxModal()">Cancelar</button><button class="btn btn-primary" onclick="saveAppointmentValue('${id}')">Salvar valor</button>`})}
async function saveAppointmentValue(id){const a=data.agenda.find(x=>x.id===id);if(!a)return;const base=Number(document.getElementById('editValBase')?.value||0),disc=Number(document.getElementById('editDiscount')?.value||0);let final=Number(document.getElementById('editValFinal')?.value||Math.max(0,base-disc));a.valorBase=base;a.desconto=disc;a.valorFinal=Math.max(0,final);const tx=(data.transacoes||[]).find(t=>t.agendaId===id);if(tx&&!tx.valorManuallyEdited)tx.valor=a.valorFinal;closeUxModal();const ok=await saveData();notify(ok?'Valor da sessão atualizado.':'Não foi possível salvar.');renderAgenda()}
function openAttendanceModal(id){const a=data.agenda.find(x=>x.id===id);if(!a)return;const s=getStudent(a.alunoId);if(!s)return;const current=a.status==='realizado'?'presente':a.status;const body=`${uxHelp('Registre o que aconteceu no atendimento','A agenda controla presença e faltas. O financeiro continua separado. Se houver falta justificável, você pode deixar a sessão marcada para reposição.','clipboard-check')}<div class="field"><label class="label">Situação</label><div class="attendance-options"><label class="attendance-option"><input type="radio" name="attStatus" value="presente" ${current==='presente'?'checked':''}><strong>Presente</strong><span>Atendimento realizado</span></label><label class="attendance-option"><input type="radio" name="attStatus" value="falta" ${current==='falta'?'checked':''}><strong>Falta</strong><span>Aluno não compareceu</span></label><label class="attendance-option"><input type="radio" name="attStatus" value="cancelado" ${current==='cancelado'?'checked':''}><strong>Cancelado</strong><span>Atendimento cancelado</span></label></div></div><div class="makeup-box"><label style="display:flex;gap:8px;align-items:center;font-size:11px;font-weight:800"><input id="attMakeup" type="checkbox" ${a.reposicaoDisponivel?'checked':''}> Esta falta pode ser reposta</label><div class="form-grid" style="margin-top:10px"><div class="field"><label class="label">Data sugerida para reposição</label><input id="attMakeupDate" class="input" type="date" value="${a.reposicaoData||''}"></div><div class="field"><label class="label">Observação</label><input id="attNote" class="input" value="${esc(a.observacaoFalta||'')}" placeholder="Ex.: falta justificada"></div></div></div>`;openUxModal({title:'Registrar presença',subtitle:`${esc(s.nome)} · ${fmtDate(a.data)} · ${a.hora}`,body,foot:`<button class="btn btn-outline" onclick="closeUxModal()">Cancelar</button><button class="btn btn-primary" onclick="saveAttendance('${id}')">Salvar registro</button>`})}
async function saveAttendance(id){const a=data.agenda.find(x=>x.id===id);if(!a)return;const st=document.querySelector('input[name="attStatus"]:checked')?.value||'presente';a.status=st==='presente'?'realizado':st;a.presente=st==='presente';a.reposicaoDisponivel=!!document.getElementById('attMakeup')?.checked&&st==='falta';a.reposicaoData=document.getElementById('attMakeupDate')?.value||'';a.observacaoFalta=document.getElementById('attNote')?.value.trim()||'';const s=getStudent(a.alunoId);if(s){ensureStudentModules(s);s.faltas=s.faltas||[];s.faltas=s.faltas.filter(f=>f.agendaId!==a.id);if(st==='falta')s.faltas.push({data:a.data,agendaId:a.id,reposicaoDisponivel:a.reposicaoDisponivel,reposicaoData:a.reposicaoData,observacao:a.observacaoFalta})}closeUxModal();const ok=await saveData();notify(ok?'Registro de presença atualizado.':'Não foi possível salvar.');renderAgenda()}
function openMakeupModal(id){const a=data.agenda.find(x=>x.id===id);if(!a)return;const s=getStudent(a.alunoId);if(!s)return;const body=`${uxHelp('Planejar reposição','Esta sessão está marcada como passível de reposição. Defina uma nova data e horário sem apagar o registro da falta.','calendar-plus')}<div class="form-grid"><div class="field"><label class="label">Aluno</label><div style="font-size:13px;font-weight:800">${esc(s.nome)}</div></div><div class="field"><label class="label">Data da reposição</label><input id="repData" class="input" type="date" value="${a.reposicaoData||today()}"></div><div class="field"><label class="label">Horário</label><input id="repHora" class="input" type="time" value="${a.reposicaoHora||a.hora||'09:00'}"></div></div><div class="discount-note">A falta original continua no histórico. A reposição será um novo compromisso vinculado a ela.</div>`;openUxModal({title:'Agendar reposição',subtitle:'O histórico da falta será preservado.',body,foot:`<button class="btn btn-outline" onclick="closeUxModal()">Cancelar</button><button class="btn btn-primary" onclick="saveMakeup('${id}')">Criar reposição</button>`})}
async function saveMakeup(id){const a=data.agenda.find(x=>x.id===id);if(!a)return;const dt=document.getElementById('repData')?.value,hr=document.getElementById('repHora')?.value;if(!dt||!hr){notify('Informe data e horário.');return}if(activeAppointments().some(x=>x.data===dt&&x.hora===hr)){notify('Horário ocupado.');return}const n={id:uid(),alunoId:a.alunoId,data:dt,hora:hr,tipo:a.tipo,status:'reposicao',presente:false,pago:false,valorBase:a.valorBase,desconto:a.desconto,valorFinal:a.valorFinal,reposicaoDe:a.id};data.agenda.push(n);a.reposicaoAgendadaId=n.id;a.reposicaoData=dt;a.reposicaoHora=hr;closeUxModal();const ok=await saveData();notify(ok?'Reposição agendada.':'Não foi possível salvar.');renderAgenda()}
function agendaProWeek(){const dates=weekDates(calendarDate);let h='<div class="week-grid-pro"><div class="week-head-pro"></div>';dates.forEach(d=>{const iso=dateISO(d);h+=`<div class="week-head-pro">${d.toLocaleDateString('pt-BR',{weekday:'short'}).replace('.','')}<strong>${d.getDate()}</strong></div>`});HOURS.forEach(hr=>{h+=`<div class="time-cell-pro">${hr}</div>`;dates.forEach(d=>{const iso=dateISO(d);const aps=activeAppointments().filter(a=>a.data===iso&&a.hora===hr);if(!aps.length)h+=`<div class="slot-pro empty" onclick="quickSchedule('${iso}','${hr}')"><div class="slot-add">+</div></div>`;else{h+='<div class="slot-pro">';aps.forEach(a=>{const s=getStudent(a.alunoId);if(!s)return;h+=`<div class="event-pro" onclick="openAppointmentEditor('${a.id}')"><div class="ep-name">${esc(s.nome.split(' ')[0])}</div><div class="ep-meta">${esc(a.tipo||'Sessão')} · ${money(agendaValue(a,s))}</div><div class="ep-status"><span class="status-pill ${statusClass(a.status)}">${agendaStatusLabel(a.status)}</span></div></div>`});h+='</div>'}})});return h+'</div>'}
function agendaProMonth(){const y=calendarDate.getFullYear(),m=calendarDate.getMonth(),first=new Date(y,m,1),last=new Date(y,m+1,0);let start=first.getDay();start=start===0?6:start-1;const total=Math.ceil((start+last.getDate())/7)*7;let h='<div class="month-grid">';['Seg','Ter','Qua','Qui','Sex','Sáb','Dom'].forEach(d=>h+=`<div class="week-head-pro">${d}</div>`);for(let i=0;i<total;i++){const d=new Date(y,m,i-start+1),inM=d.getMonth()===m,iso=dateISO(d),evs=activeAppointments().filter(a=>a.data===iso);h+=`<div class="month-day ${inM?'':'other'}" onclick="${inM?`selectMonthDay('${iso}')`:''}"><div class="day-number">${d.getDate()}</div><div class="dot-row">${evs.slice(0,6).map(a=>`<span class="dot ${TYPES[a.tipo]?.cls||''}"></span>`).join('')}</div>${evs.length?`<div style="font-size:8px;color:#8a9690;margin-top:4px">${evs.length} sessão(ões)</div>`:''}</div>`}return h+'</div>'}
function renderAgenda(){
  if(!isDataLoaded||!data||!data.agenda){document.getElementById('page-agenda').innerHTML='<div class="empty">Carregando...</div>';return}
  const apps=activeAppointments(),todayApps=apps.filter(a=>a.data===today()),week=weekDates(new Date()).map(dateISO),weekApps=apps.filter(a=>week.includes(a.data));const faltas=apps.filter(a=>a.status==='falta').length;const repos=apps.filter(a=>a.reposicaoDisponivel&&!a.reposicaoAgendadaId).length;const title=calendarMode==='week'?`${fmtDate(dateISO(weekDates(calendarDate)[0]))} — ${fmtDate(dateISO(weekDates(calendarDate)[4]))}`:monthName(calendarDate);
  const side=apps.filter(a=>a.data>=today()).sort((a,b)=>(a.data+a.hora).localeCompare(b.data+b.hora)).slice(0,7);
  document.getElementById('page-agenda').innerHTML=`<div class="agenda-pro-page">${uxHelp('A Agenda organiza seus atendimentos','Aqui você agenda, define o valor de cada sessão, registra presença ou falta e controla reposições. O pagamento é registrado separadamente no Financeiro.','calendar-days')}
  <div class="pro-hero"><div><div class="pro-kicker">Rotina de atendimentos</div><h1 class="pro-title">Agenda</h1><p class="pro-sub">Planeje sua semana, acompanhe o que aconteceu e mantenha o histórico de faltas e reposições.</p></div><button class="btn btn-primary" onclick="toggleAgendaForm()">+ Novo atendimento</button></div>
  <div class="agenda-summary"><div class="metric-box"><div class="metric-label">Hoje</div><div class="metric-value">${todayApps.length}</div><div class="metric-note">atendimento(s) na agenda</div></div><div class="metric-box"><div class="metric-label">Semana</div><div class="metric-value">${weekApps.length}</div><div class="metric-note">compromisso(s)</div></div><div class="metric-box"><div class="metric-label">Faltas</div><div class="metric-value">${faltas}</div><div class="metric-note">no histórico</div></div><div class="metric-box"><div class="metric-label">Reposições</div><div class="metric-value">${repos}</div><div class="metric-note">pendente(s) de agendamento</div></div></div>
  <div id="agendaForm" class="agenda-form-pro" style="display:none"><div class="pro-panel-title" style="margin-bottom:12px">Novo atendimento</div><div class="form-grid"><div class="field"><label class="label">Aluno</label><select id="agAluno" class="select">${(data.alunos||[]).map(a=>`<option value="${a.id}">${esc(a.nome)}</option>`).join('')}</select></div><div class="field"><label class="label">Data</label><input id="agData" class="input" type="date" value="${selectedDay||today()}"></div><div class="field"><label class="label">Horário</label><input id="agHora" class="input" type="time" value="09:00"></div><div class="field"><label class="label">Tipo</label><select id="agTipo" class="select"><option value="psicopedagogia">Psicopedagogia</option><option value="psicologia">Psicologia</option><option value="aula">Aula</option></select></div><div class="field"><label class="label">Valor da sessão</label><input id="agValor" class="input" type="number" min="0" step="0.01" placeholder="Use o valor padrão ou defina outro"></div><div class="field"><label class="label">Desconto</label><input id="agDesconto" class="input" type="number" min="0" step="0.01" value="0"></div></div><div class="value-summary"><div><div class="value-caption">Valor final desta sessão</div><div id="agValorPreview" class="value-main">R$ 0,00</div></div><div class="value-caption">O valor é independente do padrão do aluno.</div></div><div class="form-actions"><button class="btn btn-primary" onclick="saveAppointment()">Agendar atendimento</button><button class="btn btn-outline" onclick="toggleAgendaForm()">Cancelar</button></div></div>
  <div class="agenda-layout"><div class="agenda-calendar-panel"><div class="agenda-toolbar-pro"><div style="display:flex;align-items:center;gap:6px"><button class="btn btn-outline btn-sm" onclick="calendarPrev()">‹</button><div class="agenda-date-title">${esc(title)}</div><button class="btn btn-outline btn-sm" onclick="calendarNext()">›</button><button class="btn btn-soft btn-sm" onclick="calendarToday()">Hoje</button></div><div class="agenda-toolbar-actions"><button class="btn ${calendarMode==='week'?'btn-soft':'btn-outline'} btn-sm" onclick="setCalendarMode('week')">Semana</button><button class="btn ${calendarMode==='month'?'btn-soft':'btn-outline'} btn-sm" onclick="setCalendarMode('month')">Mês</button></div></div>${calendarMode==='week'?agendaProWeek():agendaProMonth()}</div><div class="agenda-side"><div class="pro-panel"><div class="pro-panel-head"><div><div class="pro-panel-title">Próximos atendimentos</div><div class="pro-panel-sub">Ações clínicas e operacionais</div></div></div><div class="pro-panel-body">${side.length?side.map(a=>{const s=getStudent(a.alunoId);return `<div class="agenda-event-row"><div class="agenda-time">${a.hora}</div><div><div class="agenda-event-name">${esc(s?.nome||'Aluno')}</div><div class="agenda-event-meta">${fmtDate(a.data)} · ${money(agendaValue(a,s))}</div></div><div class="agenda-actions"><button title="Presença/falta" onclick="openAttendanceModal('${a.id}')">✓</button><button title="Valor" onclick="openAppointmentEditor('${a.id}')">$</button>${a.reposicaoDisponivel&&!a.reposicaoAgendadaId?`<button title="Repor" onclick="openMakeupModal('${a.id}')">↻</button>`:''}</div></div>`}).join(''):'<div class="empty">Nenhum atendimento próximo.</div>'}</div></div><div class="pro-panel"><div class="pro-panel-head"><div><div class="pro-panel-title">Controle de faltas</div><div class="pro-panel-sub">Não perca reposições pendentes</div></div></div><div class="pro-panel-body">${apps.filter(a=>a.status==='falta').slice(0,5).map(a=>{const s=getStudent(a.alunoId);return `<div class="agenda-event-row"><div class="agenda-time">${fmtDate(a.data)}</div><div><div class="agenda-event-name">${esc(s?.nome||'Aluno')}</div><div class="agenda-event-meta">${a.reposicaoDisponivel?(a.reposicaoAgendadaId?'Reposição agendada':'Pode repor'):'Sem reposição'}</div></div>${a.reposicaoDisponivel&&!a.reposicaoAgendadaId?`<button class="btn btn-soft btn-sm" onclick="openMakeupModal('${a.id}')">Repor</button>`:'<span class="status-pill status-falta">Falta</span>'}</div>`}).join('')||'<div class="empty">Nenhuma falta registrada.</div>'}</div></div></div></div></div>`;
  const agValor=document.getElementById('agValor'),agDesc=document.getElementById('agDesconto'),agAluno=document.getElementById('agAluno');function upd(){const s=getStudent(agAluno?.value);const base=Number(agValor?.value||s?.valor||0),d=Number(agDesc?.value||0);const p=document.getElementById('agValorPreview');if(p)p.textContent=money(Math.max(0,base-d))}if(agAluno){agAluno.addEventListener('change',upd);agValor.addEventListener('input',upd);agDesc.addEventListener('input',upd);upd()}try{lucide.createIcons()}catch(e){}}
async function saveAppointment(){const aId=document.getElementById('agAluno')?.value,dt=document.getElementById('agData')?.value,hr=document.getElementById('agHora')?.value,tp=document.getElementById('agTipo')?.value;if(!aId||!dt||!hr){notify('Preencha aluno, data e horário.');return}if(activeAppointments().some(a=>a.data===dt&&a.hora===hr)){notify('Horário ocupado.');return}const s=getStudent(aId);if(!s){notify('Aluno não encontrado.');return}const base=Number(document.getElementById('agValor')?.value||s.valor||0),disc=Number(document.getElementById('agDesconto')?.value||0),final=Math.max(0,base-disc);const na={id:uid(),alunoId:aId,data:dt,hora:hr,tipo:tp,status:'agendado',presente:false,pago:false,valorBase:base,desconto:disc,valorFinal:final,reposicaoDisponivel:false};data.agenda.push(na);const ok=await saveData();if(ok){notify('Atendimento agendado.');renderAgenda()}else{data.agenda=data.agenda.filter(x=>x.id!==na.id);notify('Não foi possível salvar.')}}
</script>
