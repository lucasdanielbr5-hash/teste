<script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js"></script>

<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;font-family:Inter,sans-serif;background:#f7f9f8;color:#263238}
body{overflow:hidden}
button,input,select,textarea{font-family:inherit}
button{cursor:pointer}
::-webkit-scrollbar{width:7px;height:7px}
::-webkit-scrollbar-thumb{background:#cbd5d1;border-radius:20px}
::-webkit-scrollbar-track{background:transparent}

:root{
 --sage:#5f8f7a;
 --sage-dark:#477363;
 --sage-light:#eaf3ee;
 --blue:#6288a8;
 --blue-light:#edf4f8;
 --ink:#263238;
 --muted:#718096;
 --line:#e6ece9;
 --surface:#fff;
}

.app{height:100vh;display:flex}
.sidebar{
 width:76px;background:#fff;border-right:1px solid var(--line);
 display:flex;flex-direction:column;align-items:center;padding:20px 10px;
 flex-shrink:0;transition:.25s;z-index:20
}
.sidebar:hover{width:218px;align-items:stretch}
.brand{height:52px;display:flex;align-items:center;gap:12px;color:var(--sage-dark);font-weight:700;padding:0 10px;white-space:nowrap;overflow:hidden}
.brand-mark{width:36px;height:36px;border-radius:12px;background:var(--sage-light);display:grid;place-items:center;flex-shrink:0}
.brand span{opacity:0;transition:.2s}
.sidebar:hover .brand span{opacity:1}
.nav{margin-top:22px;display:flex;flex-direction:column;gap:5px}
.nav button{
 border:0;background:transparent;color:#718096;border-radius:12px;
 min-height:44px;padding:0 12px;display:flex;align-items:center;gap:13px;
 font-size:13px;font-weight:500;text-align:left;white-space:nowrap;overflow:hidden
}
.nav button:hover{background:#f3f6f5;color:var(--ink)}
.nav button.active{background:var(--sage-light);color:var(--sage-dark);font-weight:600}
.nav svg{width:20px;min-width:20px}
.nav-label{opacity:0;transition:.2s}
.sidebar:hover .nav-label{opacity:1}
.side-bottom{margin-top:auto}
.main{min-width:0;flex:1;height:100vh;display:flex;flex-direction:column}
.topbar{
 height:72px;background:#fff;border-bottom:1px solid var(--line);
 display:flex;align-items:center;justify-content:space-between;padding:0 30px;flex-shrink:0
}
.page-title{display:flex;align-items:center;gap:10px;font-size:18px;font-weight:600}
.page-title svg{color:var(--sage);width:20px}
.user-mini{display:flex;align-items:center;gap:10px}
.avatar{width:38px;height:38px;border-radius:50%;background:var(--sage-light);color:var(--sage-dark);display:grid;place-items:center;font-weight:700;overflow:hidden;background-size:cover;background-position:center}
.content{padding:26px 30px 40px;overflow:auto;height:calc(100vh - 72px)}
.view{display:none;animation:fade .2s ease}
.view.active{display:block}
@keyframes fade{from{opacity:.3;transform:translateY(5px)}to{opacity:1;transform:none}}

.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:20px;box-shadow:0 2px 8px rgba(30,50,40,.025)}
.grid{display:grid;gap:16px}
.stats{grid-template-columns:repeat(4,minmax(0,1fr))}
.stat-label{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:#91a09a;font-weight:600}
.stat-value{font-size:25px;font-weight:700;margin-top:8px;color:#263238}
.stat-sub{font-size:11px;color:#8a9892;margin-top:5px}

.btn{border:0;border-radius:11px;padding:9px 15px;font-size:13px;font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:7px;transition:.15s}
.btn svg{width:16px}
.btn-primary{background:var(--sage);color:white}
.btn-primary:hover{background:var(--sage-dark)}
.btn-soft{background:var(--sage-light);color:var(--sage-dark)}
.btn-blue{background:var(--blue-light);color:#557994}
.btn-danger{background:#fff0f0;color:#b85b5b}
.btn-outline{background:#fff;border:1px solid var(--line);color:#53615c}
.btn-outline:hover{background:#f7faf8}
.btn-outline:disabled{opacity:.5;cursor:not-allowed}
.btn-sm{padding:7px 10px;font-size:12px}

.input,.select,.textarea{
 width:100%;border:1px solid #dfe7e3;background:#fbfcfc;border-radius:10px;
 padding:9px 11px;outline:0;font-size:13px;color:var(--ink);transition:.15s
}
.input:focus,.select:focus,.textarea:focus{border-color:#8eb2a3;box-shadow:0 0 0 3px rgba(95,143,122,.09)}
.textarea{resize:vertical;min-height:100px}
.label{display:block;font-size:11px;font-weight:600;color:#66756f;margin-bottom:5px}
.field{margin-bottom:13px}
.form-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.form-grid.two{grid-template-columns:repeat(2,minmax(0,1fr))}
.form-actions{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap}

.section-head{display:flex;align-items:center;justify-content:space-between;gap:15px;margin-bottom:16px}
.section-title{font-size:15px;font-weight:700;color:#34413c}
.section-sub{font-size:12px;color:#89968f;margin-top:3px}

.student-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(235px,1fr));gap:14px}
.student{
 background:#fff;border:1px solid var(--line);border-radius:17px;padding:17px;
 transition:.18s;cursor:pointer
}
.student:hover{border-color:#c8ddd3;transform:translateY(-2px);box-shadow:0 10px 24px rgba(50,90,70,.07)}
.student-top{display:flex;gap:12px;align-items:center}
.student-avatar{width:48px;height:48px;border-radius:15px;background:var(--sage-light);color:var(--sage-dark);display:grid;place-items:center;font-weight:700;font-size:17px;overflow:hidden;background-size:cover;background-position:center}
.student-name{font-weight:700;font-size:14px}
.student-meta{font-size:11px;color:#89968f;margin-top:3px}
.tags{display:flex;flex-wrap:wrap;gap:5px;margin-top:13px}
.tag{font-size:10px;padding:4px 8px;border-radius:20px;background:#edf4f8;color:#597b96;font-weight:600}

.profile-cover{height:112px;border-radius:18px 18px 0 0;background:linear-gradient(135deg,#eaf3ee,#edf4f8)}
.profile-card{margin-top:-1px;border-radius:0 0 18px 18px}
.profile-head{display:flex;gap:20px;align-items:flex-end;margin-top:-42px;padding:0 24px}
.profile-avatar{width:92px;height:92px;border-radius:25px;background:#eaf3ee;border:5px solid white;display:grid;place-items:center;font-size:30px;font-weight:700;color:var(--sage-dark);overflow:hidden;background-size:cover;background-position:center;flex-shrink:0}
.profile-name{font-size:22px;font-weight:700}
.profile-meta{font-size:12px;color:#81908a;margin-top:4px}
.profile-actions{margin-left:auto;display:flex;gap:7px}
.profile-body{padding:20px 24px}
.profile-layout{display:grid;grid-template-columns:2fr 1fr;gap:18px;margin-top:18px}

.timeline{display:flex;flex-direction:column;gap:10px}
.evolution{border:1px solid var(--line);border-radius:13px;padding:14px;background:#fbfcfc}
.evolution-date{font-size:10px;color:#91a09a;font-weight:600}
.evolution-title{font-size:13px;font-weight:700;margin:5px 0}
.evolution-text{font-size:12px;line-height:1.65;color:#596761;white-space:pre-wrap}

.agenda-toolbar{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:15px}
.toolbar-group{display:flex;gap:5px;align-items:center}
.month-label{font-size:16px;font-weight:700;min-width:150px;text-align:center}
.week-grid{display:grid;grid-template-columns:70px repeat(5,minmax(130px,1fr));min-width:700px}
.week-head{background:#fafcfb;border-bottom:1px solid var(--line);padding:10px;text-align:center;font-size:11px;font-weight:700;color:#68766f}
.time-cell{height:72px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);padding:7px;font-size:10px;color:#97a39e;text-align:right}
.slot{height:72px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);padding:4px;background:#fff}
.slot:hover{background:#fbfdfc}
.event{padding:7px;border-radius:9px;font-size:10px;line-height:1.3;cursor:pointer;position:relative;min-height:58px}
.event.psico{background:#edf4f8;color:#557792}
.event.psicopeg{background:#f0f5ec;color:#5d806c}
.event.aula{background:#f5f0f8;color:#80678c}
.event strong{display:block;font-size:10px;margin-bottom:2px}
.event-actions{display:flex;gap:3px;margin-top:5px}
.event-actions button{border:0;background:rgba(255,255,255,.65);border-radius:5px;padding:2px 5px;font-size:9px}
.empty-slot{height:100%;display:grid;place-items:center;color:#c1ccc7;font-size:11px}

.month-grid{display:grid;grid-template-columns:repeat(7,1fr);border:1px solid var(--line);border-radius:15px;overflow:hidden;background:white}
.month-week{display:contents}
.month-day{
 min-height:105px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);
 padding:8px;cursor:pointer
}
.month-day:hover{background:#fafcfb}
.month-day.other{background:#fafafa;color:#b9c2be}
.day-number{font-size:11px;font-weight:700}
.dot-row{display:flex;flex-wrap:wrap;gap:3px;margin-top:9px}
.dot{width:7px;height:7px;border-radius:50%}
.dot.psico{background:#8db0c8}.dot.psicopeg{background:#8eb29d}.dot.aula{background:#ad94b9}
.day-events{margin-top:7px;display:flex;flex-direction:column;gap:3px}
.day-event{font-size:9px;padding:3px 5px;border-radius:5px;background:#edf4f8;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.finance-table{width:100%;border-collapse:collapse}
.finance-table th{text-align:left;font-size:10px;color:#87948e;text-transform:uppercase;padding:10px;border-bottom:1px solid var(--line)}
.finance-table td{padding:12px 10px;border-bottom:1px solid #f0f3f2;font-size:12px}
.paid{color:#5d8a70;font-weight:700}.pending{color:#a98058;font-weight:700}
.alert{padding:12px;border-radius:12px;background:#fff8ef;border:1px solid #f3e5d2}
.alert-title{font-size:12px;font-weight:700;color:#876f51}
.alert-text{font-size:11px;color:#8d8171;margin-top:3px}
.empty{padding:30px;text-align:center;color:#98a49f;font-size:13px}
.kpi-bar{height:6px;border-radius:10px;background:#edf1ef;overflow:hidden;margin-top:10px}
.kpi-fill{height:100%;background:var(--sage);border-radius:10px}

.clinical-alert{padding:13px;border-radius:13px;background:#fff8ef;border:1px solid #f1dfc8;margin-bottom:9px}
.clinical-alert.resolved{background:#f5faf7;border-color:#dcebe2;opacity:.8}
.clinical-alert-title{font-size:12px;font-weight:700;color:#795f42}
.clinical-alert.resolved .clinical-alert-title{color:#5d806c}
.clinical-alert-text{font-size:11px;color:#7d7368;line-height:1.5;margin-top:4px}
.clinical-alert-actions{display:flex;gap:6px;flex-wrap:wrap;margin-top:9px}
.clinical-alert-actions .btn{font-size:10px;padding:6px 8px}
.login-screen{height:100vh;display:grid;place-items:center;background:linear-gradient(135deg,#f4f8f6,#f1f5f8)}
.login-box{width:min(420px,calc(100% - 30px));background:#fff;border:1px solid var(--line);border-radius:24px;padding:34px;box-shadow:0 20px 60px rgba(40,70,55,.08)}
.login-brand{display:flex;justify-content:center;align-items:center;gap:10px;color:var(--sage-dark);font-weight:700;font-size:22px}
.login-sub{text-align:center;color:#87948e;font-size:12px;margin:8px 0 28px}

.toast{
 position:fixed;right:22px;bottom:22px;background:#263d35;color:#fff;padding:12px 16px;
 border-radius:12px;font-size:12px;z-index:100;opacity:0;transform:translateY(10px);pointer-events:none;transition:.25s
}
.toast.show{opacity:1;transform:none}

.profile-timeline-item{
 padding:14px 0;
 border-bottom:1px solid #f0f3f2;
 display:flex;
 gap:14px;
 align-items:flex-start;
}
.profile-timeline-item:last-child{border-bottom:0}
.profile-timeline-dot{
 width:10px;
 height:10px;
 border-radius:50%;
 margin-top:4px;
 flex-shrink:0;
}
.profile-timeline-dot.evolution{background:#8eb29d}
.profile-timeline-dot.observation{background:#8db0c8}
.profile-timeline-dot.alert{background:#c9a87c}
.profile-timeline-content{flex:1;min-width:0}
.profile-timeline-content .title{font-weight:700;font-size:13px}
.profile-timeline-content .meta{font-size:10px;color:#8a9892;margin:2px 0 5px}
.profile-timeline-content .text{font-size:12px;color:#596761;line-height:1.6;white-space:pre-wrap}
.profile-timeline-content .actions{display:flex;gap:6px;margin-top:6px;flex-wrap:wrap}

@media(max-width:950px){
 .stats{grid-template-columns:repeat(2,1fr)}
 .profile-layout{grid-template-columns:1fr}
 .form-grid{grid-template-columns:repeat(2,1fr)}
}
@media(max-width:680px){
 .sidebar{width:58px;padding:15px 6px}
 .sidebar:hover{width:58px}
 .sidebar:hover .brand span,.sidebar:hover .nav-label{opacity:0}
 .brand{padding:0 5px;justify-content:center}
 .nav button{justify-content:center;padding:0}
 .main{margin-left:0}
 .topbar{height:62px;padding:0 15px}
 .content{height:calc(100vh - 62px);padding:17px 13px}
 .form-grid,.form-grid.two{grid-template-columns:1fr}
 .stats{grid-template-columns:1fr 1fr}
 .profile-head{align-items:flex-start;flex-wrap:wrap;padding:0 14px}
 .profile-actions{width:100%;margin-left:0}
 .profile-body{padding:15px}
 .profile-avatar{width:75px;height:75px}
 .profile-name{font-size:18px}
 .month-grid{min-width:620px}
}

/* ===== Ajuda contextual (barra inferior) ===== */
.help-box{display:flex;gap:10px;align-items:flex-start;background:#f4f8f6;border:1px solid #d9e6e0;border-radius:14px;padding:13px 16px;margin-top:18px;font-size:12px;line-height:1.6;color:#5a6b64}
.help-box i{flex-shrink:0}

/* ===== Mini calendário lateral (financeiro) ===== */
.finance-layout{display:grid;grid-template-columns:1fr 280px;gap:18px;align-items:start}
.finance-side{position:sticky;top:10px}
.mini-cal{background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px}
.mini-cal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.mini-cal-head .mc-title{font-size:12px;font-weight:700;text-transform:capitalize;color:#4a5852}
.mini-cal-head button{border:0;background:#f4f8f6;border-radius:8px;width:24px;height:24px;cursor:pointer;font-size:13px;color:#6b7a73;display:flex;align-items:center;justify-content:center}
.mini-cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px}
.mini-cal-dow{font-size:8px;color:#a3aea9;text-align:center;padding:2px 0}
.mini-cal-day{aspect-ratio:1;font-size:10px;display:flex;align-items:center;justify-content:center;border-radius:6px;cursor:default;color:#6b7a73;position:relative}
.mini-cal-day.other{color:#d0d8d4}
.mini-cal-day.today{background:var(--sage);color:#fff;font-weight:700}
.mini-cal-day.has-event::after{content:"";position:absolute;bottom:2px;width:4px;height:4px;border-radius:50%;background:#e8a23d}
.mini-cal-day.has-event.paid::after{background:var(--sage)}
.mini-cal-day.has-event.pending::after{background:#e8a23d}
.mini-cal-day.sel{outline:2px solid var(--sage);outline-offset:-2px}
.side-card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px;margin-top:12px}
.side-card .sc-title{font-size:12px;font-weight:700;margin-bottom:8px;color:#4a5852}
.side-card .sc-row{display:flex;justify-content:space-between;font-size:11px;padding:5px 0;border-bottom:1px solid #f0f3f2}
.side-card .sc-row:last-child{border:0}
.side-card .sc-row .sc-val{font-weight:700}

/* ===== Tipos de avaliação (badges) ===== */
.aval-type-badge{display:inline-flex;align-items:center;gap:5px;font-size:10px;font-weight:600;padding:3px 9px;border-radius:20px;background:#eaf3ee;color:#3d8a6b}
.aval-type-badge.survey{background:#eef0f8;color:#5b63b3}
.aval-type-badge.screening{background:#fef3e8;color:#b8732a}
.aval-type-badge.anamnese{background:#e8f0fe;color:#3a6cb8}
.aval-list-item{padding:14px 0;border-top:1px solid var(--line)}
.aval-applied-row{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid #f5f7f6}
.aval-applied-row:last-child{border:0}
@media(max-width:950px){
 .finance-layout{grid-template-columns:1fr}
 .finance-side{position:static}
}
</style>
<script src="https://sites.super.myninja.ai/_assets/ninja-daytona-script.js"></script>
</head>

<body>

<div id="loginScreen" class="login-screen">
  <div class="login-box">
    <div class="login-brand">
      <div class="brand-mark"><i data-lucide="heart-handshake"></i></div>
      ASAS
    </div>
    <div class="login-sub">Gestão integrada para educação e cuidado</div>

      <label class="label">Usuário</label>

    <div style="text-align:center;color:#a0aaa6;font-size:10px;margin-top:14px">
      Acesso: professor@asas.com / 123456
    </div>
  </div>
</div>

<div id="app" class="app" style="display:none">

<aside class="sidebar">
  <div class="brand">
    <div class="brand-mark"><i data-lucide="heart-handshake"></i></div>
    <span>ASAS</span>

  <nav class="nav">

      <i data-lucide="layout-dashboard"></i><span class="nav-label">Dashboard</span>

    </button>
    <button data-page="avaliacoes">
      <i data-lucide="clipboard-check"></i><span class="nav-label">Avaliações</span>

</aside>

<main class="main">

  <div id="pageTitle" class="page-title">
    <i data-lucide="layout-dashboard"></i> Dashboard

    <span id="topUserName" style="font-size:12px;color:#68766f"></span>
    <div id="topAvatar" class="avatar">P</div>
  </div>
</header>

<div class="content">

<section id="page-dashboard" class="view active"></section>
<section id="page-alunos" class="view"></section>
<section id="page-agenda" class="view"></section>
<section id="page-avaliacoes" class="view"></section>
<section id="page-financeiro" class="view"></section>
<section id="page-recibos" class="view"></section>
<section id="page-perfil" class="view"></section>
<section id="page-prontuario" class="view"></section>

</div>
</main>
</div>

<script>
// ============================================================
// CONFIGURAÇÃO DO SUPABASE

function uid() {
    return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, function(c) {
        var r = Math.random() * 16 | 0;
        var v = c === 'x' ? r : (r & 0x3 | 0x8);
        return v.toString(16);
    });
}

function ensureValidUUID(id) {
    if (!id) return uid();
    const uuidRegex = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i;
    if (uuidRegex.test(id)) return id;
    return uid();
}

function esc(v) {
    return String(v ?? "").replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
}

function money(v) {
    return Number(v || 0).toLocaleString("pt-BR", { style: "currency", currency: "BRL" });
}

function dateISO(d) {
    const x = new Date(d);
    return x.getFullYear() + "-" + String(x.getMonth() + 1).padStart(2, "0") + "-" + String(x.getDate()).padStart(2, "0");
}

function parseDate(s) {
    if (!s) return new Date(NaN);
    if (s instanceof Date) return new Date(s);
    const [y, m, d] = String(s).split("-").map(Number);
    return new Date(y, m - 1, d);
}

function today() {
    return dateISO(new Date());
}

function fmtDate(s) {
    if (!s) return "";
    const d = parseDate(s);
    if (isNaN(d)) return String(s);
    return d.toLocaleDateString("pt-BR", { day: "2-digit", month: "2-digit", year: "numeric" });
}

function monthName(d) {
    return d.toLocaleDateString("pt-BR", { month: "long", year: "numeric" });
}

function initials(name) {
    return (name || "?").split(" ").slice(0, 2).map(x => x[0]).join("").toUpperCase();
}

function avatarHTML(person, cls = "student-avatar") {
    if (!person) return `<div class="${cls}">?</div>`;
    if (person.foto) {
        return `<div class="${cls}" style="background-image:url('${esc(person.foto)}')"></div>`;
    }
    return `<div class="${cls}">${esc(initials(person.nome))}</div>`;
}

function notify(message) {
    const t = document.getElementById("toast");
    if (!t) return;
    t.textContent = message;
    t.classList.add("show");
    clearTimeout(window.toastTimer);
    window.toastTimer = setTimeout(() => t.classList.remove("show"), 2600);
}

function monthAppointments(date) {
    const y = date.getFullYear();
    const m = date.getMonth();
    return activeAppointments().filter(a => {
        const d = parseDate(a.data);
        return d.getFullYear() === y && d.getMonth() === m;
    });
}

// CORRIGIDO: usa o mês/ano atual (não calendarDate) para refletir o mês corrente real
function monthPaid() {
    const y = new Date().getFullYear();
    const m = new Date().getMonth();
    return (data.transacoes || []).filter(t => {
        const d = parseDate(t.data);
        return d.getFullYear() === y && d.getMonth() === m;
    }).reduce((s, t) => s + Number(t.valor), 0);
}

function monthDone() {
    const y = new Date().getFullYear();
    const m = new Date().getMonth();
    return activeAppointments().filter(a => {
        const d = parseDate(a.data);
        return d.getFullYear() === y && d.getMonth() === m && a.presente;
    }).length;
}

function monthScheduled() {
    const y = new Date().getFullYear();
    const m = new Date().getMonth();
    return activeAppointments().filter(a => {
        const d = parseDate(a.data);
        return d.getFullYear() === y && d.getMonth() === m;
    }).length;
}

function attendanceRate() {
    const arr = activeAppointments().filter(a => a.presente || a.status === "falta");
    if (!arr.length) return 0;
    return Math.round(arr.filter(a => a.presente).length / arr.length * 100);
}

function weekStart(d) {
    const x = new Date(d);
    const day = x.getDay();
    const diff = day === 0 ? -6 : 1 - day;
    x.setDate(x.getDate() + diff);
    x.setHours(0, 0, 0, 0);
    return x;
}

function weekDates(d) {
    const s = weekStart(d);
    return WEEK.map((_, i) => {
        const x = new Date(s);
        x.setDate(s.getDate() + i);
        return x;
    });
}

function weekPending() {
    const dates = weekDates(new Date());
    const keys = dates.map(dateISO);
    return activeAppointments().filter(a => keys.includes(a.data) && !a.pago)
        .reduce((sum, a) => sum + (getStudent(a.alunoId)?.valor || 0), 0);
}

function studentPager(items, page, size = 5, onclick = "") {
    const total = Math.max(1, Math.ceil(items.length / size));
    page = Math.min(Math.max(1, page), total);
    const slice = items.slice((page - 1) * size, page * size);
    return {
        slice,
        total,
        page,
        controls: total > 1 ? `
            <div style="display:flex;justify-content:center;align-items:center;gap:8px;margin-top:16px;padding-top:12px;border-top:1px solid var(--line)">
                <button class="btn btn-outline btn-sm" ${page <= 1 ? "disabled" : ""} onclick="${onclick}(${page - 1})"><i data-lucide="chevron-left"></i>Anterior</button>
                <span style="font-size:11px;color:#718078">Página ${page} de ${total}</span>
                <button class="btn btn-outline btn-sm" ${page >= total ? "disabled" : ""} onclick="${onclick}(${page + 1})">Próxima<i data-lucide="chevron-right"></i></button>
            </div>` : ""
    };
}

// Helper para tratar erros de coluna inexistente (tabelas novas/parciais)
function isMissingColumnError(err) {
    if (!err) return false;
    return err.code === '42703' || err.code === 'PGRST116' || /column/i.test(err.message || '');
}

async function loadDataFromSupabase() {
    try {
        const userId = await getUserId();
        if (!userId) {
            console.warn('Usuário não autenticado');
            return null;
        }

        const { data: professorData, error: profError } = await supabaseClient
            .from('professores')
            .select('*')
            .eq('user_id', userId)
            .maybeSingle();
        if (profError && !isMissingColumnError(profError)) throw profError;

        const { data: alunosData, error: alunosError } = await supabaseClient
            .from('alunos')
            .select('*')
            .eq('user_id', userId)
            .order('nome');
        if (alunosError) throw alunosError;

        const { data: evolucoesData, error: evoError } = await supabaseClient
            .from('evolucoes')
            .select('*')
            .eq('user_id', userId);
        if (evoError && !isMissingColumnError(evoError)) throw evoError;

        const { data: consultasData, error: consError } = await supabaseClient
            .from('consultas')
            .select('*')
            .eq('user_id', userId);
        if (consError && !isMissingColumnError(consError)) throw consError;

        const { data: avaliacoesData, error: avError } = await supabaseClient
            .from('avaliacoes')
            .select('*')
            .eq('user_id', userId);
        if (avError && !isMissingColumnError(avError)) throw avError;

        const { data: resultadosData, error: resError } = await supabaseClient
            .from('resultados_avaliacoes')
            .select('*')
            .eq('user_id', userId);
        if (resError && !isMissingColumnError(resError)) throw resError;

        const { data: escolaData, error: escError } = await supabaseClient
            .from('escola')
            .select('*')
            .eq('user_id', userId);
        if (escError && !isMissingColumnError(escError)) throw escError;

        const { data: registrosEscolaData, error: regError } = await supabaseClient
            .from('registros_escola')
            .select('*')
            .eq('user_id', userId);
        if (regError && !isMissingColumnError(regError)) throw regError;

        const { data: agendaData, error: agendaError } = await supabaseClient
            .from('agenda')
            .select('*')
            .eq('user_id', userId)
            .order('data');
        if (agendaError) throw agendaError;

        const { data: transacoesData, error: transError } = await supabaseClient
            .from('transacoes')
            .select('*')
            .eq('user_id', userId);
        if (transError) throw transError;

        const { data: alertasData, error: alertError } = await supabaseClient
            .from('alertas_clinicos')
            .select('*')
            .eq('user_id', userId);
        if (alertError) throw alertError;

        const { data: obsProfData, error: obsError } = await supabaseClient
            .from('observacoes_professor')
            .select('*')
            .eq('user_id', userId)
            .order('data', { ascending: false });
        if (obsError && !isMissingColumnError(obsError)) throw obsError;

        const { data: evoProfData, error: evoProfError } = await supabaseClient
            .from('evolucoes_professor')
            .select('*')
            .eq('user_id', userId)
            .order('data', { ascending: false });
        if (evoProfError && !isMissingColumnError(evoProfError)) throw evoProfError;

        // Normaliza todos os dados do banco para o formato da memória
        const alunosNormalizados = (alunosData || []).map(mapAlunoFromDB);
        const evolucoesNorm = (evolucoesData || []).map(mapEvolucaoFromDB);
        const consultasNorm = (consultasData || []).map(mapConsultaFromDB);
        const avaliacoesNorm = (avaliacoesData || []).map(mapAvaliacaoFromDB);
        const resultadosNorm = (resultadosData || []).map(mapResultadoFromDB);
        const escolasNorm = (escolaData || []).map(mapEscolaFromDB);
        const registrosEscolaNorm = (registrosEscolaData || []).map(mapRegistroEscolaFromDB);

        // Reconstrói as relações aluno -> sub-estruturas
        alunosNormalizados.forEach(aluno => {
            aluno.evolucoes = evolucoesNorm.filter(e => e.aluno_id === aluno.id);
            aluno.consultas = consultasNorm.filter(c => c.aluno_id === aluno.id);
            aluno.avaliacoes = avaliacoesNorm.filter(a => a.aluno_id === aluno.id);
            aluno.avaliacoes.forEach(av => {
                av.resultados = resultadosNorm.filter(r => r.avaliacao_id === av.id);
            });
            const esc = escolasNorm.find(e => e.aluno_id === aluno.id);
            if (esc) {
                aluno.escola = {
                    id: esc.id,
                    aluno_id: esc.aluno_id,
                    nome: esc.nome || '',
                    professores: esc.professores || '',
                    registros: registrosEscolaNorm.filter(r => r.escola_id === esc.id)
                };
            } else {
                aluno.escola = { nome: '', professores: '', registros: [] };
            }
            ensureStudentModules(aluno);
        });

        const professorNormalizado = professorData
            ? mapProfessorFromDB(professorData)
            : {
                nome: "Professor ASAS",
                especialidade: "Psicopedagogia Clínica",
                bio: "Profissional dedicado ao desenvolvimento acadêmico, emocional e cognitivo.",
                foto: "",
                observacoes: [],
                evolucoesPessoais: [],
                configuracoes: { notificacoes: true, tema: "claro", lembretes: true }
            };

        if (obsProfData) professorNormalizado.observacoes = obsProfData.map(mapObsProfFromDB);
        if (evoProfData) professorNormalizado.evolucoesPessoais = evoProfData.map(mapEvoProfFromDB);

        const result = {
            session: true,
            professor: professorNormalizado,
            alunos: alunosNormalizados,
            agenda: (agendaData || []).map(mapAgendaFromDB),
            transacoes: (transacoesData || []).map(mapTransacaoFromDB),
            clinicalAlerts: (alertasData || []).map(mapAlertaFromDB)
        };

        isDataLoaded = true;
        return result;
    } catch (error) {
        console.error('Erro ao carregar dados:', error);
        notify('Erro ao carregar dados do servidor.');
        return null;
    }
}

// ============================================================

// Helper: remove chaves que causaram erro de coluna inexistente e tenta de novo
async function upsertSafe(tableName, payload, selectSingle = true) {
    let attempt = { ...payload };
    for (let i = 0; i < 4; i++) {
        // CORRIGIDO: encadear .select()/.single() ANTES do await.
        // Antes o código fazia `await ...upsert(attempt)` primeiro, o que
        // resolvia para um objeto {data,error} (sem metodo .select),
        // causando "TypeError: res.select is not a function".
        let query = supabaseClient.from(tableName).upsert(attempt);
        if (selectSingle) query = query.select().single();
        else query = query.select();
        const { data, error } = await query;
        if (!error) return data;
        // erro de coluna inexistente: remove a coluna e tenta de novo
        if (error && (error.code === '42703' || /could not find the column/i.test(error.message || ''))) {
            const m = (error.message || '').match(/column "([^"]+)"/i) || (error.message || '').match(/([^"]+).*does not exist/i);
            const col = m ? m[1] : null;
            if (col && col in attempt) {
                delete attempt[col];
                continue;
            }
        }
        // outros erros: propaga
        throw error;
    }
    return null;
}

async function saveAluno(aluno) {
    try {
        const userId = await getUserId();
        const id = ensureValidUUID(aluno.id);
        const data = await upsertSafe('alunos', {
            id: id,
            user_id: userId,
            nome: aluno.nome,
            idade: aluno.idade || 0,
            serie: aluno.serie || '',
            responsavel: aluno.responsavel || '',
            telefone: aluno.telefone || '',
            valor: aluno.valor || 0,
            foto: aluno.foto || '',
            tags: aluno.tags || [],
            observacoes: aluno.observacoes || '',
            ativo: aluno.ativo !== false,
            updated_at: new Date().toISOString()
        });
        return data;
    } catch (error) {
        console.error('Erro ao salvar aluno:', error);
        return null;
    }
}

async function loadData() {
    const loaded = await loadDataFromSupabase();
    if (loaded) {
        if (!loaded.professor.observacoes) loaded.professor.observacoes = [];
        if (!loaded.professor.evolucoesPessoais) loaded.professor.evolucoesPessoais = [];
        if (!loaded.professor.configuracoes) {
            loaded.professor.configuracoes = { notificacoes: true, tema: "claro", lembretes: true };
        }
        loaded.alunos.forEach(s => ensureStudentModules(s));
        isDataLoaded = true;
        return loaded;
    }
    isDataLoaded = false;
    return defaultData();
}

async function saveData() {
    if (isSaving) return false;

    const isLoggedIn = await checkSession();
    if (!isLoggedIn) {
        console.warn('Usuário não está logado, dados não salvos.');
        return false;
    }

    isSaving = true;

    try {
        if (data.professor) await saveProfessor(data.professor);

        for (const aluno of (data.alunos || [])) {
            await saveAluno(aluno);
            for (const evo of (aluno.evolucoes || [])) {
                await saveEvolucao({ ...evo, aluno_id: aluno.id });
            }
            for (const consulta of (aluno.consultas || [])) {
                await saveConsulta({ ...consulta, aluno_id: aluno.id });
            }
            for (const av of (aluno.avaliacoes || [])) {
                const savedAv = await saveAvaliacao({ ...av, aluno_id: aluno.id });
                if (savedAv && av.resultados) {
                    for (const res of av.resultados) {
                        await saveResultadoAvaliacao({ ...res, avaliacao_id: savedAv.id });
                    }
                }
            }
            if (aluno.escola) {
                const savedEscola = await saveEscola({
                    id: aluno.escola.id || uid(),
                    aluno_id: aluno.id,
                    nome: aluno.escola.nome || '',
                    professores: aluno.escola.professores || ''
                });
                if (savedEscola) {
                    // mantém o id retornado pelo banco no objeto em memória
                    aluno.escola.id = savedEscola.id;
                }
                if (aluno.escola.registros) {
                    for (const reg of aluno.escola.registros) {
                        await saveRegistroEscola({ ...reg, escola_id: aluno.escola.id });
                    }
                }
            }
        }

        // CORRIGIDO: filtra itens órfãos (sem alunoId ou aluno inexistente)
        // antes de salvar, para nao gerar avisos/erros repetidos no console.
        const validAgenda = (data.agenda || []).filter(item => item && item.alunoId && getStudent(item.alunoId));
        for (const item of validAgenda) {
            await saveAgendaItem(item);
        }
        // remove da memória os itens órfãos para nao persistirem indefinidamente
        if (data.agenda) data.agenda = validAgenda;

        const validTrans = (data.transacoes || []).filter(t => {
            if (!t) return false;
            if (t.tipo === 'despesa') return true; // despesas não precisam de alunoId
            return t.alunoId && getStudent(t.alunoId);
        });
        for (const trans of validTrans) {
            await saveTransacao(trans);
        }
        if (data.transacoes) data.transacoes = validTrans;

        for (const alerta of (data.clinicalAlerts || [])) {
            await saveAlertaClinico(alerta);
        }

        for (const obs of (data.professor?.observacoes || [])) {
            await saveObservacaoProfessor(obs);
        }

        for (const evo of (data.professor?.evolucoesPessoais || [])) {
            await saveEvolucaoProfessor(evo);
        }

        return true;
    } catch (error) {
        console.error('Erro ao salvar dados:', error);
        notify('Erro ao salvar dados no servidor.');
        return false;
    } finally {
        isSaving = false;
    }
}

function navigate(page) {
    currentPage = page;
    currentStudent = null;

    document.querySelectorAll(".view").forEach(x => x.classList.remove("active"));
    const target = document.getElementById("page-" + page);
    if (target) target.classList.add("active");

    document.querySelectorAll(".nav button").forEach(x => {
        x.classList.toggle("active", x.dataset.page === page);
    });

    const info = {
        dashboard: ["layout-dashboard", "Dashboard"],
        alunos: ["users", "Alunos"],
        agenda: ["calendar-days", "Agenda"],
        avaliacoes: ["clipboard-check", "Avaliações"],
        financeiro: ["wallet-cards", "Financeiro"],
        recibos: ["file-text", "Recibos e Declarações"],
        perfil: ["user-round", "Meu Perfil"]
    };

    if (info[page]) {
        document.getElementById("pageTitle").innerHTML = `<i data-lucide="${info[page][0]}"></i>${info[page][1]}`;
    }

    renderPage();
    lucide.createIcons();
}

function renderPage() {
    if (!isDataLoaded || !data.session) {
        document.querySelectorAll(".view").forEach(view => {
            if (view.id !== "page-dashboard") {
                view.innerHTML = `<div class="empty">Faça login para visualizar.</div>`;
            }
        });
        return;
    }

    if (currentPage === "dashboard") renderDashboard();
    if (currentPage === "alunos") renderAlunos();
    if (currentPage === "agenda") renderAgenda();
    if (currentPage === "avaliacoes") renderAvaliacoes();
    if (currentPage === "financeiro") renderFinanceiro();
    if (currentPage === "recibos") renderRecibos();
    if (currentPage === "perfil") renderPerfil();
}

async function login() {
    const user = document.getElementById("loginUser").value.trim();
    const pass = document.getElementById("loginPass").value;

    if (!user || !pass) {
        notify("Preencha usuário e senha.");
        return;
    }

    const result = await loginSupabase(user, pass);

    if (result) {
        try {
            const loadedData = await loadData();
            if (loadedData) {
                data = loadedData;
                data.session = true;
                isDataLoaded = true;
            } else {
                data = defaultData();
                data.session = true;
                isDataLoaded = false;
            }

            document.getElementById("loginScreen").style.display = "none";
            document.getElementById("app").style.display = "flex";

            updateUser();
            navigate("dashboard");
            notify(`Bem-vindo, ${data.professor?.nome || "Professor"}!`);
        } catch (error) {
            console.error('Erro no login:', error);
            notify('Erro ao carregar dados. Tente novamente.');
        }
    }
}

async function logout() {
    if (data && data.session) {
        try {
            const saved = await saveData();
            if (saved) {
                console.log('✅ Dados salvos com sucesso antes do logout');
            } else {
                console.warn('⚠️ Falha ao salvar dados, mas continuando logout');
            }
        } catch (error) {
            console.error('Erro ao salvar dados:', error);
        }
    }

    try {
        await supabaseClient.auth.signOut();
    } catch (error) {
        console.warn('Erro no logout do Supabase:', error);
    }

    data = defaultData();
    data.session = false;
    isDataLoaded = false;
    currentUserId = null;
    currentStudent = null;
    currentPage = "dashboard";

    document.getElementById("app").style.display = "none";
    document.getElementById("loginScreen").style.display = "grid";
    document.getElementById("loginPass").value = "";

    document.querySelectorAll(".view").forEach(view => {
        view.innerHTML = '';
        view.classList.remove('active');
    });

    const dashboardView = document.getElementById("page-dashboard");
    if (dashboardView) {
        dashboardView.classList.add('active');
        dashboardView.innerHTML = `
            <div class="empty" style="padding:60px;text-align:center">
                <p style="font-size:18px;color:#8a9892">👋 Logout realizado com sucesso!</p>
                <p style="font-size:13px;color:#a0aaa6;margin-top:8px">Faça login para visualizar seus dados.</p>
            </div>
        `;
    }

    document.getElementById("topUserName").textContent = "";
    const avatarEl = document.getElementById("topAvatar");
    avatarEl.style.backgroundImage = "";
    avatarEl.textContent = "?";

    notify("Logout realizado com sucesso!");
}

function filterStudents() {
    const term = (document.getElementById("studentSearch")?.value || "").toLowerCase();
    const list = (data.alunos || []).filter(a =>
        `${a.nome} ${a.responsavel} ${(a.tags || []).join(" ")}`.toLowerCase().includes(term)
    );
    const grid = document.getElementById("studentGrid");
    if (!grid) return;
    if (!list.length) {
        grid.innerHTML = `<div class="card empty" style="grid-column:1/-1">Nenhum aluno encontrado.</div>`;
        return;
    }
    grid.innerHTML = list.map(a => `
        <div class="student" onclick="openStudent('${a.id}')">
            <div class="student-top">
                ${avatarHTML(a)}
                <div style="min-width:0">
                    <div class="student-name">${esc(a.nome)}</div>
                    <div class="student-meta">${a.idade ? esc(a.idade) + " anos · " : ""}${esc(a.serie || "Sem série")}</div>
                </div>
            </div>
            <div class="student-meta" style="margin-top:11px">Responsável: ${esc(a.responsavel || "Não informado")}</div>
            <div class="tags">${(a.tags || []).slice(0, 5).map(t => `<span class="tag">${esc(t)}</span>`).join("")}</div>
            <div style="display:flex;justify-content:space-between;margin-top:15px;padding-top:11px;border-top:1px solid #f0f3f2">
                <span style="font-size:10px;color:#8a9892">Sessão</span>
                <strong style="font-size:12px">${money(a.valor)}</strong>
            </div>
        </div>
    `).join("");
}

function toggleStudentForm(forceShow) {
    const f = document.getElementById("newStudentForm");
    if (!f) return;
    if (typeof forceShow === "boolean") {
        f.style.display = forceShow ? "block" : "none";
    } else {
        f.style.display = f.style.display === "none" ? "block" : "none";
    }
    if (f.style.display === "block") f.scrollIntoView({ behavior: "smooth", block: "start" });
}

async function saveStudent() {
    const nome = document.getElementById("fNome").value.trim();
    if (!nome) { notify("Informe o nome do aluno."); return; }

    const student = {
        id: uid(),
        nome: nome,
        idade: Number(document.getElementById("fIdade").value) || 0,
        serie: document.getElementById("fSerie").value.trim(),
        responsavel: document.getElementById("fResponsavel").value.trim(),
        telefone: document.getElementById("fTelefone").value.trim(),
        valor: Number(document.getElementById("fValor").value) || 0,
        foto: document.getElementById("fFoto").value.trim(),
        tags: document.getElementById("fTags").value.split(",").map(x => x.trim()).filter(Boolean),
        observacoes: document.getElementById("fObs").value.trim(),
        ativo: true
    };

    data.alunos.push(student);
    ensureStudentModules(student);
    await saveData();
    notify("Aluno cadastrado com sucesso.");
    toggleStudentForm(false);
    renderAlunos();
}

function openStudent(id) {
    currentStudent = id;
    document.querySelectorAll(".view").forEach(x => x.classList.remove("active"));
    document.getElementById("page-prontuario").classList.add("active");
    document.querySelectorAll(".nav button").forEach(x => x.classList.remove("active"));
    document.getElementById("pageTitle").innerHTML = `<i data-lucide="notebook-tabs"></i>Prontuário`;
    studentSectionPage = { overview: 1, avaliacoes: 1, escola: 1 };
    renderStudentProfile();
    lucide.createIcons();
}

function setStudentSectionPage(section, page) {
    // descobre o modo atual a partir da seção
    let mode = "overview";
    if (section === "avaliacoes") mode = "avaliacoes";
    else if (section === "escola") mode = "escola";
    studentSectionPage[section] = page;
    renderStudentProfile(mode);
}

async function createAssessment() {

    if (!s) return;

    const titulo = document.getElementById("avTitulo")?.value.trim();
    const objetivo = document.getElementById("avObjetivo")?.value.trim();

    const questoes = raw.split(/\n+/).map(x => x.trim()).filter(Boolean).map((texto, i) => ({ id: uid(), numero: i + 1, texto }));

function applyAssessment(id) {

    currentAssessment = id;

async function saveAssessmentApplication() {
    const s = getStudent(currentStudent);
    if (!s) return;
    ensureStudentModules(s);
    const a = s.avaliacoes.find(x => x.id === currentAssessment);
    if (!a) return;

    const respostas = a.questoes.map((q, i) => document.getElementById("resp_" + i)?.value.trim() || "");

        data: today(),

    a.finalizada = true;

    await saveData();
    notify("Aplicação registrada no histórico do aluno.");

    renderStudentProfile("avaliacoes");
}

function toggleAgendaForm() {
    const f = document.getElementById("agendaForm");
    if (!f) return;
    f.style.display = f.style.display === "none" ? "block" : "none";
    if (f.style.display === "block") f.scrollIntoView({ behavior: "smooth", block: "center" });
}

function renderWeek() {
    const dates = weekDates(calendarDate);
    let html = `<div style="overflow:auto"><div class="week-grid"><div class="week-head"></div>`;

    dates.forEach(d => {
        html += `<div class="week-head">${d.toLocaleDateString("pt-BR", { weekday: "short" })}<br><span style="font-size:14px;color:#34413c">${d.getDate()}</span></div>`;
    });

    HOURS.forEach(hour => {
        html += `<div class="time-cell">${hour}</div>`;
        dates.forEach(d => {
            const iso = dateISO(d);
            const appointments = activeAppointments().filter(a => a.data === iso && a.hora === hour);

            if (!appointments.length) {
                html += `<div class="slot" onclick="quickSchedule('${iso}','${hour}')"><div class="empty-slot">+</div></div>`;
            } else {
                html += `<div class="slot">`;
                appointments.forEach(a => {
                    const s = getStudent(a.alunoId);
                    if (!s) {
                        html += `<div class="event" style="background:#f0f0f0;color:#999"><strong>Aluno removido</strong> - ${a.hora}</div>`;
                        return;
                    }
                    const t = TYPES[a.tipo];
                    html += `
                        <div class="event ${t?.cls || ''}" onclick="openStudent('${s.id}')">
                            <strong>${esc(s.nome)}</strong>
                            ${t?.label || a.tipo}
                            <div class="event-actions">
                                <button onclick="event.stopPropagation();togglePresence('${a.id}')">${a.presente ? "Presente" : "Presença"}</button>
                                <button onclick="event.stopPropagation();togglePayment('${a.id}')">${a.pago ? "Pago" : "Pagar"}</button>
                                <button onclick="event.stopPropagation();cancelAppointment('${a.id}')">Cancelar</button>
                            </div>
                        </div>`;
                });
                html += `</div>`;
            }
        });
    });

    html += `</div></div>`;
    return html;
}

function quickSchedule(date, hour) {
    const f = document.getElementById("agendaForm");
    if (!f) return;
    f.style.display = "block";
    document.getElementById("agData").value = date;
    document.getElementById("agHora").value = hour;
    f.scrollIntoView({ behavior: "smooth", block: "center" });
}

function renderMonth() {
    const y = calendarDate.getFullYear();
    const m = calendarDate.getMonth();
    const first = new Date(y, m, 1);
    const last = new Date(y, m + 1, 0);
    let start = first.getDay();
    start = start === 0 ? 6 : start - 1;
    const total = Math.ceil((start + last.getDate()) / 7) * 7;

    let html = `<div style="overflow:auto"><div class="month-grid">`;
    ["Seg", "Ter", "Qua", "Qui", "Sex", "Sáb", "Dom"].forEach(d => {
        html += `<div class="week-head">${d}</div>`;
    });

    for (let i = 0; i < total; i++) {
        const day = i - start + 1;
        let d = new Date(y, m, day);
        const inMonth = d.getMonth() === m;
        const iso = dateISO(d);
        const events = activeAppointments().filter(a => a.data === iso);

        html += `
            <div class="month-day ${inMonth ? "" : "other"}" onclick="${inMonth ? `selectMonthDay('${iso}')` : ""}">
                <div class="day-number">${d.getDate()}</div>
                <div class="dot-row">${events.slice(0, 7).map(a => `<span class="dot ${TYPES[a.tipo]?.cls || ''}"></span>`).join("")}</div>
                <div class="day-events">
                    ${events.slice(0, 3).map(a => { const s = getStudent(a.alunoId); return `<div class="day-event">${a.hora} · ${esc(s?.nome || "Aluno")}</div>`; }).join("")}
                    ${events.length > 3 ? `<div style="font-size:9px;color:#8a9892">+${events.length - 3} atendimentos</div>` : ""}
                </div>
            </div>`;
    }

    html += `</div></div>`;
    return html;
}

function selectMonthDay(day) {
    selectedDay = day;
    renderAgenda();
}

function renderDayPanel(day) {
    const events = activeAppointments().filter(a => a.data === day).sort((a, b) => a.hora.localeCompare(b.hora));

    return `
        <div class="card" style="margin-top:16px">
            <div class="section-head">
                <div><div class="section-title">Sessões de ${fmtDate(day)}</div><div class="section-sub">${events.length} atendimento(s)</div></div>
                <button class="btn btn-primary btn-sm" onclick="quickSchedule('${day}','09:00')"><i data-lucide="plus"></i>Adicionar</button>
            </div>
            ${events.length ? events.map(a => {
                const s = getStudent(a.alunoId);
                if (!s) return `<div style="padding:10px 0;border-bottom:1px solid #f0f3f2;color:#999">Aluno removido - ${a.hora}</div>`;
                const t = TYPES[a.tipo];
                return `
                    <div style="display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid #f0f3f2">
                        <strong style="width:45px;font-size:12px">${a.hora}</strong>
                        ${avatarHTML(s, "student-avatar")}
                        <div style="flex:1"><div style="font-size:12px;font-weight:700;cursor:pointer" onclick="openStudent('${s.id}')">${esc(s.nome)}</div><div style="font-size:10px;color:#8a9892">${t?.label || a.tipo}</div></div>
                        <button class="btn btn-sm ${a.presente ? "btn-soft" : "btn-outline"}" onclick="togglePresence('${a.id}')">${a.presente ? "Presente" : "Presença"}</button>
                        <button class="btn btn-sm ${a.pago ? "btn-soft" : "btn-outline"}" onclick="togglePayment('${a.id}')">${a.pago ? "Pago" : "Pagamento"}</button>
                        <button class="btn btn-danger btn-sm" onclick="cancelAppointment('${a.id}')">Cancelar</button>
                    </div>`;
            }).join("") : `<div class="empty">Nenhuma sessão neste dia.</div>`}
        </div>`;
}

async function saveAppointment() {
    const alunoId = document.getElementById("agAluno").value;
    const dataValue = document.getElementById("agData").value;
    const hora = document.getElementById("agHora").value;
    const tipo = document.getElementById("agTipo").value;

    if (!alunoId || !dataValue || !hora) {
        notify("Preencha aluno, data e horário.");
        return;
    }

    const aluno = getStudent(alunoId);
    if (!aluno) {
        notify("Aluno não encontrado. Recarregue a página.");
        return;
    }

    const occupied = activeAppointments().some(a => a.data === dataValue && a.hora === hora);
    if (occupied) {
        notify("Este horário já possui atendimento.");
        return;
    }

    const newAppointment = {
        id: uid(),
        alunoId: alunoId,
        data: dataValue,
        hora: hora,
        tipo: tipo,
        status: "agendado",
        presente: false,
        pago: false
    };

    data.agenda.push(newAppointment);

    const saved = await saveData();
    if (saved) {
        notify("Atendimento agendado com sucesso!");
        renderAgenda();
    } else {
        data.agenda = data.agenda.filter(a => a.id !== newAppointment.id);
        notify("Erro ao salvar agendamento. Tente novamente.");
    }
}

async function cancelAppointment(id) {
    const a = data.agenda.find(x => x.id === id);
    if (!a) return;
    if (!confirm("Cancelar este atendimento?")) return;
    a.status = "cancelado";
    await saveData();
    notify("Atendimento cancelado.");
    renderPage();
}

async function togglePresence(id) {
    const a = data.agenda.find(x => x.id === id);
    if (!a) return;
    a.presente = !a.presente;
    if (a.presente) a.status = "realizado";
    else a.status = "agendado";
    await saveData();
    notify(a.presente ? "Presença registrada." : "Presença removida.");
    renderPage();
}

async function togglePayment(id) {
    const a = data.agenda.find(x => x.id === id);
    if (!a) return;
    const s = getStudent(a.alunoId);
    if (!s) return;

    if (!a.pago) {
        a.pago = true;
        const transacao = {
            id: uid(),
            data: a.data,
            agendaId: a.id,
            alunoId: s.id,
            descricao: `Sessão de ${s.nome}`,
            valor: Number(s.valor) || 0,
            tipo: "receita",
            categoria: "Sessão"
        };
        data.transacoes.push(transacao);
        await saveData();
        notify(`Pagamento de ${money(s.valor)} registrado.`);
    } else {
        a.pago = false;
        const transacoesRemovidas = data.transacoes.filter(t => t.agendaId === a.id);
        data.transacoes = data.transacoes.filter(t => t.agendaId !== a.id);
        // remove do banco também
        for (const t of transacoesRemovidas) {
            await deleteTransacaoDB(t.id);
        }
        await saveData();
        notify("Pagamento revertido.");
    }
    renderPage();
}

function calendarPrev() {
    if (calendarMode === "week") calendarDate.setDate(calendarDate.getDate() - 7);
    else calendarDate.setMonth(calendarDate.getMonth() - 1);
    selectedDay = null;
    renderAgenda();
}

function calendarNext() {
    if (calendarMode === "week") calendarDate.setDate(calendarDate.getDate() + 7);
    else calendarDate.setMonth(calendarDate.getMonth() + 1);
    selectedDay = null;
    renderAgenda();
}

function calendarToday() {
    calendarDate = new Date();
    selectedDay = null;
    renderAgenda();
}

function setCalendarMode(mode) {
    calendarMode = mode;
    selectedDay = null;
    renderAgenda();
}

// --- Variáveis de estado da página de avaliações ---

// --- Funções auxiliares ---
function getAvaliacoesGlobais() {
    // coleta todas as avaliações de todos os alunos
    const todas = [];
    (data.alunos || []).forEach(aluno => {
        (aluno.avaliacoes || []).forEach(av => {
            todas.push({ ...av, alunoId: aluno.id, alunoNome: aluno.nome });
        });
    });
    return todas;
}

function getAvalTypeBadge(tipo) {
    const map = { anamnese: "anamnese", screening: "screening", survey: "survey", custom: "survey" };
    return map[tipo] || "survey";
}

function getTemplateById(id) {
    return ASSESSMENT_TEMPLATES.find(t => t.id === id);
}

// --- Render principal ---
function renderAvaliacoes() {
    if (!isDataLoaded || !data || !data.session) {
        document.getElementById("page-avaliacoes").innerHTML = `<div class="empty" style="padding:40px;text-align:center"><p>Faça login para visualizar.</p></div>`;
        return;
    }

    if (currentAvalMode === "new") return renderAvaliacoesNew();
    if (currentAvalMode === "apply") return renderAvaliacoesApply();
    if (currentAvalMode === "history") return renderAvaliacoesHistory();
    return renderAvaliacoesList();
}

// --- Salvar nova avaliação personalizada ---
async function saveNewAvaliacao() {
    const titulo = document.getElementById("newAvalTitulo")?.value.trim();
    const objetivo = document.getElementById("newAvalObjetivo")?.value.trim();
    const alunoId = document.getElementById("newAvalAluno")?.value;
    const raw = document.getElementById("newAvalQuestoes")?.value || "";
    const questoes = raw.split(/\n+/).map(x => x.trim()).filter(Boolean).map((texto, i) => ({ id: uid(), numero: i + 1, texto }));

    if (!titulo) { notify("Informe o título da avaliação."); return; }
    if (!questoes.length) { notify("Escreva pelo menos uma questão."); return; }

    if (alunoId) {
        const s = getStudent(alunoId);
        if (s) {
            ensureStudentModules(s);
            s.avaliacoes.push({ id: uid(), data: today(), titulo, objetivo, tipo: "custom", questoes, resultados: [], finalizada: false });
            await saveData();
            notify(`Avaliação criada e vinculada a ${s.nome}.`);
        }
    } else {
        // sem aluno: cria como avaliação "global" vinculada a um aluno placeholder?
        // Melhor: exigir aluno ou permitir aplicar depois via template custom salvo.
        notify("Selecione um aluno para vincular a avaliação.");
        return;
    }
    cancelAvaliacao();
}

    currentAvalTemplate = getTemplateById(tplId);
    currentAvalMode = "apply";
    renderAvaliacoes();
}

function renderAvaliacoesApply() {
    const tpl = currentAvalTemplate;
    if (!tpl) { cancelAvaliacao(); return; }

    let formHtml = "";

    // Seleção de aluno (sempre necessária)
    formHtml += `
        <div class="card" style="margin-bottom:16px">
            <div class="section-head"><div><div class="section-title">Aplicar: ${esc(tpl.nome)}</div><div class="section-sub">${esc(tpl.descricao)}</div></div>
                <span class="aval-type-badge ${getAvalTypeBadge(tpl.tipo)}">${tpl.tipo}</span>
            </div>
            <div class="field"><label class="label">Aluno avaliado</label>
                <select id="applyAvalAluno" class="select"><option value="">— Selecionar aluno —</option>${(data.alunos || []).map(a => `<option value="${a.id}">${esc(a.nome)}</option>`).join("")}</select>
            </div>
        </div>
    `;

    // Anamnese: campos estruturados por seção
    if (tpl.tipo === "anamnese" && tpl.campos) {
        tpl.campos.forEach(secao => {
            formHtml += `<div class="card" style="margin-bottom:14px"><div class="section-title" style="margin-bottom:12px">${esc(secao.secao)}</div><div class="form-grid two">`;
            secao.itens.forEach(item => {
                const fieldId = "anam_" + item.chave;
                if (item.tipo === "textarea") {
                    formHtml += `<div class="field" style="grid-column:1/-1"><label class="label">${esc(item.rotulo)}</label><textarea id="${fieldId}" class="textarea"></textarea></div>`;
                } else {
                    formHtml += `<div class="field"><label class="label">${esc(item.rotulo)}</label><input id="${fieldId}" class="input" ${item.tipo === "date" ? 'type="date"' : ''}></div>`;
                }
            });
            formHtml += `</div></div>`;
        });
        formHtml += `<div class="card" style="margin-bottom:14px"><div class="field"><label class="label">Resumo / Observações da anamnese</label><textarea id="applyAvalResumo" class="textarea" placeholder="Síntese dos dados colhidos, impressões e próximos passos..."></textarea></div></div>`;
    } else if (tpl.questoes && tpl.questoes.length) {
        // Screening / survey: questões com escala
        const escala = tpl.escala || [{ valor: 0, rotulo: "Resposta" }];
        formHtml += `<div class="card" style="margin-bottom:14px"><div class="section-title" style="margin-bottom:10px">Questões</div>`;
        tpl.questoes.forEach((q, i) => {
            formHtml += `
                <div style="padding:10px 0;border-top:${i > 0 ? '1px solid var(--line)' : '0'}">
                    <div style="font-size:12px;font-weight:600;margin-bottom:7px">${i + 1}. ${esc(q)}</div>
                    <div style="display:flex;gap:6px;flex-wrap:wrap">
                        ${escala.map(op => `<label style="display:flex;align-items:center;gap:5px;font-size:11px;cursor:pointer;border:1px solid var(--line);border-radius:8px;padding:4px 10px"><input type="radio" name="q_${i}" value="${op.valor}"> ${esc(op.rotulo)}</label>`).join("")}
                    </div>
                </div>`;
        });
        formHtml += `</div>`;
        formHtml += `<div class="card" style="margin-bottom:14px"><div class="field"><label class="label">Resumo / Observações</label><textarea id="applyAvalResumo" class="textarea" placeholder="Análise dos resultados, pontuação e impressões..."></textarea></div></div>`;
    }

    document.getElementById("page-avaliacoes").innerHTML = `
        <button class="btn btn-outline btn-sm" onclick="cancelAvaliacao()" style="margin-bottom:14px"><i data-lucide="arrow-left"></i>Voltar</button>
        ${formHtml}
        <button class="btn btn-primary" onclick="saveAvaliacaoAplicacao('${tpl.id}')"><i data-lucide="check"></i>Registrar aplicação</button>
        ${renderHelpBox("avaliacoes")}
    `;
    lucide.createIcons();
}

// --- Salvar aplicação de avaliação (a partir de template) ---
async function saveAvaliacaoAplicacao(tplId) {
    const tpl = getTemplateById(tplId);
    if (!tpl) { notify("Modelo não encontrado."); return; }

    const alunoId = document.getElementById("applyAvalAluno")?.value;
    if (!alunoId) { notify("Selecione o aluno avaliado."); return; }

    const s = getStudent(alunoId);
    if (!s) { notify("Aluno não encontrado."); return; }
    ensureStudentModules(s);

    const resumo = document.getElementById("applyAvalResumo")?.value.trim() || "";
    let respostas = [];
    let questoes = [];

    if (tpl.tipo === "anamnese" && tpl.campos) {
        // coletar todos os campos estruturados
        tpl.campos.forEach(secao => {
            secao.itens.forEach(item => {
                const el = document.getElementById("anam_" + item.chave);
                respostas.push({ secao: secao.secao, rotulo: item.rotulo, chave: item.chave, valor: el?.value.trim() || "" });
            });
        });
        questoes = tpl.campos.flatMap(sec => sec.itens.map(it => it.rotulo));
    } else if (tpl.questoes) {
        tpl.questoes.forEach((q, i) => {
            const selected = document.querySelector(`input[name="q_${i}"]:checked`);
            const escala = tpl.escala || [];
            const op = selected ? escala.find(e => String(e.valor) === selected.value) : null;
            respostas.push({ questao: q, valor: selected ? Number(selected.value) : null, rotulo: op ? op.rotulo : "Sem resposta" });
        });
        questoes = tpl.questoes.map((q, i) => ({ id: uid(), numero: i + 1, texto: q }));
    }

    // Cria a avaliação vinculada ao aluno + registra o resultado
    const avId = uid();
    const novaAval = {
        id: avId,
        data: today(),
        titulo: tpl.nome,
        tipo: tpl.tipo,
        objetivo: tpl.descricao,
        questoes,
        resultados: [{
            id: uid(),
            data: today(),
            respostas,
            resumo
        }],
        finalizada: true
    };
    s.avaliacoes.push(novaAval);

    await saveData();
    notify(`Avaliação "${tpl.nome}" aplicada a ${s.nome} com sucesso.`);
    currentAvalMode = "history";
    currentAvalId = novaAval.id;
    renderAvaliacoes();
}

// --- Histórico de uma avaliação específica (ver alunos que apliquei) ---
function viewAvaliacaoHistory(titulo) {
    currentAvalMode = "history";
    currentAvalTemplate = null;
    // armazenar título em variável temporária
    window._avalHistTitulo = titulo;
    renderAvaliacoes();
}

function renderAvaliacoesHistory() {
    const titulo = window._avalHistTitulo || "";
    if (!titulo) { cancelAvaliacao(); return; }

    const todas = getAvaliacoesGlobais().filter(a => a.titulo === titulo);
    const alunosAvaliados = todas.map(av => {
        const s = getStudent(av.alunoId);
        return {
            avalId: av.id,
            alunoId: av.alunoId,
            alunoNome: av.alunoNome,
            alunoObj: s,
            data: av.data,
            tipo: av.tipo,
            resultados: av.resultados || [],
            aplicacoes: (av.resultados || []).length,
            ultimaAplicacao: (av.resultados || []).length ? av.resultados[av.resultados.length - 1].data : av.data
        };
    }).sort((a, b) => (b.ultimaAplicacao || '').localeCompare(a.ultimaAplicacao || ''));

    document.getElementById("page-avaliacoes").innerHTML = `
        <button class="btn btn-outline btn-sm" onclick="cancelAvaliacao()" style="margin-bottom:14px"><i data-lucide="arrow-left"></i>Voltar para avaliações</button>
        <div class="section-head">
            <div><div class="section-title">Histórico: ${esc(titulo)}</div><div class="section-sub">Alunos que receberam esta avaliação e suas aplicações.</div></div>
        </div>
        <div class="grid stats" style="grid-template-columns:repeat(3,minmax(0,1fr))">
            <div class="card"><div class="stat-label">Alunos avaliados</div><div class="stat-value">${alunosAvaliados.length}</div></div>
            <div class="card"><div class="stat-label">Total de aplicações</div><div class="stat-value">${alunosAvaliados.reduce((s, a) => s + a.aplicacoes, 0)}</div></div>
            <div class="card"><div class="stat-label">Última aplicação</div><div class="stat-value" style="font-size:14px">${alunosAvaliados.length ? fmtDate(alunosAvaliados[0].ultimaAplicacao) : "—"}</div></div>
        </div>
        <div class="card" style="margin-top:18px">
            <div class="section-head"><div><div class="section-title">Alunos que aplicou</div><div class="section-sub">Clique no aluno para abrir o prontuário.</div></div></div>
            ${alunosAvaliados.length === 0 ? `<div class="empty">Nenhum aluno recebeu esta avaliação ainda.</div>` :
                alunosAvaliados.map(a => `
                    <div class="aval-applied-row">
                        ${avatarHTML(a.alunoObj || { nome: a.alunoNome, foto: "" }, "student-avatar")}
                        <div style="flex:1;cursor:pointer" onclick="openStudent('${a.alunoId}')">
                            <strong style="font-size:13px">${esc(a.alunoNome)}</strong>
                            <div class="section-sub">Criada em ${fmtDate(a.data)} · ${a.aplicacoes} aplicação(ões) · Última: ${fmtDate(a.ultimaAplicacao)}</div>
                        </div>
                        <span class="aval-type-badge ${getAvalTypeBadge(a.tipo)}">${a.tipo || "custom"}</span>
                        <button class="btn btn-outline btn-sm" onclick="viewAvaliacaoResultado('${a.alunoId}','${a.avalId}')"><i data-lucide="eye"></i>Ver resultado</button>
                    </div>
                `).join("")
            }
        </div>
        ${renderHelpBox("avaliacoes")}
    `;
    lucide.createIcons();
}

// --- Ver resultado de uma aplicação específica ---
function viewAvaliacaoResultado(alunoId, avalId) {
    const s = getStudent(alunoId);
    if (!s) return;
    openStudent(alunoId);
    // navegar para a seção de avaliações do aluno
    setTimeout(() => {
        currentStudent = alunoId;
        currentAssessment = avalId;
        renderStudentProfile("aplicar");
    }, 100);
}

// --- Cancelar / voltar ao modo lista ---
function cancelAvaliacao() {
    currentAvalMode = "list";
    currentAvalTemplate = null;
    currentAvalId = null;
    window._avalHistTitulo = null;
    renderAvaliacoes();
}

function renderFinanceiro() {
    if (!isDataLoaded || !data || !data.transacoes) {
        document.getElementById("page-financeiro").innerHTML = `
            <div class="empty" style="padding:40px;text-align:center">
                <p>Carregando dados...</p>
            </div>
        `;
        return;
    }

    const now = new Date();
    if (typeof financeYear !== "number") financeYear = now.getFullYear();
    if (typeof financeMonth !== "number") financeMonth = now.getMonth();

    const allTrans = (data.transacoes || []).filter(t => {
        const d = parseDate(t.data);
        return d.getFullYear() === financeYear && d.getMonth() === financeMonth;
    }).sort((a, b) => (b.data || '').localeCompare(a.data || ''));

    const receitas = allTrans.filter(t => (t.tipo || "receita") === "receita");
    const despesas = allTrans.filter(t => t.tipo === "despesa");

    const totalRecebido = receitas.reduce((s, t) => s + Number(t.valor || 0), 0);
    const totalDespesas = despesas.reduce((s, t) => s + Number(t.valor || 0), 0);
    const saldo = totalRecebido - totalDespesas;

    const monthAppts = activeAppointments().filter(a => {
        const d = parseDate(a.data);
        return d.getFullYear() === financeYear && d.getMonth() === financeMonth;
    }).sort((a, b) => (a.data + a.hora).localeCompare(b.data + b.hora));

    const expected = monthAppts.reduce((s, a) => s + Number(getStudent(a.alunoId)?.valor || 0), 0);
    const pending = monthAppts.filter(a => !a.pago).reduce((s, a) => s + Number(getStudent(a.alunoId)?.valor || 0), 0);
    const taxaRecebimento = expected ? Math.round(totalRecebido / expected * 100) : 0;

    // Agrupar despesas por categoria
    const despesasPorCategoria = {};
    despesas.forEach(d => {
        const cat = d.categoria || "Outros";
        if (!despesasPorCategoria[cat]) despesasPorCategoria[cat] = 0;
        despesasPorCategoria[cat] += Number(d.valor || 0);
    });

    const rows = studentPager(receitas, financePage || 1, 10, "setFinancePage");
    const monthLabel = new Date(financeYear, financeMonth, 1).toLocaleDateString("pt-BR", { month: "long", year: "numeric" });

    // --- Mini calendário lateral ---
    const todayISO = today();
    const calY = financeYear, calM = financeMonth;
    const firstDay = new Date(calY, calM, 1);
    const lastDay = new Date(calY, calM + 1, 0);
    let startOffset = firstDay.getDay(); // 0=domingo
    startOffset = startOffset === 0 ? 6 : startOffset - 1; // ajustar para segunda=0
    const totalCells = Math.ceil((startOffset + lastDay.getDate()) / 7) * 7;
    const eventosDoMes = {};
    monthAppts.forEach(a => {
        if (!eventosDoMes[a.data]) eventosDoMes[a.data] = [];
        eventosDoMes[a.data].push(a);
    });

    let miniCalHtml = '<div class="mini-cal-grid">';
    ["S","T","Q","Q","S","S","D"].forEach(d => { miniCalHtml += `<div class="mini-cal-dow">${d}</div>`; });
    for (let i = 0; i < totalCells; i++) {
        const dayNum = i - startOffset + 1;
        const d = new Date(calY, calM, dayNum);
        const inMonth = d.getMonth() === calM;
        const iso = dateISO(d);
        const isToday = iso === todayISO;
        const eventos = eventosDoMes[iso] || [];
        const hasEvent = eventos.length > 0;
        const allPaid = hasEvent && eventos.every(e => e.pago);
        const cls = (inMonth ? "" : "other") + (isToday ? " today" : "") + (hasEvent ? " has-event" : "") + (hasEvent && allPaid ? " paid" : "") + (hasEvent && !allPaid ? " pending" : "");
        miniCalHtml += `<div class="mini-cal-day ${cls}" title="${hasEvent ? eventos.length + ' atendimento(s)' : ''}">${inMonth ? d.getDate() : ""}</div>`;
    }
    miniCalHtml += '</div>';

    // --- Card informativo lateral ---
    const atendimentosPagos = monthAppts.filter(a => a.pago).length;
    const atendimentosPendentes = monthAppts.filter(a => !a.pago).length;
    const maiorDespesa = despesas.length ? despesas.reduce((m, d) => Number(d.valor) > Number(m.valor) ? d : m) : null;

    document.getElementById("page-financeiro").innerHTML = `
        <div class="section-head">
            <div><div class="section-title">Financeiro</div><div class="section-sub">Controle completo de receitas e despesas. Navegue entre meses com as setas.</div></div>
            <div style="display:flex;gap:7px;flex-wrap:wrap">
                <button class="btn btn-blue btn-sm" onclick="generateFinancePDF()"><i data-lucide="file-down"></i>PDF do período</button>
                <button class="btn btn-soft btn-sm" onclick="navigate('recibos')">Recibos</button>
            </div>
        </div>

        <div class="card" style="margin-bottom:16px">
            <div style="display:flex;align-items:center;justify-content:space-between;gap:10px">

                    <div class="card"><div class="stat-label">Recebido</div><div class="stat-value">${money(totalRecebido)}</div><div class="stat-sub">Entradas do período</div></div>
                    <div class="card"><div class="stat-label">Despesas</div><div class="stat-value" style="color:#c0504d">${money(totalDespesas)}</div><div class="stat-sub">Saídas do período</div></div>

                        </table></div>${rows.controls}
                    ` : `<div class="empty">Nenhuma receita registrada em ${monthLabel}.</div>`}

                            <tbody>${despesas.map(t => `<tr><td>${fmtDate(t.data)}</td><td><strong>${esc(t.descricao)}</strong></td><td><span class="tag">${esc(t.categoria || "Outros")}</span></td><td><strong style="color:#c0504d">-${money(t.valor)}</strong></td><td><button class="btn btn-danger btn-sm" onclick="deleteDespesa('${t.id}')"><i data-lucide="trash-2"></i></button></td></tr>`).join("")}</tbody>
                        </table></div>
                    ` : `<div class="empty">Nenhuma despesa registrada em ${monthLabel}. Clique em Nova despesa para começar.</div>`}
                </div>

                <!-- PENDÊNCIAS -->

}

async function saveDespesa() {
    const descricao = document.getElementById("despDescricao")?.value.trim();
    const valor = Number(document.getElementById("despValor")?.value) || 0;
    const dataVal = document.getElementById("despData")?.value || today();
    const categoria = document.getElementById("despCategoria")?.value || "Outros";

    if (!descricao) { notify("Descreva a despesa."); return; }
    if (valor <= 0) { notify("Informe um valor válido."); return; }

    if (!data.transacoes) data.transacoes = [];
    data.transacoes.push({
        id: uid(),
        data: dataVal,
        agendaId: null,
        alunoId: null,
        descricao,
        valor,
        tipo: "despesa",
        categoria
    });
    await saveData();
    notify("Despesa registrada.");

function gerarRecibo() {
    const alunoId = document.getElementById('reciboAluno').value;
    const mes = parseInt(document.getElementById('reciboMes').value);
    const ano = parseInt(document.getElementById('reciboAno').value);

    const aluno = getStudent(alunoId);
    if (!aluno) { notify("Aluno não encontrado."); return; }

    const transacoes = (data.transacoes || []).filter(t => {
        const d = parseDate(t.data);
        return t.alunoId === alunoId && d.getMonth() + 1 === mes && d.getFullYear() === ano;
    });

    if (!transacoes.length) {
        notify("Nenhum pagamento encontrado para este período.");
        return;
    }

    const total = transacoes.reduce((s, t) => s + Number(t.valor), 0);
    const mesNome = ['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'][mes - 1];

    const doc = new window.jspdf.jsPDF({ unit: 'mm', format: 'a4' });

    doc.setFont('helvetica', 'bold');
    doc.setFontSize(20);
    doc.text('RECIBO DE PAGAMENTO', pageW / 2, y, { align: 'center' });
    y += 12;

    doc.setFont('helvetica', 'normal');
    doc.setFontSize(11);
    doc.text(`Nº: ${String(Date.now()).slice(-6)}`, 20, y);
    doc.text(`Data: ${fmtDate(today())}`, pageW - 50, y);
    y += 10;

    doc.setFont('helvetica', 'bold');
    doc.setFontSize(14);
    doc.text('INSTITUIÇÃO ASAS', 20, y);
    y += 8;

    doc.setFont('helvetica', 'normal');
    doc.setFontSize(11);
    doc.text(`Recebi(emos) de ${esc(aluno.responsavel || 'Responsável')}`, 20, y);
    y += 7;
    const linhasValor = doc.splitTextToSize(`a importância de ${money(total)} (${numeroPorExtenso(total)})`, pageW - 40);
    linhasValor.forEach(l => { doc.text(l, 20, y); y += 6; });

// CORRIGIDO: númeroPorExtensoSimples agora tem suas próprias tabelas (antes usava dezenas/centenas indefinidas)
function numeroPorExtensoSimples(n) {
    const unidades = ['', 'um', 'dois', 'três', 'quatro', 'cinco', 'seis', 'sete', 'oito', 'nove'];
    const especiais = ['dez', 'onze', 'doze', 'treze', 'quatorze', 'quinze', 'dezesseis', 'dezessete', 'dezoito', 'dezenove'];
    const dezenas = ['', '', 'vinte', 'trinta', 'quarenta', 'cinquenta', 'sessenta', 'setenta', 'oitenta', 'noventa'];
    const centenas = ['', 'cento', 'duzentos', 'trezentos', 'quatrocentos', 'quinhentos', 'seiscentos', 'setecentos', 'oitocentos', 'novecentos'];

    if (n === 0) return '';
    if (n < 10) return unidades[n];
    if (n < 20) return especiais[n - 10];
    if (n < 100) {
        const d = Math.floor(n / 10);
        const u = n % 10;
        return dezenas[d] + (u > 0 ? ` e ${numeroPorExtensoSimples(u)}` : '');
    }
    if (n === 100) return 'cem';
    if (n < 1000) {
        const c = Math.floor(n / 100);
        const r = n % 100;
        return centenas[c] + (r > 0 ? ` e ${numeroPorExtensoSimples(r)}` : '');
    }
    if (n < 1000000) {
        const mil = Math.floor(n / 1000);
        const r = n % 1000;
        let txt = mil === 1 ? 'mil' : `${numeroPorExtensoSimples(mil)} mil`;
        if (r > 0) txt += r < 100 ? ` e ${numeroPorExtensoSimples(r)}` : ` e ${numeroPorExtensoSimples(r)}`;
        return txt;
    }
    return String(n);
}

function numeroPorExtenso(valor) {
    const inteiro = Math.floor(valor);
    const centavos = Math.round((valor - inteiro) * 100);

    if (inteiro === 0 && centavos === 0) return 'Zero reais';

    let texto = '';
    if (inteiro > 0) {
        texto = numeroPorExtensoSimples(inteiro);
        texto += inteiro === 1 ? ' real' : ' reais';
    }
    if (centavos > 0) {
        if (inteiro > 0) texto += ' e ';
        texto += numeroPorExtensoSimples(centavos);
        texto += centavos === 1 ? ' centavo' : ' centavos';
    }

    return texto.charAt(0).toUpperCase() + texto.slice(1);
}
