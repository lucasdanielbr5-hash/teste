<script>// ============================================================
// CONFIGURAÇÃO DO SUPABASE

const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InRldWptaW9qZHl5dHpwYXZyaXRmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODc5NTYxMjUsImV4cCI6MjEwMzUzMjEyNX0.rGLzx-B1bdrlcaa9a_gAOHrDv52UGHQfg-dquLJtyIk';

const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

// ============================================================
// VARIÁVEIS GLOBAIS
// ============================================================

let data = {};
let currentPage = "dashboard";
let currentStudent = null;
let currentAssessment = null;
let calendarDate = new Date();
let calendarMode = "day";
let selectedDay = null;
let studentSectionPage = { overview: 1, avaliacoes: 1, escola: 1 };
let currentConsultation = null;
let financeYear = new Date().getFullYear();
let financeMonth = new Date().getMonth();
let currentUserId = null;
let financePage = 1;
let isSaving = false;
let isDataLoaded = false;

// Variáveis para avaliação passo a passo
let avalStepMode = null; // 'select', 'answering', 'done'
let avalStepQuestions = [];
let avalStepCurrentIndex = 0;
let avalStepResponses = [];
let avalStepTemplateId = null;
let avalStepAlunoId = null;
let avalStepResumo = '';
let avalStepExistingId = null;

const TYPES = {
    psicologia: { label: "Psicologia", cls: "psico" },
    psicopedagogia: { label: "Psicopedagogia", cls: "psicopeg" },
    aula: { label: "Aula Particular", cls: "aula" }
};

const WEEK = ["Seg", "Ter", "Qua", "Qui", "Sex"];
const HOURS = [];
for (let h = 8; h <= 18; h++) HOURS.push(String(h).padStart(2, "0") + ":00");

// ============================================================
// FUNÇÕES AUXILIARES (MANTIDAS IGUAIS)
// ============================================================

function uid() {
    return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, function(c) {
        var r = Math.random() * 16 | 0;
        var v = c === 'x' ? r : (r & 0x3 | 0x8);
        return v.toString(16);
    });
}

function esc(v) {
    return String(v ?? "").replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
}

function money(v) {
    return Number(v || 0).toLocaleString("pt-BR", { style: "currency", currency: "BRL" });
}

function dateISO(d) {
    const x = new Date(d);
    return x.getFullYear() + "-" + String(x.getMonth() + 1).padStart(2, "0") + "-" + String(x.getDate()).padStart(2, "0");
}

function parseDate(s) {
    if (!s) return new Date(NaN);
    if (s instanceof Date) return new Date(s);
    const [y, m, d] = String(s).split("-").map(Number);
    return new Date(y, m - 1, d);
}

function today() {
    return dateISO(new Date());
}

function fmtDate(s) {
    if (!s) return "";
    const d = parseDate(s);
    if (isNaN(d)) return String(s);
    return d.toLocaleDateString("pt-BR", { day: "2-digit", month: "2-digit", year: "numeric" });
}

function fmtDateTime(s) {
    if (!s) return "";
    const d = parseDate(s);
    if (isNaN(d)) return String(s);
    return d.toLocaleDateString("pt-BR", { day: "2-digit", month: "short", year: "numeric" });
}

function monthName(d) {
    return d.toLocaleDateString("pt-BR", { month: "long", year: "numeric" });
}

function initials(name) {
    return (name || "?").split(" ").slice(0, 2).map(x => x[0]).join("").toUpperCase();
}

function avatarHTML(person, cls = "student-avatar") {
    if (!person) return `<div class="${cls}">?</div>`;
    if (person.foto) {
        return `<div class="${cls}" style="background-image:url('${esc(person.foto)}')"></div>`;
    }
    return `<div class="${cls}">${esc(initials(person.nome))}</div>`;
}

function notify(message) {
    const t = document.getElementById("toast");
    if (!t) return;
    t.textContent = message;
    t.classList.add("show");
    clearTimeout(window.toastTimer);
    window.toastTimer = setTimeout(() => t.classList.remove("show"), 2600);
}

function activeAppointments() {
    if (!data.agenda) return [];
    return data.agenda.filter(x => {
        if (x.status === "cancelado") return false;
        const student = getStudent(x.alunoId);
        return student !== null && student !== undefined;
    });
}

function getStudent(id) {
    if (!data.alunos) return null;
    return data.alunos.find(a => a.id === id) || null;
}

function ensureStudentModules(s) {
    if (!s) return;
    s.consultas = s.consultas || [];
    s.avaliacoes = s.avaliacoes || [];
    s.evolucoes = s.evolucoes || [];
    s.escola = s.escola || { nome: "", professores: "", registros: [] };
    s.escola.registros = s.escola.registros || [];
    s.observacoesClinicas = s.observacoesClinicas || [];
}

function defaultData() {
    return {
        session: false,
        professor: {
            nome: "Professor ASAS",
            especialidade: "Psicopedagogia Clínica",
            bio: "Profissional dedicado ao desenvolvimento acadêmico, emocional e cognitivo.",
            foto: "",
            observacoes: [],
            evolucoesPessoais: [],
            configuracoes: { notificacoes: true, tema: "claro", lembretes: true },
            vencimentoMensalidade: ''
        },
        alunos: [],
        agenda: [],
        transacoes: []
    };
}

function monthAppointments(date) {
    const y = date.getFullYear();
    const m = date.getMonth();
    return activeAppointments().filter(a => {
        const d = parseDate(a.data);
        return d.getFullYear() === y && d.getMonth() === m;
    });
}

function monthPaid() {
    const y = new Date().getFullYear();
    const m = new Date().getMonth();
    return (data.transacoes || []).filter(t => {
        const d = parseDate(t.data);
        return d.getFullYear() === y && d.getMonth() === m && (t.tipo || "receita") === "receita";
    }).reduce((s, t) => s + Number(t.valor), 0);
}

function monthDone() {
    const y = new Date().getFullYear();
    const m = new Date().getMonth();
    return activeAppointments().filter(a => {
        const d = parseDate(a.data);
        return d.getFullYear() === y && d.getMonth() === m && a.presente;
    }).length;
}

function monthScheduled() {
    const y = new Date().getFullYear();
    const m = new Date().getMonth();
    return activeAppointments().filter(a => {
        const d = parseDate(a.data);
        return d.getFullYear() === y && d.getMonth() === m;
    }).length;
}

function attendanceRate() {
    const arr = activeAppointments().filter(a => a.presente || a.status === "falta");
    if (!arr.length) return 0;
    return Math.round(arr.filter(a => a.presente).length / arr.length * 100);
}

function weekStart(d) {
    const x = new Date(d);
    const day = x.getDay();
    const diff = day === 0 ? -6 : 1 - day;
    x.setDate(x.getDate() + diff);
    x.setHours(0, 0, 0, 0);
    return x;
}

function weekDates(d) {
    const s = weekStart(d);
    return WEEK.map((_, i) => {
        const x = new Date(s);
        x.setDate(s.getDate() + i);
        return x;
    });
}

function weekPending() {
    const dates = weekDates(new Date());
    const keys = dates.map(dateISO);
    return activeAppointments().filter(a => keys.includes(a.data) && !a.pago)
        .reduce((sum, a) => sum + (getStudent(a.alunoId)?.valor || 0), 0);
}

function studentPager(items, page, size = 5, onclick = "") {
    const total = Math.max(1, Math.ceil(items.length / size));
    page = Math.min(Math.max(1, page), total);
    const slice = items.slice((page - 1) * size, page * size);
    return {
        slice,
        total,
        page,
        controls: total > 1 ? `
            <div style="display:flex;justify-content:center;align-items:center;gap:8px;margin-top:16px;padding-top:12px;border-top:1px solid var(--line)">
                <button class="btn btn-outline btn-sm" ${page <= 1 ? "disabled" : ""} onclick="${onclick}(${page - 1})"><i data-lucide="chevron-left"></i>Anterior</button>
                <span style="font-size:11px;color:#718078">Página ${page} de ${total}</span>
                <button class="btn btn-outline btn-sm" ${page >= total ? "disabled" : ""} onclick="${onclick}(${page + 1})">Próxima<i data-lucide="chevron-right"></i></button>
            </div>` : ""
    };
}

async function loadDataFromSupabase() {
    try {
        const userId = await getUserId();
        if (!userId) return null;

        const { data: professorData, error: profError } = await supabaseClient
            .from('professores')
            .select('*')
            .eq('user_id', userId)
            .maybeSingle();

        const { data: alunosData, error: alunosError } = await supabaseClient
            .from('alunos')
            .select('*')
            .eq('user_id', userId)
            .order('nome');

        const { data: evolucoesData, error: evoError } = await supabaseClient
            .from('evolucoes')
            .select('*')
            .eq('user_id', userId);

        const { data: consultasData, error: consError } = await supabaseClient
            .from('consultas')
            .select('*')
            .eq('user_id', userId);

        const { data: avaliacoesData, error: avError } = await supabaseClient
            .from('avaliacoes')
            .select('*')
            .eq('user_id', userId);

        const { data: resultadosData, error: resError } = await supabaseClient
            .from('resultados_avaliacoes')
            .select('*')
            .eq('user_id', userId);

        const { data: escolaData, error: escError } = await supabaseClient
            .from('escola')
            .select('*')
            .eq('user_id', userId);

        const { data: registrosEscolaData, error: regError } = await supabaseClient
            .from('registros_escola')
            .select('*')
            .eq('user_id', userId);

        const { data: agendaData, error: agendaError } = await supabaseClient
            .from('agenda')
            .select('*')
            .eq('user_id', userId)
            .order('data');

        const { data: transacoesData, error: transError } = await supabaseClient
            .from('transacoes')
            .select('*')
            .eq('user_id', userId);

        const { data: obsProfData, error: obsError } = await supabaseClient
            .from('observacoes_professor')
            .select('*')
            .eq('user_id', userId)
            .order('data', { ascending: false });

        const { data: evoProfData, error: evoProfError } = await supabaseClient
            .from('evolucoes_professor')
            .select('*')
            .eq('user_id', userId)
            .order('data', { ascending: false });

        const alunosNormalizados = (alunosData || []).map(mapAlunoFromDB);
        const evolucoesNorm = (evolucoesData || []).map(mapEvolucaoFromDB);
        const consultasNorm = (consultasData || []).map(mapConsultaFromDB);
        const avaliacoesNorm = (avaliacoesData || []).map(mapAvaliacaoFromDB);
        const resultadosNorm = (resultadosData || []).map(mapResultadoFromDB);
        const escolasNorm = (escolaData || []).map(mapEscolaFromDB);
        const registrosEscolaNorm = (registrosEscolaData || []).map(mapRegistroEscolaFromDB);

        alunosNormalizados.forEach(aluno => {
            aluno.evolucoes = evolucoesNorm.filter(e => e.aluno_id === aluno.id);
            aluno.consultas = consultasNorm.filter(c => c.aluno_id === aluno.id);
            aluno.avaliacoes = avaliacoesNorm.filter(a => a.aluno_id === aluno.id);
            aluno.avaliacoes.forEach(av => {
                av.resultados = resultadosNorm.filter(r => r.avaliacao_id === av.id);
            });
            const esc = escolasNorm.find(e => e.aluno_id === aluno.id);
            if (esc) {
                aluno.escola = {
                    id: esc.id,
                    aluno_id: esc.aluno_id,
                    nome: esc.nome || '',
                    professores: esc.professores || '',
                    registros: registrosEscolaNorm.filter(r => r.escola_id === esc.id)
                };
            } else {
                aluno.escola = { nome: '', professores: '', registros: [] };
            }
            ensureStudentModules(aluno);
        });

        const professorNormalizado = professorData
            ? mapProfessorFromDB(professorData)
            : {
                nome: "Professor ASAS",
                especialidade: "Psicopedagogia Clínica",
                bio: "Profissional dedicado ao desenvolvimento acadêmico, emocional e cognitivo.",
                foto: "",
                observacoes: [],
                evolucoesPessoais: [],
                configuracoes: { notificacoes: true, tema: "claro", lembretes: true }
            };

        if (obsProfData && !obsProfData.error) professorNormalizado.observacoes = obsProfData.map(mapObsProfFromDB);
        if (evoProfData && !evoProfData.error) professorNormalizado.evolucoesPessoais = evoProfData.map(mapEvoProfFromDB);

        const result = {
            session: true,
            professor: professorNormalizado,
            alunos: alunosNormalizados,
            agenda: (agendaData || []).map(mapAgendaFromDB),
            transacoes: (transacoesData || []).map(mapTransacaoFromDB)
        };

        isDataLoaded = true;
        return result;
    } catch (error) {
        console.error('Erro ao carregar dados:', error);
        notify('Erro ao carregar dados do servidor.');
        return null;
    }
}

const COLUMN_MAP = {
    'transacoes': ['id', 'user_id', 'agenda_id', 'aluno_id', 'data', 'descricao', 'valor', 'tipo', 'categoria'],
    'agenda': ['id', 'user_id', 'aluno_id', 'data', 'hora', 'tipo', 'status', 'presente', 'pago', 'updated_at'],
    'alunos': ['id', 'user_id', 'nome', 'idade', 'serie', 'responsavel', 'telefone', 'valor', 'foto', 'tags', 'observacoes', 'ativo', 'updated_at'],
    'professores': ['id', 'user_id', 'nome', 'especialidade', 'bio', 'foto', 'config_notificacoes', 'config_lembretes', 'vencimento_mensalidade', 'updated_at'],
    'evolucoes': ['id', 'user_id', 'aluno_id', 'data', 'titulo', 'texto'],
    'consultas': ['id', 'user_id', 'aluno_id', 'data', 'observacoes', 'acoes', 'pais', 'solicitacoes', 'comportamentos'],
    'avaliacoes': ['id', 'user_id', 'aluno_id', 'data', 'titulo', 'tipo', 'objetivo', 'questoes', 'finalizada'],
    'resultados_avaliacoes': ['id', 'user_id', 'avaliacao_id', 'data', 'respostas', 'resumo'],
    'escola': ['id', 'user_id', 'aluno_id', 'nome', 'professores', 'updated_at'],
    'registros_escola': ['id', 'user_id', 'escola_id', 'data', 'contato', 'tipo', 'assunto', 'relato'],
    'observacoes_professor': ['id', 'user_id', 'data', 'titulo', 'texto'],
    'evolucoes_professor': ['id', 'user_id', 'data', 'titulo', 'texto']
};

async function upsertSafe(tableName, payload, selectSingle = true) {
    let attempt = { ...payload };
    
    const knownColumns = COLUMN_MAP[tableName] || [];
    if (knownColumns.length > 0) {
        const filteredAttempt = {};
        knownColumns.forEach(col => {
            if (attempt[col] !== undefined) {
                filteredAttempt[col] = attempt[col];
            }
        });
        attempt = filteredAttempt;
    }

    for (let i = 0; i < 4; i++) {
        try {
            let query = supabaseClient.from(tableName).upsert(attempt);
            if (selectSingle) query = query.select().single();
            else query = query.select();
            const { data, error } = await query;
            if (!error) return data;
            
            if (error && (error.code === '42703' || /could not find the column/i.test(error.message || ''))) {
                const m = (error.message || '').match(/column "([^"]+)"/i) || (error.message || '').match(/([^"]+).*does not exist/i);
                const col = m ? m[1] : null;
                if (col && col in attempt) {
                    delete attempt[col];
                    continue;
                }
            }
            throw error;
        } catch (err) {
            if (i === 3) throw err;
            if (err.code === '42703' || /could not find the column/i.test(err.message || '')) {
                continue;
            }
            throw err;
        }
    }
    return null;
}

            loaded.professor.configuracoes = { notificacoes: true, tema: "claro", lembretes: true };
        }
        loaded.alunos.forEach(s => ensureStudentModules(s));
        isDataLoaded = true;
        return loaded;
    }
    isDataLoaded = false;
    return defaultData();
}

async function saveData() {
    if (isSaving) return false;

    const isLoggedIn = await checkSession();
    if (!isLoggedIn) {
        console.warn('Usuário não está logado, dados não salvos.');
        return false;
    }

    isSaving = true;

    try {
        if (data.professor) await saveProfessor(data.professor);

        for (const aluno of (data.alunos || [])) {
            await saveAluno(aluno);
            for (const evo of (aluno.evolucoes || [])) {
                await saveEvolucao({ ...evo, aluno_id: aluno.id });
            }
            for (const consulta of (aluno.consultas || [])) {
                await saveConsulta({ ...consulta, aluno_id: aluno.id });
            }
            for (const av of (aluno.avaliacoes || [])) {
                const savedAv = await saveAvaliacao({ ...av, aluno_id: aluno.id });
                if (savedAv && av.resultados) {
                    for (const res of av.resultados) {
                        await saveResultadoAvaliacao({ ...res, avaliacao_id: savedAv.id });
                    }
                }
            }
            if (aluno.escola) {
                const savedEscola = await saveEscola({
                    id: aluno.escola.id || uid(),
                    aluno_id: aluno.id,
                    nome: aluno.escola.nome || '',
                    professores: aluno.escola.professores || ''
                });
                if (savedEscola) aluno.escola.id = savedEscola.id;
                if (aluno.escola.registros) {
                    for (const reg of aluno.escola.registros) {
                        await saveRegistroEscola({ ...reg, escola_id: aluno.escola.id });
                    }
                }
            }
        }

        const validAgenda = (data.agenda || []).filter(item => item && item.alunoId && getStudent(item.alunoId));
        for (const item of validAgenda) {
            await saveAgendaItem(item);
        }
        if (data.agenda) data.agenda = validAgenda;

        const validTrans = (data.transacoes || []).filter(t => {
            if (!t) return false;
            if (t.tipo === 'despesa') return true;
            return t.alunoId && getStudent(t.alunoId);
        });
        for (const trans of validTrans) {
            await saveTransacao(trans);
        }
        if (data.transacoes) data.transacoes = validTrans;

        for (const obs of (data.professor?.observacoes || [])) {
            await saveObservacaoProfessor(obs);
        }

        for (const evo of (data.professor?.evolucoesPessoais || [])) {
            await saveEvolucaoProfessor(evo);
        }

        return true;
    } catch (error) {
        console.error('Erro ao salvar dados:', error);
        notify('Erro ao salvar dados no servidor.');
        return false;
    } finally {
        isSaving = false;
    }
}

function navigate(page) {
    currentPage = page;

    if (target) target.classList.add("active");

    });

async function login() {
    const user = document.getElementById("loginUser").value.trim();
    const pass = document.getElementById("loginPass").value;

    if (!user || !pass) { notify("Preencha usuário e senha."); return; }

    const result = await loginSupabase(user, pass);

    if (result) {
        try {
            const loadedData = await loadData();
            if (loadedData) {
                data = loadedData;
                data.session = true;
                isDataLoaded = true;
            } else {
                data = defaultData();
                data.session = true;
                isDataLoaded = false;
            }

            document.getElementById("loginScreen").style.display = "none";
            document.getElementById("app").style.display = "flex";

            updateUser();
            navigate("dashboard");
            notify(`Bem-vindo, ${data.professor?.nome || "Professor"}!`);
        } catch (error) {
            notify('Erro ao carregar dados. Tente novamente.');
        }
    }
}

async function logout() {
    if (data && data.session) {
        try { await saveData(); } catch (error) {}
    }

    try { await supabaseClient.auth.signOut(); } catch (error) {}

    data = defaultData();
    data.session = false;
    isDataLoaded = false;
    currentUserId = null;
    currentStudent = null;
    currentPage = "dashboard";

    document.getElementById("app").style.display = "none";
    document.getElementById("loginScreen").style.display = "grid";
    document.getElementById("loginPass").value = "";

    document.querySelectorAll(".view").forEach(view => {
        view.innerHTML = '';
        view.classList.remove('active');
    });

    const dashboardView = document.getElementById("page-dashboard");
    if (dashboardView) {
        dashboardView.classList.add('active');
        dashboardView.innerHTML = `
            <div class="empty" style="padding:60px;text-align:center">
                <p style="font-size:18px;color:#8a9892">👋 Logout realizado com sucesso!</p>
                <p style="font-size:13px;color:#a0aaa6;margin-top:8px">Faça login para visualizar seus dados.</p>
            </div>
        `;
    }

    document.getElementById("topUserName").textContent = "";
    const avatarEl = document.getElementById("topAvatar");
    avatarEl.style.backgroundImage = "";
    avatarEl.textContent = "?";

    notify("Logout realizado com sucesso!");
}

    return "Boa noite";
}

async function saveStudent() {
    const nome = document.getElementById("fNome").value.trim();
    if (!nome) { notify("Informe o nome do aluno."); return; }

    const student = {
        id: uid(),
        nome: nome,
        idade: Number(document.getElementById("fIdade").value) || 0,
        serie: document.getElementById("fSerie").value.trim(),
        responsavel: document.getElementById("fResponsavel").value.trim(),
        telefone: document.getElementById("fTelefone").value.trim(),
        valor: Number(document.getElementById("fValor").value) || 0,
        foto: document.getElementById("fFoto").value.trim(),
        tags: document.getElementById("fTags").value.split(",").map(x => x.trim()).filter(Boolean),
        observacoes: document.getElementById("fObs").value.trim(),
        ativo: true
    };

    data.alunos.push(student);
    ensureStudentModules(student);
    await saveData();
    notify("Aluno cadastrado com sucesso.");
    toggleStudentForm(false);
    renderAlunos();
}

    s.idade = Number(document.getElementById("eIdade")?.value) || 0;
    s.serie = document.getElementById("eSerie")?.value.trim() || "";
    s.responsavel = document.getElementById("eResponsavel")?.value.trim() || "";
    s.telefone = document.getElementById("eTelefone")?.value.trim() || "";
    s.valor = Number(document.getElementById("eValor")?.value) || 0;
    s.foto = document.getElementById("eFoto")?.value.trim() || "";

    const tagsInput = document.getElementById("eTags")?.value.trim() || "";
    s.tags = tagsInput.split(",").map(x => x.trim()).filter(Boolean);

    s.observacoes = document.getElementById("eObs")?.value.trim() || "";

    await saveData();
    notify("Dados do aluno atualizados.");
    renderStudentProfile("overview");
}

function renderStudentProfile(mode = "overview") {
    const s = getStudent(currentStudent);
    if (!s) return;
    ensureStudentModules(s);

    const consultations = [...(s.consultas || [])].sort((a,b)=>b.data.localeCompare(a.data));
    const evolucoes = [...(s.evolucoes || [])].sort((a,b)=>b.data.localeCompare(a.data));
    const assessments = [...(s.avaliacoes || [])].sort((a,b)=>b.data.localeCompare(a.data));
    const schoolRecords = [...(s.escola?.registros || [])].sort((a,b)=>b.data.localeCompare(a.data));
    const appointments = activeAppointments().filter(a=>a.alunoId===s.id);
    const upcoming = appointments.filter(a=>a.data>=today()).sort((a,b)=>(a.data+a.hora).localeCompare(b.data+b.hora));
    const done = appointments.filter(a=>a.presente).length;
    const paid = appointments.filter(a=>a.pago).length;
    const totalAplicacoes = assessments.reduce((acc,a)=>acc+(a.resultados||[]).length,0);
    const lastAttendance = consultations[0]?.data || appointments.filter(a=>a.presente).sort((a,b)=>b.data.localeCompare(a.data))[0]?.data;
    const daysSince = lastAttendance ? Math.max(0,Math.floor((parseDate(today())-parseDate(lastAttendance))/86400000)) : null;
    const activeDays = Math.max(1, appointments.filter(a=>a.data>=dateISO(new Date(Date.now()-30*86400000))).length);

    const domains = {
      participacao:'Participação', atencao:'Atenção', comunicacao:'Comunicação', autonomia:'Autonomia', comportamento:'Comportamento', emocional:'Emocional'
    };
    const scoreMap = { 'Bom':100, 'Adequado':78, 'Oscilante':55, 'Necessitou mediação':38, 'Apresentou dificuldade':22 };
    const domainStats = Object.entries(domains).map(([key,label])=>{
      const vals=consultations.map(c=>c.comportamentos?.[key]).filter(Boolean).map(v=>scoreMap[v] ?? 50);
      const avg=vals.length?Math.round(vals.reduce((a,b)=>a+b,0)/vals.length):0;
      return {key,label,avg,count:vals.length};
    });
    const filledDomains = domainStats.filter(d=>d.count>0);
    const globalScore = filledDomains.length ? Math.round(filledDomains.reduce((a,d)=>a+d.avg,0)/filledDomains.length) : 0;
    const previousConsultations = consultations.slice(0, Math.min(3,consultations.length));
    const prevText = previousConsultations.map(c=>Object.values(c.comportamentos||{}).map(v=>scoreMap[v]??50));

    const timeline = [];
    consultations.forEach(c=>timeline.push({type:'consulta',date:c.data,title:'Consulta registrada',text:c.observacoes||c.acoes||'Atendimento realizado.',obj:c}));
    evolucoes.forEach(e=>timeline.push({type:'evolucao',date:e.data,title:e.titulo||'Evolução',text:e.texto||'',obj:e}));
    assessments.forEach(a=>timeline.push({type:'avaliacao',date:a.data,title:a.titulo||'Avaliação',text:`${(a.questoes||[]).length} questões · ${(a.resultados||[]).length} aplicação(ões)`,obj:a}));
    schoolRecords.forEach(r=>timeline.push({type:'escola',date:r.data,title:r.assunto||'Contato com a escola',text:r.relato||'',obj:r}));
    timeline.sort((a,b)=>b.date.localeCompare(a.date));

    const risk = daysSince===null ? 'Sem dados recentes' : daysSince>21 ? 'Acompanhamento desatualizado' : daysSince>7 ? 'Atenção ao intervalo' : 'Acompanhamento ativo';
    const riskClass = daysSince===null || daysSince>21 ? 'danger' : daysSince>7 ? 'warn' : 'ok';

    // --- Renderização da seção "consulta" ---
    if (mode === 'consulta') {
      const c=(s.consultas||[]).find(x=>x.id===currentConsultation);
      if(!c){renderStudentProfile('overview');return;}
      document.getElementById('page-prontuario').innerHTML=`
        <div class="student-detail-page"><button class="btn btn-outline btn-sm" onclick="renderStudentProfile('overview')"><i data-lucide="arrow-left"></i>Voltar ao perfil</button>
        <div class="student-detail-card card"><div class="student-detail-header"><div><span class="eyebrow">Atendimento</span><h2>Consulta de ${fmtDate(c.data)}</h2><p>${esc(s.nome)}</p></div><button class="btn btn-blue btn-sm" onclick="generateStudentPDF('${s.id}')"><i data-lucide="file-down"></i>Relatório PDF</button></div>
        <div class="detail-section"><div class="detail-title">O que foi visto</div><div class="detail-text">${esc(c.observacoes||'Não informado.')}</div></div>
        <div class="detail-grid"><div class="detail-section"><div class="detail-title">Comportamento</div>${Object.entries(c.comportamentos||{}).map(([k,v])=>`<div class="metric-line"><span>${domains[k]||k}</span><strong>${esc(v)}</strong></div>`).join('')||'<div class="empty">Sem indicadores registrados.</div>'}</div><div class="detail-section"><div class="detail-title">Ações realizadas</div><div class="detail-text">${esc(c.acoes||'Não informado.')}</div></div></div>
        <div class="detail-grid"><div class="detail-section"><div class="detail-title">Orientações aos responsáveis</div><div class="detail-text">${esc(c.pais||'Não informado.')}</div></div><div class="detail-section"><div class="detail-title">Próximos passos</div><div class="detail-text">${esc(c.solicitacoes||'Não informado.')}</div></div></div></div></div>`;
      lucide.createIcons(); return;
    }

    // --- Renderização da seção "edit" ---
    if (mode === 'edit') {
      document.getElementById('page-prontuario').innerHTML=`<div class="student-detail-page"><button class="btn btn-outline btn-sm" onclick="renderStudentProfile('overview')"><i data-lucide="arrow-left"></i>Voltar</button><div class="card student-detail-card"><div class="student-detail-header"><div><span class="eyebrow">Cadastro</span><h2>Editar aluno</h2><p>${esc(s.nome)}</p></div></div><div class="form-grid"><div class="field"><label class="label">Nome</label><input id="eNome" class="input" value="${esc(s.nome)}"></div><div class="field"><label class="label">Idade</label><input id="eIdade" class="input" type="number" value="${s.idade||''}"></div><div class="field"><label class="label">Série / Ano</label><input id="eSerie" class="input" value="${esc(s.serie||'')}"></div><div class="field"><label class="label">Responsável</label><input id="eResponsavel" class="input" value="${esc(s.responsavel||'')}"></div><div class="field"><label class="label">Telefone</label><input id="eTelefone" class="input" value="${esc(s.telefone||'')}"></div><div class="field"><label class="label">Valor por sessão</label><input id="eValor" class="input" type="number" step=".01" value="${s.valor||0}"></div><div class="field" style="grid-column:1/-1"><label class="label">Tags / marcadores</label><input id="eTags" class="input" value="${esc((s.tags||[]).join(', '))}"></div><div class="field" style="grid-column:1/-1"><label class="label">Observações gerais</label><textarea id="eObs" class="textarea">${esc(s.observacoes||'')}</textarea></div></div><div class="form-actions"><button class="btn btn-primary" onclick="saveStudentEdit()">Salvar alterações</button><button class="btn btn-outline" onclick="renderStudentProfile('overview')">Cancelar</button></div></div></div>`;
      lucide.createIcons(); return;
    }

    // --- Renderização da seção "avaliacoes" ---
    if (mode === 'avaliacoes') {
      // Corrigido: Usar 'assessments' para a lista de avaliações
      const rows = assessments.map(a => {
        const results=[...(a.resultados||[])].sort((x,y)=>y.data.localeCompare(x.data));
        const last=results[0];
        return `<div class="assessment-card-row"><div class="assessment-history-icon"><i data-lucide="clipboard-check"></i></div><div class="assessment-row-main"><div class="assessment-row-title"><b>${esc(a.titulo||'Avaliação')}</b><span>${fmtDate(a.data)}</span></div><p>${(a.questoes||[]).length} questões · ${results.length} aplicação(ões)</p>${last?`<div class="assessment-result-snippet"><span>Último resultado · ${fmtDate(last.data)}</span><strong>${esc(last.resumo||'Aplicação registrada.')}</strong></div>`:''}</div><button class="btn btn-primary btn-sm" onclick="applyAssessment('${a.id}')">Aplicar</button></div>`;
      }).join('');
      
      document.getElementById('page-prontuario').innerHTML=`<div class="student-profile-page"><div class="profile-backbar"><button class="btn btn-outline btn-sm" onclick="renderStudentProfile('overview')"><i data-lucide="arrow-left"></i>Voltar ao perfil</button><span>Avaliações de ${esc(s.nome)}</span></div><div class="card student-cover"><div class="student-cover-art"></div><div class="student-identity">${avatarHTML(s,'student-profile-avatar')}<div class="student-identity-copy"><span class="eyebrow">Histórico de avaliações</span><h1>${esc(s.nome)}</h1><p>${assessments.length} instrumento(s) · ${totalAplicacoes} aplicação(ões)</p></div><div class="student-cover-actions"><button class="btn btn-primary btn-sm" onclick="startAvalStep()"><i data-lucide="plus"></i>Nova aplicação</button><button class="btn btn-blue btn-sm" onclick="generateStudentPDF('${s.id}')">Relatório</button></div></div><div class="student-profile-tabs"><button onclick="renderStudentProfile('overview')">Visão geral</button><button class="active">Avaliações <span>${assessments.length}</span></button><button onclick="renderStudentProfile('escola')">Escola <span>${schoolRecords.length}</span></button></div></div><div class="profile-kpi-grid"><div class="profile-kpi card"><span>Instrumentos</span><strong>${assessments.length}</strong><small>Tipos registrados</small></div><div class="profile-kpi card"><span>Aplicações</span><strong>${totalAplicacoes}</strong><small>Resultados armazenados</small></div><div class="profile-kpi card"><span>Última aplicação</span><strong style="font-size:17px">${assessments.length && assessments[0].resultados && assessments[0].resultados.length ? fmtDate(assessments[0].resultados[assessments[0].resultados.length-1].data) : '—'}</strong><small>Data mais recente</small></div><div class="profile-kpi card"><span>Última evolução</span><strong style="font-size:17px">${evolucoes[0]?fmtDate(evolucoes[0].data):'—'}</strong><small>Registro de progresso</small></div></div><div class="card profile-section"><div class="profile-section-head"><div><span class="eyebrow">Histórico</span><h2>Aplicações e resultados</h2><p>Cada aplicação permanece vinculada ao prontuário do aluno.</p></div></div><div class="assessment-list-full">${rows||'<div class="empty">Nenhuma avaliação registrada.</div>'}</div></div></div>`;
      lucide.createIcons(); return;
    }

    // --- Renderização da seção "escola" ---
    if (mode === 'escola') {
      const history=schoolRecords.map(r=>`<div class="profile-event"><div class="profile-event-marker escola"></div><div class="profile-event-body"><div class="profile-event-head"><div><b>${esc(r.assunto||'Contato com a escola')}</b><span>${fmtDate(r.data)} · ${esc(r.tipo||'Contato')} · ${esc(r.contato||'')}</span></div></div><p>${esc(r.relato||'')}</p></div></div>`).join('');
      document.getElementById('page-prontuario').innerHTML=`<div class="student-profile-page"><div class="profile-backbar"><button class="btn btn-outline btn-sm" onclick="renderStudentProfile('overview')"><i data-lucide="arrow-left"></i>Voltar ao perfil</button><span>Escola · ${esc(s.nome)}</span></div><div class="card student-cover"><div class="student-cover-art"></div><div class="student-identity">${avatarHTML(s,'student-profile-avatar')}<div class="student-identity-copy"><span class="eyebrow">Contexto escolar</span><h1>${esc(s.nome)}</h1><p>${esc(s.escola?.nome||'Escola não cadastrada')} · ${esc(s.escola?.professores||'Equipe não informada')}</p></div><div class="student-cover-actions"><button class="btn btn-primary btn-sm" onclick="document.getElementById('schoolNewWrap').scrollIntoView({behavior:'smooth'})"><i data-lucide="plus"></i>Novo contato</button></div></div><div class="student-profile-tabs"><button onclick="renderStudentProfile('overview')">Visão geral</button><button onclick="renderStudentProfile('avaliacoes')">Avaliações <span>${assessments.length}</span></button><button class="active">Escola <span>${schoolRecords.length}</span></button></div></div><div class="student-profile-grid"><main class="student-profile-main"><div class="card profile-section"><div class="profile-section-head"><div><span class="eyebrow">Dados</span><h2>Informações da escola</h2><p>Instituição e profissionais relacionados ao acompanhamento.</p></div></div><div class="form-grid two"><div class="field"><label class="label">Escola</label><input id="escNome" class="input" value="${esc(s.escola?.nome||'')}"></div><div class="field"><label class="label">Professora / equipe</label><input id="escProf" class="input" value="${esc(s.escola?.professores||'')}"></div></div><button class="btn btn-primary btn-sm" onclick="saveSchoolInfo()">Salvar dados</button></div><div class="card profile-section" id="schoolNewWrap"><div class="profile-section-head"><div><span class="eyebrow">Registro</span><h2>Novo contato</h2><p>Documente reuniões, ligações, mensagens ou relatórios.</p></div></div><div class="form-grid"><div class="field"><label class="label">Data</label><input id="escData" class="input" type="date" value="${today()}"></div><div class="field"><label class="label">Contato</label><input id="escContato" class="input"></div><div class="field"><label class="label">Tipo</label><select id="escTipo" class="select"><option>Conversa</option><option>Reunião</option><option>Ligação</option><option>Mensagem</option><option>Relatório da escola</option></select></div><div class="field"><label class="label">Assunto</label><input id="escAssunto" class="input"></div></div><div class="field"><label class="label">Relato</label><textarea id="escRelato" class="textarea"></textarea></div><button class="btn btn-primary btn-sm" onclick="addSchoolRecord()">Registrar contato</button></div><div class="card profile-section"><div class="profile-section-head"><div><span class="eyebrow">Histórico</span><h2>Comunicações com a escola</h2><p>${schoolRecords.length} registro(s) cronológico(s).</p></div></div><div class="profile-timeline">${history||'<div class="empty">Nenhum contato registrado.</div>'}</div></div></main><aside class="student-profile-side"><div class="card profile-section sticky-card"><div class="profile-side-title">Resumo escolar</div><div class="side-metric"><span>Escola</span><b>${esc(s.escola?.nome||'Não cadastrada')}</b></div><div class="side-metric"><span>Equipe</span><b>${esc(s.escola?.professores||'Não informada')}</b></div><div class="side-metric"><span>Contatos registrados</span><b>${schoolRecords.length}</b></div></div></aside></div></div>`;
      lucide.createIcons(); return;
    }

    // --- Renderização da seção "aplicar" ---
    if (mode === 'aplicar') {
      const a=s.avaliacoes.find(x=>x.id===currentAssessment);
      if(!a){renderStudentProfile('avaliacoes');return;}
      document.getElementById('page-prontuario').innerHTML=`<div class="student-detail-page"><button class="btn btn-outline btn-sm" onclick="renderStudentProfile('avaliacoes')"><i data-lucide="arrow-left"></i>Voltar</button><div class="card student-detail-card"><div class="student-detail-header"><div><span class="eyebrow">Avaliação</span><h2>${esc(a.titulo)}</h2><p>${esc(s.nome)} · ${fmtDate(a.data)}</p></div><button class="btn btn-blue btn-sm" onclick="gerarPDFAvaliacao('${s.id}','${a.id}')"><i data-lucide="file-down"></i>PDF</button></div><div class="form-grid one">${(a.questoes||[]).map(q=>`<div class="detail-section"><div class="detail-title">${q.numero}. ${esc(q.texto)}</div><textarea id="resp_${q.numero-1}" class="textarea" placeholder="Resposta / observação do aluno"></textarea></div>`).join('')}</div><div class="field"><label class="label">Resumo da aplicação</label><textarea id="avResumo" class="textarea"></textarea></div><div class="form-actions"><button class="btn btn-primary" onclick="saveAssessmentApplication()">Registrar aplicação</button><button class="btn btn-outline" onclick="renderStudentProfile('avaliacoes')">Cancelar</button></div></div></div>`;
      lucide.createIcons(); return;
    }

            <div class="student-cover-actions"><button class="btn btn-primary btn-sm" onclick="newConsultationForm()"><i data-lucide="plus"></i>Consulta</button><button class="btn btn-soft btn-sm" onclick="newEvolucaoForm()"><i data-lucide="trending-up"></i>Evolução</button><button class="btn btn-outline btn-sm" onclick="renderStudentProfile('edit')">Editar</button><button class="btn btn-blue btn-sm" onclick="generateStudentPDF('${s.id}')">Relatório</button></div>
          </div>
          <div class="student-profile-tabs"><button class="active" onclick="renderStudentProfile('overview')">Visão geral</button><button onclick="renderStudentProfile('avaliacoes')">Avaliações <span>${assessments.length}</span></button><button onclick="renderStudentProfile('escola')">Escola <span>${schoolRecords.length}</span></button></div>
        </section>

        <section class="profile-kpi-grid">
          <div class="profile-kpi card"><div class="kpi-icon sage"><i data-lucide="activity"></i></div><span>Índice de acompanhamento</span><strong>${progress?progress+'%':'—'}</strong><small>${progress?'Baseado nos registros de comportamento':'Registre consultas para gerar'}</small></div>

async function createAssessment() {
    const s = getStudent(currentStudent);
    if (!s) return;
    ensureStudentModules(s);

    const titulo = document.getElementById("avTitulo")?.value.trim();
    const objetivo = document.getElementById("avObjetivo")?.value.trim();
    const raw = document.getElementById("avQuestoes")?.value || "";
    const questoes = raw.split(/\n+/).map(x => x.trim()).filter(Boolean).map((texto, i) => ({ id: uid(), numero: i + 1, texto }));

    if (!titulo || !questoes.length) { notify("Informe o título e pelo menos uma questão."); return; }

    s.avaliacoes.push({ id: uid(), data: today(), titulo, tipo: "custom", objetivo, questoes, resultados: [], finalizada: false });
    await saveData();
    notify("Avaliação criada.");
    renderStudentProfile("avaliacoes");
}

function startExistingAssessmentStep(id) {
    const s = getStudent(currentStudent);
    if (!s) return;
    const a = (s.avaliacoes || []).find(x => x.id === id);
    if (!a) { notify("Avaliação não encontrada."); return; }
    ensureStudentModules(s);
    avalStepExistingId = id;
    avalStepTemplateId = null;
    avalStepAlunoId = s.id;
    avalStepCurrentIndex = 0;
    avalStepResponses = [];
    avalStepResumo = '';
    avalStepQuestions = (a.questoes || []).map((q,i) => ({ index:i, texto:q.texto || String(q), escala:a.escala || [{valor:0,rotulo:'Resposta'}] }));
    avalStepMode = 'answering';
    // Armazena o título no template virtualmente para o cabeçalho.
    renderExistingAvalStepAnswer();
}

function renderExistingAvalStepAnswer() {
    const s = getStudent(avalStepAlunoId);
    const a = s ? (s.avaliacoes || []).find(x=>x.id===avalStepExistingId) : null;
    if (!s || !a) { cancelAvalStep(); return; }
    const total=avalStepQuestions.length, idx=avalStepCurrentIndex, q=avalStepQuestions[idx];
    if (!q || !total) { finalizeExistingAssessmentStep(); return; }
    const pct=Math.round((idx/total)*100), escala=q.escala||[{valor:0,rotulo:'Resposta'}];
    document.getElementById('page-avaliacoes').innerHTML=`
      <div class="assessment-workspace">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px"><button class="btn btn-outline btn-sm" onclick="cancelAvalStep()"><i data-lucide="arrow-left"></i> Sair</button><span style="font-size:10px;color:#909b96">${esc(a.titulo)}</span></div>
        <div class="assessment-progress"><span class="text">Questão ${idx+1} de ${total}</span><span class="pct">${pct}% concluído</span></div>
        <div class="assessment-track"><div class="assessment-fill" style="width:${Math.max(4,pct)}%"></div></div>
        <div class="assessment-page"><div class="eyebrow">Aplicação para ${esc(s.nome)}</div><div class="question">${esc(q.texto)}</div><div class="answer-grid">${escala.map(op=>`<label class="${avalStepResponses[idx]===op.valor?'selected':''}" onclick="selectExistingAvalStepOption(${idx},${op.valor})"><input type="radio" name="existingOpt" value="${op.valor}" ${avalStepResponses[idx]===op.valor?'checked':''} style="margin-right:7px;accent-color:var(--sage)">${esc(op.rotulo)}</label>`).join('')}</div></div>
        <div class="assessment-nav"><button class="btn btn-outline" onclick="existingAvalStepPrev()" ${idx===0?'disabled':''}><i data-lucide="chevron-left"></i> Anterior</button><span class="hint">Uma questão por página.</span><button class="btn btn-primary" onclick="existingAvalStepNext()">${idx===total-1?'Concluir':'Próxima página'} <i data-lucide="chevron-right"></i></button></div>
      </div>`;
    lucide.createIcons();
}

function selectExistingAvalStepOption(idx,value){ avalStepResponses[idx]=value; renderExistingAvalStepAnswer(); }
function existingAvalStepPrev(){ if(avalStepCurrentIndex>0){avalStepCurrentIndex--;renderExistingAvalStepAnswer();} }
function existingAvalStepNext(){
    const idx=avalStepCurrentIndex;
    if(avalStepResponses[idx]===undefined){notify('Selecione uma resposta antes de continuar.');return;}
    if(idx===avalStepQuestions.length-1){ finalizeExistingAssessmentStep(); } else { avalStepCurrentIndex++; renderExistingAvalStepAnswer(); }
}
async function finalizeExistingAssessmentStep(){
    const s=getStudent(avalStepAlunoId); const a=s?(s.avaliacoes||[]).find(x=>x.id===avalStepExistingId):null;
    if(!s||!a){cancelAvalStep();return;}
    const escalaBase=a.escala||[];
    const respostas=avalStepQuestions.map((q,i)=>{const op=escalaBase.find(e=>e.valor===avalStepResponses[i]);return {questao:q.texto,valor:avalStepResponses[i],rotulo:op?op.rotulo:'Sem resposta'};});
    a.resultados=a.resultados||[]; a.resultados.push({id:uid(),data:today(),respostas,resumo:avalStepResumo||'Aplicação concluída.'}); a.finalizada=true;
    await saveData(); notify(`Aplicação de "${a.titulo}" registrada.`); const avId=a.id; avalStepExistingId=null; avalStepMode=null; avalStepQuestions=[]; avalStepResponses=[]; currentStudent=s.id; renderStudentProfile('avaliacoes');
}

function applyAssessment(id) { startExistingAssessmentStep(id); }

async function saveAssessmentApplication() {
    const s = getStudent(currentStudent);
    if (!s) return;
    ensureStudentModules(s);
    const a = s.avaliacoes.find(x => x.id === currentAssessment);
    if (!a) return;

    const respostas = a.questoes.map((q, i) => document.getElementById("resp_" + i)?.value.trim() || "");
    a.resultados.push({
        id: uid(),
        data: today(),
        respostas,
        resumo: document.getElementById("avResumo")?.value.trim() || "Aplicação concluída."
    });
    a.finalizada = true;

    await saveData();
    notify("Aplicação registrada no histórico do aluno.");
    currentAssessment = null;
    renderStudentProfile("avaliacoes");
}

function renderMonth() {
    const y = calendarDate.getFullYear();
    const m = calendarDate.getMonth();
    const first = new Date(y, m, 1);
    const last = new Date(y, m + 1, 0);
    let start = first.getDay();
    start = start === 0 ? 6 : start - 1;
    const total = Math.ceil((start + last.getDate()) / 7) * 7;

    let html = `<div style="overflow:auto"><div class="month-grid">`;
    ["Seg", "Ter", "Qua", "Qui", "Sex", "Sáb", "Dom"].forEach(d => {
        html += `<div class="week-head">${d}</div>`;
    });

    for (let i = 0; i < total; i++) {
        const day = i - start + 1;
        let d = new Date(y, m, day);
        const inMonth = d.getMonth() === m;
        const iso = dateISO(d);
        const events = activeAppointments().filter(a => a.data === iso);

        html += `
            <div class="month-day ${inMonth ? "" : "other"}" onclick="${inMonth ? `selectMonthDay('${iso}')` : ""}">
                <div class="day-number">${d.getDate()}</div>
                <div class="dot-row">${events.slice(0, 7).map(a => `<span class="dot ${TYPES[a.tipo]?.cls || ''}"></span>`).join("")}</div>
                <div class="day-events">
                    ${events.slice(0, 3).map(a => { const s = getStudent(a.alunoId); return `<div class="day-event">${a.hora} · ${esc(s?.nome || "Aluno")}</div>`; }).join("")}
                    ${events.length > 3 ? `<div style="font-size:9px;color:#8a9892">+${events.length - 3} atendimentos</div>` : ""}
                </div>
            </div>`;
    }

    html += `</div></div>`;
    return html;
}

function selectMonthDay(day) {
    selectedDay = day;
    renderAgenda();
}

function renderDayPanel(day) {
    const events = activeAppointments().filter(a => a.data === day).sort((a, b) => a.hora.localeCompare(b.hora));

    return `
        <div class="card" style="margin-top:16px">
            <div class="section-head">
                <div><div class="section-title">Sessões de ${fmtDate(day)}</div><div class="section-sub">${events.length} atendimento(s)</div></div>
                <button class="btn btn-primary btn-sm" onclick="quickSchedule('${day}','09:00')"><i data-lucide="plus"></i>Adicionar</button>
            </div>
            ${events.length ? events.map(a => {
                const s = getStudent(a.alunoId);
                if (!s) return `<div style="padding:10px 0;border-bottom:1px solid #f0f3f2;color:#999">Aluno removido - ${a.hora}</div>`;
                const t = TYPES[a.tipo];
                return `
                    <div style="display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid #f0f3f2">
                        <strong style="width:45px;font-size:12px">${a.hora}</strong>
                        ${avatarHTML(s, "student-avatar")}
                        <div style="flex:1"><div style="font-size:12px;font-weight:700;cursor:pointer" onclick="openStudent('${s.id}')">${esc(s.nome)}</div><div style="font-size:10px;color:#8a9892">${t?.label || a.tipo}</div></div>
                        <button class="btn btn-sm ${a.presente ? "btn-soft" : "btn-outline"}" onclick="togglePresence('${a.id}')">${a.presente ? "Presente" : "Presença"}</button>
                        <button class="btn btn-sm ${a.pago ? "btn-soft" : "btn-outline"}" onclick="togglePayment('${a.id}')">${a.pago ? "Pago" : "Pagamento"}</button>
                        <button class="btn btn-danger btn-sm" onclick="cancelAppointment('${a.id}')">Cancelar</button>
                    </div>`;
            }).join("") : `<div class="empty">Nenhuma sessão neste dia.</div>`}
        </div>`;
}

async function saveAppointment() {
    const alunoId = document.getElementById("agAluno").value;
    const dataValue = document.getElementById("agData").value;
    const hora = document.getElementById("agHora").value;
    const tipo = document.getElementById("agTipo").value;

    if (!alunoId || !dataValue || !hora) {
        notify("Preencha aluno, data e horário.");
        return;
    }

    const aluno = getStudent(alunoId);
    if (!aluno) {
        notify("Aluno não encontrado. Recarregue a página.");
        return;
    }

    const occupied = activeAppointments().some(a => a.data === dataValue && a.hora === hora);
    if (occupied) {
        notify("Este horário já possui atendimento.");
        return;
    }

    const newAppointment = {
        id: uid(),
        alunoId: alunoId,
        data: dataValue,
        hora: hora,
        tipo: tipo,
        status: "agendado",
        presente: false,
        pago: false
    };

    data.agenda.push(newAppointment);

    const saved = await saveData();
    if (saved) {
        notify("Atendimento agendado com sucesso!");
        renderAgenda();
    } else {
        data.agenda = data.agenda.filter(a => a.id !== newAppointment.id);
        notify("Erro ao salvar agendamento. Tente novamente.");
    }
}

async function cancelAppointment(id) {
    const a = data.agenda.find(x => x.id === id);
    if (!a) return;
    if (!confirm("Cancelar este atendimento?")) return;
    a.status = "cancelado";
    await saveData();
    notify("Atendimento cancelado.");
    renderPage();
}

async function togglePresence(id) {
    const a = data.agenda.find(x => x.id === id);
    if (!a) return;
    a.presente = !a.presente;
    if (a.presente) a.status = "realizado";
    else a.status = "agendado";
    await saveData();
    notify(a.presente ? "Presença registrada." : "Presença removida.");
    renderPage();
}

async function togglePayment(id) {
    const a = data.agenda.find(x => x.id === id);
    if (!a) return;
    const s = getStudent(a.alunoId);
    if (!s) return;

    if (!a.pago) {
        a.pago = true;
        const transacao = {
            id: uid(),
            data: a.data,
            agendaId: a.id,
            alunoId: s.id,
            descricao: `Sessão de ${s.nome}`,
            valor: Number(s.valor) || 0,
            tipo: "receita",
            categoria: "Sessão"
        };
        data.transacoes.push(transacao);
        await saveData();
        notify(`Pagamento de ${money(s.valor)} registrado.`);
    } else {
        a.pago = false;
        const transacoesRemovidas = data.transacoes.filter(t => t.agendaId === a.id);
        data.transacoes = data.transacoes.filter(t => t.agendaId !== a.id);
        for (const t of transacoesRemovidas) {
            await deleteTransacaoDB(t.id);
        }
        await saveData();
        notify("Pagamento revertido.");
    }
    renderPage();
}

function calendarPrev() {
    if (calendarMode === "day") { calendarDate.setDate(calendarDate.getDate() - 1); selectedDay = dateISO(calendarDate); }
    else if (calendarMode === "week") { calendarDate.setDate(calendarDate.getDate() - 7); selectedDay = dateISO(calendarDate); }
    else { calendarDate.setMonth(calendarDate.getMonth() - 1); selectedDay = null; }
    renderAgenda();
}

function calendarNext() {
    if (calendarMode === "day") { calendarDate.setDate(calendarDate.getDate() + 1); selectedDay = dateISO(calendarDate); }
    else if (calendarMode === "week") { calendarDate.setDate(calendarDate.getDate() + 7); selectedDay = dateISO(calendarDate); }
    else { calendarDate.setMonth(calendarDate.getMonth() + 1); selectedDay = null; }
    renderAgenda();
}

function calendarToday() { calendarDate = new Date(); selectedDay = today(); renderAgenda(); }
function setCalendarMode(mode) { calendarMode = mode; if (mode !== 'month') selectedDay = selectedDay || today(); renderAgenda(); }

function getAvaliacoesGlobais() {
    const todas = [];
    (data.alunos || []).forEach(aluno => {
        (aluno.avaliacoes || []).forEach(av => {
            todas.push({ ...av, alunoId: aluno.id, alunoNome: aluno.nome });
        });
    });
    return todas;
}

function getAvalTypeBadge(tipo) {
    const map = { anamnese: "anamnese", screening: "screening", survey: "survey", custom: "survey" };
    return map[tipo] || "survey";
}

function getTemplateById(id) {
    return ASSESSMENT_TEMPLATES.find(t => t.id === id);
}

function renderAvaliacoes() {
    if (!isDataLoaded || !data || !data.session) {
        document.getElementById("page-avaliacoes").innerHTML = `<div class="empty" style="padding:40px;text-align:center"><p>Faça login para visualizar.</p></div>`;
        return;
    }

    // Verifica se está em modo passo a passo
    if (avalStepMode === 'select') return renderAvalStepSelect();
    if (avalStepMode === 'answering') return avalStepExistingId ? renderExistingAvalStepAnswer() : renderAvalStepAnswer();
    if (avalStepMode === 'done') return renderAvalStepDone();

    if (currentAvalMode === "new") return renderAvaliacoesNew();
    if (currentAvalMode === "apply") return renderAvaliacoesApply();
    if (currentAvalMode === "history") return renderAvaliacoesHistory();
    return renderAvaliacoesList();
}

function renderAvaliacoesList() {
    const todas = getAvaliacoesGlobais();
    const porTitulo = {};
    todas.forEach(av => {
        const key = av.titulo;
        if (!porTitulo[key]) porTitulo[key] = { titulo: av.titulo, tipo: av.tipo || "custom", count: 0, aplicacoes: 0, ids: [] };
        porTitulo[key].count++;
        porTitulo[key].aplicacoes += (av.resultados || []).length;

function startAvalStep() {

function startAvalStepWithTemplate(tplId) {

    avalStepTemplateId = tplId;
    avalStepAlunoId = null;
    avalStepCurrentIndex = 0;
    avalStepResponses = [];

}

function renderAvalStepSelect() {

        <div class="section-head"><div><div class="section-title">Aplicar avaliação (passo a passo)</div><div class="section-sub">Selecione o aluno e o instrumento.</div></div></div>

        <div class="card" style="max-width:600px;margin:0 auto">

            <button class="btn btn-primary" onclick="startAvalStepAnswer()"><i data-lucide="play"></i>Iniciar avaliação</button>
        </div>
    `;
    lucide.createIcons();
}

function startAvalStepAnswer() {
    const alunoId = document.getElementById("stepAluno")?.value;
    const tplId = document.getElementById("stepTemplate")?.value;

    if (!alunoId) { notify("Selecione um aluno."); return; }
    if (!tplId) { notify("Selecione um instrumento."); return; }

    const aluno = getStudent(alunoId);
    if (!aluno) { notify("Aluno não encontrado."); return; }

    const tpl = getTemplateById(tplId);
    if (!tpl) { notify("Modelo não encontrado."); return; }

    avalStepAlunoId = alunoId;
    avalStepTemplateId = tplId;
    avalStepCurrentIndex = 0;
    avalStepResponses = [];

    // Preparar questões
    if (tpl.tipo === "anamnese" && tpl.campos) {
        const allItems = [];
        tpl.campos.forEach(secao => {
            secao.itens.forEach(item => {
                allItems.push({
                    secao: secao.secao,
                    rotulo: item.rotulo,
                    chave: item.chave,
                    tipo: item.tipo,
                    valor: ''
                });
            });
        });
        avalStepQuestions = allItems;
    } else if (tpl.questoes) {
        avalStepQuestions = tpl.questoes.map((q, i) => ({
            index: i,
            texto: q,
            escala: tpl.escala || [{ valor: 0, rotulo: "Resposta" }]
        }));
    } else {
        avalStepQuestions = [];
    }

    avalStepMode = 'answering';
    avalStepResumo = '';
    renderAvaliacoes();
}

function renderAvalStepAnswer() {
    const total = avalStepQuestions.length;
    const idx = avalStepCurrentIndex;
    const q = avalStepQuestions[idx];
    if (!q || total === 0) { avalStepMode = 'done'; renderAvaliacoes(); return; }

    const isAnamnese = q.secao !== undefined;
    const pct = Math.round(((idx) / total) * 100);
    const currentValue = isAnamnese ? (avalStepResponses[idx] ?? '') : avalStepResponses[idx];
    let content = '';

    if (isAnamnese) {
        content = `
          <div class="eyebrow">${esc(q.secao)}</div>
          <div class="question">${esc(q.rotulo)}</div>
          ${q.tipo === 'textarea' ? `<textarea id="stepAnswer" class="textarea" style="min-height:140px;font-size:13px" placeholder="Preencha esta informação..."></textarea>` : `<input id="stepAnswer" class="input" type="${q.tipo === 'date' ? 'date' : 'text'}" placeholder="Preencha esta informação...">`}
        `;
    } else {
        const escala = q.escala || [{ valor: 0, rotulo: 'Resposta' }];
        content = `
          <div class="eyebrow">Questão ${idx + 1} de ${total}</div>
          <div class="question">${esc(q.texto)}</div>
          <div class="answer-grid">${escala.map(op => `<label class="${avalStepResponses[idx] === op.valor ? 'selected' : ''}" onclick="selectAvalStepOption(${idx}, ${op.valor})"><input type="radio" name="avalStepOpt" value="${op.valor}" ${avalStepResponses[idx] === op.valor ? 'checked':''} style="margin-right:7px;accent-color:var(--sage)">${esc(op.rotulo)}</label>`).join('')}</div>
        `;
    }

    document.getElementById("page-avaliacoes").innerHTML = `
      <div class="assessment-workspace">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px">
          <button class="btn btn-outline btn-sm" onclick="cancelAvalStep()"><i data-lucide="arrow-left"></i> Sair</button>
          <span style="font-size:10px;color:#909b96">${esc(getTemplateById(avalStepTemplateId)?.nome || 'Avaliação')}</span>
        </div>
        <div class="assessment-progress"><span class="text">Página ${idx+1} de ${total}</span><span class="pct">${pct}% concluído</span></div>
        <div class="assessment-track"><div class="assessment-fill" style="width:${Math.max(4,pct)}%"></div></div>
        <div class="assessment-page">
          ${content}
        </div>
        <div class="assessment-nav">
          <button class="btn btn-outline" onclick="avalStepPrev()" ${idx===0?'disabled':''}><i data-lucide="chevron-left"></i> Anterior</button>
          <span class="hint">Preencha e avance para a próxima página.</span>
          <button class="btn btn-primary" onclick="avalStepNext()">${idx===total-1?'Concluir avaliação':'Próxima página'} <i data-lucide="chevron-right"></i></button>
        </div>
      </div>
    `;
    lucide.createIcons();
    if (isAnamnese) { const el=document.getElementById('stepAnswer'); if(el) el.value=currentValue || ''; }
}

function selectAvalStepOption(idx, value) {
    avalStepResponses[idx] = value;
    renderAvalStepAnswer();
}

function avalStepPrev() {
    if (avalStepCurrentIndex > 0) {
        avalStepCurrentIndex--;
        renderAvalStepAnswer();
    }
}

function avalStepNext() {
    const idx = avalStepCurrentIndex;
    const q = avalStepQuestions[idx];
    const isAnamnese = q.secao !== undefined;

    if (isAnamnese) {
        const el = document.getElementById("stepAnswer");
        if (el) {
            avalStepResponses[idx] = el.value || '';
        }
    } else {
        if (avalStepResponses[idx] === undefined || avalStepResponses[idx] === null) {
            notify("Selecione uma opção antes de continuar.");
            return;
        }
    }

    if (idx === avalStepQuestions.length - 1) {
        // Finalizar
        avalStepMode = 'done';
        renderAvaliacoes();
    } else {
        avalStepCurrentIndex++;
        renderAvalStepAnswer();
    }
}

function renderAvalStepDone() {
    const tpl = getTemplateById(avalStepTemplateId);
    const aluno = getStudent(avalStepAlunoId);

    if (!tpl || !aluno) {
        cancelAvalStep();
        return;
    }

    // Salvar respostas
    let respostas = [];
    let questoes = [];

    if (tpl.tipo === "anamnese" && tpl.campos) {
        avalStepQuestions.forEach(q => {
            respostas.push({
                secao: q.secao,
                rotulo: q.rotulo,
                chave: q.chave,
                valor: avalStepResponses[i] || ''
            });
        });
        questoes = tpl.campos.flatMap(sec => sec.itens.map(it => it.rotulo));
    } else if (tpl.questoes) {
        avalStepQuestions.forEach((q, i) => {
            const val = avalStepResponses[i];
            const escala = q.escala || [];
            const op = escala.find(e => e.valor === val);
            respostas.push({
                questao: q.texto,
                valor: val !== undefined ? val : null,
                rotulo: op ? op.rotulo : "Sem resposta"
            });
        });
        questoes = tpl.questoes.map((q, i) => ({ id: uid(), numero: i + 1, texto: q }));
    }

    const avId = uid();
    const novaAval = {
        id: avId,
        data: today(),
        titulo: tpl.nome,
        tipo: tpl.tipo,
        objetivo: tpl.descricao,
        questoes: questoes,
        resultados: [{
            id: uid(),
            data: today(),
            respostas: respostas,
            resumo: avalStepResumo || "Avaliação concluída."
        }],
        finalizada: true
    };

    if (aluno) {
        ensureStudentModules(aluno);
        aluno.avaliacoes.push(novaAval);
        saveData().then(() => {
            notify(`Avaliação "${tpl.nome}" aplicada a ${aluno.nome} com sucesso!`);
        });
    }

    document.getElementById("page-avaliacoes").innerHTML = `
        <div class="card" style="max-width:600px;margin:40px auto;text-align:center;padding:40px">
            <div style="font-size:48px;margin-bottom:16px">✅</div>
            <div class="section-title" style="font-size:20px">Avaliação concluída!</div>
            <div class="section-sub" style="font-size:14px;margin-top:8px">${esc(tpl.nome)} aplicada a ${esc(aluno.nome)}</div>
            <div style="margin-top:20px;display:flex;gap:10px;justify-content:center;flex-wrap:wrap">
                <button class="btn btn-primary" onclick="cancelAvalStep()"><i data-lucide="check"></i>Ver avaliações</button>
                <button class="btn btn-outline" onclick="gerarPDFAvaliacao('${aluno.id}','${avId}')"><i data-lucide="file-text"></i>PDF</button>
                <button class="btn btn-soft" onclick="openStudent('${aluno.id}')">Ver prontuário</button>
            </div>
        </div>
    `;
    lucide.createIcons();
}

async function saveNewAvaliacao() {
    const titulo = document.getElementById("newAvalTitulo")?.value.trim();
    const objetivo = document.getElementById("newAvalObjetivo")?.value.trim();
    const alunoId = document.getElementById("newAvalAluno")?.value;
    const raw = document.getElementById("newAvalQuestoes")?.value || "";
    const questoes = raw.split(/\n+/).map(x => x.trim()).filter(Boolean).map((texto, i) => ({ id: uid(), numero: i + 1, texto }));

    if (!titulo) { notify("Informe o título da avaliação."); return; }
    if (!questoes.length) { notify("Escreva pelo menos uma questão."); return; }

    if (alunoId) {
        const s = getStudent(alunoId);
        if (s) {
            ensureStudentModules(s);
            s.avaliacoes.push({ id: uid(), data: today(), titulo, objetivo, tipo: "custom", questoes, resultados: [], finalizada: false });
            await saveData();
            notify(`Avaliação criada e vinculada a ${s.nome}.`);
        }
    } else {
        notify("Selecione um aluno para vincular a avaliação.");
        return;
    }
    cancelAvaliacao();
}

async function saveAvaliacaoAplicacao(tplId) {
    const tpl = getTemplateById(tplId);
    if (!tpl) { notify("Modelo não encontrado."); return; }

    const alunoId = document.getElementById("applyAvalAluno")?.value;
    if (!alunoId) { notify("Selecione o aluno avaliado."); return; }

    const s = getStudent(alunoId);
    if (!s) { notify("Aluno não encontrado."); return; }
    ensureStudentModules(s);

    const resumo = document.getElementById("applyAvalResumo")?.value.trim() || "";
    let respostas = [];
    let questoes = [];

    if (tpl.tipo === "anamnese" && tpl.campos) {
        tpl.campos.forEach(secao => {
            secao.itens.forEach(item => {
                const el = document.getElementById("anam_" + item.chave);
                respostas.push({ secao: secao.secao, rotulo: item.rotulo, chave: item.chave, valor: el?.value.trim() || "" });
            });
        });
        questoes = tpl.campos.flatMap(sec => sec.itens.map(it => it.rotulo));
    } else if (tpl.questoes) {
        tpl.questoes.forEach((q, i) => {
            const selected = document.querySelector(`input[name="q_${i}"]:checked`);
            const escala = tpl.escala || [];
            const op = selected ? escala.find(e => String(e.valor) === selected.value) : null;
            respostas.push({ questao: q, valor: selected ? Number(selected.value) : null, rotulo: op ? op.rotulo : "Sem resposta" });
        });
        questoes = tpl.questoes.map((q, i) => ({ id: uid(), numero: i + 1, texto: q }));
    }

    const avId = uid();
    const novaAval = {
        id: avId,
        data: today(),
        titulo: tpl.nome,
        tipo: tpl.tipo,
        objetivo: tpl.descricao,
        questoes,
        resultados: [{
            id: uid(),
            data: today(),
            respostas,
            resumo
        }],
        finalizada: true
    };
    s.avaliacoes.push(novaAval);

    await saveData();
    notify(`Avaliação "${tpl.nome}" aplicada a ${s.nome} com sucesso.`);
    currentAvalMode = "history";
    currentAvalId = novaAval.id;
    renderAvaliacoes();

function gerarPDFAvaliacao(alunoId, avalId) {
    const s = getStudent(alunoId);
    if (!s) return;
    const av = s.avaliacoes.find(x => x.id === avalId);
    if (!av) return;

    const doc = new window.jspdf.jsPDF({ unit: 'mm', format: 'a4' });
    const pageW = doc.internal.pageSize.getWidth();
    let y = 20;

    doc.setFont('helvetica', 'bold');
    doc.setFontSize(18);
    doc.text('ASAS - Avaliação Psicopedagógica', pageW / 2, y, { align: 'center' });
    y += 10;

    doc.setFont('helvetica', 'bold');
    doc.setFontSize(14);
    doc.text(esc(av.titulo), pageW / 2, y, { align: 'center' });
    y += 8;

    doc.setFont('helvetica', 'normal');
    doc.setFontSize(10);
    doc.text(`Aluno: ${esc(s.nome)}`, 20, y);
    y += 6;
    doc.text(`Data: ${fmtDate(av.data)}`, 20, y);
    y += 6;
    if (av.objetivo) {
        doc.text(`Objetivo: ${esc(av.objetivo)}`, 20, y);
        y += 8;
    }

    const resultado = av.resultados && av.resultados.length ? av.resultados[av.resultados.length - 1] : null;

    if (av.questoes && av.questoes.length) {
        doc.setFont('helvetica', 'bold');
        doc.text('Questões e Respostas:', 20, y);
        y += 6;
        doc.setFont('helvetica', 'normal');

        av.questoes.forEach((q, i) => {
            const resp = resultado && resultado.respostas ? resultado.respostas[i] || '' : '';
            const text = `${q.numero}. ${q.texto}\nResposta: ${resp || 'Não respondido'}`;
            const lines = doc.splitTextToSize(text, pageW - 40);
            lines.forEach(line => {
                if (y > 270) { doc.addPage(); y = 20; }
                doc.text(line, 20, y);
                y += 5;
            });
            y += 2;
        });
    }

    if (resultado && resultado.resumo) {
        y += 4;
        doc.setFont('helvetica', 'bold');
        doc.text('Resumo da Aplicação:', 20, y);
        y += 6;
        doc.setFont('helvetica', 'normal');
        const lines = doc.splitTextToSize(esc(resultado.resumo), pageW - 40);
        lines.forEach(line => {
            if (y > 270) { doc.addPage(); y = 20; }
            doc.text(line, 20, y);
            y += 5;
        });
    }

    y += 10;
    doc.setFont('helvetica', 'bold');
    doc.text('________________________________________', 40, y);
    y += 6;
    doc.text(esc(data.professor?.nome || 'Professor'), 40, y);
    y += 5;
    doc.text('Profissional Responsável', 40, y);
    y += 10;
    doc.setFontSize(8);
    doc.text(`Documento gerado em ${fmtDate(today())} - ASAS Gestão Psicopedagógica`, 20, y);

    doc.save(`avaliacao-${s.nome}-${av.titulo}.pdf`);
    notify("PDF da avaliação gerado com sucesso!");
}

function renderFinanceiro() {
    if (!isDataLoaded || !data || !data.transacoes) {
        document.getElementById("page-financeiro").innerHTML = `
            <div class="empty" style="padding:40px;text-align:center"><p>Carregando dados...</p></div>`;
        return;
    }

    const now = new Date();
    if (typeof financeYear !== "number") financeYear = now.getFullYear();
    if (typeof financeMonth !== "number") financeMonth = now.getMonth();

    const allTrans = (data.transacoes || []).filter(t => {
        const d = parseDate(t.data);
        return d.getFullYear() === financeYear && d.getMonth() === financeMonth;
    }).sort((a, b) => (b.data || '').localeCompare(a.data || ''));

    const receitas = allTrans.filter(t => (t.tipo || "receita") === "receita");
    const despesas = allTrans.filter(t => t.tipo === "despesa");

    const totalRecebido = receitas.reduce((s, t) => s + Number(t.valor || 0), 0);
    const totalDespesas = despesas.reduce((s, t) => s + Number(t.valor || 0), 0);
    const saldo = totalRecebido - totalDespesas;

    const monthAppts = activeAppointments().filter(a => {
        const d = parseDate(a.data);
        return d.getFullYear() === financeYear && d.getMonth() === financeMonth;
    }).sort((a, b) => (a.data + a.hora).localeCompare(b.data + b.hora));

    const expected = monthAppts.reduce((s, a) => s + Number(getStudent(a.alunoId)?.valor || 0), 0);
    const pending = monthAppts.filter(a => !a.pago).reduce((s, a) => s + Number(getStudent(a.alunoId)?.valor || 0), 0);
    const taxaRecebimento = expected ? Math.round(totalRecebido / expected * 100) : 0;

    const despesasPorCategoria = {};
    despesas.forEach(d => {
        const cat = d.categoria || "Outros";

    const monthLabel = new Date(financeYear, financeMonth, 1).toLocaleDateString("pt-BR", { month: "long", year: "numeric" });

    const todayISO = today();
    const calY = financeYear, calM = financeMonth;
    const firstDay = new Date(calY, calM, 1);
    const lastDay = new Date(calY, calM + 1, 0);
    let startOffset = firstDay.getDay();
    startOffset = startOffset === 0 ? 6 : startOffset - 1;
    const totalCells = Math.ceil((startOffset + lastDay.getDate()) / 7) * 7;
    const eventosDoMes = {};
    monthAppts.forEach(a => {
        if (!eventosDoMes[a.data]) eventosDoMes[a.data] = [];
        eventosDoMes[a.data].push(a);

async function saveDespesa() {
    const descricao = document.getElementById("despDescricao")?.value.trim();
    const valor = Number(document.getElementById("despValor")?.value) || 0;
    const dataVal = document.getElementById("despData")?.value || today();
    const categoria = document.getElementById("despCategoria")?.value || "Outros";

    if (!descricao) { notify("Descreva a despesa."); return; }
    if (valor <= 0) { notify("Informe um valor válido."); return; }

    if (!data.transacoes) data.transacoes = [];
    data.transacoes.push({
        id: uid(),
        data: dataVal,
        agendaId: null,
        alunoId: null,
        descricao,
        valor,
        tipo: "despesa",
        categoria
    });
    await saveData();
    notify("Despesa registrada.");
    renderFinanceiro();
}

    await deleteTransacaoDB(id);
    await saveData();
    notify("Despesa removida.");
    renderFinanceiro();
}

// ============================================================
// FUNÇÕES PARA NÚMEROS POR EXTENSO
// ============================================================

function numeroPorExtensoSimples(n) {
    const unidades = ['', 'um', 'dois', 'três', 'quatro', 'cinco', 'seis', 'sete', 'oito', 'nove'];
    const especiais = ['dez', 'onze', 'doze', 'treze', 'quatorze', 'quinze', 'dezesseis', 'dezessete', 'dezoito', 'dezenove'];
    const dezenas = ['', '', 'vinte', 'trinta', 'quarenta', 'cinquenta', 'sessenta', 'setenta', 'oitenta', 'noventa'];
    const centenas = ['', 'cento', 'duzentos', 'trezentos', 'quatrocentos', 'quinhentos', 'seiscentos', 'setecentos', 'oitocentos', 'novecentos'];

    if (n === 0) return '';
    if (n < 10) return unidades[n];
    if (n < 20) return especiais[n - 10];
    if (n < 100) {
        const d = Math.floor(n / 10);
        const u = n % 10;
        return dezenas[d] + (u > 0 ? ` e ${numeroPorExtensoSimples(u)}` : '');
    }
    if (n === 100) return 'cem';
    if (n < 1000) {
        const c = Math.floor(n / 100);
        const r = n % 100;
        return centenas[c] + (r > 0 ? ` e ${numeroPorExtensoSimples(r)}` : '');
    }
    if (n < 1000000) {
        const mil = Math.floor(n / 1000);
        const r = n % 1000;
        let txt = mil === 1 ? 'mil' : `${numeroPorExtensoSimples(mil)} mil`;
        if (r > 0) txt += r < 100 ? ` e ${numeroPorExtensoSimples(r)}` : ` ${numeroPorExtensoSimples(r)}`;
        return txt;
    }
    return String(n);
}

function numeroPorExtenso(valor) {
    const inteiro = Math.floor(valor);
    const centavos = Math.round((valor - inteiro) * 100);

    if (inteiro === 0 && centavos === 0) return 'Zero reais';

    let texto = '';
    if (inteiro > 0) {
        texto = numeroPorExtensoSimples(inteiro);
        texto += inteiro === 1 ? ' real' : ' reais';
    }
    if (centavos > 0) {
        if (inteiro > 0) texto += ' e ';
        texto += numeroPorExtensoSimples(centavos);
        texto += centavos === 1 ? ' centavo' : ' centavos';
    }

    return texto.charAt(0).toUpperCase() + texto.slice(1);
}
