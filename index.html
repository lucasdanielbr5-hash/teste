function renderFinanceiro() {
    if (!isDataLoaded || !data || !data.transacoes) {
        document.getElementById("page-financeiro").innerHTML = `
            <div class="empty" style="padding:40px;text-align:center"><p>Carregando dados...</p></div>`;
        return;
    }

    const now = new Date();
    if (typeof financeYear !== "number") financeYear = now.getFullYear();
    if (typeof financeMonth !== "number") financeMonth = now.getMonth();

    const allTrans = (data.transacoes || []).filter(t => {
        const d = parseDate(t.data);
        return d.getFullYear() === financeYear && d.getMonth() === financeMonth;
    }).sort((a, b) => (b.data || '').localeCompare(a.data || ''));

    const receitas = allTrans.filter(t => (t.tipo || "receita") === "receita");
    const despesas = allTrans.filter(t => t.tipo === "despesa");

    const totalRecebido = receitas.reduce((s, t) => s + Number(t.valor || 0), 0);
    const totalDespesas = despesas.reduce((s, t) => s + Number(t.valor || 0), 0);
    const saldo = totalRecebido - totalDespesas;

    const monthAppts = activeAppointments().filter(a => {
        const d = parseDate(a.data);
        return d.getFullYear() === financeYear && d.getMonth() === financeMonth;
    }).sort((a, b) => (a.data + a.hora).localeCompare(b.data + b.hora));

    const expected = monthAppts.reduce((s, a) => s + Number(getStudent(a.alunoId)?.valor || 0), 0);
    const pending = monthAppts.filter(a => !a.pago).reduce((s, a) => s + Number(getStudent(a.alunoId)?.valor || 0), 0);
    const taxaRecebimento = expected ? Math.round(totalRecebido / expected * 100) : 0;

    const despesasPorCategoria = {};
    despesas.forEach(d => {
        const cat = d.categoria || "Outros";
        if (!despesasPorCategoria[cat]) despesasPorCategoria[cat] = 0;
        despesasPorCategoria[cat] += Number(d.valor || 0);
    });

    const rows = studentPager(receitas, financePage || 1, 10, "setFinancePage");
    const monthLabel = new Date(financeYear, financeMonth, 1).toLocaleDateString("pt-BR", { month: "long", year: "numeric" });

    const todayISO = today();
    const calY = financeYear, calM = financeMonth;
    const firstDay = new Date(calY, calM, 1);
    const lastDay = new Date(calY, calM + 1, 0);
    let startOffset = firstDay.getDay();
    startOffset = startOffset === 0 ? 6 : startOffset - 1;
    const totalCells = Math.ceil((startOffset + lastDay.getDate()) / 7) * 7;
    const eventosDoMes = {};
    monthAppts.forEach(a => {
        if (!eventosDoMes[a.data]) eventosDoMes[a.data] = [];
        eventosDoMes[a.data].push(a);
    });

    let miniCalHtml = '<div class="mini-cal-grid">';
    ["S","T","Q","Q","S","S","D"].forEach(d => { miniCalHtml += `<div class="mini-cal-dow">${d}</div>`; });
    for (let i = 0; i < totalCells; i++) {
        const dayNum = i - startOffset + 1;
        const d = new Date(calY, calM, dayNum);
        const inMonth = d.getMonth() === calM;
        const iso = dateISO(d);
        const isToday = iso === todayISO;
        const eventos = eventosDoMes[iso] || [];
        const hasEvent = eventos.length > 0;
        const allPaid = hasEvent && eventos.every(e => e.pago);
        const cls = (inMonth ? "" : "other") + (isToday ? " today" : "") + (hasEvent ? " has-event" : "") + (hasEvent && allPaid ? " paid" : "") + (hasEvent && !allPaid ? " pending" : "");
        miniCalHtml += `<div class="mini-cal-day ${cls}" title="${hasEvent ? eventos.length + ' atendimento(s)' : ''}">${inMonth ? d.getDate() : ""}</div>`;
    }
    miniCalHtml += '</div>';

    const atendimentosPagos = monthAppts.filter(a => a.pago).length;
    const atendimentosPendentes = monthAppts.filter(a => !a.pago).length;

    document.getElementById("page-financeiro").innerHTML = `
        ${renderHelpBox("financeiro")}

        <div class="page-intro">
            <div class="page-intro-copy">
                <h1>Financeiro</h1>
                <p>Acompanhe recebimentos, pendências e despesas por mês para ter uma visão clara do seu negócio.</p>
            </div>
            <div class="page-intro-actions">
                <button class="btn btn-blue btn-sm" onclick="generateFinancePDF()"><i data-lucide="file-down"></i>PDF do período</button>
                
            </div>
        </div>

        <div class="card" style="margin-bottom:16px">
            <div style="display:flex;align-items:center;justify-content:space-between;gap:10px">
                <button class="btn btn-outline btn-sm" onclick="changeFinanceMonth(-1)">‹</button>
                <div style="text-align:center"><div class="section-title" style="text-transform:capitalize">${monthLabel}</div><div class="section-sub">Período selecionado</div></div>
                <button class="btn btn-outline btn-sm" onclick="changeFinanceMonth(1)">›</button>
            </div>
        </div>

        <div class="finance-layout">
            <div>
                <div class="grid stats" style="grid-template-columns:repeat(4,minmax(0,1fr))">
                    <div class="card" style="border-left:3px solid var(--sage)"><div class="stat-label">Saldo do mês</div><div class="stat-value" style="color:${saldo >= 0 ? 'var(--sage)' : '#c0504d'}">${money(saldo)}</div><div class="stat-sub">Recebido - Despesas</div></div>
                    <div class="card"><div class="stat-label">Recebido</div><div class="stat-value">${money(totalRecebido)}</div><div class="stat-sub">Entradas do período</div></div>
                    <div class="card"><div class="stat-label">Despesas</div><div class="stat-value" style="color:#c0504d">${money(totalDespesas)}</div><div class="stat-sub">Saídas do período</div></div>
                    <div class="card"><div class="stat-label">A receber</div><div class="stat-value">${money(pending)}</div><div class="stat-sub">Pendências</div></div>
                </div>

                <div class="card" style="margin-top:18px;display:none" id="despesaFormCard">
                    <div class="section-head"><div><div class="section-title">Nova Despesa</div><div class="section-sub">Registre uma saída financeira.</div></div>

                        <div class="field"><label class="label">Categoria</label><select id="despCategoria" class="select">
                            <option>Material didático</option>
                            <option>Aluguel / Espaço</option>

                        </select></div>
                    </div>
                    <button class="btn btn-primary" onclick="saveDespesa()"><i data-lucide="minus-circle"></i>Registrar despesa</button>
                </div>

// FUNÇÕES PARA NÚMEROS POR EXTENSO
// ============================================================

function numeroPorExtensoSimples(n) {
    const unidades = ['', 'um', 'dois', 'três', 'quatro', 'cinco', 'seis', 'sete', 'oito', 'nove'];
    const especiais = ['dez', 'onze', 'doze', 'treze', 'quatorze', 'quinze', 'dezesseis', 'dezessete', 'dezoito', 'dezenove'];
    const dezenas = ['', '', 'vinte', 'trinta', 'quarenta', 'cinquenta', 'sessenta', 'setenta', 'oitenta', 'noventa'];
    const centenas = ['', 'cento', 'duzentos', 'trezentos', 'quatrocentos', 'quinhentos', 'seiscentos', 'setecentos', 'oitocentos', 'novecentos'];

    if (n === 0) return '';
    if (n < 10) return unidades[n];
    if (n < 20) return especiais[n - 10];
    if (n < 100) {
        const d = Math.floor(n / 10);
        const u = n % 10;
        return dezenas[d] + (u > 0 ? ` e ${numeroPorExtensoSimples(u)}` : '');
    }
    if (n === 100) return 'cem';
    if (n < 1000) {
        const c = Math.floor(n / 100);
        const r = n % 100;
        return centenas[c] + (r > 0 ? ` e ${numeroPorExtensoSimples(r)}` : '');
    }
    if (n < 1000000) {
        const mil = Math.floor(n / 1000);
        const r = n % 1000;
        let txt = mil === 1 ? 'mil' : `${numeroPorExtensoSimples(mil)} mil`;
        if (r > 0) txt += r < 100 ? ` e ${numeroPorExtensoSimples(r)}` : ` ${numeroPorExtensoSimples(r)}`;
        return txt;
    }
    return String(n);
}

function numeroPorExtenso(valor) {
    const inteiro = Math.floor(valor);
    const centavos = Math.round((valor - inteiro) * 100);

    if (inteiro === 0 && centavos === 0) return 'Zero reais';

    let texto = '';
    if (inteiro > 0) {
        texto = numeroPorExtensoSimples(inteiro);
        texto += inteiro === 1 ? ' real' : ' reais';
    }
    if (centavos > 0) {
        if (inteiro > 0) texto += ' e ';
        texto += numeroPorExtensoSimples(centavos);
        texto += centavos === 1 ? ' centavo' : ' centavos';
    }

    return texto.charAt(0).toUpperCase() + texto.slice(1);
}

function gerarReciboSide() {
    const alunoId = document.getElementById("reciboAlunoSide")?.value;
    if (!alunoId) { notify("Selecione um aluno."); return; }
    const aluno = getStudent(alunoId);
    if (!aluno) { notify("Aluno não encontrado."); return; }

    const mes = new Date().getMonth() + 1;
    const ano = new Date().getFullYear();

    const transacoes = (data.transacoes || []).filter(t => {
        const d = parseDate(t.data);
        return t.alunoId === alunoId && d.getMonth() + 1 === mes && d.getFullYear() === ano && (t.tipo || "receita") === "receita";
    });

    if (!transacoes.length) {
        notify("Nenhum pagamento encontrado para este mês.");
        return;
    }

    const total = transacoes.reduce((s, t) => s + Number(t.valor), 0);
    const mesNome = ['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'][mes - 1];

    const doc = new window.jspdf.jsPDF({ unit: 'mm', format: 'a4' });
    const pageW = doc.internal.pageSize.getWidth();
    let y = 25;

    doc.setFont('helvetica', 'bold');
    doc.setFontSize(20);
    doc.text('RECIBO DE PAGAMENTO', pageW / 2, y, { align: 'center' });
    y += 12;

    doc.setFont('helvetica', 'normal');
    doc.setFontSize(11);
    doc.text(`Nº: ${String(Date.now()).slice(-6)}`, 20, y);
    doc.text(`Data: ${fmtDate(today())}`, pageW - 50, y);
    y += 10;

    doc.setFont('helvetica', 'bold');
    doc.setFontSize(14);
    doc.text('INSTITUIÇÃO ASAS', 20, y);
    y += 8;

    doc.setFont('helvetica', 'normal');
    doc.setFontSize(11);
    doc.text(`Recebi(emos) de ${esc(aluno.responsavel || 'Responsável')}`, 20, y);
    y += 7;
    const linhasValor = doc.splitTextToSize(`a importância de ${money(total)} (${numeroPorExtenso(total)})`, pageW - 40);
    linhasValor.forEach(l => { doc.text(l, 20, y); y += 6; });
    const linhasRef = doc.splitTextToSize(`referente a ${transacoes.length} sessão(ões) de acompanhamento do(a) aluno(a) ${esc(aluno.nome)} no período de ${mesNome}/${ano}.`, pageW - 40);
    linhasRef.forEach(l => { doc.text(l, 20, y); y += 6; });
    y += 10;

    doc.text('________________________________________', 40, y);
    y += 5;
    doc.text(esc(data.professor?.nome || 'Professor'), 40, y);
    y += 5;
    doc.text('Profissional Responsável', 40, y);
    y += 15;

    doc.setFontSize(8);
    doc.text('Este recibo serve como comprovante de pagamento para fins educacionais e fiscais.', 20, y);

    doc.save(`recibo-${aluno.nome}-${mesNome}-${ano}.pdf`);
    notify("Recibo gerado com sucesso!");
}

      <div class="profile-stats-grid" style="margin-top:18px">

        <div class="stat-card"><div class="icon">🧠</div><div class="number">${totalAvaliacoes}</div><div class="label">Aplicações</div></div>
        <div class="stat-card"><div class="icon">💰</div><div class="number" style="font-size:22px">${money(receivedMonth)}</div><div class="label">Recebido no mês</div></div>
      </div>

    p.configuracoes = p.configuracoes || {};
    p.configuracoes.notificacoes = document.getElementById("cfgNotif").checked;
    p.configuracoes.lembretes = document.getElementById("cfgLembretes").checked;

    await saveData();
    updateUser();
    notify("Perfil salvo com sucesso.");
    renderPerfil();
}

// ============================================================
// PDF (Relatórios)
// ============================================================

function pdfSafe(v) { return String(v ?? "").replace(/[\r\n]+/g, " ").trim(); }

function pdfInstance() {
    if (!window.jspdf || !window.jspdf.jsPDF) { notify("A biblioteca de PDF não foi carregada."); return null; }
    return new window.jspdf.jsPDF({ unit: "mm", format: "a4" });
}

function pdfText(doc, text, x, y, maxWidth, lineHeight = 5) {
    const lines = doc.splitTextToSize(pdfSafe(text), maxWidth);
    lines.forEach(line => { if (y > 280) { doc.addPage(); y = 18; } doc.text(line, x, y); y += lineHeight; });
    return y;
}

function generateStudentPDF(id) {
    const s = getStudent(id);
    if (!s) return;
    ensureStudentModules(s);

    const doc = pdfInstance();
    if (!doc) return;
    const pageW = doc.internal.pageSize.getWidth();
    let y = 18;

    const heading = (title, size = 12) => {
        if (y > 270) { doc.addPage(); y = 18; }
        doc.setFont("helvetica", "bold");
        doc.setFontSize(size);
        doc.text(pdfSafe(title), 15, y);
        y += 6;
        doc.setFont("helvetica", "normal");
        doc.setFontSize(10);
    };
    const para = (value) => {
        y = pdfText(doc, String(value || "Não informado"), 15, y, pageW - 30);
        y += 4;
    };

    doc.setFont("helvetica", "bold");
    doc.setFontSize(18);
    doc.text("ASAS", 15, y);
    y += 8;
    doc.setFontSize(14);
    doc.text("Relatório clínico e pedagógico", 15, y);
    y += 8;
    doc.setFont("helvetica", "normal");
    doc.setFontSize(9);
    doc.text(`Gerado em ${fmtDate(today())}`, 15, y);
    y += 9;
    doc.setFont("helvetica", "bold");
    doc.setFontSize(13);
    doc.text(pdfSafe(s.nome), 15, y);
    y += 7;
    doc.setFont("helvetica", "normal");
    doc.setFontSize(10);
    para(`Idade: ${s.idade || "Não informada"} · Série/Ano: ${s.serie || "Não informado"}`);
    para(`Responsável: ${s.responsavel || "Não informado"}`);
    if ((s.tags || []).length) para(`Marcadores: ${s.tags.join(", ")}`);

    heading("Observações gerais");
    para(s.observacoes || "Nenhuma observação registrada.");

    heading("Histórico de evolução");
    const evs = (s.evolucoes || []).slice().sort((a, b) => (a.data || '').localeCompare(b.data || ''));
    if (!evs.length) para("Nenhuma evolução registrada.");
    evs.forEach(e => {
        heading(`${fmtDate(e.data)} · ${e.titulo || "Registro"}`, 10);
        para(e.texto);
    });

    heading("Comportamento observado nas consultas");
    const br = s.consultas.slice().sort((a, b) => (a.data || '').localeCompare(b.data || ''));
    if (!br.length) para("Nenhum registro de comportamento.");
    br.forEach(r => {
        heading(`Consulta de ${fmtDate(r.data)}`, 10);
        const labels = { participacao: "Participação", atencao: "Atenção", comunicacao: "Comunicação", autonomia: "Autonomia", comportamento: "Comportamento", emocional: "Aspecto emocional" };
        Object.entries(r.comportamentos || {}).forEach(([k, v]) => para(`${labels[k] || k}: ${v}`));
        if (r.observacoes) para(r.observacoes);
    });

    heading("Avaliações e atividades");
    const avs = s.avaliacoes || [];
    if (!avs.length) para("Nenhuma avaliação registrada.");
    avs.forEach(a => {
        heading(`${a.titulo} · ${fmtDate(a.data)}`, 10);
        if (a.objetivo) para(`Objetivo: ${a.objetivo}`);
        (a.resultados || []).forEach(r => {
            if (y > 260) { doc.addPage(); y = 18; }
            doc.setFont("helvetica", "bold");
            doc.setFontSize(9);
            doc.text(`Aplicação — ${fmtDate(r.data)}`, 15, y);
            y += 5;
            (a.questoes || []).forEach((q, i) => para(`${q.numero}. ${q.texto}\nResposta: ${r.respostas?.[i] || ""}`));
            if (r.resumo) para(`Resumo: ${r.resumo}`);
        });
    });

    heading("Informações recebidas da escola");
    if (s.escola.nome) para(`Escola: ${s.escola.nome}`);
    if (s.escola.professores) para(`Equipe/professora: ${s.escola.professores}`);
    const school = s.escola.registros.slice().sort((a, b) => (a.data || '').localeCompare(b.data || ''));
    if (!school.length) para("Nenhum contato com a escola registrado.");
    school.forEach(r => {
        heading(`${fmtDate(r.data)} · ${r.tipo || "Contato"} · ${r.assunto || "Registro escolar"}`, 10);
        para(`Contato: ${r.contato || "Não informado"}`);
        para(r.relato);
    });

    const safeName = (s.nome || "aluno").replace(/[^a-z0-9à-ÿ]+/gi, "-").replace(/^-|-$/g, "");
    doc.save(`relatorio-clinico-${safeName || "aluno"}.pdf`);
    notify("Relatório clínico e pedagógico salvo em PDF.");
}

function generateFinancePDF() {
    const doc = pdfInstance();
    if (!doc) return;
    const year = financeYear, m = financeMonth;

    const monthTx = (data.transacoes || []).filter(t => {
        const d = parseDate(t.data);
        return d.getFullYear() === year && d.getMonth() === m;
    }).sort((a, b) => (b.data || '').localeCompare(a.data || ''));

    const monthAppts = activeAppointments().filter(a => {
        const d = parseDate(a.data);
        return d.getFullYear() === year && d.getMonth() === m;
    }).sort((a, b) => (a.data + a.hora).localeCompare(b.data + b.hora));

    const received = monthTx.reduce((sum, t) => sum + Number(t.valor || 0), 0);
    const expected = monthAppts.reduce((sum, a) => sum + Number(getStudent(a.alunoId)?.valor || 0), 0);
    const pending = monthAppts.filter(a => !a.pago).reduce((sum, a) => sum + Number(getStudent(a.alunoId)?.valor || 0), 0);

    const pageW = doc.internal.pageSize.getWidth();
    let cursor = 18;

    doc.setFont("helvetica", "bold");
    doc.setFontSize(18);
    doc.text("ASAS", 15, cursor);
    cursor += 8;
    doc.setFontSize(14);
    doc.text(`Relatório financeiro — ${new Date(year, m, 1).toLocaleDateString("pt-BR", { month: "long", year: "numeric" })}`, 15, cursor);
    cursor += 8;
    doc.setFont("helvetica", "normal");
    doc.setFontSize(10);
    cursor = pdfText(doc, `Gerado em ${fmtDate(today())}`, 15, cursor, pageW - 30);
    cursor += 4;
    doc.setFont("helvetica", "bold");
    doc.text("Resumo", 15, cursor);
    cursor += 6;
    doc.setFont("helvetica", "normal");
    cursor = pdfText(doc, `Recebido: ${money(received)} · Previsto: ${money(expected)} · Pendente: ${money(pending)}`, 15, cursor, pageW - 30);
    cursor += 6;
    doc.setFont("helvetica", "bold");
    doc.text("Recebimentos confirmados", 15, cursor);
    cursor += 6;
    doc.setFont("helvetica", "normal");
    if (!monthTx.length) cursor = pdfText(doc, "Nenhum recebimento confirmado neste mês.", 15, cursor, pageW - 30);
    monthTx.forEach(t => {
        const st = getStudent(t.alunoId);
        cursor = pdfText(doc, `${fmtDate(t.data)} · ${st?.nome || "Aluno removido"} · ${t.descricao || "Recebimento"} · ${money(t.valor)} · Recebido`, 15, cursor, pageW - 30);
    });
    if (cursor > 260) { doc.addPage(); cursor = 18; }
    cursor += 5;
    doc.setFont("helvetica", "bold");
    doc.text("Pendências do mês", 15, cursor);
    cursor += 6;
    doc.setFont("helvetica", "normal");
    const pendingRows = monthAppts.filter(a => !a.pago);
    if (!pendingRows.length) cursor = pdfText(doc, "Nenhuma pendência no mês.", 15, cursor, pageW - 30);
    pendingRows.forEach(a => {
        const st = getStudent(a.alunoId);
        cursor = pdfText(doc, `${fmtDate(a.data)} ${a.hora} · ${st?.nome || "Aluno removido"} · ${money(st?.valor || 0)} · Pendente`, 15, cursor, pageW - 30);
    });
    if (cursor > 260) { doc.addPage(); cursor = 18; }
    cursor += 5;
    doc.setFont("helvetica", "bold");
    doc.text("Histórico financeiro do mês", 15, cursor);
    cursor += 6;
    doc.setFont("helvetica", "normal");
    monthAppts.forEach(a => {
        const st = getStudent(a.alunoId);
        cursor = pdfText(doc, `${fmtDate(a.data)} ${a.hora} · ${st?.nome || "Aluno removido"} · ${money(st?.valor || 0)} · ${a.pago ? "Pago" : "Pendente"}`, 15, cursor, pageW - 30);
    });

    doc.save(`relatorio-financeiro-${year}-${String(m + 1).padStart(2, "0")}.pdf`);
    notify("Relatório financeiro do mês salvo em PDF.");
}

async function init() {
    lucide.createIcons();

    const isLoggedIn = await checkSession();

    if (isLoggedIn) {
        const loadedData = await loadData();
        if (loadedData) {
            data = loadedData;
            data.session = true;
            isDataLoaded = true;
        } else {
            data = defaultData();
        }

        document.getElementById("loginScreen").style.display = "none";
        document.getElementById("app").style.display = "flex";
        updateUser();
        navigate("dashboard");
        if (isDataLoaded) notify("Bem-vindo de volta!");
    } else {
        document.getElementById("loginScreen").style.display = "grid";
        document.getElementById("app").style.display = "none";
        isDataLoaded = false;
    }
}
