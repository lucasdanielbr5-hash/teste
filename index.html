<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Legado Que Ensina · Gestão Psicopedagógica</title>
<link rel="icon" type="image/png" href="https://i.imgur.com/AUoGLEq.png">
<link href="https://cdn.jsdelivr.net/npm/tailwindcss@3.4.1/dist/tailwind.min.css" rel="stylesheet">
<script src="https://unpkg.com/lucide@latest"></script>
<script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;font-family:Inter,sans-serif;background:#f7f9f8;color:#263238}
body{overflow:hidden}
button,input,select,textarea{font-family:inherit}
button{cursor:pointer}
::-webkit-scrollbar{width:7px;height:7px}
::-webkit-scrollbar-thumb{background:#cbd5d1;border-radius:20px}
::-webkit-scrollbar-track{background:transparent}
:root{--sage:#5f8f7a;--sage-dark:#477363;--sage-light:#eaf3ee;--blue:#6288a8;--blue-light:#edf4f8;--ink:#263238;--muted:#718096;--line:#e6ece9;--surface:#fff}
@keyframes fadeIn{from{opacity:0;transform:translateY(15px)}to{opacity:1;transform:translateY(0)}}
@keyframes slideIn{from{opacity:0;transform:translateX(-20px)}to{opacity:1;transform:translateX(0)}}
@keyframes slideUp{from{opacity:0;transform:translateY(30px)}to{opacity:1;transform:translateY(0)}}
@keyframes pulse{0%{transform:scale(1)}50%{transform:scale(1.02)}100%{transform:scale(1)}}
@keyframes fade{from{opacity:.3;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes loginEnter{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.card-animated{animation:fadeIn 0.4s ease forwards;opacity:0}
.stat-animated{animation:slideUp 0.5s ease forwards;opacity:0}
.btn-hover{transition:all 0.25s ease}
.btn-hover:hover{transform:translateY(-2px);box-shadow:0 4px 12px rgba(0,0,0,.06)}
.app{height:100vh;display:flex}
.sidebar{width:218px;background:#fff;border-right:1px solid var(--line);display:flex;flex-direction:column;padding:20px 14px;flex-shrink:0;z-index:20;overflow-y:auto}
.brand{height:52px;display:flex;align-items:center;gap:12px;color:var(--sage-dark);font-weight:700;padding:0 10px;white-space:nowrap;flex-shrink:0}
.brand-mark{width:36px;height:36px;border-radius:12px;overflow:hidden;flex-shrink:0}
.brand-mark img{width:100%;height:100%;object-fit:contain}
.brand-text{display:flex;flex-direction:column;line-height:1.2}
.brand-text .main{font-size:14px;font-weight:700;color:var(--sage-dark)}
.brand-text .sub{font-size:8px;color:#8a9892;letter-spacing:.03em}
.nav{margin-top:22px;display:flex;flex-direction:column;gap:2px}
.nav button{border:0;background:transparent;color:#718096;border-radius:12px;min-height:44px;padding:0 14px;display:flex;align-items:center;gap:13px;font-size:13px;font-weight:500;text-align:left;position:relative;transition:all .2s}
.nav button:hover{background:#f3f6f5;color:var(--ink)}
.nav button.active{background:var(--sage-light);color:var(--sage-dark);font-weight:600}
.nav svg{width:20px;min-width:20px}
.nav-badge{position:absolute;right:12px;top:50%;transform:translateY(-50%);background:#b85b5b;color:#fff;font-size:10px;font-weight:700;min-width:20px;height:20px;border-radius:10px;display:none;align-items:center;justify-content:center;padding:0 5px}
.side-bottom{margin-top:auto}
.main{min-width:0;flex:1;height:100vh;display:flex;flex-direction:column}
.topbar{height:72px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 30px;flex-shrink:0}
.page-title{display:flex;align-items:center;gap:10px;font-size:18px;font-weight:600}
.page-title svg{color:var(--sage);width:20px}
.user-mini{display:flex;align-items:center;gap:10px}
.avatar{width:38px;height:38px;border-radius:50%;background:var(--sage-light);color:var(--sage-dark);display:grid;place-items:center;font-weight:700;overflow:hidden;background-size:cover;background-position:center}
.content{padding:26px 30px 40px;overflow:auto;height:calc(100vh - 72px)}
.view{display:none;animation:fade .3s ease}
.view.active{display:block}
.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:20px;box-shadow:0 2px 8px rgba(30,50,40,.025);transition:all .25s}
.card:hover{box-shadow:0 6px 20px rgba(30,50,40,.06)}
.grid{display:grid;gap:16px}
.stats{grid-template-columns:repeat(4,minmax(0,1fr))}
.stat-label{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:#91a09a;font-weight:600}
.stat-value{font-size:25px;font-weight:700;margin-top:8px;color:#263238}
.stat-sub{font-size:11px;color:#8a9892;margin-top:5px}
.btn{border:0;border-radius:11px;padding:9px 15px;font-size:13px;font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:7px;transition:all .25s}
.btn svg{width:16px}
.btn-primary{background:var(--sage);color:#fff}
.btn-primary:hover{background:var(--sage-dark);transform:translateY(-2px)}
.btn-soft{background:var(--sage-light);color:var(--sage-dark)}
.btn-soft:hover{background:#d5e8df;transform:translateY(-2px)}
.btn-blue{background:var(--blue-light);color:#557994}
.btn-blue:hover{background:#d5e4ee;transform:translateY(-2px)}
.btn-danger{background:#fff0f0;color:#b85b5b}
.btn-danger:hover{background:#fdd;transform:translateY(-2px)}
.btn-outline{background:#fff;border:1px solid var(--line);color:#53615c}
.btn-outline:hover{background:#f7faf8;transform:translateY(-2px)}
.btn-outline:disabled{opacity:.5;cursor:not-allowed;transform:none}
.btn-sm{padding:7px 10px;font-size:12px}
.input,.select,.textarea{width:100%;border:1px solid #dfe7e3;background:#fbfcfc;border-radius:10px;padding:9px 11px;outline:0;font-size:13px;color:var(--ink)}
.input:focus,.select:focus,.textarea:focus{border-color:#8eb2a3;box-shadow:0 0 0 3px rgba(95,143,122,.09)}
.textarea{resize:vertical;min-height:100px}
.label{display:block;font-size:11px;font-weight:600;color:#66756f;margin-bottom:5px}
.field{margin-bottom:13px}
.form-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.form-grid.two{grid-template-columns:repeat(2,minmax(0,1fr))}
.form-actions{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap}
.section-head{display:flex;align-items:center;justify-content:space-between;gap:15px;margin-bottom:16px}
.section-title{font-size:15px;font-weight:700;color:#34413c}
.section-sub{font-size:12px;color:#89968f;margin-top:3px}
.dash-hero{background:linear-gradient(135deg,#fff,#f3f8f5);border:1px solid var(--line);border-radius:24px;padding:28px 30px;margin-bottom:20px;display:flex;justify-content:space-between;align-items:flex-start;gap:20px;flex-wrap:wrap}
.dash-hero .greeting{font-size:24px;font-weight:800;letter-spacing:-.03em;color:#263832;margin:0}
.dash-hero .greeting span{color:var(--sage)}
.dash-hero .subtitle{font-size:13px;color:#74827c;margin:6px 0 0}
.dash-hero .badges{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.dash-stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:20px}
.dash-stat{background:#fff;border:1px solid var(--line);border-radius:18px;padding:18px 20px;position:relative}
.dash-stat:hover{transform:translateY(-2px);box-shadow:0 4px 12px rgba(0,0,0,.06)}
.dash-stat .ds-label{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:#91a09a;font-weight:700}
.dash-stat .ds-value{font-size:26px;font-weight:800;color:#263238;margin-top:6px}
.dash-stat .ds-sub{font-size:11px;color:#9aa6a1;margin-top:4px}
.dash-stat .ds-icon{position:absolute;top:16px;right:18px;width:36px;height:36px;border-radius:10px;display:grid;place-items:center;background:#f4f8f6;color:var(--sage)}
.dash-stat.blue .ds-icon{background:#edf4f8;color:var(--blue)}
.dash-stat.amber .ds-icon{background:#fff8ef;color:#b8732a}
.dash-stat.rose .ds-icon{background:#fff0f0;color:#b85b5b}
.dash-grid{display:grid;grid-template-columns:1.5fr 1fr;gap:18px}
.dash-card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:20px}
.dash-card .dc-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
.dash-card .dc-title{font-size:14px;font-weight:700;color:#34413c}
.dash-card .dc-sub{font-size:11px;color:#8a9892;margin-top:2px}
.today-list{display:flex;flex-direction:column;gap:8px}
.today-item{display:flex;align-items:center;gap:12px;padding:12px 14px;border:1px solid var(--line);border-radius:14px;cursor:pointer;background:#fff}
.today-item:hover{border-color:#c8ddd3;background:#fafcfb}
.today-item .ti-time{font-size:12px;font-weight:800;color:var(--sage-dark);min-width:44px}
.today-item .ti-info{flex:1}
.today-item .ti-name{font-size:13px;font-weight:700;color:#2e3d37}
.today-item .ti-type{font-size:10px;color:#8a9892;margin-top:1px}
.today-item .ti-actions{display:flex;gap:5px}
.workload-card{background:linear-gradient(135deg,#fff,#f8fbf9);border:1px solid var(--line);border-radius:18px;padding:20px}
.workload-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
.workload-header .wl-title{font-size:14px;font-weight:700;color:#34413c}
.workload-header .wl-percent{font-size:26px;font-weight:800;color:var(--sage)}
.workload-bar{height:10px;border-radius:10px;background:#edf1ef;overflow:hidden;display:flex}
.workload-segment{height:100%;transition:width .8s ease}
.workload-segment.occupied{background:linear-gradient(90deg,var(--sage),var(--sage-dark))}
.workload-segment.available{background:#d4e6dc}
.workload-legend{display:flex;gap:16px;margin-top:12px;font-size:11px;color:#8a9892}
.workload-legend span{display:flex;align-items:center;gap:5px}
.workload-legend .dot{width:10px;height:10px;border-radius:3px}
.workload-legend .dot.occ{background:var(--sage)}
.workload-legend .dot.avail{background:#d4e6dc}
.month-summary{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.ms-item{padding:14px;background:#f8faf9;border-radius:12px;text-align:center}
.ms-item .ms-label{font-size:10px;color:#89968f;text-transform:uppercase;font-weight:600}
.ms-item .ms-value{font-size:20px;font-weight:800;color:#34413c;margin-top:5px}
.agenda-toolbar{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:16px}
.toolbar-group{display:flex;gap:5px;align-items:center}
.month-label{font-size:15px;font-weight:700;min-width:140px;text-align:center;color:#34413c}
.week-grid{display:grid;grid-template-columns:60px repeat(5,minmax(100px,1fr));min-width:560px}
.week-head{background:#fafcfb;border-bottom:1px solid var(--line);padding:8px 4px;text-align:center;font-size:10px;font-weight:700;color:#68766f}
.time-cell{height:50px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);padding:4px 6px;font-size:9px;color:#97a39e;text-align:right}
.slot{height:50px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);padding:3px;background:#fff;cursor:pointer}
.slot:hover{background:#f8fbf9}
.slot .empty-slot{height:100%;display:grid;place-items:center;color:#d0d8d4;font-size:14px;opacity:0}
.slot:hover .empty-slot{opacity:1}
.event{padding:4px 6px;border-radius:7px;font-size:9px;line-height:1.25;cursor:pointer;overflow:hidden}
.event.psico{background:#edf4f8;color:#557792}
.event.psicopeg{background:#f0f5ec;color:#5d806c}
.event.aula{background:#f5f0f8;color:#80678c}
.event strong{display:block;font-size:9px;margin-bottom:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.event-actions{display:flex;gap:2px;margin-top:3px}
.event-actions button{border:0;background:rgba(255,255,255,.7);border-radius:4px;padding:1px 4px;font-size:8px;cursor:pointer}
.month-grid{display:grid;grid-template-columns:repeat(7,1fr);border:1px solid var(--line);border-radius:14px;overflow:hidden;background:#fff}
.month-day{min-height:72px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);padding:5px;cursor:pointer}
.month-day:hover{background:#fafcfb}
.month-day.other{background:#fafafa;color:#b9c2be}
.day-number{font-size:10px;font-weight:700}
.dot-row{display:flex;flex-wrap:wrap;gap:2px;margin-top:5px}
.dot{width:5px;height:5px;border-radius:50%}
.dot.psico{background:#8db0c8}
.dot.psicopeg{background:#8eb29d}
.dot.aula{background:#ad94b9}
.day-events{margin-top:4px;display:flex;flex-direction:column;gap:2px}
.day-event{font-size:8px;padding:2px 4px;border-radius:4px;background:#edf4f8;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fin-hero{background:linear-gradient(135deg,#fff,#f3f8f5);border:1px solid var(--line);border-radius:24px;padding:24px 28px;margin-bottom:20px;display:flex;justify-content:space-between;align-items:center;gap:20px;flex-wrap:wrap}
.fin-hero .fh-title{font-size:20px;font-weight:800;color:#263832;margin:0}
.fin-hero .fh-sub{font-size:12px;color:#74827c;margin:4px 0 0}
.fin-month-nav{display:flex;align-items:center;gap:10px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:6px 10px}
.fin-month-nav button{border:0;background:transparent;color:#6b7a73;cursor:pointer;padding:4px 8px;border-radius:8px}
.fin-month-nav .month-text{font-size:13px;font-weight:700;color:#34413c;min-width:140px;text-align:center;text-transform:capitalize}
.fin-cards{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:20px}
.fin-card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:18px 20px;transition:all .25s}
.fin-card:hover{transform:translateY(-2px);box-shadow:0 4px 12px rgba(0,0,0,.06)}
.fin-card .fc-label{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:#91a09a;font-weight:700}
.fin-card .fc-value{font-size:24px;font-weight:800;margin-top:6px}
.fin-card .fc-sub{font-size:11px;color:#9aa6a1;margin-top:4px}
.fin-card .fc-bar{height:4px;border-radius:4px;background:#edf1ef;margin-top:10px;overflow:hidden}
.fin-card .fc-bar span{display:block;height:100%;border-radius:4px}
.fin-card.positive .fc-value{color:var(--sage-dark)}
.fin-card.positive .fc-bar span{background:var(--sage)}
.fin-card.negative .fc-value{color:#c0504d}
.fin-card.negative .fc-bar span{background:#e8a0a0}
.fin-card.neutral .fc-value{color:#34413c}
.fin-card.neutral .fc-bar span{background:#b8ccc2}
.fin-grid{display:grid;grid-template-columns:1.4fr 1fr;gap:18px}
.fin-panel{background:#fff;border:1px solid var(--line);border-radius:18px;padding:20px}
.fin-panel .fp-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
.fin-panel .fp-title{font-size:14px;font-weight:700;color:#34413c}
.fin-table{width:100%;border-collapse:collapse}
.fin-table th{text-align:left;font-size:10px;color:#87948e;text-transform:uppercase;padding:10px 8px;border-bottom:1px solid var(--line);font-weight:700}
.fin-table td{padding:12px 8px;border-bottom:1px solid #f0f3f2;font-size:12px}
.payment-method-badge{display:inline-flex;gap:4px;font-size:10px;font-weight:600;padding:3px 8px;border-radius:12px;background:#e8f0fe;color:#3a6cb8}
.fin-pending-item{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid #f0f3f2}
.fin-pending-item .fp-info{flex:1}
.fin-pending-item .fp-name{font-size:13px;font-weight:700}
.fin-pending-item .fp-date{font-size:10px;color:#8a9892;margin-top:2px}
.fin-pending-item .fp-value{font-size:14px;font-weight:800}
.fin-calc-card{background:#f8faf9;border:1px solid var(--line);border-radius:18px;padding:18px}
.fin-calc-card .fcc-title{font-size:13px;font-weight:700;color:#34413c;margin-bottom:4px}
.fin-calc-card .fcc-sub{font-size:11px;color:#8a9892;margin-bottom:14px}
.calc-result{background:linear-gradient(135deg,#eaf3ee,#edf4f8);border-radius:14px;padding:18px;text-align:center;margin-top:14px}
.calc-result .result-label{font-size:11px;color:#5a6b64;text-transform:uppercase;font-weight:700}
.calc-result .result-value{font-size:28px;font-weight:800;color:var(--sage-dark);margin:6px 0}
.calc-result .result-detail{font-size:11px;color:#718096;line-height:1.7}
.assessment-shell{display:grid;gap:18px}
.assessment-hero{background:linear-gradient(135deg,#fff,#f4f8f6);border:1px solid var(--line);border-radius:24px;padding:24px;display:flex;justify-content:space-between;gap:18px;flex-wrap:wrap}
.assessment-hero h2{margin:0;font-size:22px;color:#263832}
.assessment-hero p{margin:7px 0 0;color:#74827c;font-size:12px;line-height:1.6;max-width:680px}
.assessment-actions{display:flex;gap:8px;flex-wrap:wrap}
.assessment-metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.assessment-metric{background:#fff;border:1px solid var(--line);border-radius:16px;padding:15px 16px}
.assessment-metric .m-label{font-size:10px;text-transform:uppercase;color:#89968f;font-weight:700}
.assessment-metric .m-value{font-size:24px;font-weight:800;color:#263832;margin-top:6px}
.assessment-metric .m-sub{font-size:10px;color:#9aa6a1;margin-top:3px}
.instrument-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.instrument-card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:17px}
.instrument-card:hover{border-color:#c4d8ce;box-shadow:0 8px 24px rgba(30,50,40,.06)}
.instrument-card .instrument-head{display:flex;justify-content:space-between;gap:12px}
.instrument-card .instrument-title{font-size:14px;font-weight:800;color:#2e3d37}
.instrument-card .instrument-desc{font-size:11px;color:#7d8b85;line-height:1.55;margin-top:6px}
.instrument-card .instrument-meta{display:flex;gap:7px;flex-wrap:wrap;margin-top:12px}
.assessment-table{width:100%;border-collapse:collapse}
.assessment-table th{font-size:10px;text-transform:uppercase;color:#8b9892;text-align:left;padding:11px 12px;border-bottom:1px solid var(--line)}
.assessment-table td{padding:13px 12px;border-bottom:1px solid #edf1ef;font-size:12px;color:#52605a}
.assessment-status{display:inline-flex;padding:4px 8px;border-radius:7px;font-size:10px;font-weight:700;background:#edf5f0;color:#4b7863}
.aval-type-badge{display:inline-flex;gap:5px;font-size:10px;font-weight:600;padding:3px 9px;border-radius:20px;background:#eaf3ee;color:#3d8a6b}
.aval-type-badge.screening{background:#fef3e8;color:#b8732a}
.aval-type-badge.anamnese{background:#e8f0fe;color:#3a6cb8}
.aval-step{max-width:650px;margin:0 auto}
.step-card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:24px}
.step-question{font-size:16px;font-weight:700;margin:10px 0 16px;color:#263238;line-height:1.5}
.step-options{display:flex;flex-direction:column;gap:8px}
.step-options label{display:flex;align-items:center;gap:10px;padding:12px 14px;border:2px solid var(--line);border-radius:12px;cursor:pointer;font-size:13px}
.step-options label:hover{border-color:#b8ccc2;background:#f8fbf9}
.step-options label.selected{border-color:var(--sage);background:var(--sage-light)}
.step-nav{display:flex;justify-content:space-between;margin-top:20px}
.step-nav button{padding:10px 20px;border:0;border-radius:10px;font-weight:600;font-size:12px;cursor:pointer;background:var(--sage);color:#fff}
.step-progress-wide{height:5px;background:#edf1ef;border-radius:8px;overflow:hidden;margin:8px 0 18px}
.step-progress-wide span{display:block;height:100%;background:var(--sage);border-radius:8px;transition:width .25s ease}
.onboarding-content-page{max-width:900px;margin:0 auto}
.onboarding-content-page .page-hero{background:linear-gradient(135deg,#fff,#f3f8f5);border:1px solid var(--line);border-radius:24px;padding:28px 30px;margin-bottom:20px}
.onboarding-content-page .page-hero .eyebrow{font-size:10px;text-transform:uppercase;letter-spacing:.1em;color:var(--sage);font-weight:800}
.onboarding-content-page .page-hero h2{margin:8px 0 0;font-size:24px;color:#263832}
.onboarding-content-page .page-hero p{margin:8px 0 0;color:#75827d;font-size:13px;line-height:1.7}
.onboarding-block{background:#fff;border:1px solid var(--line);border-radius:18px;padding:24px;margin-bottom:16px}

function weekStart(d){ const x=new Date(d); const day=x.getDay(); x.setDate(x.getDate()+(day===0?-6:1-day)); x.setHours(0,0,0,0); return x; }
function weekDates(d){ const s=weekStart(d); return WEEK.map((_,i)=>{ const x=new Date(s); x.setDate(s.getDate()+i); return x; }); }
function weekPending(){ const keys=weekDates(new Date()).map(dateISO); return activeAppointments().filter(a=>keys.includes(a.data)&&!a.pago).reduce((s,a)=>s+(getStudent(a.alunoId)?.valor||0),0); }

function monthDone(){ const y=new Date().getFullYear(),m=new Date().getMonth(); return activeAppointments().filter(a=>{ const d=parseDate(a.data); return d.getFullYear()===y&&d.getMonth()===m&&a.presente; }).length; }

function scheduleDayHours(d){ const w=getWorkSchedule(); if(!(w.dias||[]).includes(d)) return 0; const g=Math.max(0,timeToMinutes(w.fim)-timeToMinutes(w.inicio)); const b=Math.max(0,timeToMinutes(w.pausaFim)-timeToMinutes(w.pausaInicio)); return Math.max(0,g-b)/60; }

function getTimeRemaining(v){ if(!v)return null; const d=new Date(v)-new Date(); if(d<=0)return{days:0,hours:0,minutes:0,seconds:0,total:0}; return {days:Math.floor(d/864e5),hours:Math.floor(d%864e5/36e5),minutes:Math.floor(d%36e5/6e4),seconds:Math.floor(d%6e4/1e3),total:d}; }

async function createAssessment(){
    const s=getStudent(currentStudent); if(!s)return; ensureStudentModules(s);
    const t=document.getElementById("avTitulo")?.value.trim(), o=document.getElementById("avObjetivo")?.value.trim(), raw=document.getElementById("avQuestoes")?.value||"";
    const q=raw.split(/\n+/).map(x=>x.trim()).filter(Boolean).map((txt,i)=>({id:uid(),numero:i+1,texto:txt}));
    if(!t||!q.length){notify("Informe título e questões.");return;}
    s.avaliacoes.push({id:uid(),data:today(),titulo:t,tipo:"custom",objetivo:o,questoes:q,resultados:[],finalizada:false});
    await saveData(); notify("Criada."); renderStudentProfile("avaliacoes");
}
function applyAssessment(id){
    const s=getStudent(currentStudent); if(!s)return; ensureStudentModules(s);
    if(!s.avaliacoes.find(x=>x.id===id))return; currentAssessment=id; renderStudentProfile("aplicar");
}
async function saveAssessmentApplication(){
    const s=getStudent(currentStudent); if(!s)return; ensureStudentModules(s);
    const a=s.avaliacoes.find(x=>x.id===currentAssessment); if(!a)return;
    const rsp=a.questoes.map((q,i)=>document.getElementById("resp_"+i)?.value.trim()||"");
    a.resultados.push({id:uid(),data:today(),respostas:rsp,resumo:document.getElementById("avResumo")?.value.trim()||"Aplicação concluída."});
    a.finalizada=true; await saveData(); notify("Registrado."); currentAssessment=null; renderStudentProfile("avaliacoes");
}
async function saveSchoolInfo(){

async function addSchoolRecord(){

        <div class="card" style="padding:18px">
            <div class="agenda-toolbar"><div style="display:flex;gap:5px;align-items:center"><button class="btn btn-outline btn-sm" onclick="calendarPrev()">‹</button><div style="font-size:15px;font-weight:700;min-width:140px;text-align:center">${esc(title)}</div><button class="btn btn-outline btn-sm" onclick="calendarNext()">›</button><button class="btn btn-soft btn-sm" onclick="calendarToday()">Hoje</button></div><div style="display:flex;gap:5px"><button class="btn ${calendarMode==="week"?"btn-soft":"btn-outline"} btn-sm" onclick="setCalendarMode('week')">Semanal</button><button class="btn ${calendarMode==="month"?"btn-soft":"btn-outline"} btn-sm" onclick="setCalendarMode('month')">Mensal</button></div></div>

        </div>

function renderWeek(){
    const dates=weekDates(calendarDate);
    let h=`<div style="overflow:auto"><div class="week-grid"><div class="week-head"></div>`;
    dates.forEach(d=>{h+=`<div class="week-head">${d.toLocaleDateString("pt-BR",{weekday:"short"})}<br><span style="font-size:14px;color:#34413c">${d.getDate()}</span></div>`;});
    HOURS.forEach(hr=>{ h+=`<div class="time-cell">${hr}</div>`; dates.forEach(d=>{ const iso=dateISO(d); const aps=activeAppointments().filter(a=>a.data===iso&&a.hora===hr);
        if(!aps.length) h+=`<div class="slot" onclick="quickSchedule('${iso}','${hr}')"><div class="empty-slot">+</div></div>`;
        else{ h+=`<div class="slot">`; aps.forEach(a=>{const s=getStudent(a.alunoId); if(!s)return; const t=TYPES[a.tipo]; h+=`<div class="event ${t?.cls||''}" onclick="openStudent('${s.id}')"><strong>${esc(s.nome.split(' ')[0])}</strong>${t?.label||a.tipo}<div class="event-actions"><button onclick="event.stopPropagation();togglePresence('${a.id}')">${a.presente?"✓":"○"}</button><button onclick="event.stopPropagation();togglePayment('${a.id}')">${a.pago?"R$":"$"}</button><button onclick="event.stopPropagation();cancelAppointment('${a.id}')">×</button></div></div>`; }); h+=`</div>`; }
    }); });
    h+=`</div></div>`; return h;
}
function renderMonth(){
    const y=calendarDate.getFullYear(),m=calendarDate.getMonth();
    const first=new Date(y,m,1),last=new Date(y,m+1,0);
    let start=first.getDay(); start=start===0?6:start-1;
    const total=Math.ceil((start+last.getDate())/7)*7;
    let h=`<div style="overflow:auto"><div class="month-grid">`;
    ["Seg","Ter","Qua","Qui","Sex","Sáb","Dom"].forEach(d=>{h+=`<div class="week-head">${d}</div>`;});
    for(let i=0;i<total;i++){ const d=new Date(y,m,i-start+1); const inM=d.getMonth()===m; const iso=dateISO(d); const evs=activeAppointments().filter(a=>a.data===iso);
        h+=`<div class="month-day ${inM?"":"other"}" onclick="${inM?`selectMonthDay('${iso}')`:""}"><div class="day-number">${d.getDate()}</div><div class="dot-row">${evs.slice(0,7).map(a=>`<span class="dot ${TYPES[a.tipo]?.cls||''}"></span>`).join("")}</div></div>`;
    }
    h+=`</div></div>`; return h;
}
function selectMonthDay(day){ selectedDay=day; renderAgenda(); }
function renderDayPanel(day){
    const evs=activeAppointments().filter(a=>a.data===day).sort((a,b)=>a.hora.localeCompare(b.hora));
    return `<div class="card" style="margin-top:16px"><div class="section-head"><div><div class="section-title">Sessões de ${fmtDate(day)}</div><div class="section-sub">${evs.length} atendimento(s)</div></div><button class="btn btn-primary btn-sm" onclick="quickSchedule('${day}','09:00')">+ Adicionar</button></div>${evs.length?evs.map(a=>{const s=getStudent(a.alunoId); if(!s)return ''; return `<div style="display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid #f0f3f2"><strong style="width:45px;font-size:12px">${a.hora}</strong>${avatarHTML(s)}<div style="flex:1"><div style="font-size:12px;font-weight:700;cursor:pointer" onclick="openStudent('${s.id}')">${esc(s.nome)}</div></div><button class="btn btn-sm ${a.presente?"btn-soft":"btn-outline"}" onclick="togglePresence('${a.id}')">${a.presente?"✓":"○"}</button><button class="btn btn-sm ${a.pago?"btn-soft":"btn-outline"}" onclick="togglePayment('${a.id}')">${a.pago?"R$":"$"}</button></div>`;}).join(""):`<div class="empty">—</div>`}</div>`;
}
function toggleAgendaForm(){ const f=document.getElementById("agendaForm"); if(!f)return; f.style.display=f.style.display==="none"?"block":"none"; if(f.style.display==="block")f.scrollIntoView({behavior:"smooth"}); }
function quickSchedule(date,hour){ const f=document.getElementById("agendaForm"); if(!f)return; f.style.display="block"; document.getElementById("agData").value=date; document.getElementById("agHora").value=hour; f.scrollIntoView({behavior:"smooth"}); }
async function saveAppointment(){
    const aId=document.getElementById("agAluno").value, dt=document.getElementById("agData").value, hr=document.getElementById("agHora").value, tp=document.getElementById("agTipo").value;
    if(!aId||!dt||!hr){notify("Preencha tudo.");return;}
    if(!getStudent(aId)){notify("Aluno não encontrado.");return;}
    if(activeAppointments().some(a=>a.data===dt&&a.hora===hr)){notify("Horário ocupado.");return;}
    const na={id:uid(),alunoId:aId,data:dt,hora:hr,tipo:tp,status:"agendado",presente:false,pago:false};
    data.agenda.push(na);
    const ok=await saveData();
    if(ok){notify("Agendado!");renderAgenda();}
    else{data.agenda=data.agenda.filter(a=>a.id!==na.id);notify("Erro.");}
}
async function cancelAppointment(id){
    const a=data.agenda.find(x=>x.id===id); if(!a||!confirm("Cancelar?"))return;
    a.status="cancelado"; await saveData(); notify("Cancelado."); renderPage();
}
async function togglePresence(id){
    const a=data.agenda.find(x=>x.id===id); if(!a)return;
    a.presente=!a.presente; a.status=a.presente?"realizado":"agendado";
    if(!a.presente&&a.data<=today()){ a.status="falta"; const s=getStudent(a.alunoId); if(s){ensureStudentModules(s);s.faltas.push({data:a.data,agendaId:a.id});} }
    await saveData(); notify(a.presente?"Presença.":"Falta."); renderPage();
}
async function togglePayment(id){
    const a=data.agenda.find(x=>x.id===id); if(!a)return;
    const s=getStudent(a.alunoId); if(!s)return;
    if(!a.pago){
        const met=prompt("Método:\n1-Dinheiro\n2-PIX\n3-Cartão\n4-Cartão parcelado");
        let ms="",par=0;
        if(met==='1')ms='dinheiro'; else if(met==='2')ms='pix'; else if(met==='3')ms='cartao';
        else if(met==='4'){ms='cartao_parcelado';par=parseInt(prompt("Parcelas:"))||0;if(par<2||par>12){notify("Inválido.");return;}}
        else{notify("Inválido.");return;}
        a.pago=true;
        data.transacoes.push({id:uid(),data:a.data,agendaId:a.id,alunoId:s.id,descricao:`Sessão de ${s.nome}`,valor:Number(s.valor)||0,tipo:"receita",categoria:"Sessão",metodo_pagamento:ms,parcelas:par});
        await saveData(); notify(`Pago ${money(s.valor)}.`);
    } else {
        a.pago=false;
        const rem=data.transacoes.filter(t=>t.agendaId===a.id);
        data.transacoes=data.transacoes.filter(t=>t.agendaId!==a.id);
        for(const t of rem) await deleteTransacaoDB(t.id);
        await saveData(); notify("Revertido.");
    }
    renderPage();
}
function calendarPrev(){ if(calendarMode==="week")calendarDate.setDate(calendarDate.getDate()-7); else calendarDate.setMonth(calendarDate.getMonth()-1); selectedDay=null; renderAgenda(); }
function calendarNext(){ if(calendarMode==="week")calendarDate.setDate(calendarDate.getDate()+7); else calendarDate.setMonth(calendarDate.getMonth()+1); selectedDay=null; renderAgenda(); }
function calendarToday(){ calendarDate=new Date(); selectedDay=null; renderAgenda(); }
function setCalendarMode(m){ calendarMode=m; selectedDay=null; renderAgenda(); }

function getAvaliacoesGlobais() {
    const todas = [];
    (data.alunos || []).forEach(aluno => {
        (aluno.avaliacoes || []).forEach(av => { todas.push({ ...av, alunoId: aluno.id, alunoNome: aluno.nome }); });
    });
    return todas;
}
function getAvalTypeBadge(tipo) { const map = { anamnese: "anamnese", screening: "screening", survey: "survey", custom: "survey" }; return map[tipo] || "survey"; }
function getTemplateById(id) { return ASSESSMENT_TEMPLATES.find(t => t.id === id); }

function renderAvaliacoes() {
    if (!isDataLoaded || !data || !data.session) {
        document.getElementById("page-avaliacoes").innerHTML = `<div class="empty" style="padding:40px;text-align:center"><p>Faça login.</p></div>`;
        return;
    }
    if (avalStepMode === 'select') return renderAvalStepSelect();
    if (avalStepMode === 'answering') return renderAvalStepAnswer();
    if (avalStepMode === 'done') return renderAvalStepDone();
    if (currentAvalMode === "new") return renderAvaliacoesNew();
    return renderAvaliacoesList();
}

async function saveNewAvaliacao() {
    const titulo = document.getElementById("newAvalTitulo")?.value.trim();
    const objetivo = document.getElementById("newAvalObjetivo")?.value.trim();
    const alunoId = document.getElementById("newAvalAluno")?.value;
    const raw = document.getElementById("newAvalQuestoes")?.value || "";
    const questoes = raw.split(/\n+/).map(x => x.trim()).filter(Boolean).map((texto, i) => ({ id: uid(), numero: i + 1, texto }));
    if (!titulo) { notify("Informe o título."); return; }
    if (!alunoId) { notify("Selecione um aluno."); return; }
    if (!questoes.length) { notify("Escreva uma questão."); return; }
    const s = getStudent(alunoId);
    if (!s) { notify("Aluno não encontrado."); return; }
    ensureStudentModules(s);
    s.avaliacoes.push({ id: uid(), data: today(), titulo, objetivo, tipo: "custom", questoes, resultados: [], finalizada: false });
    await saveData();
    notify(`Avaliação "${titulo}" criada.`);
    cancelAvaliacao();
}

function startAvalStepAnswer() {
    const alunoId = document.getElementById("stepAluno")?.value;
    const tplId = document.getElementById("stepTemplate")?.value;
    if (!alunoId) { notify("Selecione um aluno."); return; }
    if (!tplId) { notify("Selecione um instrumento."); return; }
    const aluno = getStudent(alunoId);
    const tpl = getTemplateById(tplId);
    if (!aluno || !tpl) { notify("Erro."); return; }
    avalStepAlunoId = alunoId; avalStepTemplateId = tplId;
    avalStepCurrentIndex = 0; avalStepResponses = [];
    if (tpl.tipo === "anamnese" && tpl.campos) {
        const allItems = [];
        tpl.campos.forEach(secao => { secao.itens.forEach(item => { allItems.push({ secao: secao.secao, rotulo: item.rotulo, chave: item.chave, tipo: item.tipo, valor: '' }); }); });
        avalStepQuestions = allItems;
    } else if (tpl.questoes && tpl.questoes.length) {
        avalStepQuestions = tpl.questoes.map((q, i) => ({ index: i, texto: q, escala: tpl.escala || [{ valor: 0, rotulo: "Resposta" }] }));
    } else { avalStepQuestions = []; }
    avalStepMode = 'answering';
    renderAvaliacoes();
}

function renderAvalStepAnswer() {
    const total = avalStepQuestions.length;
    const idx = avalStepCurrentIndex;
    const q = avalStepQuestions[idx];
    if (!q || total === 0) { avalStepMode = 'done'; renderAvaliacoes(); return; }
    const isAnamnese = q.secao !== undefined;
    let content = '';
    if (isAnamnese) {
        content = `<div style="font-size:11px;color:#8a9892;font-weight:600;text-transform:uppercase;margin-bottom:4px">${esc(q.secao)}</div><div class="step-question">${esc(q.rotulo)}</div>${q.tipo === 'textarea' ? `<textarea id="stepAnswer" class="textarea" style="min-height:100px"></textarea>` : `<input id="stepAnswer" class="input" type="text">`}`;
    } else {
        const escala = q.escala || [{ valor: 0, rotulo: "Resposta" }];
        content = `<div style="font-size:11px;color:#8a9892;font-weight:600">Questão ${idx + 1} de ${total}</div><div class="step-question">${esc(q.texto)}</div><div class="step-options">${escala.map(op => `<label class="${avalStepResponses[idx] === op.valor ? 'selected' : ''}" onclick="selectAvalStepOption(${idx}, ${op.valor})"><input type="radio" name="avalStepOpt" ${avalStepResponses[idx] === op.valor ? 'checked' : ''}>${esc(op.rotulo)}</label>`).join("")}</div>`;
    }
    document.getElementById("page-avaliacoes").innerHTML = `
        <button class="btn btn-outline btn-sm" onclick="cancelAvalStep()" style="margin-bottom:14px">← Cancelar</button>
        <div class="aval-step">
            <div style="font-size:11px;font-weight:700;color:#6d7b75">Item ${idx + 1} de ${total}</div>
            <div class="step-progress-wide"><span style="width:${Math.round(((idx + 1) / total) * 100)}%"></span></div>
            <div class="step-card">
                <div style="font-size:10px;color:#8a9892;margin-bottom:8px">${Math.round((idx / total) * 100)}% concluído</div>
                ${content}
                <div class="step-nav">
                    <button style="background:#f5f8f7;color:#5a6b64" onclick="avalStepPrev()" ${idx === 0 ? 'disabled' : ''}>Anterior</button>
                    <button onclick="avalStepNext()">${idx === total - 1 ? 'Finalizar' : 'Próxima'}</button>
                </div>
            </div>
        </div>`;
    try{lucide.createIcons();}catch(e){}
    if (isAnamnese && avalStepResponses[idx] !== undefined) { const el = document.getElementById("stepAnswer"); if (el) el.value = avalStepResponses[idx] || ''; }
}

function selectAvalStepOption(idx, value) { avalStepResponses[idx] = value; renderAvalStepAnswer(); }
function avalStepPrev() { if (avalStepCurrentIndex > 0) { avalStepCurrentIndex--; renderAvalStepAnswer(); } }
function avalStepNext() {
    const idx = avalStepCurrentIndex;
    const q = avalStepQuestions[idx];
    const isAnamnese = q.secao !== undefined;
    if (isAnamnese) { const el = document.getElementById("stepAnswer"); if (el) avalStepResponses[idx] = el.value || ''; }
    else if (avalStepResponses[idx] === undefined || avalStepResponses[idx] === null) { notify("Selecione uma opção."); return; }
    if (idx === avalStepQuestions.length - 1) { avalStepMode = 'done'; renderAvaliacoes(); }
    else { avalStepCurrentIndex++; renderAvalStepAnswer(); }
}

function renderAvalStepDone() {
    const tpl = getTemplateById(avalStepTemplateId);
    const aluno = getStudent(avalStepAlunoId);
    if (!tpl || !aluno) { cancelAvalStep(); return; }
    let respostas = [], questoes = [];
    if (tpl.tipo === "anamnese" && tpl.campos) {
        avalStepQuestions.forEach((q, i) => { respostas.push({ secao: q.secao, rotulo: q.rotulo, chave: q.chave, valor: avalStepResponses[i] || '' }); });
        questoes = tpl.campos.flatMap(sec => sec.itens.map(it => it.rotulo));
    } else if (tpl.questoes) {
        avalStepQuestions.forEach((q, i) => {
            const val = avalStepResponses[i];
            const escala = q.escala || [];
            const op = escala.find(e => e.valor === val);
            respostas.push({ questao: q.texto, valor: val !== undefined ? val : null, rotulo: op ? op.rotulo : "Sem resposta" });
        });
        questoes = tpl.questoes.map((q, i) => ({ id: uid(), numero: i + 1, texto: q }));
    }
    const avId = uid();
    aluno.avaliacoes.push({ id: avId, data: today(), titulo: tpl.nome, tipo: tpl.tipo, objetivo: tpl.descricao, questoes, resultados: [{ id: uid(), data: today(), respostas, resumo: "Avaliação concluída." }], finalizada: true });
    saveData().then(() => notify(`"${tpl.nome}" aplicada a ${aluno.nome}!`));
    document.getElementById("page-avaliacoes").innerHTML = `
        <div class="card" style="max-width:600px;margin:40px auto;text-align:center;padding:40px">
            <div style="font-size:48px;margin-bottom:16px">✓</div>
            <div class="section-title" style="font-size:20px">Avaliação concluída!</div>
            <div class="section-sub" style="font-size:14px;margin-top:8px">${esc(tpl.nome)} aplicada a ${esc(aluno.nome)}</div>
            <div style="margin-top:20px;display:flex;gap:10px;justify-content:center;flex-wrap:wrap">
                <button class="btn btn-primary" onclick="cancelAvalStep()">Ver avaliações</button>
                <button class="btn btn-outline" onclick="gerarPDFAvaliacao('${aluno.id}','${avId}')">PDF</button>
                <button class="btn btn-soft" onclick="openStudent('${aluno.id}')">Ver prontuário</button>
            </div>
        </div>`;
    try{lucide.createIcons();}catch(e){}
}

function cancelAvalStep() { avalStepMode = null; avalStepQuestions = []; avalStepCurrentIndex = 0; avalStepResponses = []; avalStepTemplateId = null; avalStepAlunoId = null; currentAvalMode = "list"; renderAvaliacoes(); }

function gerarPDFAvaliacao(alunoId, avalId) {
    const s = getStudent(alunoId); if (!s) return;
    const av = s.avaliacoes.find(x => x.id === avalId); if (!av) return;
    const doc = new window.jspdf.jsPDF({ unit: 'mm', format: 'a4' });
    const pageW = doc.internal.pageSize.getWidth();
    let y = 20;
    doc.setFont('helvetica', 'bold'); doc.setFontSize(18); doc.text('Legado Que Ensina - Avaliação', pageW / 2, y, { align: 'center' }); y += 10;
    doc.setFontSize(14); doc.text(String(av.titulo || ''), pageW / 2, y, { align: 'center' }); y += 8;
    doc.setFont('helvetica', 'normal'); doc.setFontSize(10);
    doc.text(`Aluno: ${s.nome || ''}`, 20, y); y += 6;
    doc.text(`Data: ${fmtDate(av.data)}`, 20, y); y += 6;
    const resultado = av.resultados && av.resultados.length ? av.resultados[av.resultados.length - 1] : null;
    if (av.questoes) {
        av.questoes.forEach((q, i) => {
            const rawResp = resultado && resultado.respostas ? resultado.respostas[i] || '' : '';
            const resp = rawResp && typeof rawResp === 'object' ? (rawResp.rotulo || rawResp.valor || '—') : rawResp;
            const text = `${q.numero}. ${q.texto}\nResposta: ${resp || '—'}`;
            const lines = doc.splitTextToSize(text, pageW - 40);
            lines.forEach(line => { if (y > 270) { doc.addPage(); y = 20; } doc.text(line, 20, y); y += 5; });
            y += 2;
        });
    }
    doc.save(`avaliacao-${s.nome}-${av.titulo}.pdf`); notify("PDF gerado!");
}

function renderFinanceiro() {
    if (!isDataLoaded || !data) { document.getElementById("page-financeiro").innerHTML = `<div class="empty">Carregando...</div>`; return; }
    const allTrans = (data.transacoes || []).filter(t => { const d = parseDate(t.data); return d.getFullYear() === financeYear && d.getMonth() === financeMonth; }).sort((a, b) => (b.data || '').localeCompare(a.data || ''));
    const receitas = allTrans.filter(t => (t.tipo || "receita") === "receita");
    const despesas = allTrans.filter(t => t.tipo === "despesa");
    const totalRecebido = receitas.reduce((s, t) => s + Number(t.valor || 0), 0);
    const totalDespesas = despesas.reduce((s, t) => s + Number(t.valor || 0), 0);
    const saldo = totalRecebido - totalDespesas;
    const monthAppts = activeAppointments().filter(a => { const d = parseDate(a.data); return d.getFullYear() === financeYear && d.getMonth() === financeMonth; });
    const pending = monthAppts.filter(a => !a.pago).reduce((s, a) => s + Number(getStudent(a.alunoId)?.valor || 0), 0);
    const monthLabel = new Date(financeYear, financeMonth, 1).toLocaleDateString("pt-BR", { month: "long", year: "numeric" });
    const totalEsperado = totalRecebido + pending;
    const percentRecebido = totalEsperado > 0 ? Math.round((totalRecebido / totalEsperado) * 100) : 0;

    document.getElementById("page-financeiro").innerHTML = `
        <div class="fin-hero">
            <div><h1 class="fh-title">Financeiro</h1><p class="fh-sub">Acompanhe receitas, despesas e pendências do mês.</p></div>
            <div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap">
                <div class="fin-month-nav"><button onclick="changeFinanceMonth(-1)">‹</button><span class="month-text">${monthLabel}</span><button onclick="changeFinanceMonth(1)">›</button></div>
                <button class="btn btn-blue btn-sm" onclick="generateFinancePDF()">PDF</button>
            </div>
        </div>
        <div class="fin-cards">
            <div class="fin-card ${saldo >= 0 ? 'positive' : 'negative'}"><div class="fc-label">Saldo do mês</div><div class="fc-value">${money(saldo)}</div><div class="fc-sub">${saldo >= 0 ? 'Positivo' : 'Negativo'}</div><div class="fc-bar"><span style="width:${Math.min(100, Math.abs(saldo) / (totalRecebido || 1) * 100)}%"></span></div></div>
            <div class="fin-card positive"><div class="fc-label">Recebido</div><div class="fc-value">${money(totalRecebido)}</div><div class="fc-sub">${receitas.length} recebimento(s)</div><div class="fc-bar"><span style="width:${percentRecebido}%"></span></div></div>
            <div class="fin-card negative"><div class="fc-label">Despesas</div><div class="fc-value">${money(totalDespesas)}</div><div class="fc-sub">${despesas.length} lançamento(s)</div><div class="fc-bar"><span style="width:${totalRecebido > 0 ? Math.min(100, totalDespesas / totalRecebido * 100) : 0}%"></span></div></div>
            <div class="fin-card neutral"><div class="fc-label">A receber</div><div class="fc-value">${money(pending)}</div><div class="fc-sub">${monthAppts.filter(a => !a.pago).length} pendência(s)</div><div class="fc-bar"><span style="width:${100 - percentRecebido}%"></span></div></div>
        </div>
        <div class="fin-grid">
            <div class="fin-panel">
                <div class="fp-head"><div class="fp-title">Recebimentos</div><span style="font-size:11px;color:#8a9892">${receitas.length} registro(s)</span></div>
                ${receitas.length ? `<div style="overflow:auto"><table class="fin-table"><thead><tr><th>Data</th><th>Aluno</th><th>Valor</th><th>Método</th></tr></thead><tbody>${receitas.slice(0, 12).map(t => { const s = getStudent(t.alunoId); return `<tr><td style="color:#8a9892">${fmtDate(t.data)}</td><td><strong>${esc(s?.nome || "—")}</strong></td><td><strong style="color:var(--sage-dark)">${money(t.valor)}</strong></td><td><span class="payment-method-badge">${getMetodoPagamentoLabel(t.metodo_pagamento)}${t.parcelas > 0 ? ` · ${t.parcelas}x` : ''}</span></td></tr>`; }).join("")}</tbody></table></div>` : `<div class="empty">Nenhuma receita.</div>`}
            </div>
            <div style="display:flex;flex-direction:column;gap:16px">
                <div class="fin-panel">
                    <div class="fp-head"><div class="fp-title">Pendências</div><button class="btn btn-soft btn-sm" onclick="showDespesaForm()">+ Despesa</button></div>
                    ${monthAppts.filter(a => !a.pago).length ? monthAppts.filter(a => !a.pago).slice(0, 8).map(a => { const s = getStudent(a.alunoId); return `<div class="fin-pending-item"><div class="fp-info" style="cursor:pointer" onclick="openStudent('${s?.id}')"><div class="fp-name">${esc(s?.nome || "Aluno")}</div><div class="fp-date">${fmtDate(a.data)} · ${a.hora}</div></div><div class="fp-value">${money(s?.valor || 0)}</div><button class="btn btn-primary btn-sm" onclick="togglePayment('${a.id}')">✓</button></div>`; }).join("") : `<div class="empty">Sem pendências.</div>`}
                </div>
            </div>
        </div>`;
    try{lucide.createIcons();}catch(e){}
}

    const receitas = allTrans.filter(t => (t.tipo || "receita") === "receita");

function renderWaitlistRows(lista) {

    return lista.map((w,i) => `
      <div class="waitlist-row" onclick="openWaitlistDetail(${i})">
        <div class="waitlist-priority ${esc(w.prioridade||'media')}"></div>
        <div class="waitlist-row-avatar">${esc(initials(w.nome))}</div>
        <div style="min-width:0">

function filterWaitlist() {
    const q=(document.getElementById('waitlistSearch')?.value||'').trim().toLowerCase();
    const pr=document.getElementById('waitlistPriorityFilter')?.value||'todos';
    const area=document.getElementById('waitlistAreaFilter')?.value||'todos';
    const list=(data.listaEspera||[]).filter(w=>{
        const hay=[w.nome,w.telefone,w.area,w.horario,w.observacoes].join(' ').toLowerCase();
        return (!q||hay.includes(q))&&(pr==='todos'||w.prioridade===pr)&&(area==='todos'||w.area===area);
    });
    const el=document.getElementById('waitlistList'); if(el){el.innerHTML=renderWaitlistRows(list);try{lucide.createIcons();}catch(e){}}
}

function clearWaitlistFilters(){const q=document.getElementById('waitlistSearch'),p=document.getElementById('waitlistPriorityFilter'),a=document.getElementById('waitlistAreaFilter');if(q)q.value='';if(p)p.value='todos';if(a)a.value='todos';filterWaitlist();}

function saveWaitlist(){
    const nome=document.getElementById('wlNome')?.value.trim(); if(!nome){notify('Informe o nome.');return;}
    if(!data.listaEspera)data.listaEspera=[];
    const idx=document.getElementById('wlEditId')?.value||'';
    const previous=idx!==''?data.listaEspera[Number(idx)]:null;
    const item={id:previous?.id||uid(),nome,telefone:document.getElementById('wlTelefone').value.trim(),idade:Number(document.getElementById('wlIdade').value)||0,area:document.getElementById('wlArea').value,horario:document.getElementById('wlHorario').value.trim(),prioridade:document.getElementById('wlPrioridade').value,observacoes:document.getElementById('wlObs').value.trim(),criadoEm:previous?.criadoEm||today()};
    if(idx!=='')data.listaEspera[Number(idx)]=item;else data.listaEspera.push(item);
    try{localStorage.setItem('waitlist_'+currentUserId,JSON.stringify(data.listaEspera));}catch(e){}
    closeWaitlistFormModal();renderListaEspera();notify(idx!==''?'Interessado atualizado.':'Interessado adicionado à lista.');
}
function promoteWaitlist(i){
    const w=(data.listaEspera||[])[i];if(!w)return;
    if(!confirm(`Transformar ${w.nome} em aluno?`))return;
    const st={id:uid(),nome:w.nome,idade:w.idade||0,serie:'',responsavel:'',telefone:w.telefone||'',valor:Number(data.professor?.configuracoes?.valorSessaoPadrao)||0,foto:'',tags:[],observacoes:w.observacoes||'',ativo:true};
    data.alunos.push(st);ensureStudentModules(st);data.listaEspera.splice(i,1);
    try{localStorage.setItem('waitlist_'+currentUserId,JSON.stringify(data.listaEspera));}catch(e){}
    saveData().then(()=>{currentStudent=st.id;navigate('agenda');setTimeout(()=>{toggleAgendaForm();const s=document.getElementById('agAluno');if(s)s.value=st.id;},150);notify(`${st.nome} agora é aluno.`);});
}
function removeWaitlist(i){
    if(!confirm('Remover este interessado da lista de espera?'))return;
    data.listaEspera.splice(i,1);try{localStorage.setItem('waitlist_'+currentUserId,JSON.stringify(data.listaEspera));}catch(e){}
    renderListaEspera();notify('Interessado removido.');
}

async function loadRecados() {
    try {
        const userId = await getUserId(); if (!userId) return;
        const { data: recadosData, error } = await supabaseClient.from('recados').select('*').or(`destinatario_id.eq.${userId},para_todos.eq.true,user_id.eq.${userId}`).order('created_at', { ascending: false });
        if (error) throw error;
        recadosList = recadosData || [];
        recadosUnreadCount = recadosList.filter(r => !r.lido && (r.destinatario_id === userId || r.para_todos)).length;
        updateRecadosBadge();
        return recadosList;
    } catch (error) { console.error(error); return []; }
}
async function saveRecado(recado) {
    try {
        const userId = await getUserId(); if (!userId) return null;
        const payload = { id: recado.id || uid(), user_id: userId, remetente_id: userId, destinatario_id: recado.destinatario_id || null, titulo: recado.titulo, mensagem: recado.mensagem, tipo: recado.tipo || 'comunicado', lido: false, para_todos: recado.para_todos || false, created_at: new Date().toISOString() };
        const { data, error } = await supabaseClient.from('recados').insert(payload).select().single();
        if (error) throw error;
        return data;
    } catch (error) { console.error(error); return null; }
}
async function markRecadoAsRead(id) { try { await supabaseClient.from('recados').update({ lido: true }).eq('id', id); const r = recadosList.find(x => x.id === id); if (r) r.lido = true; recadosUnreadCount = Math.max(0, recadosUnreadCount - 1); updateRecadosBadge(); return true; } catch(e) { return false; } }
async function deleteRecado(id) { try { await supabaseClient.from('recados').delete().eq('id', id); recadosList = recadosList.filter(r => r.id !== id); return true; } catch(e) { return false; } }
function updateRecadosBadge() { const badge = document.getElementById('recadosBadge'); if (!badge) return; if (recadosUnreadCount > 0) { badge.style.display = 'flex'; badge.textContent = recadosUnreadCount > 9 ? '9+' : recadosUnreadCount; } else badge.style.display = 'none'; }
function setRecadosFilter(filter) { recadosFilter = filter; recadosPage = 1; renderRecados(); }

async function extendLicense(id, days) {
    const p = data.master.professores.find(x => x.id === id); if (!p) return;
    let base = p.licenca_fim ? new Date(p.licenca_fim) : new Date(); if (base < new Date()) base = new Date();
    base.setDate(base.getDate() + days);
    const { error } = await supabaseClient.from('professores').update({ licenca_fim: base.toISOString() }).eq('id', id);
    if (error) { notify('Erro.'); return; }

    notify(`+${days} dias.`);

async function loadDataFromSupabase() {
    try {
        const userId = await getUserId(); if (!userId) return null;
        const pR = await supabaseClient.from('professores').select('*').eq('user_id', userId).maybeSingle();
        const aR = await supabaseClient.from('alunos').select('*').eq('user_id', userId).order('nome');
        const eR = await supabaseClient.from('evolucoes').select('*').eq('user_id', userId);
        const cR = await supabaseClient.from('consultas').select('*').eq('user_id', userId);
        const avR = await supabaseClient.from('avaliacoes').select('*').eq('user_id', userId);
        const rrR = await supabaseClient.from('resultados_avaliacoes').select('*').eq('user_id', userId);
        const esR = await supabaseClient.from('escola').select('*').eq('user_id', userId);
        const rgR = await supabaseClient.from('registros_escola').select('*').eq('user_id', userId);
        const agR = await supabaseClient.from('agenda').select('*').eq('user_id', userId).order('data');
        const tR = await supabaseClient.from('transacoes').select('*').eq('user_id', userId);
        const oR = await supabaseClient.from('observacoes_professor').select('*').eq('user_id', userId).order('data', { ascending: false });
        const epR = await supabaseClient.from('evolucoes_professor').select('*').eq('user_id', userId).order('data', { ascending: false });

        const alunos = (aR.data || []).map(mapAlunoFromDB);
        const evol = (eR.data || []).map(mapEvolucaoFromDB);
        const cons = (cR.data || []).map(mapConsultaFromDB);
        const avs = (avR.data || []).map(mapAvaliacaoFromDB);
        const rrs = (rrR.data || []).map(mapResultadoFromDB);
        const escs = (esR.data || []).map(mapEscolaFromDB);
        const regs = (rgR.data || []).map(mapRegistroEscolaFromDB);

        alunos.forEach(a => {
            a.evolucoes = evol.filter(e => e.aluno_id === a.id);
            a.consultas = cons.filter(c => c.aluno_id === a.id);
            a.avaliacoes = avs.filter(av => av.aluno_id === a.id);
            a.avaliacoes.forEach(av => { av.resultados = rrs.filter(r => r.avaliacao_id === av.id); });
            const e = escs.find(x => x.aluno_id === a.id);
            if (e) a.escola = { id: e.id, aluno_id: e.aluno_id, nome: e.nome || '', professores: e.professores || '', registros: regs.filter(r => r.escola_id === e.id) };
            ensureStudentModules(a);
        });

        const prof = pR.data ? mapProfessorFromDB(pR.data) : defaultData().professor;
        if (oR.data) prof.observacoes = oR.data.map(mapObsProfFromDB);
        if (epR.data) prof.evolucoesPessoais = epR.data.map(mapEvoProfFromDB);

        isDataLoaded = true;
        let lw = [], le = [], lo = {};
        try { lw = JSON.parse(localStorage.getItem('waitlist_' + userId) || '[]') || []; } catch(e) {}
        try { le = JSON.parse(localStorage.getItem('equipe_' + userId) || '[]') || []; } catch(e) {}
        try { lo = JSON.parse(localStorage.getItem('onboarding_' + userId) || '{}') || {}; } catch(e) {}

        return { session: true, professor: prof, alunos, agenda: (agR.data || []).map(mapAgendaFromDB), transacoes: (tR.data || []).map(mapTransacaoFromDB), listaEspera: lw, equipe: le, onboarding: lo };
    } catch (error) { console.error('Erro load:', error); notify('Erro ao carregar dados.'); return null; }
}
async function loadData() {
    const l = await loadDataFromSupabase();
    if (l) {
        if (!l.professor.observacoes) l.professor.observacoes = [];
        if (!l.professor.evolucoesPessoais) l.professor.evolucoesPessoais = [];
        if (!l.professor.configuracoes) l.professor.configuracoes = defaultData().professor.configuracoes;
        l.alunos.forEach(s => ensureStudentModules(s));
        isDataLoaded = true;
        return l;
    }
    isDataLoaded = false;
    return defaultData();
}
