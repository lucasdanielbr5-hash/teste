<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Professor · Sistema de Gestão</title>
  <!-- Font Awesome (ícones) -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Segoe UI', Roboto, system-ui, sans-serif;
    }

    body {
      background: #f4f7fc;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    /* --- CARD PRINCIPAL --- */
    .app-container {
      max-width: 1300px;
      width: 100%;
      background: white;
      border-radius: 40px;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
      padding: 28px 32px 32px;
      transition: all 0.2s;
    }

    /* --- LOGIN (inicial) --- */
    #loginSection {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 30px 10px 20px;
    }
    #loginSection h1 {
      font-size: 2.2rem;
      font-weight: 600;
      color: #1e293b;
      margin-bottom: 8px;
    }
    #loginSection p {
      color: #64748b;
      margin-bottom: 28px;
    }
    .login-box {
      background: #f8fafc;
      padding: 30px 35px;
      border-radius: 32px;
      width: 100%;
      max-width: 420px;
      box-shadow: 0 8px 20px rgba(0,0,0,0.02);
      border: 1px solid #e9eef3;
    }
    .login-box label {
      font-weight: 500;
      color: #0f172a;
      display: block;
      margin-top: 12px;
      margin-bottom: 4px;
    }
    .login-box input {
      width: 100%;
      padding: 14px 16px;
      border: 1px solid #d1d9e6;
      border-radius: 60px;
      font-size: 1rem;
      background: white;
      transition: 0.2s;
    }
    .login-box input:focus {
      outline: none;
      border-color: #3b82f6;
      box-shadow: 0 0 0 3px rgba(59,130,246,0.2);
    }
    .login-btn {
      width: 100%;
      margin-top: 24px;
      padding: 14px;
      background: #1e293b;
      color: white;
      border: none;
      border-radius: 60px;
      font-size: 1.1rem;
      font-weight: 600;
      cursor: pointer;
      transition: 0.2s;
    }
    .login-btn:hover {
      background: #0f172a;
      transform: scale(1.01);
    }
    .login-error {
      color: #b91c1c;
      background: #fee2e2;
      padding: 8px 14px;
      border-radius: 40px;
      margin-top: 16px;
      font-size: 0.9rem;
      display: none;
    }

    /* --- PAINEL PRINCIPAL (logado) --- */
    #dashboard {
      display: none;
    }

    /* cabeçalho */
    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      margin-bottom: 28px;
    }
    .top-bar h2 {
      font-size: 1.9rem;
      font-weight: 600;
      color: #0f172a;
    }
    .top-bar h2 i {
      color: #3b82f6;
      margin-right: 8px;
    }
    .user-badge {
      background: #eef2f6;
      padding: 10px 22px;
      border-radius: 60px;
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .user-badge i {
      font-size: 1.4rem;
      color: #1e293b;
    }
    .logout-btn {
      background: transparent;
      border: 1px solid #cbd5e1;
      padding: 6px 16px;
      border-radius: 40px;
      font-weight: 500;
      cursor: pointer;
      transition: 0.2s;
    }
    .logout-btn:hover {
      background: #f1f5f9;
    }

    /* GRID INFO */
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(190px, 1fr));
      gap: 18px;
      margin-bottom: 30px;
    }
    .stat-card {
      background: #f8fafc;
      padding: 18px 22px;
      border-radius: 28px;
      border: 1px solid #e2e8f0;
    }
    .stat-card .label {
      font-size: 0.85rem;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: #64748b;
    }
    .stat-card .value {
      font-size: 2rem;
      font-weight: 700;
      color: #0f172a;
      margin-top: 4px;
    }
    .stat-card .sub {
      color: #475569;
      font-size: 0.9rem;
    }

    /* aba de navegação */
    .tabs {
      display: flex;
      gap: 6px;
      border-bottom: 2px solid #e9edf2;
      padding-bottom: 4px;
      margin-bottom: 28px;
      flex-wrap: wrap;
    }
    .tab-btn {
      background: transparent;
      border: none;
      padding: 12px 24px;
      font-weight: 600;
      color: #475569;
      cursor: pointer;
      border-radius: 40px;
      transition: 0.2s;
      font-size: 0.95rem;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .tab-btn i {
      font-size: 1rem;
    }
    .tab-btn.active {
      background: #1e293b;
      color: white;
    }
    .tab-btn:hover:not(.active) {
      background: #eef2f6;
    }

    /* conteúdo das abas */
    .tab-content {
      display: none;
      animation: fade 0.2s ease;
    }
    .tab-content.active {
      display: block;
    }
    @keyframes fade {
      0% { opacity: 0.4; }
      100% { opacity: 1; }
    }

    /* alunos / lista */
    .student-list {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }
    .student-item {
      background: #fafcff;
      border: 1px solid #e2e8f0;
      border-radius: 40px;
      padding: 16px 24px;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      transition: 0.15s;
    }
    .student-item:hover {
      background: #f1f5f9;
      border-color: #b9c7da;
    }
    .student-info {
      display: flex;
      align-items: center;
      gap: 18px;
    }
    .student-avatar {
      width: 48px;
      height: 48px;
      background: #dbeafe;
      border-radius: 60px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #1e4f8a;
      font-weight: 700;
      font-size: 1.2rem;
    }
    .student-name {
      font-weight: 600;
      font-size: 1.1rem;
      color: #0f172a;
    }
    .student-meta {
      display: flex;
      gap: 20px;
      color: #475569;
      font-size: 0.9rem;
      align-items: center;
      flex-wrap: wrap;
    }
    .student-meta span {
      display: flex;
      align-items: center;
      gap: 4px;
    }
    .badge-paid {
      background: #dcfce7;
      color: #166534;
      padding: 4px 14px;
      border-radius: 60px;
      font-weight: 500;
      font-size: 0.8rem;
    }
    .badge-pending {
      background: #fee2e2;
      color: #991b1b;
      padding: 4px 14px;
      border-radius: 60px;
      font-weight: 500;
      font-size: 0.8rem;
    }
    .btn-sm {
      background: #eef2f6;
      border: none;
      padding: 6px 18px;
      border-radius: 60px;
      font-weight: 500;
      cursor: pointer;
      transition: 0.2s;
      font-size: 0.85rem;
    }
    .btn-sm i {
      margin-right: 4px;
    }
    .btn-sm:hover {
      background: #d1d9e6;
    }
    .btn-primary-sm {
      background: #1e293b;
      color: white;
    }
    .btn-primary-sm:hover {
      background: #0f172a;
    }

    /* perfil do aluno (detalhe) */
    .profile-detail {
      background: #fafcff;
      border-radius: 32px;
      padding: 24px 28px;
      border: 1px solid #e2e8f0;
      margin-top: 16px;
    }
    .profile-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      border-bottom: 1px dashed #d1d9e6;
      padding-bottom: 16px;
      margin-bottom: 18px;
    }
    .profile-header h3 {
      font-size: 1.8rem;
      font-weight: 600;
    }
    .profile-session-status {
      background: #f1f5f9;
      padding: 6px 20px;
      border-radius: 60px;
    }
    .profile-session-status i {
      margin-right: 6px;
    }
    .obs-box {
      background: #f1f5f9;
      padding: 18px 22px;
      border-radius: 24px;
      margin: 18px 0;
      border-left: 5px solid #3b82f6;
    }
    .obs-box strong {
      display: block;
      margin-bottom: 6px;
    }
    .note-area {
      margin: 22px 0 10px;
    }
    .note-area textarea {
      width: 100%;
      border: 1px solid #d1d9e6;
      border-radius: 24px;
      padding: 16px;
      font-size: 0.95rem;
      resize: vertical;
      min-height: 70px;
      background: white;
    }
    .note-area textarea:focus {
      outline: none;
      border-color: #3b82f6;
      box-shadow: 0 0 0 2px rgba(59,130,246,0.2);
    }

    /* financeiro */
    .finance-total {
      background: #f1f5f9;
      padding: 14px 22px;
      border-radius: 80px;
      display: inline-block;
      font-weight: 600;
      margin-bottom: 20px;
    }
    .finance-total i {
      color: #15803d;
      margin-right: 10px;
    }

    /* sessões */
    .session-row {
      display: flex;
      justify-content: space-between;
      border-bottom: 1px solid #e9edf2;
      padding: 12px 0;
      align-items: center;
    }
    .session-row:last-child {
      border-bottom: none;
    }

    /* responsividade */
    @media (max-width: 700px) {
      .app-container { padding: 16px; }
      .top-bar { flex-direction: column; align-items: start; gap: 16px; }
      .student-item { flex-direction: column; align-items: start; gap: 12px; }
    }
  </style>
</head>
<body>
<div class="app-container" id="appContainer">

  <!-- LOGIN -->
  <div id="loginSection">
    <h1><i class="fas fa-chalkboard-teacher" style="color:#1e293b;"></i> Professor</h1>
    <p>Gestão de alunos, sessões e finanças</p>
    <div class="login-box">
      <label><i class="fas fa-user"></i> Usuário</label>
      <input type="text" id="loginUser" value="professor" placeholder="professor">
      <label><i class="fas fa-lock"></i> Senha</label>
      <input type="password" id="loginPass" value="123" placeholder="••••••">
      <button class="login-btn" id="loginBtn"><i class="fas fa-sign-in-alt"></i> Acessar</button>
      <div id="loginError" class="login-error"><i class="fas fa-exclamation-circle"></i> Credenciais inválidas</div>
    </div>
  </div>

  <!-- DASHBOARD (logado) -->
  <div id="dashboard">
    <!-- topo -->
    <div class="top-bar">
      <h2><i class="fas fa-graduation-cap"></i> Meu Painel</h2>
      <div class="user-badge">
        <i class="fas fa-user-tie"></i>
        <span id="userNameDisplay">Professor</span>
        <button class="logout-btn" id="logoutBtn"><i class="fas fa-sign-out-alt"></i> Sair</button>
      </div>
    </div>

    <!-- stats rápidos -->
    <div class="stats-grid" id="statsGrid">
      <div class="stat-card"><div class="label">Alunos</div><div class="value" id="totalAlunos">0</div></div>
      <div class="stat-card"><div class="label">Sessões hoje</div><div class="value" id="sessoesHoje">0</div></div>
      <div class="stat-card"><div class="label">Pagamentos (mês)</div><div class="value" id="totalRecebido">R$ 0</div></div>
      <div class="stat-card"><div class="label">Anotações</div><div class="value" id="totalAnotacoes">0</div></div>
    </div>

    <!-- TABS -->
    <div class="tabs">
      <button class="tab-btn active" data-tab="tabAlunos"><i class="fas fa-users"></i> Alunos</button>
      <button class="tab-btn" data-tab="tabFinanceiro"><i class="fas fa-coins"></i> Financeiro</button>
      <button class="tab-btn" data-tab="tabSessoes"><i class="fas fa-calendar-check"></i> Sessões</button>
    </div>

    <!-- ABAS -->
    <!-- Alunos -->
    <div id="tabAlunos" class="tab-content active">
      <div style="display: flex; justify-content: space-between; flex-wrap: wrap; margin-bottom: 16px;">
        <span><i class="fas fa-user-plus" style="color:#3b82f6;"></i> Perfis dos alunos</span>
        <button class="btn-sm btn-primary-sm" id="addStudentBtn"><i class="fas fa-plus"></i> Novo aluno</button>
      </div>
      <div class="student-list" id="studentList"></div>
      <!-- detalhe do perfil -->
      <div id="profileDetailContainer" style="margin-top: 24px;"></div>
    </div>

    <!-- Financeiro -->
    <div id="tabFinanceiro" class="tab-content">
      <div class="finance-total"><i class="fas fa-wallet"></i> Total recebido (todos os alunos): <span id="financeTotalValue">R$ 0</span></div>
      <div id="financeStudentList" style="display: flex; flex-direction: column; gap: 12px;"></div>
    </div>

    <!-- Sessões -->
    <div id="tabSessoes" class="tab-content">
      <div style="margin-bottom: 12px;"><i class="fas fa-clock"></i> Sessões marcadas (psicopedagogia)</div>
      <div id="sessoesList" style="background: #fafcff; border-radius: 28px; padding: 16px 22px; border:1px solid #e2e8f0;"></div>
    </div>

  </div>
</div>

<script>
  (function() {
    // ----- DADOS INICIAIS (simulando "banco") -----
    let students = [
      { id: 1, name: 'Ana Clara', paid: true, sessionDate: '2026-08-29', observations: 'Ótima evolução na leitura.', notes: 'Trabalhar interpretação.' },
      { id: 2, name: 'Lucas Mendes', paid: false, sessionDate: '2026-08-28', observations: 'Dificuldade em matemática.', notes: 'Reforçar frações.' },
      { id: 3, name: 'Marina Silva', paid: true, sessionDate: '2026-08-30', observations: 'Participativa, mas dispersa.', notes: 'Técnicas de foco.' },
    ];
    let nextId = 4;
    let loggedUser = null;

    // referências DOM
    const loginSection = document.getElementById('loginSection');
    const dashboard = document.getElementById('dashboard');
    const loginBtn = document.getElementById('loginBtn');
    const logoutBtn = document.getElementById('logoutBtn');
    const loginError = document.getElementById('loginError');
    const loginUser = document.getElementById('loginUser');
    const loginPass = document.getElementById('loginPass');
    const userNameDisplay = document.getElementById('userNameDisplay');
    const studentListEl = document.getElementById('studentList');
    const profileContainer = document.getElementById('profileDetailContainer');
    const financeStudentList = document.getElementById('financeStudentList');
    const sessoesList = document.getElementById('sessoesList');
    const totalAlunos = document.getElementById('totalAlunos');
    const sessoesHoje = document.getElementById('sessoesHoje');
    const totalRecebido = document.getElementById('totalRecebido');
    const totalAnotacoes = document.getElementById('totalAnotacoes');
    const financeTotalValue = document.getElementById('financeTotalValue');
    const addStudentBtn = document.getElementById('addStudentBtn');

    // ----- helpers -----
    function formatCurrency(val) {
      return 'R$ ' + val.toFixed(2).replace('.', ',');
    }

    function getTodayStr() {
      return new Date().toISOString().slice(0,10);
    }

    // ----- renderizar tudo -----
    function renderAll() {
      renderStudentList();
      renderFinance();
      renderSessoes();
      updateStats();
      // se houver perfil aberto, re-renderizar (opcional)
    }

    // ----- lista de alunos (com botão ver perfil) -----
    function renderStudentList() {
      if (!studentListEl) return;
      if (students.length === 0) {
        studentListEl.innerHTML = `<div style="padding: 20px; text-align:center; color:#64748b;">Nenhum aluno cadastrado.</div>`;
        return;
      }
      let html = '';
      students.forEach(s => {
        const paidLabel = s.paid 
          ? '<span class="badge-paid"><i class="fas fa-check-circle"></i> Pago</span>' 
          : '<span class="badge-pending"><i class="fas fa-hourglass-half"></i> Pendente</span>';
        html += `
          <div class="student-item">
            <div class="student-info">
              <div class="student-avatar">${s.name.charAt(0).toUpperCase()}</div>
              <div>
                <div class="student-name">${s.name}</div>
                <div class="student-meta">
                  <span><i class="fas fa-calendar-day"></i> Sessão: ${s.sessionDate || '—'}</span>
                  ${paidLabel}
                </div>
              </div>
            </div>
            <div style="display:flex; gap:8px; flex-wrap:wrap;">
              <button class="btn-sm" data-id="${s.id}" onclick="viewProfile(${s.id})"><i class="fas fa-eye"></i> Perfil</button>
            </div>
          </div>
        `;
      });
      studentListEl.innerHTML = html;
    }

    // ----- exibir perfil do aluno (com observações, notas, sessão paga?) -----
    window.viewProfile = function(id) {
      const student = students.find(s => s.id === id);
      if (!student) return;
      const paidStatus = student.paid 
        ? '<span style="color:#166534;"><i class="fas fa-check-circle"></i> Paga</span>' 
        : '<span style="color:#991b1b;"><i class="fas fa-times-circle"></i> Não paga</span>';
      const obs = student.observations || 'Sem observações.';
      const note = student.notes || 'Sem anotações.';
      const sessionDate = student.sessionDate || 'Não agendada';

      let html = `
        <div class="profile-detail">
          <div class="profile-header">
            <h3><i class="fas fa-user-graduate"></i> ${student.name}</h3>
            <div class="profile-session-status"><i class="fas fa-credit-card"></i> Sessão: ${paidStatus}</div>
          </div>
          <div><strong><i class="fas fa-calendar-alt"></i> Próxima sessão:</strong> ${sessionDate}</div>
          <div class="obs-box">
            <strong><i class="fas fa-comment-dots"></i> Observações</strong>
            <div>${obs}</div>
          </div>
          <div class="note-area">
            <strong><i class="fas fa-pencil-alt"></i> Anotações de avaliação</strong>
            <textarea id="noteTextarea_${student.id}" rows="2">${note}</textarea>
            <div style="display:flex; gap:12px; margin-top: 12px;">
              <button class="btn-sm btn-primary-sm" onclick="saveNote(${student.id})"><i class="fas fa-save"></i> Salvar anotação</button>
              <button class="btn-sm" onclick="togglePayment(${student.id})"><i class="fas fa-sync-alt"></i> Alternar status pagamento</button>
            </div>
            <div style="margin-top: 10px; font-size:0.9rem; color:#475569;"><i class="far fa-clock"></i> Anotação salva localmente</div>
          </div>
        </div>
      `;
      profileContainer.innerHTML = html;
    };

    // salvar anotação (nota)
    window.saveNote = function(id) {
      const student = students.find(s => s.id === id);
      if (!student) return;
      const textarea = document.getElementById(`noteTextarea_${id}`);
      if (textarea) {
        student.notes = textarea.value;
        renderAll(); 
        // reabrir perfil
        viewProfile(id);
      }
    };

    // alternar pagamento
    window.togglePayment = function(id) {
      const student = students.find(s => s.id === id);
      if (student) {
        student.paid = !student.paid;
        renderAll();
        viewProfile(id);
      }
    };

    // ----- financeiro (mostrar cada aluno e total) -----
    function renderFinance() {
      let total = 0;
      let html = '';
      students.forEach(s => {
        const valor = s.paid ? 150.00 : 0;  // simulando valor da sessão
        total += valor;
        html += `
          <div style="display:flex; justify-content:space-between; background:#f8fafc; padding:12px 18px; border-radius:40px; border:1px solid #e2e8f0;">
            <span><strong>${s.name}</strong> ${s.paid ? '<i class="fas fa-check-circle" style="color:#16a34a;"></i>' : '<i class="fas fa-hourglass" style="color:#b45309;"></i>'}</span>
            <span>${s.paid ? formatCurrency(150) : '—'}</span>
          </div>
        `;
      });
      financeStudentList.innerHTML = html || '<div style="color:#64748b;">Nenhum registro financeiro.</div>';
      financeTotalValue.textContent = formatCurrency(total);
    }

    // ----- sessões (listar todas) -----
    function renderSessoes() {
      if (students.length === 0) {
        sessoesList.innerHTML = '<div style="color:#64748b;">Nenhuma sessão marcada.</div>';
        return;
      }
      let html = '';
      students.forEach(s => {
        const data = s.sessionDate || '—';
        const status = s.paid ? '✅ Paga' : '⏳ Pendente';
        html += `
          <div class="session-row">
            <span><i class="fas fa-user"></i> ${s.name}</span>
            <span><i class="fas fa-calendar-day"></i> ${data}</span>
            <span>${status}</span>
          </div>
        `;
      });
      sessoesList.innerHTML = html;
    }

    // ----- estatísticas -----
    function updateStats() {
      totalAlunos.textContent = students.length;
      const hoje = getTodayStr();
      const sessoesHojeCount = students.filter(s => s.sessionDate === hoje).length;
      sessoesHoje.textContent = sessoesHojeCount;
      const totalPago = students.reduce((acc, s) => acc + (s.paid ? 150 : 0), 0);
      totalRecebido.textContent = formatCurrency(totalPago);
      const totalNotas = students.reduce((acc, s) => acc + (s.notes && s.notes.trim().length > 0 ? 1 : 0), 0);
      totalAnotacoes.textContent = totalNotas;
    }

    // ----- adicionar aluno (exemplo) -----
    function addStudent() {
      const name = prompt('Digite o nome do novo aluno:');
      if (!name || name.trim() === '') return;
      const newStudent = {
        id: nextId++,
        name: name.trim(),
        paid: false,
        sessionDate: '',
        observations: 'Sem observações.',
        notes: '',
      };
      students.push(newStudent);
      renderAll();
      // abrir perfil do novo
      viewProfile(newStudent.id);
    }
    addStudentBtn.addEventListener('click', addStudent);

    // ----- TABS -----
    document.querySelectorAll('.tab-btn').forEach(btn => {
      btn.addEventListener('click', function() {
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        this.classList.add('active');
        const tabId = this.dataset.tab;
        document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
        document.getElementById(tabId).classList.add('active');
        // re-renderizar conteúdo
        if (tabId === 'tabAlunos') renderStudentList();
        if (tabId === 'tabFinanceiro') renderFinance();
        if (tabId === 'tabSessoes') renderSessoes();
      });
    });

    // ----- LOGIN / LOGOUT -----
    function doLogin() {
      const user = loginUser.value.trim();
      const pass = loginPass.value.trim();
      if (user === 'professor' && pass === '123') {
        loggedUser = user;
        loginError.style.display = 'none';
        loginSection.style.display = 'none';
        dashboard.style.display = 'block';
        userNameDisplay.textContent = 'Professor';
        renderAll();
      } else {
        loginError.style.display = 'block';
      }
    }

    loginBtn.addEventListener('click', doLogin);
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && loginSection.style.display !== 'none') doLogin();
    });

    logoutBtn.addEventListener('click', function() {
      loggedUser = null;
      dashboard.style.display = 'none';
      loginSection.style.display = 'flex';
      loginUser.value = 'professor';
      loginPass.value = '123';
      loginError.style.display = 'none';
      profileContainer.innerHTML = '';
    });

    // Inicialização: se já estiver logado (por padrão não)
    // mas deixamos login visível
    loginSection.style.display = 'flex';
    dashboard.style.display = 'none';

    // expor algumas funções para o HTML
    window.renderAll = renderAll;
    window.viewProfile = viewProfile;

    // pequeno fix para carregar stats iniciais
    setTimeout(() => { if (dashboard.style.display === 'block') renderAll(); }, 100);
  })();
</script>
</body>
</html>
