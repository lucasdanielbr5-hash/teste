<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>ASAS · Gestão Psicopedagógica</title>

<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/lucide@latest"></script>
<script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;font-family:Inter,sans-serif;background:#f7f9f8;color:#263238}
body{overflow:hidden}
button,input,select,textarea{font-family:inherit}
button{cursor:pointer}
::-webkit-scrollbar{width:7px;height:7px}
::-webkit-scrollbar-thumb{background:#cbd5d1;border-radius:20px}
::-webkit-scrollbar-track{background:transparent}

:root{
 --sage:#5f8f7a;
 --sage-dark:#477363;
 --sage-light:#eaf3ee;
 --blue:#6288a8;
 --blue-light:#edf4f8;
 --ink:#263238;
 --muted:#718096;
 --line:#e6ece9;
 --surface:#fff;
 --gold:#c9a87c;
 --rose:#d4a0a0;
 --lavender:#b8a8c9;
}

.app{height:100vh;display:flex}
.sidebar{
 width:76px;background:#fff;border-right:1px solid var(--line);
 display:flex;flex-direction:column;align-items:center;padding:20px 10px;
 flex-shrink:0;transition:.25s;z-index:20
}
.sidebar:hover{width:218px;align-items:stretch}
.brand{height:52px;display:flex;align-items:center;gap:12px;color:var(--sage-dark);font-weight:700;padding:0 10px;white-space:nowrap;overflow:hidden}
.brand-mark{width:36px;height:36px;border-radius:12px;background:var(--sage-light);display:grid;place-items:center;flex-shrink:0}
.brand span{opacity:0;transition:.2s}
.sidebar:hover .brand span{opacity:1}
.nav{margin-top:22px;display:flex;flex-direction:column;gap:5px}
.nav button{
 border:0;background:transparent;color:#718096;border-radius:12px;
 min-height:44px;padding:0 12px;display:flex;align-items:center;gap:13px;
 font-size:13px;font-weight:500;text-align:left;white-space:nowrap;overflow:hidden
}
.nav button:hover{background:#f3f6f5;color:var(--ink)}
.nav button.active{background:var(--sage-light);color:var(--sage-dark);font-weight:600}
.nav svg{width:20px;min-width:20px}
.nav-label{opacity:0;transition:.2s}
.sidebar:hover .nav-label{opacity:1}
.side-bottom{margin-top:auto}
.main{min-width:0;flex:1;height:100vh;display:flex;flex-direction:column}
.topbar{
 height:72px;background:#fff;border-bottom:1px solid var(--line);
 display:flex;align-items:center;justify-content:space-between;padding:0 30px;flex-shrink:0
}
.page-title{display:flex;align-items:center;gap:10px;font-size:18px;font-weight:600}
.page-title svg{color:var(--sage);width:20px}
.user-mini{display:flex;align-items:center;gap:10px}
.avatar{width:38px;height:38px;border-radius:50%;background:var(--sage-light);color:var(--sage-dark);display:grid;place-items:center;font-weight:700;overflow:hidden;background-size:cover;background-position:center}
.content{padding:26px 30px 40px;overflow:auto;height:calc(100vh - 72px)}
.view{display:none;animation:fade .2s ease}
.view.active{display:block}
@keyframes fade{from{opacity:.3;transform:translateY(5px)}to{opacity:1;transform:none}}

.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:20px;box-shadow:0 2px 8px rgba(30,50,40,.025)}
.grid{display:grid;gap:16px}
.stats{grid-template-columns:repeat(4,minmax(0,1fr))}
.stat-label{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:#91a09a;font-weight:600}
.stat-value{font-size:25px;font-weight:700;margin-top:8px;color:#263238}
.stat-sub{font-size:11px;color:#8a9892;margin-top:5px}

.btn{border:0;border-radius:11px;padding:9px 15px;font-size:13px;font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:7px;transition:.15s}
.btn svg{width:16px}
.btn-primary{background:var(--sage);color:white}
.btn-primary:hover{background:var(--sage-dark)}
.btn-soft{background:var(--sage-light);color:var(--sage-dark)}
.btn-blue{background:var(--blue-light);color:#557994}
.btn-danger{background:#fff0f0;color:#b85b5b}
.btn-outline{background:#fff;border:1px solid var(--line);color:#53615c}
.btn-outline:hover{background:#f7faf8}
.btn-sm{padding:7px 10px;font-size:12px}
.btn-gold{background:#f5efe6;color:#a8875c}
.btn-rose{background:#f5ecec;color:#b58080}
.btn-lavender{background:#f0ecf5;color:#8a7a9e}

.input,.select,.textarea{
 width:100%;border:1px solid #dfe7e3;background:#fbfcfc;border-radius:10px;
 padding:9px 11px;outline:0;font-size:13px;color:var(--ink);transition:.15s
}
.input:focus,.select:focus,.textarea:focus{border-color:#8eb2a3;box-shadow:0 0 0 3px rgba(95,143,122,.09)}
.textarea{resize:vertical;min-height:100px}
.label{display:block;font-size:11px;font-weight:600;color:#66756f;margin-bottom:5px}
.field{margin-bottom:13px}
.form-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.form-grid.two{grid-template-columns:repeat(2,minmax(0,1fr))}
.form-actions{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap}

.section-head{display:flex;align-items:center;justify-content:space-between;gap:15px;margin-bottom:16px}
.section-title{font-size:15px;font-weight:700;color:#34413c}
.section-sub{font-size:12px;color:#89968f;margin-top:3px}

.student-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(235px,1fr));gap:14px}
.student{
 background:#fff;border:1px solid var(--line);border-radius:17px;padding:17px;
 transition:.18s;cursor:pointer
}
.student:hover{border-color:#c8ddd3;transform:translateY(-2px);box-shadow:0 10px 24px rgba(50,90,70,.07)}
.student-top{display:flex;gap:12px;align-items:center}
.student-avatar{width:48px;height:48px;border-radius:15px;background:var(--sage-light);color:var(--sage-dark);display:grid;place-items:center;font-weight:700;font-size:17px;overflow:hidden;background-size:cover;background-position:center}
.student-name{font-weight:700;font-size:14px}
.student-meta{font-size:11px;color:#89968f;margin-top:3px}
.tags{display:flex;flex-wrap:wrap;gap:5px;margin-top:13px}
.tag{font-size:10px;padding:4px 8px;border-radius:20px;background:#edf4f8;color:#597b96;font-weight:600}

.profile-cover{height:112px;border-radius:18px 18px 0 0;background:linear-gradient(135deg,#eaf3ee,#edf4f8)}
.profile-card{margin-top:-1px;border-radius:0 0 18px 18px}
.profile-head{display:flex;gap:20px;align-items:flex-end;margin-top:-42px;padding:0 24px}
.profile-avatar{width:92px;height:92px;border-radius:25px;background:#eaf3ee;border:5px solid white;display:grid;place-items:center;font-size:30px;font-weight:700;color:var(--sage-dark);overflow:hidden;background-size:cover;background-position:center;flex-shrink:0}
.profile-name{font-size:22px;font-weight:700}
.profile-meta{font-size:12px;color:#81908a;margin-top:4px}
.profile-actions{margin-left:auto;display:flex;gap:7px}
.profile-body{padding:20px 24px}
.profile-layout{display:grid;grid-template-columns:2fr 1fr;gap:18px;margin-top:18px}

.timeline{display:flex;flex-direction:column;gap:10px}
.evolution{border:1px solid var(--line);border-radius:13px;padding:14px;background:#fbfcfc}
.evolution-date{font-size:10px;color:#91a09a;font-weight:600}
.evolution-title{font-size:13px;font-weight:700;margin:5px 0}
.evolution-text{font-size:12px;line-height:1.65;color:#596761;white-space:pre-wrap}

.agenda-toolbar{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:15px}
.toolbar-group{display:flex;gap:5px;align-items:center}
.month-label{font-size:16px;font-weight:700;min-width:150px;text-align:center}
.week-grid{display:grid;grid-template-columns:70px repeat(5,minmax(130px,1fr));min-width:700px}
.week-head{background:#fafcfb;border-bottom:1px solid var(--line);padding:10px;text-align:center;font-size:11px;font-weight:700;color:#68766f}
.time-cell{height:72px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);padding:7px;font-size:10px;color:#97a39e;text-align:right}
.slot{height:72px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);padding:4px;background:#fff}
.slot:hover{background:#fbfdfc}
.event{padding:7px;border-radius:9px;font-size:10px;line-height:1.3;cursor:pointer;position:relative;min-height:58px}
.event.psico{background:#edf4f8;color:#557792}
.event.psicopeg{background:#f0f5ec;color:#5d806c}
.event.aula{background:#f5f0f8;color:#80678c}
.event strong{display:block;font-size:10px;margin-bottom:2px}
.event-actions{display:flex;gap:3px;margin-top:5px}
.event-actions button{border:0;background:rgba(255,255,255,.65);border-radius:5px;padding:2px 5px;font-size:9px}
.empty-slot{height:100%;display:grid;place-items:center;color:#c1ccc7;font-size:11px}

.month-grid{display:grid;grid-template-columns:repeat(7,1fr);border:1px solid var(--line);border-radius:15px;overflow:hidden;background:white}
.month-week{display:contents}
.month-day{
 min-height:105px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);
 padding:8px;cursor:pointer
}
.month-day:hover{background:#fafcfb}
.month-day.other{background:#fafafa;color:#b9c2be}
.day-number{font-size:11px;font-weight:700}
.dot-row{display:flex;flex-wrap:wrap;gap:3px;margin-top:9px}
.dot{width:7px;height:7px;border-radius:50%}
.dot.psico{background:#8db0c8}.dot.psicopeg{background:#8eb29d}.dot.aula{background:#ad94b9}
.day-events{margin-top:7px;display:flex;flex-direction:column;gap:3px}
.day-event{font-size:9px;padding:3px 5px;border-radius:5px;background:#edf4f8;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.finance-table{width:100%;border-collapse:collapse}
.finance-table th{text-align:left;font-size:10px;color:#87948e;text-transform:uppercase;padding:10px;border-bottom:1px solid var(--line)}
.finance-table td{padding:12px 10px;border-bottom:1px solid #f0f3f2;font-size:12px}
.paid{color:#5d8a70;font-weight:700}.pending{color:#a98058;font-weight:700}
.alert{padding:12px;border-radius:12px;background:#fff8ef;border:1px solid #f3e5d2}
.alert-title{font-size:12px;font-weight:700;color:#876f51}
.alert-text{font-size:11px;color:#8d8171;margin-top:3px}
.empty{padding:30px;text-align:center;color:#98a49f;font-size:13px}
.kpi-bar{height:6px;border-radius:10px;background:#edf1ef;overflow:hidden;margin-top:10px}
.kpi-fill{height:100%;background:var(--sage);border-radius:10px}

.clinical-alert{padding:13px;border-radius:13px;background:#fff8ef;border:1px solid #f1dfc8;margin-bottom:9px}
.clinical-alert.resolved{background:#f5faf7;border-color:#dcebe2;opacity:.8}
.clinical-alert-title{font-size:12px;font-weight:700;color:#795f42}
.clinical-alert.resolved .clinical-alert-title{color:#5d806c}
.clinical-alert-text{font-size:11px;color:#7d7368;line-height:1.5;margin-top:4px}
.clinical-alert-actions{display:flex;gap:6px;flex-wrap:wrap;margin-top:9px}
.clinical-alert-actions .btn{font-size:10px;padding:6px 8px}
.login-screen{height:100vh;display:grid;place-items:center;background:linear-gradient(135deg,#f4f8f6,#f1f5f8)}
.login-box{width:min(420px,calc(100% - 30px));background:#fff;border:1px solid var(--line);border-radius:24px;padding:34px;box-shadow:0 20px 60px rgba(40,70,55,.08)}
.login-brand{display:flex;justify-content:center;align-items:center;gap:10px;color:var(--sage-dark);font-weight:700;font-size:22px}
.login-sub{text-align:center;color:#87948e;font-size:12px;margin:8px 0 28px}

.toast{
 position:fixed;right:22px;bottom:22px;background:#263d35;color:#fff;padding:12px 16px;
 border-radius:12px;font-size:12px;z-index:100;opacity:0;transform:translateY(10px);pointer-events:none;transition:.25s
}
.toast.show{opacity:1;transform:none}

/* PERFIL - Estilos exclusivos */
.profile-stat-card{
 background:linear-gradient(135deg,#f8faf9,#f1f5f3);
 border-radius:14px;
 padding:16px;
 text-align:center;
 border:1px solid var(--line);
 transition:.2s
}
.profile-stat-card:hover{transform:translateY(-2px);box-shadow:0 6px 16px rgba(50,80,60,.06)}
.profile-stat-card .icon-wrap{
 width:38px;height:38px;border-radius:12px;
 display:grid;place-items:center;margin:0 auto 8px;
 font-size:18px
}
.profile-stat-card .icon-wrap.green{background:#eaf3ee;color:#5d806c}
.profile-stat-card .icon-wrap.blue{background:#edf4f8;color:#557792}
.profile-stat-card .icon-wrap.gold{background:#f5efe6;color:#a8875c}
.profile-stat-card .icon-wrap.rose{background:#f5ecec;color:#b58080}
.profile-stat-card .number{font-size:26px;font-weight:800;color:#263238}
.profile-stat-card .label{font-size:10px;color:#8a9892;text-transform:uppercase;letter-spacing:.05em;margin-top:2px}

.timeline-item{
 display:flex;gap:14px;padding:14px 0;
 border-bottom:1px solid #f0f3f2;
 transition:.15s
}
.timeline-item:last-child{border-bottom:0}
.timeline-item:hover{background:#fafcfb;margin:0 -12px;padding:14px 12px;border-radius:10px}
.timeline-dot{
 width:12px;height:12px;border-radius:50%;margin-top:3px;
 flex-shrink:0;border:2px solid white;box-shadow:0 0 0 2px var(--line)
}
.timeline-dot.evolution{background:#8eb29d;box-shadow:0 0 0 2px #8eb29d}
.timeline-dot.observation{background:#8db0c8;box-shadow:0 0 0 2px #8db0c8}
.timeline-dot.alert{background:#c9a87c;box-shadow:0 0 0 2px #c9a87c}
.timeline-content{flex:1;min-width:0}
.timeline-content .title{font-weight:700;font-size:13px;color:#263238}
.timeline-content .meta{font-size:10px;color:#8a9892;margin:2px 0 6px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.timeline-content .text{font-size:12px;color:#596761;line-height:1.6;white-space:pre-wrap}
.timeline-badge{font-size:9px;padding:2px 8px;border-radius:12px;font-weight:600}
.timeline-badge.evo{background:#eaf3ee;color:#5d806c}
.timeline-badge.obs{background:#edf4f8;color:#557792}

.profile-config-item{
 display:flex;align-items:center;justify-content:space-between;
 padding:10px 0;border-bottom:1px solid #f0f3f2
}
.profile-config-item:last-child{border-bottom:0}
.profile-config-item .info{display:flex;align-items:center;gap:10px}
.profile-config-item .info .icon{color:#8a9892}
.profile-config-item .info .label{font-size:12px;font-weight:500;color:#34413c;margin:0}
.profile-config-item .info .desc{font-size:10px;color:#8a9892}
.switch{
 width:38px;height:20px;border-radius:12px;
 background:#dfe7e3;cursor:pointer;transition:.2s;
 position:relative;flex-shrink:0
}
.switch.on{background:var(--sage)}
.switch .thumb{
 width:16px;height:16px;border-radius:50%;
 background:white;position:absolute;top:2px;left:2px;
 transition:.2s;box-shadow:0 1px 3px rgba(0,0,0,.15)
}
.switch.on .thumb{left:20px}

@media(max-width:950px){
 .stats{grid-template-columns:repeat(2,1fr)}
 .profile-layout{grid-template-columns:1fr}
 .form-grid{grid-template-columns:repeat(2,1fr)}
}
@media(max-width:680px){
 .sidebar{width:58px;padding:15px 6px}
 .sidebar:hover{width:58px}
 .sidebar:hover .brand span,.sidebar:hover .nav-label{opacity:0}
 .brand{padding:0 5px;justify-content:center}
 .nav button{justify-content:center;padding:0}
 .main{margin-left:0}
 .topbar{height:62px;padding:0 15px}
 .content{height:calc(100vh - 62px);padding:17px 13px}
 .form-grid,.form-grid.two{grid-template-columns:1fr}
 .stats{grid-template-columns:1fr 1fr}
 .profile-head{align-items:flex-start;flex-wrap:wrap;padding:0 14px}
 .profile-actions{width:100%;margin-left:0}
 .profile-body{padding:15px}
 .profile-avatar{width:75px;height:75px}
 .profile-name{font-size:18px}
 .month-grid{min-width:620px}
}
</style>
</head>

<body>

<div id="loginScreen" class="login-screen">
  <div class="login-box">
    <div class="login-brand">
      <div class="brand-mark"><i data-lucide="heart-handshake"></i></div>
      ASAS
    </div>
    <div class="login-sub">Gestão integrada para educação e cuidado</div>

    <div class="field">
      <label class="label">Usuário</label>
      <input id="loginUser" class="input" value="professor" autocomplete="username">
    </div>

    <div class="field">
      <label class="label">Senha</label>
      <input id="loginPass" class="input" type="password" value="123" autocomplete="current-password">
    </div>

    <button id="loginBtn" class="btn btn-primary" style="width:100%;padding:12px">
      <i data-lucide="log-in"></i> Entrar no ASAS
    </button>

    <div style="text-align:center;color:#a0aaa6;font-size:10px;margin-top:14px">
      Acesso demonstrativo: professor / 123
    </div>
  </div>
</div>

<div id="app" class="app" style="display:none">

<aside class="sidebar">
  <div class="brand">
    <div class="brand-mark"><i data-lucide="heart-handshake"></i></div>
    <span>ASAS</span>
  </div>

  <nav class="nav">
    <button data-page="dashboard" class="active">
      <i data-lucide="layout-dashboard"></i><span class="nav-label">Dashboard</span>
    </button>
    <button data-page="alunos">
      <i data-lucide="users"></i><span class="nav-label">Alunos</span>
    </button>
    <button data-page="agenda">
      <i data-lucide="calendar-days"></i><span class="nav-label">Agenda</span>
    </button>
    <button data-page="financeiro">
      <i data-lucide="wallet-cards"></i><span class="nav-label">Financeiro</span>
    </button>
    <button data-page="perfil">
      <i data-lucide="user-round"></i><span class="nav-label">Meu Perfil</span>
    </button>
  </nav>

  <div class="side-bottom nav">
    <button id="logoutBtn">
      <i data-lucide="log-out"></i><span class="nav-label">Sair</span>
    </button>
  </div>
</aside>

<main class="main">

<header class="topbar">
  <div id="pageTitle" class="page-title">
    <i data-lucide="layout-dashboard"></i> Dashboard
  </div>
  <div class="user-mini">
    <span id="topUserName" style="font-size:12px;color:#68766f"></span>
    <div id="topAvatar" class="avatar">P</div>
  </div>
</header>

<div class="content">

<section id="page-dashboard" class="view active"></section>
<section id="page-alunos" class="view"></section>
<section id="page-agenda" class="view"></section>
<section id="page-financeiro" class="view"></section>
<section id="page-perfil" class="view"></section>
<section id="page-prontuario" class="view"></section>

</div>
</main>
</div>

<div id="toast" class="toast"></div>

function esc(v){
 return String(v??"")
 .replace(/&/g,"&amp;")
 .replace(/</g,"&lt;")
 .replace(/>/g,"&gt;")
 .replace(/"/g,"&quot;");
}

function money(v){
 return Number(v||0).toLocaleString("pt-BR",{style:"currency",currency:"BRL"});
}

function dateISO(d){
 const x=new Date(d);
 return x.getFullYear()+"-"+String(x.getMonth()+1).padStart(2,"0")+"-"+String(x.getDate()).padStart(2,"0");
}

function parseDate(s){
 const [y,m,d]=s.split("-").map(Number);
 return new Date(y,m-1,d);
}

function today(){
 return dateISO(new Date());
}

function fmtDate(s){
 if(!s)return"";
 return parseDate(s).toLocaleDateString("pt-BR",{day:"2-digit",month:"2-digit",year:"numeric"});
}

function monthName(d){
 return d.toLocaleDateString("pt-BR",{month:"long",year:"numeric"});
}

function initials(name){
 return (name||"?").split(" ").slice(0,2).map(x=>x[0]).join("").toUpperCase();
}

function syncClinicalAlerts(){
 data.clinicalAlerts=data.clinicalAlerts||[];
 const seen=new Set();
 data.alunos.forEach(s=>{
  (s.evolucoes||[]).forEach(e=>{
   const text=`${e.titulo||""} ${e.texto||""}`;
   if(!/queda|piora|falt|atenção|dificuldade|regress|baixo desempenho/i.test(text))return;
   const key=`evo:${e.id}`; seen.add(key);
   let a=data.clinicalAlerts.find(x=>x.key===key);
   if(!a){
    const reason=/falt/i.test(text)?"Registro relacionado a falta/assiduidade.":/queda|piora|regress/i.test(text)?"Registro indica possível queda, piora ou regressão.":"Registro indica um ponto que merece acompanhamento.";
    a={id:uid(),key,studentId:s.id,evolutionId:e.id,title:e.titulo||"Alerta clínico",text:reason+" "+String(e.texto||"").slice(0,180),status:"active",createdAt:e.data};
    data.clinicalAlerts.push(a);
   }else if(a.status!=="resolved"){
    a.studentId=s.id;a.evolutionId=e.id;a.title=e.titulo||"Alerta clínico";
    a.text=(/falt/i.test(text)?"Registro relacionado a falta/assiduidade.":/queda|piora|regress/i.test(text)?"Registro indica possível queda, piora ou regressão.":"Registro indica um ponto que merece acompanhamento.")+" "+String(e.texto||"").slice(0,180);
   }
  });
 });
 data.clinicalAlerts=data.clinicalAlerts.filter(a=>!a.evolutionId||seen.has(a.key)||a.status==="resolved");
 return data.clinicalAlerts;
}
function getClinicalAlerts(){ syncClinicalAlerts(); return (data.clinicalAlerts||[]).filter(a=>a.status!=="resolved"); }
function resolveClinicalAlert(id){const a=(data.clinicalAlerts||[]).find(x=>x.id===id);if(!a)return;a.status="resolved";a.resolvedAt=today();save();notify("Alerta arquivado como resolvido.");renderDashboard();}
function reopenClinicalAlert(id){const a=(data.clinicalAlerts||[]).find(x=>x.id===id);if(!a)return;a.status="active";delete a.resolvedAt;save();notify("Alerta reaberto.");renderDashboard();}
function focusAlertEvolution(id){const a=(data.clinicalAlerts||[]).find(x=>x.id===id);if(!a)return;openStudent(a.studentId);setTimeout(()=>{const t=document.getElementById("evTitle"),x=document.getElementById("evText");if(t)t.value="Acompanhamento do alerta";if(x)x.focus();},120);}

function monthAppointments(date){
 const y=date.getFullYear();
 const m=date.getMonth();
 return activeAppointments().filter(a=>{
   const d=parseDate(a.data);
   return d.getFullYear()===y&&d.getMonth()===m;
 });
}

function monthPaid(){
 const y=calendarDate.getFullYear();
 const m=calendarDate.getMonth();
 return data.transacoes.filter(t=>{
   const d=parseDate(t.data);
   return d.getFullYear()===y&&d.getMonth()===m;
 }).reduce((s,t)=>s+Number(t.valor),0);
}

function monthDone(){
 const y=new Date().getFullYear();
 const m=new Date().getMonth();
 return activeAppointments().filter(a=>{
   const d=parseDate(a.data);
   return d.getFullYear()===y&&d.getMonth()===m&&a.presente;
 }).length;
}

function monthScheduled(){
 const y=new Date().getFullYear();
 const m=new Date().getMonth();
 return activeAppointments().filter(a=>{
   const d=parseDate(a.data);
   return d.getFullYear()===y&&d.getMonth()===m;
 }).length;
}

function attendanceRate(){
 const arr=activeAppointments().filter(a=>a.presente||a.status==="falta");
 if(!arr.length)return 0;
 return Math.round(arr.filter(a=>a.presente).length/arr.length*100);
}

function weekStart(d){
 const x=new Date(d);
 const day=x.getDay();
 const diff=day===0?-6:1-day;
 x.setDate(x.getDate()+diff);
 x.setHours(0,0,0,0);
 return x;
}

function weekDates(d){
 const s=weekStart(d);
 return WEEK.map((_,i)=>{
   const x=new Date(s);
   x.setDate(s.getDate()+i);
   return x;
 });
}

function weekPending(){
 const dates=weekDates(new Date());
 const keys=dates.map(dateISO);
 return activeAppointments().filter(a=>keys.includes(a.data)&&!a.pago)
 .reduce((sum,a)=>sum+(getStudent(a.alunoId)?.valor||0),0);
}

function saveConsultation(){

 const c={id:uid(),data:dataVal,observacoes:document.getElementById("consObs").value.trim(),acoes:document.getElementById("consAcoes").value.trim(),pais:document.getElementById("consPais").value.trim(),solicitacoes:document.getElementById("consSolic").value.trim(),comportamentos:{}};
 ["participacao","atencao","comunicacao","autonomia","comportamento","emocional"].forEach(k=>{const v=document.getElementById("cons_"+k)?.value;if(v)c.comportamentos[k]=v;});

 save(); syncClinicalAlerts(); notify("Consulta registrada."); renderStudentProfile("overview");

function ensureStudentModules(s){
 s.behaviorRecords=s.behaviorRecords||[];
 s.consultas=s.consultas||s.behaviorRecords;
 if(!s.behaviorRecords.length&&s.consultas.length)s.behaviorRecords=s.consultas;
 s.avaliacoes=s.avaliacoes||[];
 s.escola=s.escola||{nome:"",professores:"",registros:[]};
 s.escola.registros=s.escola.registros||[];
}

 ensureStudentModules(s);

 s.behaviorRecords=s.consultas;
 save(); renderStudentProfile("overview"); notify("Consulta removida.");
}

function createAssessment(){
 const s=getStudent(currentStudent); if(!s)return;
 ensureStudentModules(s);
 const titulo=document.getElementById("avTitulo")?.value.trim();
 const objetivo=document.getElementById("avObjetivo")?.value.trim();
 const raw=document.getElementById("avQuestoes")?.value||"";
 const questoes=raw.split(/\n+/).map(x=>x.trim()).filter(Boolean).map((texto,i)=>({id:uid(),numero:i+1,texto}));
 if(!titulo||!questoes.length){notify("Informe o título e pelo menos uma questão.");return;}
 s.avaliacoes.push({id:uid(),data:today(),titulo,objetivo,questoes,resultados:[]});
 save(); notify("Avaliação criada."); renderStudentProfile("avaliacoes");
}

function applyAssessment(id){
 const s=getStudent(currentStudent); if(!s)return;
 ensureStudentModules(s);
 if(!s.avaliacoes.find(x=>x.id===id))return;
 currentAssessment=id;
 renderStudentProfile("aplicar");
}

function saveAssessmentApplication(){
 const s=getStudent(currentStudent); if(!s)return;
 ensureStudentModules(s);
 const a=s.avaliacoes.find(x=>x.id===currentAssessment); if(!a)return;
 const respostas=a.questoes.map((q,i)=>document.getElementById("resp_"+i)?.value.trim()||"");
 a.resultados=a.resultados||[];
 a.resultados.push({
  id:uid(),data:today(),respostas,
  resumo:document.getElementById("avResumo")?.value.trim()||"Aplicação concluída."
 });
 a.finalizada=true;
 save(); notify("Aplicação registrada no histórico do aluno."); currentAssessment=null; renderStudentProfile("avaliacoes");
}

 return `https://wa.me/55${phone}?text=${encodeURIComponent(message)}`;
}

function toggleAgendaForm(){
 const f=document.getElementById("agendaForm");

function renderWeek(){

 const dates=weekDates(calendarDate);

 let html=`<div style="overflow:auto"><div class="week-grid">`;
 html+=`<div class="week-head"></div>`;

 dates.forEach(d=>{
   html+=`
   <div class="week-head">
     ${d.toLocaleDateString("pt-BR",{weekday:"short"})}
     <br>
     <span style="font-size:14px;color:#34413c">${d.getDate()}</span>
   </div>`;
 });

 HOURS.forEach(hour=>{
   html+=`<div class="time-cell">${hour}</div>`;

   dates.forEach(d=>{
     const iso=dateISO(d);
     const appointments=activeAppointments().filter(a=>a.data===iso&&a.hora===hour);

     if(!appointments.length){
       html+=`
       <div class="slot" onclick="quickSchedule('${iso}','${hour}')">
         <div class="empty-slot">+</div>
       </div>`;
     }else{
       html+=`<div class="slot">`;
       appointments.forEach(a=>{
         const s=getStudent(a.alunoId);
         const t=TYPES[a.tipo];
         html+=`
         <div class="event ${t.cls}" onclick="openStudent('${s.id}')">
           <strong>${esc(s.nome)}</strong>

 });

 html+=`</div></div>`;

}

function renderMonth(){

 const y=calendarDate.getFullYear();
 const m=calendarDate.getMonth();

 const first=new Date(y,m,1);
 const last=new Date(y,m+1,0);

 let start=first.getDay();
 start=start===0?6:start-1;

 const total=Math.ceil((start+last.getDate())/7)*7;

 let html=`<div style="overflow:auto"><div class="month-grid">`;

 ["Seg","Ter","Qua","Qui","Sex","Sáb","Dom"].forEach(d=>{
   html+=`<div class="week-head">${d}</div>`;
 });

 for(let i=0;i<total;i++){

   const day=i-start+1;
   let d=new Date(y,m,day);
   const inMonth=d.getMonth()===m;
   const iso=dateISO(d);
   const events=activeAppointments().filter(a=>a.data===iso);

   html+=`
   <div class="month-day ${inMonth?"":"other"}" onclick="${inMonth?`selectMonthDay('${iso}')`:""}">
     <div class="day-number">${d.getDate()}</div>
     <div class="dot-row">
       ${events.slice(0,7).map(a=>`<span class="dot ${TYPES[a.tipo].cls}"></span>`).join("")}
     </div>
     <div class="day-events">
       ${events.slice(0,3).map(a=>{
         const s=getStudent(a.alunoId);
         return `<div class="day-event">${a.hora} · ${esc(s?.nome||"Aluno")}</div>`;
       }).join("")}
       ${events.length>3?`<div style="font-size:9px;color:#8a9892">+${events.length-3} atendimentos</div>`:""}
     </div>
   </div>`;
 }

 html+=`</div></div>`;
 return html;
}

function saveAppointment(){

 const alunoId=document.getElementById("agAluno").value;
 const dataValue=document.getElementById("agData").value;
 const hora=document.getElementById("agHora").value;
 const tipo=document.getElementById("agTipo").value;

 if(!alunoId||!dataValue||!hora){
   notify("Preencha aluno, data e horário.");
   return;
 }

 const occupied=activeAppointments().some(a=>a.data===dataValue&&a.hora===hora);

 if(occupied){
   notify("Este horário já possui atendimento.");
   return;
 }

 data.agenda.push({
   id:uid(),
   alunoId,
   data:dataValue,
   hora,
   tipo,
   status:"agendado",
   presente:false,
   pago:false
 });

 save();
 notify("Atendimento agendado.");
 renderAgenda();
}

function cancelAppointment(id){

 const a=data.agenda.find(x=>x.id===id);
 if(!a)return;

 if(!confirm("Cancelar este atendimento?"))return;

 a.status="cancelado";
 save();
 notify("Atendimento cancelado.");
 renderPage();
}

function togglePresence(id){

 const a=data.agenda.find(x=>x.id===id);
 if(!a)return;

 a.presente=!a.presente;

 if(a.presente)a.status="realizado";
 else a.status="agendado";

 save();
 notify(a.presente?"Presença registrada.":"Presença removida.");
 renderPage();
}

function togglePayment(id){

 const a=data.agenda.find(x=>x.id===id);
 if(!a)return;

 const s=getStudent(a.alunoId);
 if(!s)return;

 if(!a.pago){

   a.pago=true;

   data.transacoes.push({
     id:uid(),
     data:a.data,
     agendaId:a.id,
     alunoId:s.id,
     descricao:`Sessão de ${s.nome}`,
     valor:Number(s.valor)||0
   });

   notify(`Pagamento de ${money(s.valor)} registrado.`);
 }else{

   a.pago=false;
   data.transacoes=data.transacoes.filter(t=>t.agendaId!==a.id);

   notify("Pagamento revertido.");
 }

 save();
 renderPage();
}

function pdfSafe(v){return String(v??"").replace(/[\r\n]+/g," ").trim();}

function pdfInstance(){
  if(!window.jspdf||!window.jspdf.jsPDF){notify("A biblioteca de PDF não foi carregada. Verifique sua conexão e tente novamente.");return null;}
  return new window.jspdf.jsPDF({unit:"mm",format:"a4"});
}

function pdfText(doc,text,x,y,maxWidth,lineHeight=5){
  const lines=doc.splitTextToSize(pdfSafe(text),maxWidth);
  lines.forEach(line=>{if(y>280){doc.addPage();y=18;}doc.text(line,x,y);y+=lineHeight;});
  return y;
}

     <div class="icon-wrap" style="background:#e8eee6;color:#6a8a7a;"><i data-lucide="wallet" style="width:20px;"></i></div>
     <div class="number">${money(data.transacoes.reduce((s,t) => s + Number(t.valor||0), 0))}</div>
     <div class="label">Total faturado</div>
   </div>

   <div class="profile-stat-card" style="background:linear-gradient(135deg,#f5f6f8,#eef1f5);">
     <div class="icon-wrap" style="background:#e6edf4;color:#5a7a94;"><i data-lucide="percent" style="width:20px;"></i></div>
     <div class="number">${taxaPresenca}%</div>
     <div class="label">Assiduidade</div>
   </div>

   <div class="profile-stat-card" style="background:linear-gradient(135deg,#f8f5f0,#f3efe8);">
     <div class="icon-wrap" style="background:#efe8de;color:#a08060;"><i data-lucide="bell" style="width:20px;"></i></div>
     <div class="number">${totalAlertas}</div>
     <div class="label">Alertas ativos</div>
   </div>

   <div class="profile-stat-card" style="background:linear-gradient(135deg,#f5f2f8,#efeaf5);">
     <div class="icon-wrap" style="background:#e8e2f0;color:#7a6a8e;"><i data-lucide="clock" style="width:20px;"></i></div>
     <div class="number">${activeAppointments().filter(a => a.data >= today()).length}</div>
     <div class="label">Próximos atend.</div>
   </div>

 </div>

 <!-- ====== ATENDIMENTOS POR TIPO ====== -->
 <div class="card" style="margin-bottom:18px;">
   <div class="section-title" style="font-size:13px;">Atendimentos por tipo</div>
   <div style="display:flex;gap:20px;flex-wrap:wrap;margin-top:10px;">
     <div><span class="tag" style="background:#f0f5ec;color:#5d806c;">🧠 Psicopedagogia</span> <strong>${porTipo.psicopedagogia}</strong></div>
     <div><span class="tag" style="background:#edf4f8;color:#557792;">🧘 Psicologia</span> <strong>${porTipo.psicologia}</strong></div>
     <div><span class="tag" style="background:#f5f0f8;color:#80678c;">📚 Aula</span> <strong>${porTipo.aula}</strong></div>
   </div>
 </div>

 <!-- ====== PERFIL + FORMULÁRIO ====== -->
 <div class="grid" style="grid-template-columns: 1fr 1.8fr; gap: 18px;">

   <!-- COLUNA ESQUERDA - AVATAR E INFO -->
   <div class="card" style="text-align:center; padding:24px 16px;">
     ${avatarHTML(p, "profile-avatar")}
     <div style="font-size:20px;font-weight:800;margin-top:14px;color:#263238;">${esc(p.nome)}</div>
     <div style="font-size:12px;color:#8a9892;margin-top:3px;">${esc(p.especialidade)}</div>
     <div style="font-size:11px;color:#8a9892;margin-top:6px;line-height:1.5;max-width:280px;margin-left:auto;margin-right:auto;">${p.bio ? esc(p.bio) : 'Profissional dedicado ao desenvolvimento acadêmico, emocional e cognitivo.'}</div>

     <div style="margin-top:14px;display:flex;gap:6px;flex-wrap:wrap;justify-content:center;">
       <span class="tag">${totalAlunos} alunos</span>
       <span class="tag">${totalAtendimentos} atend.</span>
       <span class="tag">${totalEvolucoes} evoluções</span>
     </div>

     <div style="margin-top:16px;padding-top:14px;border-top:1px solid var(--line);">
       <div style="font-size:10px;color:#8a9892;text-transform:uppercase;letter-spacing:.05em;">Membro desde</div>
       <div style="font-size:12px;font-weight:600;color:#34413c;">${fmtDate(data.alunos.length ? data.alunos[0]?.evolucoes?.[0]?.data || today() : today())}</div>
     </div>
   </div>

   <!-- COLUNA DIREITA - FORMULÁRIO -->
   <div class="card">

     <div class="form-grid two">

       <div class="field">
         <label class="label">Nome profissional</label>
         <input id="profNome" class="input" value="${esc(p.nome)}">
       </div>

       <div class="field">
         <label class="label">Especialidade</label>
         <input id="profEspecialidade" class="input" value="${esc(p.especialidade)}">
       </div>

       <div class="field" style="grid-column:1/-1;">
         <label class="label">URL da foto</label>
         <input id="profFoto" class="input" value="${esc(p.foto||"")}" placeholder="https://exemplo.com/foto.jpg">
       </div>

       <div class="field" style="grid-column:1/-1;">
         <label class="label">Bio profissional</label>
         <textarea id="profBio" class="textarea" rows="2">${esc(p.bio||"")}</textarea>
       </div>

     </div>

     <div class="field" style="margin-top:6px;">
       <label class="label">Configurações</label>
       <div class="profile-config-item">
         <div class="info">
           <span class="icon"><i data-lucide="bell" style="width:16px;"></i></span>
           <div><div class="label">Notificações</div><div class="desc">Receber alertas e lembretes</div></div>
         </div>
         <div class="switch ${p.configuracoes?.notificacoes !== false ? 'on' : ''}" onclick="toggleSwitch(this, 'cfgNotif')">
           <div class="thumb"></div>
         </div>
       </div>
       <div class="profile-config-item">
         <div class="info">
           <span class="icon"><i data-lucide="clock" style="width:16px;"></i></span>
           <div><div class="label">Lembretes</div><div class="desc">Lembrar de atendimentos próximos</div></div>
         </div>
         <div class="switch ${p.configuracoes?.lembretes !== false ? 'on' : ''}" onclick="toggleSwitch(this, 'cfgLembretes')">
           <div class="thumb"></div>
         </div>
       </div>
     </div>

     <button class="btn btn-primary" onclick="saveProfile()" style="width:100%;">
       <i data-lucide="save"></i> Salvar perfil
     </button>

   </div>
 </div>

 <!-- ====== NOVA OBSERVAÇÃO ====== -->
 <div class="card" style="margin-top:18px; border-left:4px solid #8db0c8;">
   <div class="section-head">
     <div>
       <div class="section-title"><i data-lucide="file-text" style="width:16px;color:#8db0c8;"></i> Nova Observação</div>
       <div class="section-sub">Registre anotações pessoais, reflexões ou lembretes sobre sua prática.</div>
     </div>
   </div>
   <div class="form-grid two">
     <div class="field">
       <label class="label">Título</label>
       <input id="obsTitulo" class="input" placeholder="Ex.: Reflexão sobre atendimento">
     </div>
     <div class="field">
       <label class="label">Data</label>
       <input id="obsData" class="input" type="date" value="${today()}">
     </div>
   </div>
   <div class="field">
     <label class="label">Observação</label>
     <textarea id="obsTexto" class="textarea" rows="2" placeholder="Descreva sua observação ou reflexão..."></textarea>
   </div>
   <button class="btn btn-blue" onclick="saveObservacao()">
     <i data-lucide="file-text"></i> Salvar observação
   </button>
 </div>

 <!-- ====== NOVA EVOLUÇÃO PESSOAL ====== -->
 <div class="card" style="margin-top:14px; border-left:4px solid #8eb29d;">
   <div class="section-head">
     <div>
       <div class="section-title"><i data-lucide="trending-up" style="width:16px;color:#8eb29d;"></i> Nova Evolução Pessoal</div>
       <div class="section-sub">Registre marcos, aprendizados ou mudanças na sua prática profissional.</div>
     </div>
   </div>
   <div class="form-grid two">
     <div class="field">
       <label class="label">Título</label>
       <input id="evoPessoalTitulo" class="input" placeholder="Ex.: Curso de Neuropsicopedagogia">
     </div>
     <div class="field">
       <label class="label">Data</label>
       <input id="evoPessoalData" class="input" type="date" value="${today()}">
     </div>
   </div>
   <div class="field">
     <label class="label">Descrição</label>
     <textarea id="evoPessoalTexto" class="textarea" rows="2" placeholder="Descreva sua evolução, aprendizado ou conquista..."></textarea>
   </div>
   <button class="btn btn-primary" onclick="saveEvolucaoPessoal()">
     <i data-lucide="trending-up"></i> Salvar evolução
   </button>
 </div>

 <!-- ====== LINHA DO TEMPO ====== -->
 <div class="card" style="margin-top:18px;">
   <div class="section-head">
     <div>
       <div class="section-title">📜 Linha do Tempo</div>
       <div class="section-sub">Histórico completo de observações e evoluções pessoais.</div>
     </div>
     ${timeline.length > 0 ? `<span style="font-size:11px;color:#89968f;">${timeline.length} registro(s)</span>` : ''}
   </div>

   ${timeline.length === 0 ? `
     <div class="empty" style="padding:20px;">
       <i data-lucide="inbox" style="width:28px;color:#c1ccc7;display:block;margin:0 auto 8px;"></i>
       Nenhuma observação ou evolução registrada ainda.
     </div>
   ` : `
     <div style="max-height:420px;overflow-y:auto;padding-right:4px;">
       ${timeline.map(item => {
         const isEvo = item.tipo === 'evolucao';
         const dotClass = isEvo ? 'evolution' : 'observation';
         const badgeClass = isEvo ? 'evo' : 'obs';
         const badgeText = isEvo ? 'Evolução' : 'Observação';
         const icon = isEvo ? 'trending-up' : 'file-text';
         return `
           <div class="timeline-item">
             <div class="timeline-dot ${dotClass}"></div>
             <div class="timeline-content">
               <div class="title">${esc(item.titulo || badgeText)}</div>
               <div class="meta">
                 ${fmtDate(item.data)}
                 <span class="timeline-badge ${badgeClass}">${badgeText}</span>
                 <button style="border:0;background:none;color:#b5b5b5;font-size:10px;cursor:pointer;" onclick="deletarRegistroPessoal('${item.id}','${item.tipo}')">
                   <i data-lucide="trash-2" style="width:12px;"></i>
                 </button>
               </div>
               <div class="text">${esc(item.texto || item.descricao || '')}</div>
             </div>
           </div>
         `;
       }).join('')}
     </div>
   `}
 </div>
 `;

 lucide.createIcons();
}

// ============================================================
// FUNÇÕES DO PERFIL
// ============================================================

function toggleSwitch(el, inputId) {
  el.classList.toggle('on');
  // O valor será salvo ao clicar em "Salvar perfil"
}

function saveObservacao(){
 const titulo = document.getElementById("obsTitulo").value.trim() || "Observação";
 const data = document.getElementById("obsData").value || today();
 const texto = document.getElementById("obsTexto").value.trim();

 if(!texto){
   notify("Escreva a observação antes de salvar.");
   return;
 }

 data.professor.observacoes = data.professor.observacoes || [];
 data.professor.observacoes.push({
   id: uid(),
   data: data,
   titulo: titulo,
   texto: texto
 });

 save();
 notify("✅ Observação salva com sucesso!");
 renderPerfil();
}

function saveEvolucaoPessoal(){
 const titulo = document.getElementById("evoPessoalTitulo").value.trim() || "Evolução pessoal";
 const data = document.getElementById("evoPessoalData").value || today();
 const texto = document.getElementById("evoPessoalTexto").value.trim();

 if(!texto){
   notify("Descreva sua evolução antes de salvar.");
   return;
 }

 data.professor.evolucoesPessoais = data.professor.evolucoesPessoais || [];
 data.professor.evolucoesPessoais.push({
   id: uid(),
   data: data,
   titulo: titulo,
   texto: texto
 });

 save();
 notify("✅ Evolução pessoal registrada!");
 renderPerfil();
}

function deletarRegistroPessoal(id, tipo){
 if(!confirm("Excluir este registro?")) return;

 if(tipo === 'observacao'){
   data.professor.observacoes = (data.professor.observacoes||[]).filter(o => o.id !== id);
 } else if(tipo === 'evolucao'){
   data.professor.evolucoesPessoais = (data.professor.evolucoesPessoais||[]).filter(e => e.id !== id);
 }

 save();
 notify("Registro removido.");
 renderPerfil();
}

function saveProfile(){

 const p = data.professor;

 p.nome = document.getElementById("profNome").value.trim() || "Professor ASAS";
 p.especialidade = document.getElementById("profEspecialidade").value.trim();
 p.foto = document.getElementById("profFoto").value.trim();
 p.bio = document.getElementById("profBio").value.trim();

 // Ler configurações dos switches
 const switches = document.querySelectorAll('.switch');
 p.configuracoes = p.configuracoes || {};
 switches.forEach((sw, index) => {
   const key = index === 0 ? 'notificacoes' : 'lembretes';
   p.configuracoes[key] = sw.classList.contains('on');
 });

 save();
 updateUser();
 notify("✅ Perfil salvo com sucesso!");
 renderPerfil();
}

function generateProfilePDF() {
  const doc = pdfInstance();
  if (!doc) return;

  const p = data.professor;
  const pageW = doc.internal.pageSize.getWidth();
  let y = 18;

  doc.setFont("helvetica", "bold");
  doc.setFontSize(22);
  doc.text("ASAS", 15, y);
  y += 10;

  doc.setFontSize(16);
  doc.text("Perfil Profissional", 15, y);
  y += 8;

  doc.setFont("helvetica", "normal");
  doc.setFontSize(10);
  doc.text(`Gerado em: ${fmtDate(today())}`, 15, y);
  y += 10;

  doc.setFont("helvetica", "bold");
  doc.setFontSize(14);
  doc.text(p.nome || "Professor", 15, y);
  y += 6;

  doc.setFont("helvetica", "normal");
  doc.setFontSize(10);
  y = pdfText(doc, `Especialidade: ${p.especialidade || "Não informada"}`, 15, y, pageW - 30);
  y = pdfText(doc, `Bio: ${p.bio || "Não informada"}`, 15, y, pageW - 30);
  y += 4;

  // Estatísticas
  const totalAlunos = data.alunos.length;
  const totalAtendimentos = activeAppointments().length;
  const totalEvolucoes = (p.evolucoesPessoais || []).length;
  const totalObservacoes = (p.observacoes || []).length;

  doc.setFont("helvetica", "bold");
  doc.text("Resumo estatístico", 15, y);
  y += 6;
  doc.setFont("helvetica", "normal");
  y = pdfText(doc, `Alunos: ${totalAlunos} | Atendimentos: ${totalAtendimentos} | Evoluções: ${totalEvolucoes} | Observações: ${totalObservacoes}`, 15, y, pageW - 30);
  y += 6;

  // Evoluções
  doc.setFont("helvetica", "bold");
  doc.text("Evoluções pessoais", 15, y);
  y += 6;
  doc.setFont("helvetica", "normal");
  const evos = (p.evolucoesPessoais || []).slice().sort((a,b) => b.data.localeCompare(a.data));
  if (!evos.length) {
    y = pdfText(doc, "Nenhuma evolução registrada.", 15, y, pageW - 30);
  } else {
    evos.forEach(e => {
      y = pdfText(doc, `${fmtDate(e.data)} - ${e.titulo || "Evolução"}`, 15, y, pageW - 30);
      y = pdfText(doc, `  ${e.texto || ""}`, 15, y, pageW - 30);
    });
  }
  y += 4;

  // Observações
  doc.setFont("helvetica", "bold");
  doc.text("Observações pessoais", 15, y);
  y += 6;
  doc.setFont("helvetica", "normal");
  const obs = (p.observacoes || []).slice().sort((a,b) => b.data.localeCompare(a.data));
  if (!obs.length) {
    y = pdfText(doc, "Nenhuma observação registrada.", 15, y, pageW - 30);
  } else {
    obs.forEach(o => {
      y = pdfText(doc, `${fmtDate(o.data)} - ${o.titulo || "Observação"}`, 15, y, pageW - 30);
      y = pdfText(doc, `  ${o.texto || ""}`, 15, y, pageW - 30);
    });
  }

  doc.save(`perfil-${p.nome?.replace(/\s/g, '-') || 'professor'}.pdf`);
  notify("✅ Perfil exportado em PDF!");
}

function updateUser(){

 const p=data.professor;

 document.getElementById("topUserName").textContent=p.nome;

 const a=document.getElementById("topAvatar");

 if(p.foto){
   a.style.backgroundImage=`url('${p.foto}')`;
   a.textContent="";
 }else{
   a.style.backgroundImage="";
   a.textContent=initials(p.nome);
 }
}

function login(){

 const user=document.getElementById("loginUser").value.trim();
 const pass=document.getElementById("loginPass").value;

 if(user!=="professor"||pass!=="123"){
   notify("Usuário ou senha inválidos.");
   return;
 }

 data.session=true;
 save();

 document.getElementById("loginScreen").style.display="none";
 document.getElementById("app").style.display="flex";

 updateUser();
 navigate("dashboard");
}

function logout(){

 data.session=false;
 save();

 document.getElementById("app").style.display="none";
 document.getElementById("loginScreen").style.display="grid";
}

document.querySelectorAll(".nav button[data-page]").forEach(btn=>{
 btn.addEventListener("click",()=>navigate(btn.dataset.page));
});

document.getElementById("loginBtn").addEventListener("click",login);

document.getElementById("loginPass").addEventListener("keydown",e=>{
 if(e.key==="Enter")login();
});

document.getElementById("logoutBtn").addEventListener("click",logout);

function init(){

 lucide.createIcons();
 syncClinicalAlerts();

 if(data.session){
   document.getElementById("loginScreen").style.display="none";
   document.getElementById("app").style.display="flex";
   updateUser();
   navigate("dashboard");
 }else{
   document.getElementById("loginScreen").style.display="grid";
   document.getElementById("app").style.display="none";
 }
}

init();

window.calendarPrev=calendarPrev;

window.openConsultation=openConsultation;
window.newConsultationForm=newConsultationForm;

window.setFinancePage=setFinancePage;
window.changeFinanceMonth=changeFinanceMonth;

window.reopenClinicalAlert=reopenClinicalAlert;

// Novas funções do perfil
window.saveObservacao=saveObservacao;
window.saveEvolucaoPessoal=saveEvolucaoPessoal;
window.deletarRegistroPessoal=deletarRegistroPessoal;
window.toggleSwitch=toggleSwitch;
window.generateProfilePDF=generateProfilePDF;

</script>
