<script>
// ============================================================
// CONFIGURAÇÃO DO SUPABASE
// ============================================================

const SUPABASE_URL = 'https://teujmiojdyytzpavritf.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InRldWptaW9qZHl5dHpwYXZyaXRmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODc5NTYxMjUsImV4cCI6MjEwMzUzMjEyNX0.rGLzx-B1bdrlcaa9a_gAOHrDv52UGHQfg-dquLJtyIk';

const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

// ============================================================
// VARIÁVEIS GLOBAIS
// ============================================================

let data = {};
let currentPage = "dashboard";
let currentStudent = null;
let currentAssessment = null;
let calendarDate = new Date();
let calendarMode = "day";
let selectedDay = null;
let studentSectionPage = { overview: 1, avaliacoes: 1, escola: 1 };
let currentConsultation = null;
let financeYear = new Date().getFullYear();
let financeMonth = new Date().getMonth();
let currentUserId = null;
let financePage = 1;
let isSaving = false;
let isDataLoaded = false;

let avalStepMode = null;
let avalStepQuestions = [];
let avalStepCurrentIndex = 0;
let avalStepResponses = [];
let avalStepTemplateId = null;
let avalStepAlunoId = null;
let avalStepResumo = '';
let avalStepExistingId = null;

const TYPES = {
    psicologia: { label: "Psicologia", cls: "psico" },
    psicopedagogia: { label: "Psicopedagogia", cls: "psicopeg" },
    aula: { label: "Aula Particular", cls: "aula" }
};

const WEEK = ["Seg", "Ter", "Qua", "Qui", "Sex"];
const HOURS = [];
for (let h = 8; h <= 18; h++) HOURS.push(String(h).padStart(2, "0") + ":00");

// ============================================================
// FUNÇÕES AUXILIARES
// ============================================================

function uid() {
    return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, function(c) {
        var r = Math.random() * 16 | 0;
        var v = c === 'x' ? r : (r & 0x3 | 0x8);
        return v.toString(16);
    });
}

function esc(v) {
    return String(v ?? "").replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
}

function money(v) {
    return Number(v || 0).toLocaleString("pt-BR", { style: "currency", currency: "BRL" });
}

function dateISO(d) {
    const x = new Date(d);
    return x.getFullYear() + "-" + String(x.getMonth() + 1).padStart(2, "0") + "-" + String(x.getDate()).padStart(2, "0");
}

function parseDate(s) {
    if (!s) return new Date(NaN);
    if (s instanceof Date) return new Date(s);
    const [y, m, d] = String(s).split("-").map(Number);
    return new Date(y, m - 1, d);
}

function today() {
    return dateISO(new Date());
}

function fmtDate(s) {
    if (!s) return "";
    const d = parseDate(s);
    if (isNaN(d)) return String(s);
    return d.toLocaleDateString("pt-BR", { day: "2-digit", month: "2-digit", year: "numeric" });
}

function fmtDateTime(s) {
    if (!s) return "";
    const d = parseDate(s);
    if (isNaN(d)) return String(s);
    return d.toLocaleDateString("pt-BR", { day: "2-digit", month: "short", year: "numeric" });
}

function monthName(d) {
    return d.toLocaleDateString("pt-BR", { month: "long", year: "numeric" });
}

function initials(name) {
    return (name || "?").split(" ").slice(0, 2).map(x => x[0]).join("").toUpperCase();
}

function avatarHTML(person, cls = "student-avatar") {
    if (!person) return `<div class="${cls}">?</div>`;
    if (person.foto) {
        return `<div class="${cls}" style="background-image:url('${esc(person.foto)}')"></div>`;
    }
    return `<div class="${cls}">${esc(initials(person.nome))}</div>`;
}

function notify(message) {
    const t = document.getElementById("toast");
    if (!t) return;
    t.textContent = message;
    t.classList.add("show");
    clearTimeout(window.toastTimer);
    window.toastTimer = setTimeout(() => t.classList.remove("show"), 2600);
}

function activeAppointments() {
    if (!data.agenda) return [];
    return data.agenda.filter(x => {
        if (x.status === "cancelado") return false;
        const student = getStudent(x.alunoId);
        return student !== null && student !== undefined;
    });
}

function getStudent(id) {
    if (!data.alunos) return null;
    return data.alunos.find(a => a.id === id) || null;
}

function ensureStudentModules(s) {
    if (!s) return;
    s.consultas = s.consultas || [];
    s.avaliacoes = s.avaliacoes || [];
    s.evolucoes = s.evolucoes || [];
    s.escola = s.escola || { nome: "", professores: "", registros: [] };
    s.escola.registros = s.escola.registros || [];
    s.observacoesClinicas = s.observacoesClinicas || [];
}

function defaultData() {
    return {
        session: false,
        professor: {
            nome: "Professor ASAS",
            especialidade: "Psicopedagogia Clínica",
            bio: "Profissional dedicado ao desenvolvimento acadêmico, emocional e cognitivo.",
            foto: "",
            observacoes: [],
            evolucoesPessoais: [],
            configuracoes: { notificacoes: true, tema: "claro", lembretes: true },
            vencimentoMensalidade: ''
        },
        alunos: [],
        agenda: [],
        transacoes: []
    };
}

function monthAppointments(date) {
    const y = date.getFullYear();
    const m = date.getMonth();
    return activeAppointments().filter(a => {
        const d = parseDate(a.data);
        return d.getFullYear() === y && d.getMonth() === m;
    });
}

function monthPaid() {
    const y = new Date().getFullYear();
    const m = new Date().getMonth();
    return (data.transacoes || []).filter(t => {
        const d = parseDate(t.data);
        return d.getFullYear() === y && d.getMonth() === m && (t.tipo || "receita") === "receita";
    }).reduce((s, t) => s + Number(t.valor), 0);
}

function monthDone() {
    const y = new Date().getFullYear();
    const m = new Date().getMonth();
    return activeAppointments().filter(a => {
        const d = parseDate(a.data);
        return d.getFullYear() === y && d.getMonth() === m && a.presente;
    }).length;
}

function monthScheduled() {
    const y = new Date().getFullYear();
    const m = new Date().getMonth();
    return activeAppointments().filter(a => {
        const d = parseDate(a.data);
        return d.getFullYear() === y && d.getMonth() === m;
    }).length;
}

function attendanceRate() {
    const arr = activeAppointments().filter(a => a.presente || a.status === "falta");
    if (!arr.length) return 0;
    return Math.round(arr.filter(a => a.presente).length / arr.length * 100);
}

function weekStart(d) {
    const x = new Date(d);
    const day = x.getDay();
    const diff = day === 0 ? -6 : 1 - day;
    x.setDate(x.getDate() + diff);
    x.setHours(0, 0, 0, 0);
    return x;
}

function weekDates(d) {
    const s = weekStart(d);
    return WEEK.map((_, i) => {
        const x = new Date(s);
        x.setDate(s.getDate() + i);
        return x;
    });
}

function weekPending() {
    const dates = weekDates(new Date());
    const keys = dates.map(dateISO);
    return activeAppointments().filter(a => keys.includes(a.data) && !a.pago)
        .reduce((sum, a) => sum + (getStudent(a.alunoId)?.valor || 0), 0);
}

function studentPager(items, page, size = 5, onclick = "") {
    const total = Math.max(1, Math.ceil(items.length / size));
    page = Math.min(Math.max(1, page), total);
    const slice = items.slice((page - 1) * size, page * size);
    return {
        slice,
        total,
        page,
        controls: total > 1 ? `
            <div style="display:flex;justify-content:center;align-items:center;gap:8px;margin-top:16px;padding-top:12px;border-top:1px solid var(--line)">
                <button class="btn btn-outline btn-sm" ${page <= 1 ? "disabled" : ""} onclick="${onclick}(${page - 1})"><i data-lucide="chevron-left"></i>Anterior</button>
                <span style="font-size:11px;color:#718078">Página ${page} de ${total}</span>
                <button class="btn btn-outline btn-sm" ${page >= total ? "disabled" : ""} onclick="${onclick}(${page + 1})">Próxima<i data-lucide="chevron-right"></i></button>
            </div>` : ""
    };
}

async function getCurrentUserId() {
    try {
        const { data: userData, error } = await supabaseClient.auth.getUser();
        if (error) return null;
        if (userData?.user?.id) {
            currentUserId = userData.user.id;
            return currentUserId;
        }
        return null;
    } catch (error) {
        return null;
    }
}

async function loginSupabase(email, password) {
    try {
        const { data, error } = await supabaseClient.auth.signInWithPassword({
            email: email,
            password: password
        });
        if (error) throw error;
        return data;
    } catch (error) {
        notify('Usuário ou senha inválidos.');
        return null;
    }
}

async function logoutSupabase() {
    try {
        const { error } = await supabaseClient.auth.signOut();
        if (error) throw error;
        return true;
    } catch (error) {
        return false;
    }
}

async function checkSession() {
    try {
        const { data, error } = await supabaseClient.auth.getSession();
        if (error) throw error;
        return data.session !== null;
    } catch (error) {
        return false;
    }
}

async function getUserId() {
    if (currentUserId) return currentUserId;
    const id = await getCurrentUserId();
    if (id) {
        currentUserId = id;
        return id;
    }
    throw new Error('Usuário não autenticado');
}

async function loadDataFromSupabase() {
    try {
        const userId = await getUserId();
        if (!userId) return null;

        const { data: professorData, error: profError } = await supabaseClient
            .from('professores')
            .select('*')
            .eq('user_id', userId)
            .maybeSingle();

        const { data: alunosData, error: alunosError } = await supabaseClient
            .from('alunos')
            .select('*')
            .eq('user_id', userId)
            .order('nome');

        const { data: evolucoesData, error: evoError } = await supabaseClient
            .from('evolucoes')
            .select('*')
            .eq('user_id', userId);

        const { data: consultasData, error: consError } = await supabaseClient
            .from('consultas')
            .select('*')
            .eq('user_id', userId);

        const { data: avaliacoesData, error: avError } = await supabaseClient
            .from('avaliacoes')
            .select('*')
            .eq('user_id', userId);

        const { data: resultadosData, error: resError } = await supabaseClient
            .from('resultados_avaliacoes')
            .select('*')
            .eq('user_id', userId);

        const { data: escolaData, error: escError } = await supabaseClient
            .from('escola')
            .select('*')
            .eq('user_id', userId);

        const { data: registrosEscolaData, error: regError } = await supabaseClient
            .from('registros_escola')
            .select('*')
            .eq('user_id', userId);

        const { data: agendaData, error: agendaError } = await supabaseClient
            .from('agenda')
            .select('*')
            .eq('user_id', userId)
            .order('data');

        const { data: transacoesData, error: transError } = await supabaseClient
            .from('transacoes')
            .select('*')
            .eq('user_id', userId);

        const { data: obsProfData, error: obsError } = await supabaseClient
            .from('observacoes_professor')
            .select('*')
            .eq('user_id', userId)
            .order('data', { ascending: false });

        const { data: evoProfData, error: evoProfError } = await supabaseClient
            .from('evolucoes_professor')
            .select('*')
            .eq('user_id', userId)
            .order('data', { ascending: false });

        const alunosNormalizados = (alunosData || []).map(mapAlunoFromDB);
        const evolucoesNorm = (evolucoesData || []).map(mapEvolucaoFromDB);
        const consultasNorm = (consultasData || []).map(mapConsultaFromDB);
        const avaliacoesNorm = (avaliacoesData || []).map(mapAvaliacaoFromDB);
        const resultadosNorm = (resultadosData || []).map(mapResultadoFromDB);
        const escolasNorm = (escolaData || []).map(mapEscolaFromDB);
        const registrosEscolaNorm = (registrosEscolaData || []).map(mapRegistroEscolaFromDB);

        alunosNormalizados.forEach(aluno => {
            aluno.evolucoes = evolucoesNorm.filter(e => e.aluno_id === aluno.id);
            aluno.consultas = consultasNorm.filter(c => c.aluno_id === aluno.id);
            aluno.avaliacoes = avaliacoesNorm.filter(a => a.aluno_id === aluno.id);
            aluno.avaliacoes.forEach(av => {
                av.resultados = resultadosNorm.filter(r => r.avaliacao_id === av.id);
            });
            const esc = escolasNorm.find(e => e.aluno_id === aluno.id);
            if (esc) {
                aluno.escola = {
                    id: esc.id,
                    aluno_id: esc.aluno_id,
                    nome: esc.nome || '',
                    professores: esc.professores || '',
                    registros: registrosEscolaNorm.filter(r => r.escola_id === esc.id)
                };
            } else {
                aluno.escola = { nome: '', professores: '', registros: [] };
            }
            ensureStudentModules(aluno);
        });

        const professorNormalizado = professorData
            ? mapProfessorFromDB(professorData)
            : {
                nome: "Professor ASAS",
                especialidade: "Psicopedagogia Clínica",
                bio: "Profissional dedicado ao desenvolvimento acadêmico, emocional e cognitivo.",
                foto: "",
                observacoes: [],
                evolucoesPessoais: [],
                configuracoes: { notificacoes: true, tema: "claro", lembretes: true }
            };

        if (obsProfData && !obsProfData.error) professorNormalizado.observacoes = obsProfData.map(mapObsProfFromDB);
        if (evoProfData && !evoProfData.error) professorNormalizado.evolucoesPessoais = evoProfData.map(mapEvoProfFromDB);

        const result = {
            session: true,
            professor: professorNormalizado,
            alunos: alunosNormalizados,
            agenda: (agendaData || []).map(mapAgendaFromDB),
            transacoes: (transacoesData || []).map(mapTransacaoFromDB)
        };

        isDataLoaded = true;
        return result;
    } catch (error) {
        console.error('Erro ao carregar dados:', error);
        notify('Erro ao carregar dados do servidor.');
        return null;
    }
}

const COLUMN_MAP = {
    'transacoes': ['id', 'user_id', 'agenda_id', 'aluno_id', 'data', 'descricao', 'valor', 'tipo', 'categoria'],
    'agenda': ['id', 'user_id', 'aluno_id', 'data', 'hora', 'tipo', 'status', 'presente', 'pago', 'updated_at'],
    'alunos': ['id', 'user_id', 'nome', 'idade', 'serie', 'responsavel', 'telefone', 'valor', 'foto', 'tags', 'observacoes', 'ativo', 'updated_at'],
    'professores': ['id', 'user_id', 'nome', 'especialidade', 'bio', 'foto', 'config_notificacoes', 'config_lembretes', 'vencimento_mensalidade', 'updated_at'],
    'evolucoes': ['id', 'user_id', 'aluno_id', 'data', 'titulo', 'texto'],
    'consultas': ['id', 'user_id', 'aluno_id', 'data', 'observacoes', 'acoes', 'pais', 'solicitacoes', 'comportamentos'],
    'avaliacoes': ['id', 'user_id', 'aluno_id', 'data', 'titulo', 'tipo', 'objetivo', 'questoes', 'finalizada'],
    'resultados_avaliacoes': ['id', 'user_id', 'avaliacao_id', 'data', 'respostas', 'resumo'],
    'escola': ['id', 'user_id', 'aluno_id', 'nome', 'professores', 'updated_at'],
    'registros_escola': ['id', 'user_id', 'escola_id', 'data', 'contato', 'tipo', 'assunto', 'relato'],
    'observacoes_professor': ['id', 'user_id', 'data', 'titulo', 'texto'],
    'evolucoes_professor': ['id', 'user_id', 'data', 'titulo', 'texto']
};

async function upsertSafe(tableName, payload, selectSingle = true) {
    let attempt = { ...payload };
    
    const knownColumns = COLUMN_MAP[tableName] || [];
    if (knownColumns.length > 0) {
        const filteredAttempt = {};
        knownColumns.forEach(col => {
            if (attempt[col] !== undefined) {
                filteredAttempt[col] = attempt[col];
            }
        });
        attempt = filteredAttempt;
    }

    for (let i = 0; i < 4; i++) {
        try {
            let query = supabaseClient.from(tableName).upsert(attempt);
            if (selectSingle) query = query.select().single();
            else query = query.select();
            const { data, error } = await query;
            if (!error) return data;
            
            if (error && (error.code === '42703' || /could not find the column/i.test(error.message || ''))) {
                const m = (error.message || '').match(/column "([^"]+)"/i) || (error.message || '').match(/([^"]+).*does not exist/i);
                const col = m ? m[1] : null;
                if (col && col in attempt) {
                    delete attempt[col];
                    continue;
                }
            }
            throw error;
        } catch (err) {
            if (i === 3) throw err;
            if (err.code === '42703' || /could not find the column/i.test(err.message || '')) {
                continue;
            }
            throw err;
        }
    }
    return null;
}

async function loadData() {
    const loaded = await loadDataFromSupabase();
    if (loaded) {
        if (!loaded.professor.observacoes) loaded.professor.observacoes = [];
        if (!loaded.professor.evolucoesPessoais) loaded.professor.evolucoesPessoais = [];
        if (!loaded.professor.configuracoes) {
            loaded.professor.configuracoes = { notificacoes: true, tema: "claro", lembretes: true };
        }
        loaded.alunos.forEach(s => ensureStudentModules(s));
        isDataLoaded = true;
        return loaded;
    }
    isDataLoaded = false;
    return defaultData();
}

async function saveData() {
    if (isSaving) return false;

    const isLoggedIn = await checkSession();
    if (!isLoggedIn) {
        console.warn('Usuário não está logado, dados não salvos.');
        return false;
    }

    isSaving = true;

    try {
        if (data.professor) await saveProfessor(data.professor);

        for (const aluno of (data.alunos || [])) {
            await saveAluno(aluno);
            for (const evo of (aluno.evolucoes || [])) {
                await saveEvolucao({ ...evo, aluno_id: aluno.id });
            }
            for (const consulta of (aluno.consultas || [])) {
                await saveConsulta({ ...consulta, aluno_id: aluno.id });
            }
            for (const av of (aluno.avaliacoes || [])) {
                const savedAv = await saveAvaliacao({ ...av, aluno_id: aluno.id });
                if (savedAv && av.resultados) {
                    for (const res of av.resultados) {
                        await saveResultadoAvaliacao({ ...res, avaliacao_id: savedAv.id });
                    }
                }
            }
            if (aluno.escola) {
                const savedEscola = await saveEscola({
                    id: aluno.escola.id || uid(),
                    aluno_id: aluno.id,
                    nome: aluno.escola.nome || '',
                    professores: aluno.escola.professores || ''
                });
                if (savedEscola) aluno.escola.id = savedEscola.id;
                if (aluno.escola.registros) {
                    for (const reg of aluno.escola.registros) {
                        await saveRegistroEscola({ ...reg, escola_id: aluno.escola.id });
                    }
                }
            }
        }

        const validAgenda = (data.agenda || []).filter(item => item && item.alunoId && getStudent(item.alunoId));
        for (const item of validAgenda) {
            await saveAgendaItem(item);
        }
        if (data.agenda) data.agenda = validAgenda;

        const validTrans = (data.transacoes || []).filter(t => {
            if (!t) return false;
            if (t.tipo === 'despesa') return true;
            return t.alunoId && getStudent(t.alunoId);
        });
        for (const trans of validTrans) {
            await saveTransacao(trans);
        }
        if (data.transacoes) data.transacoes = validTrans;

        for (const obs of (data.professor?.observacoes || [])) {
            await saveObservacaoProfessor(obs);
        }

        for (const evo of (data.professor?.evolucoesPessoais || [])) {
            await saveEvolucaoProfessor(evo);
        }

        return true;
    } catch (error) {
        console.error('Erro ao salvar dados:', error);
        notify('Erro ao salvar dados no servidor.');
        return false;
    } finally {
        isSaving = false;
    }
}

function navigate(page) {
    currentPage = page;
    currentStudent = null;

    document.querySelectorAll(".view").forEach(x => x.classList.remove("active"));
    const target = document.getElementById("page-" + page);
    if (target) target.classList.add("active");

    document.querySelectorAll(".nav button").forEach(x => {
        x.classList.toggle("active", x.dataset.page === page);
    });

    const info = {
        dashboard: ["layout-dashboard", "Dashboard"],
        alunos: ["users", "Alunos"],
        agenda: ["calendar-days", "Agenda"],
        avaliacoes: ["clipboard-check", "Avaliações"],
        financeiro: ["wallet-cards", "Financeiro"],
        perfil: ["user-round", "Meu Perfil"]
    };

    if (info[page]) {
        document.getElementById("pageTitle").innerHTML = `<i data-lucide="${info[page][0]}"></i>${info[page][1]}`;
    }

    if (page !== "avaliacoes") {
        avalStepMode = null;
        avalStepQuestions = [];
        avalStepCurrentIndex = 0;
        avalStepResponses = [];
        avalStepTemplateId = null;
        avalStepAlunoId = null;
    }

    renderPage();
    lucide.createIcons();
}

function renderPage() {
    if (!isDataLoaded || !data.session) {
        document.querySelectorAll(".view").forEach(view => {
            if (view.id !== "page-dashboard") {
                view.innerHTML = `<div class="empty">Faça login para visualizar.</div>`;
            }
        });
        return;
    }

    if (currentPage === "dashboard") renderDashboard();
    if (currentPage === "alunos") renderAlunos();
    if (currentPage === "agenda") renderAgenda();
    if (currentPage === "avaliacoes") renderAvaliacoes();
    if (currentPage === "financeiro") renderFinanceiro();
    if (currentPage === "perfil") renderPerfil();
}

function updateUser() {
    const p = data.professor;
    if (!p) return;
    document.getElementById("topUserName").textContent = p.nome;
    const a = document.getElementById("topAvatar");
    if (p.foto) {
        a.style.backgroundImage = `url('${p.foto}')`;

    } else {
        a.style.backgroundImage = "";
        a.textContent = initials(p.nome);
    }
}

async function login() {
    const user = document.getElementById("loginUser").value.trim();
    const pass = document.getElementById("loginPass").value;

    if (!user || !pass) { notify("Preencha usuário e senha."); return; }

    const result = await loginSupabase(user, pass);

    if (result) {
        try {
            const loadedData = await loadData();
            if (loadedData) {
                data = loadedData;
                data.session = true;
                isDataLoaded = true;
            } else {
                data = defaultData();
                data.session = true;
                isDataLoaded = false;
            }

            document.getElementById("loginScreen").style.display = "none";
            document.getElementById("app").style.display = "flex";

            updateUser();
            navigate("dashboard");
            notify(`Bem-vindo, ${data.professor?.nome || "Professor"}!`);
        } catch (error) {
            notify('Erro ao carregar dados. Tente novamente.');
        }
    }
}

async function logout() {
    if (data && data.session) {
        try { await saveData(); } catch (error) {}
    }

    try { await supabaseClient.auth.signOut(); } catch (error) {}

    data = defaultData();
    data.session = false;
    isDataLoaded = false;
    currentUserId = null;
    currentStudent = null;
    currentPage = "dashboard";

    document.getElementById("app").style.display = "none";
    document.getElementById("loginScreen").style.display = "grid";
    document.getElementById("loginPass").value = "";

    document.querySelectorAll(".view").forEach(view => {
        view.innerHTML = '';
        view.classList.remove('active');
    });

    const dashboardView = document.getElementById("page-dashboard");
    if (dashboardView) {
        dashboardView.classList.add('active');
        dashboardView.innerHTML = `
            <div class="empty" style="padding:60px;text-align:center">
                <p style="font-size:18px;color:#8a9892">👋 Logout realizado com sucesso!</p>
                <p style="font-size:13px;color:#a0aaa6;margin-top:8px">Faça login para visualizar seus dados.</p>
            </div>
        `;
    }

    document.getElementById("topUserName").textContent = "";
    const avatarEl = document.getElementById("topAvatar");
    avatarEl.style.backgroundImage = "";
    avatarEl.textContent = "?";

    notify("Logout realizado com sucesso!");
}

    const hora = new Date().getHours();
    if (hora >= 6 && hora < 12) return "Bom dia";
    if (hora >= 12 && hora < 18) return "Boa tarde";
    if (hora >= 18 && hora < 24) return "Boa noite";
    return "Boa noite";
}

function filterStudents() {
    const term = (document.getElementById('studentSearch')?.value || '').toLowerCase().trim();
    const mode = window.studentListFilter || 'active';
    const all = (data.alunos || []);
    
    let list = all.filter(a => `${a.nome} ${a.responsavel} ${(a.tags || []).join(' ')}`.toLowerCase().includes(term));
    if (mode === 'active') list = list.filter(a => a.ativo !== false);
    if (mode === 'attention') {
        list = list.filter(a => {
            const hasUpcomingUnpaid = activeAppointments().some(x => x.alunoId === a.id && x.data >= today() && !x.pago);
            const hasEvolucoes = (a.evolucoes || []).length > 0;
            const hasRecentAval = (a.avaliacoes || []).some(av => (av.resultados || []).some(r => r.data >= today()));
            return hasUpcomingUnpaid || !hasEvolucoes || !hasRecentAval;
        });
    }

    const grid = document.getElementById('studentGrid');
    if (!grid) return;
    if (!list.length) {
        grid.innerHTML = '<div class="card empty" style="grid-column:1/-1">Nenhum aluno encontrado com esse filtro.</div>';
        return;
    }

    grid.innerHTML = list.sort((a, b) => a.nome.localeCompare(b.nome)).map(a => {

function toggleStudentForm(forceShow) {
    const f = document.getElementById("newStudentForm");
    if (!f) return;
    if (typeof forceShow === "boolean") {
        f.style.display = forceShow ? "block" : "none";
    } else {
        f.style.display = f.style.display === "none" ? "block" : "none";
    }
    if (f.style.display === "block") f.scrollIntoView({ behavior: "smooth", block: "start" });
}

async function saveStudent() {
    const nome = document.getElementById("fNome").value.trim();
    if (!nome) { notify("Informe o nome do aluno."); return; }

    const student = {
        id: uid(),
        nome: nome,
        idade: Number(document.getElementById("fIdade").value) || 0,
        serie: document.getElementById("fSerie").value.trim(),
        responsavel: document.getElementById("fResponsavel").value.trim(),
        telefone: document.getElementById("fTelefone").value.trim(),
        valor: Number(document.getElementById("fValor").value) || 0,
        foto: document.getElementById("fFoto").value.trim(),
        tags: document.getElementById("fTags").value.split(",").map(x => x.trim()).filter(Boolean),
        observacoes: document.getElementById("fObs").value.trim(),
        ativo: true
    };

    data.alunos.push(student);
    ensureStudentModules(student);
    await saveData();
    notify("Aluno cadastrado com sucesso.");
    toggleStudentForm(false);
    renderAlunos();
}

function openStudent(id) {
    currentStudent = id;
    document.querySelectorAll(".view").forEach(x => x.classList.remove("active"));
    document.getElementById("page-prontuario").classList.add("active");
    document.querySelectorAll(".nav button").forEach(x => x.classList.remove("active"));
    document.getElementById("pageTitle").innerHTML = `<i data-lucide="notebook-tabs"></i>Prontuário`;
    studentSectionPage = { overview: 1, avaliacoes: 1, escola: 1 };
    renderStudentProfile();
    lucide.createIcons();
}

function renderAgenda() {
    if (!isDataLoaded || !data || !data.agenda) {
        document.getElementById("page-agenda").innerHTML = `<div class="empty"><p>Carregando dados...</p></div>`;
        return;
    }

    const selected = selectedDay || dateISO(calendarDate);
    const selectedDate = parseDate(selected);
    const week = weekDates(selectedDate);
    const active = activeAppointments().filter(a => a.data === selected).sort((a,b) => a.hora.localeCompare(b.hora));
    const weekCount = activeAppointments().filter(a => week.map(dateISO).includes(a.data)).length;
    const done = active.filter(a => a.presente).length;
    const pending = active.filter(a => !a.pago).length;
    const totalValue = active.reduce((s, a) => s + Number(getStudent(a.alunoId)?.valor || 0), 0);
    const paidValue = active.filter(a => a.pago).reduce((s, a) => s + Number(getStudent(a.alunoId)?.valor || 0), 0);

    const dayChips = week.map(d => {
        const iso = dateISO(d);
        const count = activeAppointments().filter(a => a.data === iso).length;
        const cls = iso === selected ? 'active' : '';
        return `<div class="day-chip ${cls}" onclick="selectAgendaDay('${iso}')"><div class="dow">${d.toLocaleDateString('pt-BR',{weekday:'short'}).replace('.','')}</div><span class="num">${d.getDate()}</span><span class="count">${count} ${count === 1 ? 'atend.' : 'atend.'}</span></div>`;

    const dateLabel = selectedDate.toLocaleDateString('pt-BR',{weekday:'long',day:'2-digit',month:'long'});

    document.getElementById("page-agenda").innerHTML = `
        ${renderHelpBox("agenda")}

        <div class="page-intro">

                <h1>Agenda</h1>
                <p>Veja o seu dia, registre presença e acompanhe pagamentos sem perder o foco.</p>
            </div>

        </div>

            <div class="section-head"><div><div class="section-title">Novo atendimento</div><div class="section-sub">Cadastre o próximo compromisso em poucos campos.</div></div><button class="btn btn-outline btn-sm" onclick="toggleAgendaForm()">Fechar</button></div>
            <div class="form-grid">
                <div class="field"><label class="label">Aluno</label><select id="agAluno" class="select">${(data.alunos || []).filter(a=>a.ativo!==false).map(a => `<option value="${a.id}" ${a.id === currentStudent ? 'selected':''}>${esc(a.nome)}</option>`).join('')}</select></div>
                <div class="field"><label class="label">Data</label><input id="agData" class="input" type="date" value="${selected}"></div>
                <div class="field"><label class="label">Horário</label><input id="agHora" class="input" type="time" value="09:00"></div>
                <div class="field"><label class="label">Tipo</label><select id="agTipo" class="select"><option value="psicopedagogia">Psicopedagogia</option><option value="psicologia">Psicologia</option><option value="aula">Aula Particular</option></select></div>
            </div>
            <div class="form-actions"><button class="btn btn-primary" onclick="saveAppointment()"><i data-lucide="save"></i>Salvar atendimento</button><button class="btn btn-outline" onclick="toggleAgendaForm()">Cancelar</button></div>
        </div>

        <div class="agenda-shell">
            <div class="agenda-main">
                <div class="card agenda-main">
                    <div class="agenda-head">
                        <div><div class="agenda-date-title">${esc(dateLabel)}</div><div class="section-sub">${active.length} atendimento(s) programado(s)</div></div>
                        <div class="agenda-tools">

                                const typ = TYPES[a.tipo];

                    <div class="summary-row"><span>Recebido</span><b style="color:var(--sage2)">${money(paidValue)}</b></div>
                    <div class="summary-row"><span>Pendente</span><b style="color:#9a6b30">${money(totalValue - paidValue)}</b></div>
                </div>
                <div class="card panel">
                    <div class="section-title">Próximos atendimentos</div>
                    <div class="section-sub">Seu fluxo imediato.</div>
                    <div style="margin-top:8px">
                        ${activeAppointments().filter(a => a.data >= today()).sort((a,b) => (a.data + a.hora).localeCompare(b.data + b.hora)).slice(0, 5).map(a => {
                            const s = getStudent(a.alunoId);
                            return s ? `
                                <div style="padding:8px 0;border-bottom:1px solid #f0f3f2;cursor:pointer" onclick="openStudent('${s.id}')">
                                    <div style="font-size:9px;color:#8a9792">${fmtDate(a.data)} · ${a.hora}</div>
                                    <div style="font-size:11px;font-weight:700">${esc(s.nome)}</div>
                                </div>
                            ` : '';
                        }).join('') || '<div class="empty" style="padding:12px 0;font-size:10px">Nenhum próximo atendimento.</div>'}
                    </div>
                </div>
            </aside>
        </div>
    `;
    lucide.createIcons();
}

function toggleAgendaForm() {
    const f = document.getElementById("agendaForm");
    if (!f) return;
    f.style.display = f.style.display === "none" ? "block" : "none";
    if (f.style.display === "block") f.scrollIntoView({ behavior: "smooth", block: "center" });
}

async function saveAppointment() {
    const alunoId = document.getElementById("agAluno").value;
    const dataValue = document.getElementById("agData").value;
    const hora = document.getElementById("agHora").value;
    const tipo = document.getElementById("agTipo").value;

    if (!alunoId || !dataValue || !hora) {
        notify("Preencha aluno, data e horário.");
        return;
    }

    const aluno = getStudent(alunoId);
    if (!aluno) { notify("Aluno não encontrado."); return; }

    const occupied = activeAppointments().some(a => a.data === dataValue && a.hora === hora);
    if (occupied) { notify("Este horário já possui atendimento."); return; }

    const newAppointment = { id: uid(), alunoId, data: dataValue, hora, tipo, status: "agendado", presente: false, pago: false };
    data.agenda.push(newAppointment);
    await saveData();
    notify("Atendimento agendado com sucesso!");
    renderAgenda();
}

async function cancelAppointment(id) {
    const a = data.agenda.find(x => x.id === id);
    if (!a) return;
    if (!confirm("Cancelar este atendimento?")) return;
    a.status = "cancelado";
    await saveData();
    notify("Atendimento cancelado.");
    renderPage();
}

async function togglePresence(id) {
    const a = data.agenda.find(x => x.id === id);
    if (!a) return;
    a.presente = !a.presente;
    a.status = a.presente ? "realizado" : "agendado";
    await saveData();
    notify(a.presente ? "Presença registrada." : "Presença removida.");
    renderPage();
}

async function togglePayment(id) {
    const a = data.agenda.find(x => x.id === id);
    if (!a) return;
    const s = getStudent(a.alunoId);
    if (!s) return;

    if (!a.pago) {
        a.pago = true;
        data.transacoes.push({ id: uid(), data: a.data, agendaId: a.id, alunoId: s.id, descricao: `Sessão de ${s.nome}`, valor: Number(s.valor) || 0, tipo: "receita", categoria: "Sessão" });
        await saveData();
        notify(`Pagamento de ${money(s.valor)} registrado.`);
    } else {
        a.pago = false;
        data.transacoes = data.transacoes.filter(t => t.agendaId !== a.id);
        await saveData();
        notify("Pagamento revertido.");
    }
    renderPage();
}

function calendarPrev() { calendarDate.setDate(calendarDate.getDate() - 1); selectedDay = dateISO(calendarDate); renderAgenda(); }
function calendarNext() { calendarDate.setDate(calendarDate.getDate() + 1); selectedDay = dateISO(calendarDate); renderAgenda(); }
function calendarToday() { calendarDate = new Date(); selectedDay = today(); renderAgenda(); }
function setCalendarMode(mode) { calendarMode = mode; selectedDay = selectedDay || today(); renderAgenda(); }
function selectAgendaDay(day) { selectedDay = day; calendarDate = parseDate(day); renderAgenda(); }

function getAvaliacoesGlobais() {
    const todas = [];
    (data.alunos || []).forEach(aluno => {
        (aluno.avaliacoes || []).forEach(av => {
            todas.push({ ...av, alunoId: aluno.id, alunoNome: aluno.nome });
        });
    });
    return todas;
}

function getTemplateById(id) {
    return ASSESSMENT_TEMPLATES.find(t => t.id === id);
}

function startAvalStep() {
    avalStepMode = 'select';
    avalStepTemplateId = null;
    avalStepAlunoId = null;
    avalStepCurrentIndex = 0;
    avalStepResponses = [];
    avalStepResumo = '';
    avalStepExistingId = null;
    renderAvaliacoes();
}

function startAvalStepWithTemplate(tplId) {
    avalStepMode = 'select';
    avalStepTemplateId = tplId;
    avalStepAlunoId = null;
    avalStepCurrentIndex = 0;
    avalStepResponses = [];
    avalStepResumo = '';
    avalStepExistingId = null;
    renderAvaliacoes();
}

function renderAvalStepSelect() {
    document.getElementById("page-avaliacoes").innerHTML = `
        <button class="btn btn-outline btn-sm" onclick="cancelAvalStep()" style="margin-bottom:14px"><i data-lucide="arrow-left"></i>Voltar</button>

                <div class="field"><label class="label">Instrumento</label><select id="stepTemplate" class="select">${ASSESSMENT_TEMPLATES.map(t => `<option value="${t.id}" ${t.id === avalStepTemplateId ? 'selected' : ''}>${esc(t.nome)}</option>`).join('')}</select></div>

            </div>
        </div>
    `;
    lucide.createIcons();
}

function startAvalStepAnswer() {
    const alunoId = document.getElementById("stepAluno")?.value;
    const tplId = document.getElementById("stepTemplate")?.value;

    if (!alunoId) { notify("Selecione um aluno."); return; }
    if (!tplId) { notify("Selecione um instrumento."); return; }

    const aluno = getStudent(alunoId);
    const tpl = getTemplateById(tplId);
    if (!aluno || !tpl) { notify("Dados não encontrados."); return; }

    avalStepAlunoId = alunoId;
    avalStepTemplateId = tplId;
    avalStepCurrentIndex = 0;
    avalStepResponses = [];

    if (tpl.tipo === "anamnese" && tpl.campos) {
        avalStepQuestions = tpl.campos.flatMap(sec => sec.itens.map(it => ({
            secao: sec.secao,
            rotulo: it.rotulo,
            chave: it.chave,
            tipo: it.tipo,
            valor: ''
        })));
    } else {
        avalStepQuestions = (tpl.questoes || []).map((q, i) => ({
            index: i,
            texto: q,
            escala: tpl.escala || [{ valor: 0, rotulo: "Resposta" }]
        }));
    }

    avalStepMode = 'answering';
    renderAvaliacoes();
}

function renderAvalStepAnswer() {
    const total = avalStepQuestions.length;
    const idx = avalStepCurrentIndex;
    const q = avalStepQuestions[idx];
    if (!q || total === 0) { avalStepMode = 'done'; renderAvaliacoes(); return; }

    const isAnamnese = q.secao !== undefined;
    const pct = Math.round(((idx) / total) * 100);
    let content = '';

    if (isAnamnese) {
        content = `
            <div class="eyebrow">${esc(q.secao)}</div>
            <div class="step-question">${esc(q.rotulo)}</div>
            ${q.tipo === 'textarea' ? `<textarea id="stepAnswer" class="textarea" style="min-height:140px;font-size:13px" placeholder="Preencha esta informação..."></textarea>` : `<input id="stepAnswer" class="input" type="${q.tipo === 'date' ? 'date' : 'text'}" placeholder="Preencha esta informação...">`}
        `;
    } else {
        const escala = q.escala || [{ valor: 0, rotulo: 'Resposta' }];
        content = `
            <div class="eyebrow">Questão ${idx + 1} de ${total}</div>
            <div class="step-question">${esc(q.texto)}</div>
            <div class="step-options">
                ${escala.map(op => `
                    <label class="${avalStepResponses[idx] === op.valor ? 'selected' : ''}" onclick="selectAvalStepOption(${idx}, ${op.valor})">
                        <input type="radio" name="avalStepOpt" value="${op.valor}" ${avalStepResponses[idx] === op.valor ? 'checked' : ''} style="margin-right:7px;accent-color:var(--sage)">
                        ${esc(op.rotulo)}
                    </label>
                `).join('')}
            </div>
        `;
    }

    document.getElementById("page-avaliacoes").innerHTML = `
        <button class="btn btn-outline btn-sm" onclick="cancelAvalStep()" style="margin-bottom:14px"><i data-lucide="arrow-left"></i>Sair da aplicação</button>
        <div class="step-shell">
            <div class="card step-card">
                <div class="step-meta"><span>${esc(getStudent(avalStepAlunoId)?.nome || 'Aluno')}</span><span>${idx + 1} / ${total}</span></div>
                <div class="step-progress-wide"><i style="width:${Math.max(3, ((idx + 1) / total) * 100)}%"></i></div>
                ${content}
                <div class="step-nav">
                    <button class="btn btn-outline" onclick="avalStepPrev()" ${idx === 0 ? 'disabled' : ''}>Anterior</button>
                    <button class="btn btn-primary" onclick="avalStepNext()">${idx === total - 1 ? 'Concluir' : 'Continuar'} <i data-lucide="arrow-right"></i></button>
                </div>
            </div>
        </div>
    `;
    lucide.createIcons();
    if (isAnamnese && avalStepResponses[idx] !== undefined) {
        const el = document.getElementById('stepAnswer');
        if (el) el.value = avalStepResponses[idx] || '';
    }
}

function selectAvalStepOption(idx, value) {
    avalStepResponses[idx] = value;
    renderAvalStepAnswer();
}

function avalStepPrev() {
    if (avalStepCurrentIndex > 0) {
        avalStepCurrentIndex--;
        renderAvalStepAnswer();
    }
}

function avalStepNext() {
    const idx = avalStepCurrentIndex;
    const q = avalStepQuestions[idx];
    const isAnamnese = q.secao !== undefined;

    if (isAnamnese) {
        const el = document.getElementById("stepAnswer");
        if (el) avalStepResponses[idx] = el.value || '';
    } else {
        if (avalStepResponses[idx] === undefined || avalStepResponses[idx] === null) {
            notify("Selecione uma opção antes de continuar.");
            return;
        }
    }

    if (idx === avalStepQuestions.length - 1) {
        avalStepMode = 'done';
        renderAvaliacoes();
    } else {
        avalStepCurrentIndex++;
        renderAvalStepAnswer();
    }
}

function renderAvalStepDone() {
    const tpl = getTemplateById(avalStepTemplateId);
    const aluno = getStudent(avalStepAlunoId);

    if (!tpl || !aluno) { cancelAvalStep(); return; }

    let respostas = [];
    let questoes = [];

    if (tpl.tipo === "anamnese" && tpl.campos) {
        avalStepQuestions.forEach((q, i) => {
            respostas.push({ secao: q.secao, rotulo: q.rotulo, chave: q.chave, valor: avalStepResponses[i] || '' });
        });
        questoes = tpl.campos.flatMap(sec => sec.itens.map(it => it.rotulo));
    } else if (tpl.questoes) {
        avalStepQuestions.forEach((q, i) => {
            const val = avalStepResponses[i];
            const escala = q.escala || [];
            const op = escala.find(e => e.valor === val);
            respostas.push({ questao: q.texto, valor: val !== undefined ? val : null, rotulo: op ? op.rotulo : "Sem resposta" });
        });
        questoes = tpl.questoes.map((q, i) => ({ id: uid(), numero: i + 1, texto: q }));
    }

    const avId = uid();
    const novaAval = {
        id: avId,
        data: today(),
        titulo: tpl.nome,
        tipo: tpl.tipo,
        objetivo: tpl.descricao,
        questoes: questoes,
        resultados: [{
            id: uid(),
            data: today(),
            respostas: respostas,
            resumo: avalStepResumo || "Avaliação concluída."
        }],
        finalizada: true
    };

    if (aluno) {
        ensureStudentModules(aluno);
        aluno.avaliacoes.push(novaAval);
        saveData().then(() => {
            notify(`Avaliação "${tpl.nome}" aplicada a ${aluno.nome} com sucesso!`);
        });
    }

    document.getElementById("page-avaliacoes").innerHTML = `
        <div class="card" style="max-width:600px;margin:40px auto;text-align:center;padding:40px">
            <div style="font-size:48px;margin-bottom:16px">✅</div>
            <div class="section-title" style="font-size:20px">Avaliação concluída!</div>
            <div class="section-sub" style="font-size:14px;margin-top:8px">${esc(tpl.nome)} aplicada a ${esc(aluno.nome)}</div>
            <div style="margin-top:20px;display:flex;gap:10px;justify-content:center;flex-wrap:wrap">
                <button class="btn btn-primary" onclick="cancelAvalStep()"><i data-lucide="check"></i>Ver avaliações</button>
                <button class="btn btn-outline" onclick="gerarPDFAvaliacao('${aluno.id}','${avId}')"><i data-lucide="file-text"></i>PDF</button>
                <button class="btn btn-soft" onclick="openStudent('${aluno.id}')">Ver prontuário</button>
            </div>
        </div>
    `;
    lucide.createIcons();
}

function gerarPDFAvaliacao(alunoId, avalId) {
    const s = getStudent(alunoId);
    if (!s) return;
    const av = s.avaliacoes.find(x => x.id === avalId);
    if (!av) return;

    const doc = new window.jspdf.jsPDF({ unit: 'mm', format: 'a4' });
    const pageW = doc.internal.pageSize.getWidth();
    let y = 20;

    doc.setFont('helvetica', 'bold');
    doc.setFontSize(18);
    doc.text('ASAS - Avaliação Psicopedagógica', pageW / 2, y, { align: 'center' });
    y += 10;

    doc.setFont('helvetica', 'bold');
    doc.setFontSize(14);
    doc.text(esc(av.titulo), pageW / 2, y, { align: 'center' });
    y += 8;

    doc.setFont('helvetica', 'normal');
    doc.setFontSize(10);
    doc.text(`Aluno: ${esc(s.nome)}`, 20, y);
    y += 6;
    doc.text(`Data: ${fmtDate(av.data)}`, 20, y);
    y += 6;
    if (av.objetivo) {
        doc.text(`Objetivo: ${esc(av.objetivo)}`, 20, y);
        y += 8;
    }

    const resultado = av.resultados && av.resultados.length ? av.resultados[av.resultados.length - 1] : null;

    if (av.questoes && av.questoes.length) {
        doc.setFont('helvetica', 'bold');
        doc.text('Questões e Respostas:', 20, y);
        y += 6;
        doc.setFont('helvetica', 'normal');

        av.questoes.forEach((q, i) => {
            const resp = resultado && resultado.respostas ? resultado.respostas[i] || '' : '';
            const text = `${q.numero}. ${q.texto}\nResposta: ${resp || 'Não respondido'}`;
            const lines = doc.splitTextToSize(text, pageW - 40);
            lines.forEach(line => {
                if (y > 270) { doc.addPage(); y = 20; }
                doc.text(line, 20, y);
                y += 5;
            });
            y += 2;
        });
    }

    if (resultado && resultado.resumo) {
        y += 4;
        doc.setFont('helvetica', 'bold');
        doc.text('Resumo da Aplicação:', 20, y);
        y += 6;
        doc.setFont('helvetica', 'normal');
        const lines = doc.splitTextToSize(esc(resultado.resumo), pageW - 40);
        lines.forEach(line => {
            if (y > 270) { doc.addPage(); y = 20; }
            doc.text(line, 20, y);
            y += 5;
        });
    }

    y += 10;
    doc.setFont('helvetica', 'bold');
    doc.text('________________________________________', 40, y);
    y += 6;
    doc.text(esc(data.professor?.nome || 'Professor'), 40, y);
    y += 5;
    doc.text('Profissional Responsável', 40, y);
    y += 10;
    doc.setFontSize(8);
    doc.text(`Documento gerado em ${fmtDate(today())} - ASAS Gestão Psicopedagógica`, 20, y);

    doc.save(`avaliacao-${s.nome}-${av.titulo}.pdf`);
    notify("PDF da avaliação gerado com sucesso!");
}

    const now = new Date();
    if (typeof financeYear !== "number") financeYear = now.getFullYear();
    if (typeof financeMonth !== "number") financeMonth = now.getMonth();

    const label = new Date(financeYear, financeMonth, 1).toLocaleDateString("pt-BR", { month: "long", year: "numeric" });

        const d = parseDate(t.data);
        return d.getFullYear() === financeYear && d.getMonth() === financeMonth;

            <button class="btn btn-outline btn-sm" onclick="changeFinanceMonth(1)"><i data-lucide="chevron-right"></i></button>
        </div>

        <div class="metric-grid">
            <div class="card metric"><div class="metric-top"><span class="label">Saldo</span><div class="metric-icon"><i data-lucide="scale"></i></div></div><div class="value" style="color:${received - expenses >= 0 ? 'var(--sage2)' : 'var(--danger)'}">${money(received - expenses)}</div><div class="meta">Recebimentos menos despesas</div></div>
            <div class="card metric"><div class="metric-top"><span class="label">Recebido</span><div class="metric-icon"><i data-lucide="arrow-down-left"></i></div></div><div class="value">${money(received)}</div><div class="meta">${rec.length} recebimento(s)</div></div>
            <div class="card metric"><div class="metric-top"><span class="label">Despesas</span><div class="metric-icon" style="background:var(--danger-soft);color:var(--danger)"><i data-lucide="arrow-up-right"></i></div></div><div class="value">${money(expenses)}</div><div class="meta">${desp.length} despesa(s)</div></div>

            </div>

                <div class="side-card">
                    <div class="sc-title">Resumo do mês</div>

                            return acc;

async function saveDespesa() {
    const descricao = document.getElementById("despDescricao")?.value.trim();
    const valor = Number(document.getElementById("despValor")?.value) || 0;
    const dataVal = document.getElementById("despData")?.value || today();
    const categoria = document.getElementById("despCategoria")?.value || "Outros";

    if (!descricao) { notify("Descreva a despesa."); return; }
    if (valor <= 0) { notify("Informe um valor válido."); return; }

    if (!data.transacoes) data.transacoes = [];
    data.transacoes.push({ id: uid(), data: dataVal, agendaId: null, alunoId: null, descricao, valor, tipo: "despesa", categoria });
    await saveData();
    notify("Despesa registrada.");
    renderFinanceiro();
}

function changeFinanceMonth(delta) { const d = new Date(financeYear, financeMonth + delta, 1); financeYear = d.getFullYear(); financeMonth = d.getMonth(); financePage = 1; renderFinanceiro(); }

    doc.text('INSTITUIÇÃO ASAS', 20, y);

    doc.setFont('helvetica', 'normal');

    const linhasValor = doc.splitTextToSize(`a importância de ${money(total)}`, pageW - 40);
    linhasValor.forEach(l => { doc.text(l, 20, y); y += 6; });

}

function generateFinancePDF() {
    const doc = new window.jspdf.jsPDF({ unit: "mm", format: "a4" });
    const pageW = doc.internal.pageSize.getWidth();
    let y = 20;

    doc.setFont("helvetica", "bold");
    doc.setFontSize(18);
    doc.text("ASAS - Relatório Financeiro", pageW / 2, y, { align: "center" });
    y += 8;

    doc.setFontSize(12);
    const label = new Date(financeYear, financeMonth, 1).toLocaleDateString("pt-BR", { month: "long", year: "numeric" });
    doc.text(label, pageW / 2, y, { align: "center" });
    y += 10;

    doc.setFont("helvetica", "normal");
    doc.setFontSize(10);
    doc.text(`Gerado em ${fmtDate(today())}`, 20, y);
    y += 8;

    const tx = (data.transacoes || []).filter(t => {
        const d = parseDate(t.data);
        return d.getFullYear() === financeYear && d.getMonth() === financeMonth;
    });

    const rec = tx.filter(t => (t.tipo || "receita") === "receita");
    const desp = tx.filter(t => t.tipo === "despesa");
    const received = rec.reduce((s, t) => s + Number(t.valor || 0), 0);
    const expenses = desp.reduce((s, t) => s + Number(t.valor || 0), 0);

    doc.setFont("helvetica", "bold");
    doc.text("Resumo", 20, y);
    y += 6;
    doc.setFont("helvetica", "normal");
    doc.text(`Recebido: ${money(received)}`, 20, y);
    y += 5;
    doc.text(`Despesas: ${money(expenses)}`, 20, y);
    y += 5;
    doc.text(`Saldo: ${money(received - expenses)}`, 20, y);
    y += 10;

    if (rec.length) {
        doc.setFont("helvetica", "bold");
        doc.text("Recebimentos", 20, y);
        y += 6;
        doc.setFont("helvetica", "normal");
        rec.forEach(t => {
            const s = getStudent(t.alunoId);
            doc.text(`${fmtDate(t.data)} - ${esc(s?.nome || 'Recebimento')} - ${esc(t.descricao)} - ${money(t.valor)}`, 20, y);
            y += 5;
        });
        y += 4;
    }

    if (desp.length) {
        doc.setFont("helvetica", "bold");
        doc.text("Despesas", 20, y);
        y += 6;
        doc.setFont("helvetica", "normal");
        desp.forEach(t => {
            doc.text(`${fmtDate(t.data)} - ${esc(t.descricao)} - ${esc(t.categoria || 'Outros')} - ${money(t.valor)}`, 20, y);
            y += 5;
        });
    }

    doc.save(`relatorio-financeiro-${financeYear}-${String(financeMonth + 1).padStart(2, "0")}.pdf`);
    notify("Relatório financeiro salvo em PDF.");
}

// ============================================================
// PERFIL
// ============================================================

function renderPerfil() {
    if (!isDataLoaded || !data || !data.professor) {
        document.getElementById("page-perfil").innerHTML = `<div class="empty"><p>Carregando dados...</p></div>`;
        return;
    }

    const p = data.professor;
    const raw = p.vencimentoMensalidade || p.vencimento_mensalidade || '';
    const exp = raw ? parseDate(raw) : null;
    const days = exp && !isNaN(exp) ? Math.ceil((exp - parseDate(today())) / 86400000) : null;
    const safeDays = days === null ? 0 : Math.max(0, days);
    const pct = days === null ? 0 : Math.max(0, Math.min(100, (safeDays / 30) * 100));
    const status = days === null ? 'Defina a data' : days < 0 ? 'Vencida' : days <= 5 ? 'Vence em breve' : 'Em dia';
    const statusClass = days === null ? 'pending' : days <= 5 ? 'pending' : 'ok';

    document.getElementById("page-perfil").innerHTML = `
        ${renderHelpBox("perfil")}

        <div class="profile-editor">
            <div class="card">
                <div class="eyebrow">Minha conta</div>
                <div style="display:flex;justify-content:space-between;gap:15px;align-items:flex-start;flex-wrap:wrap;margin-top:7px">
                    <div><div class="profile-name-big">${esc(p.nome || 'Professor ASAS')}</div><div class="section-sub">Dados básicos da sua conta no ASAS.</div></div>
                    <span class="status ${statusClass}">${status}</span>
                </div>
                <div class="profile-expiry" style="--pct:${pct}%">
                    <div class="profile-expiry-ring" style="--pct:${pct}%">
                        <div>${days === null ? '<strong>—</strong><small>definir</small>' : `<strong>${safeDays}</strong><small>${safeDays === 1 ? 'dia' : 'dias'}</small>`}</div>
                    </div>
                    <div class="profile-expiry-info">
                        <b>Próxima mensalidade</b>
                        <span>${exp && !isNaN(exp) ? `Seu acesso está previsto para vencer em <strong>${fmtDate(raw)}</strong>.` : 'Cadastre uma data para acompanhar o vencimento da assinatura.'}</span>
                    </div>
                </div>
                <div class="profile-edit-row">
                    <div class="field"><label class="label">Nome</label><input id="profNome" class="input" value="${esc(p.nome || 'Professor ASAS')}"></div>
                    <div class="field"><label class="label">Vencimento da mensalidade</label><input id="profVencimento" class="input" type="date" value="${esc(raw || '')}"></div>
                </div>
                <div class="form-actions"><button class="btn btn-primary" onclick="saveProfile()"><i data-lucide="save"></i>Salvar alterações</button></div>
            </div>
        </div>
    `;
    lucide.createIcons();
}

async function saveProfile() {
    const p = data.professor || (data.professor = {});
    p.nome = document.getElementById("profNome")?.value.trim() || "Professor ASAS";
    p.vencimentoMensalidade = document.getElementById("profVencimento")?.value || '';
    p.especialidade = p.especialidade || '';
    p.bio = p.bio || '';
    p.foto = p.foto || '';
    await saveData();
    updateUser();
    notify("Dados da conta atualizados.");
    renderPerfil();
}

// ============================================================
// INICIALIZAÇÃO
// ============================================================

async function init() {
    lucide.createIcons();

    const isLoggedIn = await checkSession();

    if (isLoggedIn) {
        const loadedData = await loadData();
        if (loadedData) {
            data = loadedData;
            data.session = true;
            isDataLoaded = true;
        } else {
            data = defaultData();
        }

        document.getElementById("loginScreen").style.display = "none";
        document.getElementById("app").style.display = "flex";
        updateUser();
        navigate("dashboard");
        if (isDataLoaded) notify("Bem-vindo de volta!");
    } else {
        document.getElementById("loginScreen").style.display = "grid";
        document.getElementById("app").style.display = "none";
        isDataLoaded = false;
    }
}
