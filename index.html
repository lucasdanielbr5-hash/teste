<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>ASAS · Gestão Psicopedagógica</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E✦%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://unpkg.com/lucide@latest"></script>
<script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root {
 --bg:#f4f7f6;--surface:#fff;--ink:#18231f;--muted:#70817a;--line:#e4ebe8;
 --sage:#4f8f72;--sage2:#2f6f55;--sage-soft:#e9f4ee;
 --blue:#5188a6;--blue-soft:#edf5f8;--amber:#c9954d;--amber-soft:#fff5e8;
 --violet:#806aa4;--violet-soft:#f2eef8;--danger:#c35f5b;--danger-soft:#fff0ef;
 --shadow:0 18px 50px rgba(31,55,44,.07);--shadow-sm:0 8px 24px rgba(31,55,44,.05);
 --card-radius:16px;--transition:all .2s ease;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{margin:0;width:100%;height:100%;font-family:Inter,system-ui,sans-serif;background:var(--bg);color:var(--ink);font-size:14px;line-height:1.5}
body{overflow:hidden}
button,input,select,textarea{font:inherit}
button{cursor:pointer;background:none;border:none}
a{color:inherit;text-decoration:none}
::-webkit-scrollbar{width:6px;height:6px}
::-webkit-scrollbar-thumb{background:#ccd8d3;border-radius:20px}
::-webkit-scrollbar-track{background:transparent}

.app{height:100vh;display:flex}
.sidebar{width:220px;background:#fbfcfb;border-right:1px solid var(--line);display:flex;flex-direction:column;padding:16px 12px;z-index:30;flex-shrink:0}
.brand{display:flex;align-items:center;gap:10px;padding:10px 8px 18px}
.brand-mark{width:36px;height:36px;border-radius:12px;background:linear-gradient(145deg,var(--sage-soft),#dceee4);display:grid;place-items:center;color:var(--sage2);font-size:18px}
.brand strong{font-size:16px;letter-spacing:-.02em}
.brand small{display:block;color:#94a29d;font-size:9px;margin-top:1px}
.nav{display:flex;flex-direction:column;gap:3px}
.nav button{border:0;background:transparent;color:#72817b;border-radius:12px;padding:10px 12px;display:flex;align-items:center;gap:11px;font-size:12px;font-weight:600;text-align:left;transition:var(--transition)}
.nav button svg{width:17px;flex-shrink:0}
.nav button:hover{background:#f1f5f3;color:var(--ink)}
.nav button.active{background:var(--sage-soft);color:var(--sage2);box-shadow:inset 0 0 0 1px #d9ebe2}
.nav-label{white-space:nowrap}
.side-bottom{margin-top:auto;padding-top:12px;border-top:1px solid var(--line)}

.main{min-width:0;flex:1;height:100vh;display:flex;flex-direction:column;overflow:hidden}
.topbar{height:64px;background:rgba(255,255,255,.92);backdrop-filter:blur(16px);border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 28px;flex-shrink:0}
.page-title{display:flex;align-items:center;gap:10px;font-size:17px;font-weight:700;letter-spacing:-.02em}
.page-title svg{width:18px;color:var(--sage)}
.user-mini{display:flex;align-items:center;gap:10px;font-size:12px;color:#68766f}
.avatar{width:36px;height:36px;border-radius:12px;background:var(--sage-soft);color:var(--sage2);display:grid;place-items:center;font-weight:800;background-size:cover;background-position:center;font-size:13px;flex-shrink:0}

.content{padding:20px 28px 40px;overflow-y:auto;height:calc(100vh - 64px);scroll-behavior:smooth}
.view{display:none;animation:rise .2s ease}
.view.active{display:block}
@keyframes rise{from{opacity:.2;transform:translateY(6px)}to{opacity:1;transform:none}}

.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--card-radius);box-shadow:var(--shadow-sm);transition:var(--transition)}
.card:hover{box-shadow:var(--shadow)}
.section-head{display:flex;justify-content:space-between;align-items:flex-start;gap:14px;margin-bottom:14px;flex-wrap:wrap}
.section-title{font-size:15px;font-weight:750;letter-spacing:-.02em}
.section-sub{font-size:11px;color:var(--muted);margin-top:4px;line-height:1.5}

.btn{border:1px solid transparent;border-radius:10px;padding:8px 14px;font-size:12px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;gap:6px;transition:var(--transition)}
.btn svg{width:14px}
.btn-primary{background:var(--sage);color:white;box-shadow:0 6px 16px rgba(79,143,114,.2)}
.btn-primary:hover{background:var(--sage2);transform:translateY(-1px)}
.btn-soft{background:var(--sage-soft);color:var(--sage2)}
.btn-soft:hover{background:#dceee4}
.btn-blue{background:var(--blue-soft);color:#4e7890}
.btn-outline{background:#fff;border-color:var(--line);color:#55645e}
.btn-outline:hover{background:#f8faf9}
.btn-danger{background:var(--danger-soft);color:var(--danger)}
.btn-danger:hover{background:#fde8e7}
.btn-sm{padding:5px 10px;font-size:10px;border-radius:8px}
.btn-xs{padding:3px 8px;font-size:9px;border-radius:6px}

.input,.select,.textarea{width:100%;border:1px solid #dfe7e3;background:#fcfdfd;border-radius:10px;padding:9px 12px;outline:0;font-size:12px;color:var(--ink);transition:var(--transition)}
.input:focus,.select:focus,.textarea:focus{border-color:#9bc0ae;box-shadow:0 0 0 3px rgba(79,143,114,.1);background:#fff}
.textarea{resize:vertical;min-height:80px}
.label{display:block;font-size:10px;font-weight:800;color:#697873;margin-bottom:5px;text-transform:uppercase;letter-spacing:.04em}
.field{margin-bottom:11px}
.form-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}
.form-grid.two{grid-template-columns:repeat(2,minmax(0,1fr))}
.form-grid.one{grid-template-columns:1fr}
.form-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:4px}

.empty{padding:40px 20px;text-align:center;color:#96a29d;font-size:12px}
.empty b{display:block;font-size:14px;color:#55655e;margin-bottom:4px}

/* ===== HELP BOX ===== */
.help-box{display:flex;gap:14px;background:var(--sage-soft);border:1px solid #d9ebe2;border-radius:var(--card-radius);padding:14px 18px;margin-bottom:18px;align-items:flex-start}
.help-box .help-title{font-weight:700;font-size:13px;color:var(--sage2)}
.help-box > div > div{font-size:11px;color:#5a7368;line-height:1.5}
.help-steps{display:flex;gap:12px;flex-wrap:wrap;margin-top:8px}
.help-step{display:flex;align-items:center;gap:6px;font-size:10px;color:#4d6a5e;background:rgba(255,255,255,.6);padding:3px 10px 3px 6px;border-radius:999px}
.help-step b{display:inline-flex;align-items:center;justify-content:center;width:16px;height:16px;border-radius:50%;background:var(--sage);color:#fff;font-size:8px}

/* ===== DASHBOARD ===== */
.page-intro{display:flex;justify-content:space-between;align-items:flex-start;gap:14px;flex-wrap:wrap;margin-bottom:18px}
.page-intro-copy h1{font-size:24px;letter-spacing:-.03em;margin:0 0 4px}
.page-intro-copy p{font-size:13px;color:var(--muted);margin:0}
.page-intro-actions{display:flex;gap:8px;flex-wrap:wrap}

.stats-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin-bottom:16px}
.stat-card{background:var(--surface);border:1px solid var(--line);border-radius:var(--card-radius);padding:16px 18px;transition:var(--transition)}
.stat-card:hover{border-color:#c4d9cf}
.stat-card .stat-label{font-size:9px;text-transform:uppercase;letter-spacing:.06em;color:#8a9792;font-weight:800}
.stat-card .stat-value{font-size:22px;font-weight:800;letter-spacing:-.03em;margin-top:5px}
.stat-card .stat-sub{font-size:10px;color:#8a9792;margin-top:3px}
.stat-card .stat-bar{height:4px;background:#edf2ef;border-radius:99px;margin-top:8px;overflow:hidden}
.stat-card .stat-bar .fill{height:100%;border-radius:inherit;background:linear-gradient(90deg,#6eae91,#2f6f55)}

.dashboard-grid{display:grid;grid-template-columns:1.5fr 1fr;gap:14px;margin-top:14px}
.dashboard-grid .card{padding:18px}

.chart{height:140px;display:flex;align-items:flex-end;gap:8px;padding:14px 4px 4px}
.bar-col{flex:1;display:flex;flex-direction:column;align-items:center;gap:5px;height:100%;justify-content:flex-end}
.bar{width:60%;min-height:6px;border-radius:6px 6px 3px 3px;background:linear-gradient(180deg,#6eae91,#4f8f72);transition:height .4s ease}
.bar-label{font-size:8px;color:#899790;font-weight:600}
.bar-value{font-size:8px;font-weight:800;color:#56655f}

.activity-list{display:flex;flex-direction:column;gap:2px}
.activity{display:flex;gap:12px;padding:10px 0;border-bottom:1px solid #f0f3f2;align-items:center}
.activity:last-child{border-bottom:0}
.activity-time{width:40px;font-size:10px;font-weight:800;color:#64726d;flex-shrink:0}
.activity-dot{width:7px;height:7px;border-radius:50%;flex-shrink:0;background:var(--sage)}
.activity-main{flex:1;min-width:0}
.activity-main b{font-size:12px;display:block}
.activity-main span{font-size:10px;color:#8a9792;display:block;margin-top:1px}

.status{font-size:8px;font-weight:800;padding:4px 8px;border-radius:999px;white-space:nowrap}
.status.ok{background:var(--sage-soft);color:var(--sage2)}
.status.pending{background:var(--amber-soft);color:#9a6b30}
.status.missed{background:var(--danger-soft);color:#a44e4a}

/* ===== ALUNOS ===== */
.students-shell{display:grid;grid-template-columns:1fr 260px;gap:14px;align-items:start}
.students-main{min-width:0}
.students-sidebar{position:sticky;top:10px;display:flex;flex-direction:column;gap:12px}

.students-hero{padding:20px 24px;background:linear-gradient(135deg,#f6fbf8,#eef6f2);position:relative;overflow:hidden}
.students-hero:after{content:"";position:absolute;width:200px;height:200px;border-radius:50%;right:-60px;top:-100px;background:rgba(79,143,114,.08)}
.students-hero .eyebrow,.students-hero h1,.students-hero p{position:relative;z-index:1}
.students-hero .eyebrow{font-size:9px;text-transform:uppercase;letter-spacing:.12em;font-weight:800;color:var(--sage2)}
.students-hero h1{font-size:22px;margin:4px 0 3px;letter-spacing:-.03em}
.students-hero p{font-size:12px;color:var(--muted);margin:0}

.student-kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px;position:relative;z-index:1}
.student-kpi{background:rgba(255,255,255,.7);border:1px solid rgba(217,231,224,.8);border-radius:12px;padding:10px 12px}
.student-kpi b{font-size:18px;display:block}
.student-kpi span{font-size:8px;color:#81908a;text-transform:uppercase;letter-spacing:.06em;font-weight:700}

.student-searchbar{display:flex;gap:8px;align-items:center;padding:8px 12px;margin-top:12px}
.student-searchbar .input{border:0;background:transparent;padding:4px 6px;font-size:13px}
.student-filters{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px;padding:0 4px}

/* Cards de alunos compactos */
.student-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px;margin-top:12px}
.student-card{position:relative;padding:14px 16px;cursor:pointer;transition:var(--transition);min-height:140px;display:flex;flex-direction:column;border-left:3px solid var(--sage)}
.student-card.inactive{border-left-color:#b8c2be;opacity:.7}
.student-card:hover{transform:translateY(-2px);border-color:#c7dcd2;box-shadow:var(--shadow-sm)}
.student-card-top{display:flex;gap:10px;align-items:center}
.student-card .student-avatar{width:40px;height:40px;border-radius:12px;font-size:14px;flex-shrink:0}
.student-card .student-name{font-size:13px;font-weight:700;line-height:1.2}
.student-card .student-meta{font-size:9px;color:var(--muted);margin-top:2px}
.student-card .student-tags{display:flex;gap:4px;flex-wrap:wrap;margin-top:6px}
.student-card .student-tags .tag{font-size:7px;padding:2px 7px;border-radius:999px;background:var(--blue-soft);color:#5a7c92;font-weight:700}
.student-card .student-footer{margin-top:auto;padding-top:8px;border-top:1px solid #f0f3f2;display:flex;justify-content:space-between;align-items:center;font-size:9px;color:#8a9792}
.student-card .student-footer strong{font-size:11px;color:var(--sage2)}

.students-sidebar .card{padding:16px}
.sidebar-title{font-size:12px;font-weight:800}
.sidebar-list{display:flex;flex-direction:column;gap:5px;margin-top:8px}
.sidebar-row{display:flex;align-items:center;gap:8px;padding:7px 0;border-bottom:1px solid #f0f3f2}
.sidebar-row:last-child{border-bottom:0}
.sidebar-row .mini-avatar{width:28px;height:28px;border-radius:8px;background:var(--sage-soft);color:var(--sage2);display:grid;place-items:center;font-size:9px;font-weight:800;flex:none}
.sidebar-row div{min-width:0}
.sidebar-row b{font-size:10px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sidebar-row span{font-size:8px;color:#8a9792}

/* ===== AGENDA ===== */
.agenda-shell{display:grid;grid-template-columns:1fr 260px;gap:14px}
.agenda-main{min-width:0}
.agenda-side{display:flex;flex-direction:column;gap:12px}

.agenda-header{padding:16px 18px}
.agenda-top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.agenda-nav{display:flex;gap:4px;align-items:center}
.agenda-range{font-weight:700;font-size:14px;padding:0 8px;min-width:120px;text-align:center}
.agenda-mode{display:flex;gap:3px}
.agenda-mode button{padding:4px 12px;border-radius:8px;font-size:10px;font-weight:700;color:#8a9792;border:1px solid transparent}
.agenda-mode button.active{background:var(--sage-soft);color:var(--sage2);border-color:#d9ebe2}

.agenda-days{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-top:12px}
.day-chip{border:1px solid var(--line);border-radius:12px;background:#fff;padding:8px 4px;text-align:center;transition:var(--transition);cursor:pointer}
.day-chip:hover{border-color:#c4d9cf}
.day-chip.active{background:var(--sage);color:#fff;border-color:var(--sage)}
.day-chip .dow{font-size:8px;text-transform:uppercase;letter-spacing:.06em;font-weight:800;opacity:.7}
.day-chip .num{display:block;font-size:16px;font-weight:800;margin-top:3px}
.day-chip .count{font-size:7px;padding:2px 6px;border-radius:999px;background:#f1f5f3;color:#71817a;display:inline-block;margin-top:4px}
.day-chip.active .count{background:rgba(255,255,255,.15);color:#fff}

.agenda-today-line{display:flex;align-items:center;gap:12px;padding:10px 0 6px;font-size:11px;font-weight:700;color:#55655e}
.agenda-today-line .line{flex:1;height:1px;background:var(--line)}

.day-list{display:flex;flex-direction:column;gap:4px}
.day-appointment{display:grid;grid-template-columns:48px 1fr auto;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid #eef2f0}
.day-appointment:last-child{border-bottom:0}
.day-time{font-size:13px;font-weight:800;color:#293731}
.day-person{display:flex;align-items:center;gap:8px;cursor:pointer;min-width:0}
.day-person .student-avatar{width:32px;height:32px;border-radius:10px;font-size:11px;flex-shrink:0}
.day-person .name{font-size:12px;font-weight:700}
.day-person .meta{font-size:9px;color:#8a9792}
.day-actions{display:flex;gap:4px;flex-wrap:wrap;justify-content:flex-end}

.agenda-side .day-summary{padding:16px}
.agenda-side .day-summary .number{font-size:26px;font-weight:850;letter-spacing:-.04em}
.agenda-side .day-summary .progress{height:5px;border-radius:99px;background:#edf2ef;overflow:hidden;margin:10px 0}
.agenda-side .day-summary .progress .fill{display:block;height:100%;border-radius:inherit;background:linear-gradient(90deg,#5b9c7d,#2f6f55)}
.agenda-side .summary-row{display:flex;justify-content:space-between;align-items:center;padding:5px 0;font-size:10px;border-bottom:1px solid #f0f3f2}
.agenda-side .summary-row:last-child{border-bottom:0}

.quick-form{padding:16px}
.quick-form .form-grid{grid-template-columns:1fr 1fr;gap:8px}

.agenda-empty{padding:30px 16px;text-align:center;border:1px dashed #d9e5df;border-radius:14px;background:#fbfdfc}
.agenda-empty b{display:block;font-size:13px}
.agenda-empty span{font-size:10px;color:#89968f;display:block;margin-top:4px}

/* ===== AVALIAÇÕES ===== */
.eval-layout{display:grid;grid-template-columns:240px 1fr;gap:14px;align-items:start}
.eval-sidebar{padding:16px;height:fit-content;position:sticky;top:0}
.eval-model{display:flex;flex-direction:column;gap:5px;margin-top:10px}
.eval-model button{text-align:left;border:1px solid var(--line);background:#fff;border-radius:12px;padding:10px 12px;font-size:9px;color:#65746d;transition:var(--transition)}
.eval-model button:hover{border-color:#bfd7cb;background:#fbfdfc}
.eval-model button b{display:block;font-size:11px;color:var(--ink);margin-bottom:2px}

.aval-type-badge{font-size:8px;font-weight:800;padding:3px 8px;border-radius:999px;text-transform:uppercase;letter-spacing:.04em}
.aval-type-badge.anamnese{background:var(--violet-soft);color:var(--violet)}
.aval-type-badge.screening{background:var(--blue-soft);color:#4e7890}
.aval-type-badge.survey{background:var(--amber-soft);color:#9a6b30}

.aval-list-item{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid #f0f3f2}
.aval-list-item:last-child{border-bottom:0}

.assessment-workspace{max-width:680px;margin:0 auto}
.assessment-progress{display:flex;justify-content:space-between;font-size:10px;color:#8a9792;margin-bottom:4px}
.assessment-track{height:4px;background:#edf2ef;border-radius:99px;overflow:hidden;margin-bottom:18px}
.assessment-track .fill{display:block;height:100%;background:linear-gradient(90deg,#6eae91,#2f6f55);border-radius:inherit}
.assessment-page{padding:4px 0}
.assessment-page .eyebrow{font-size:10px;text-transform:uppercase;letter-spacing:.08em;font-weight:800;color:var(--sage2)}
.assessment-page .question{font-size:18px;font-weight:800;letter-spacing:-.02em;margin:8px 0 16px;line-height:1.4}
.answer-grid{display:flex;flex-direction:column;gap:6px}
.answer-grid label{display:flex;align-items:center;gap:10px;padding:11px 14px;border:1px solid var(--line);border-radius:11px;cursor:pointer;font-size:12px;background:#fff;transition:var(--transition)}
.answer-grid label:hover{border-color:#9fc4b1;background:var(--sage-soft)}
.answer-grid label.selected{border-color:#9fc4b1;background:var(--sage-soft)}
.assessment-nav{display:flex;justify-content:space-between;align-items:center;margin-top:20px;gap:10px}
.assessment-nav .hint{font-size:10px;color:#8a9792}

/* ===== PERFIL ===== */
.profile-editor{max-width:620px;margin:30px auto}
.profile-editor .card{padding:28px}
.profile-name-big{font-size:26px;font-weight:850;letter-spacing:-.04em}
.profile-expiry{display:grid;grid-template-columns:auto 1fr;gap:16px;align-items:center;margin-top:18px;padding:16px;border:1px solid var(--line);border-radius:16px;background:#fbfdfc}
.profile-expiry-ring{width:90px;height:90px;border-radius:50%;background:conic-gradient(var(--sage) var(--pct,0%),#e9efec 0);display:grid;place-items:center;position:relative;flex-shrink:0}
.profile-expiry-ring:after{content:"";position:absolute;inset:7px;background:#fff;border-radius:50%}
.profile-expiry-ring>div{position:relative;z-index:1;text-align:center}
.profile-expiry-ring strong{display:block;font-size:20px}
.profile-expiry-ring small{font-size:7px;color:#899790;text-transform:uppercase;letter-spacing:.06em}
.profile-expiry-info b{font-size:14px}
.profile-expiry-info span{display:block;font-size:10px;color:var(--muted);margin-top:4px;line-height:1.5}
.profile-edit-row{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:18px}

/* ===== PRONTUÁRIO ===== */
.student-profile-page{max-width:1200px;margin:0 auto}
.profile-backbar{display:flex;align-items:center;gap:10px;margin-bottom:12px;font-size:10px;color:var(--muted)}
.student-cover{overflow:hidden;margin-bottom:12px}
.student-cover-art{height:90px;background:radial-gradient(circle at 80% 10%,rgba(79,143,114,.15),transparent 32%),linear-gradient(120deg,#eef7f2,#f4f7fa 55%,#edf1f7);border-bottom:1px solid var(--line)}
.student-identity{display:flex;align-items:flex-end;gap:14px;padding:0 20px 14px;margin-top:-30px;position:relative;flex-wrap:wrap}

<script>
// ============================================================
// CONFIGURAÇÃO DO SUPABASE

const SUPABASE_URL = 'https://teujmiojdyytzpavritf.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InRldWptaW9qZHl5dHpwYXZyaXRmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODc5NTYxMjUsImV4cCI6MjEwMzUzMjEyNX0.rGLzx-B1bdrlcaa9a_gAOHrDv52UGHQfg-dquLJtyIk';

const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

// ============================================================
// VARIÁVEIS GLOBAIS
// ============================================================

let data = {};
let currentPage = "dashboard";
let currentStudent = null;
let currentAssessment = null;
let calendarDate = new Date();
let calendarMode = "day";
let selectedDay = null;
let studentSectionPage = { overview: 1, avaliacoes: 1, escola: 1 };
let currentConsultation = null;
let financeYear = new Date().getFullYear();
let financeMonth = new Date().getMonth();
let currentUserId = null;
let financePage = 1;
let isSaving = false;
let isDataLoaded = false;

// Avaliação passo a passo
let avalStepMode = null;
let avalStepQuestions = [];
let avalStepCurrentIndex = 0;
let avalStepResponses = [];
let avalStepTemplateId = null;
let avalStepAlunoId = null;
let avalStepResumo = '';
let avalStepExistingId = null;

const TYPES = {
    psicologia: { label: "Psicologia", cls: "psico" },
    psicopedagogia: { label: "Psicopedagogia", cls: "psicopeg" },
    aula: { label: "Aula Particular", cls: "aula" }
};

const WEEK = ["Seg", "Ter", "Qua", "Qui", "Sex"];
const HOURS = [];
for (let h = 8; h <= 18; h++) HOURS.push(String(h).padStart(2, "0") + ":00");

// ============================================================
// FUNÇÕES AUXILIARES
// ============================================================

function uid() {
    return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, function(c) {
        var r = Math.random() * 16 | 0;
        var v = c === 'x' ? r : (r & 0x3 | 0x8);
        return v.toString(16);
    });
}

function esc(v) {
    return String(v ?? "").replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
}

function money(v) {
    return Number(v || 0).toLocaleString("pt-BR", { style: "currency", currency: "BRL" });
}

function dateISO(d) {
    const x = new Date(d);
    return x.getFullYear() + "-" + String(x.getMonth() + 1).padStart(2, "0") + "-" + String(x.getDate()).padStart(2, "0");
}

function parseDate(s) {
    if (!s) return new Date(NaN);
    if (s instanceof Date) return new Date(s);
    const [y, m, d] = String(s).split("-").map(Number);
    return new Date(y, m - 1, d);
}

function today() {
    return dateISO(new Date());
}

function fmtDate(s) {
    if (!s) return "";
    const d = parseDate(s);
    if (isNaN(d)) return String(s);
    return d.toLocaleDateString("pt-BR", { day: "2-digit", month: "2-digit", year: "numeric" });
}

function fmtDateTime(s) {
    if (!s) return "";
    const d = parseDate(s);
    if (isNaN(d)) return String(s);
    return d.toLocaleDateString("pt-BR", { day: "2-digit", month: "short", year: "numeric" });
}

function monthName(d) {
    return d.toLocaleDateString("pt-BR", { month: "long", year: "numeric" });
}

function initials(name) {
    return (name || "?").split(" ").slice(0, 2).map(x => x[0]).join("").toUpperCase();
}

function avatarHTML(person, cls = "student-avatar") {
    if (!person) return `<div class="${cls}">?</div>`;
    if (person.foto) {
        return `<div class="${cls}" style="background-image:url('${esc(person.foto)}')"></div>`;
    }
    return `<div class="${cls}">${esc(initials(person.nome))}</div>`;
}

function notify(message) {
    const t = document.getElementById("toast");
    if (!t) return;
    t.textContent = message;
    t.classList.add("show");
    clearTimeout(window.toastTimer);
    window.toastTimer = setTimeout(() => t.classList.remove("show"), 2600);
}

function activeAppointments() {
    if (!data.agenda) return [];
    return data.agenda.filter(x => {
        if (x.status === "cancelado") return false;
        const student = getStudent(x.alunoId);
        return student !== null && student !== undefined;
    });
}

function getStudent(id) {
    if (!data.alunos) return null;
    return data.alunos.find(a => a.id === id) || null;
}

function ensureStudentModules(s) {
    if (!s) return;
    s.consultas = s.consultas || [];
    s.avaliacoes = s.avaliacoes || [];
    s.evolucoes = s.evolucoes || [];
    s.escola = s.escola || { nome: "", professores: "", registros: [] };
    s.escola.registros = s.escola.registros || [];
    s.observacoesClinicas = s.observacoesClinicas || [];
}

function defaultData() {
    return {
        session: false,
        professor: {
            nome: "Professor ASAS",
            especialidade: "Psicopedagogia Clínica",
            bio: "Profissional dedicado ao desenvolvimento acadêmico, emocional e cognitivo.",
            foto: "",
            observacoes: [],
            evolucoesPessoais: [],
            configuracoes: { notificacoes: true, tema: "claro", lembretes: true },
            vencimentoMensalidade: ''
        },
        alunos: [],
        agenda: [],
        transacoes: []
    };
}

function monthAppointments(date) {
    const y = date.getFullYear();
    const m = date.getMonth();
    return activeAppointments().filter(a => {
        const d = parseDate(a.data);
        return d.getFullYear() === y && d.getMonth() === m;
    });
}

function monthPaid() {
    const y = new Date().getFullYear();
    const m = new Date().getMonth();
    return (data.transacoes || []).filter(t => {
        const d = parseDate(t.data);
        return d.getFullYear() === y && d.getMonth() === m && (t.tipo || "receita") === "receita";
    }).reduce((s, t) => s + Number(t.valor), 0);
}

function monthDone() {
    const y = new Date().getFullYear();
    const m = new Date().getMonth();
    return activeAppointments().filter(a => {
        const d = parseDate(a.data);
        return d.getFullYear() === y && d.getMonth() === m && a.presente;
    }).length;
}

function monthScheduled() {
    const y = new Date().getFullYear();
    const m = new Date().getMonth();
    return activeAppointments().filter(a => {
        const d = parseDate(a.data);
        return d.getFullYear() === y && d.getMonth() === m;
    }).length;
}

function attendanceRate() {
    const arr = activeAppointments().filter(a => a.presente || a.status === "falta");
    if (!arr.length) return 0;
    return Math.round(arr.filter(a => a.presente).length / arr.length * 100);
}

function weekStart(d) {
    const x = new Date(d);
    const day = x.getDay();
    const diff = day === 0 ? -6 : 1 - day;
    x.setDate(x.getDate() + diff);
    x.setHours(0, 0, 0, 0);
    return x;
}

function weekDates(d) {
    const s = weekStart(d);
    return WEEK.map((_, i) => {
        const x = new Date(s);
        x.setDate(s.getDate() + i);
        return x;
    });
}

function weekPending() {
    const dates = weekDates(new Date());
    const keys = dates.map(dateISO);
    return activeAppointments().filter(a => keys.includes(a.data) && !a.pago)
        .reduce((sum, a) => sum + (getStudent(a.alunoId)?.valor || 0), 0);
}

function studentPager(items, page, size = 5, onclick = "") {
    const total = Math.max(1, Math.ceil(items.length / size));
    page = Math.min(Math.max(1, page), total);
    const slice = items.slice((page - 1) * size, page * size);
    return {
        slice,
        total,
        page,
        controls: total > 1 ? `
            <div style="display:flex;justify-content:center;align-items:center;gap:8px;margin-top:12px;padding-top:10px;border-top:1px solid var(--line)">
                <button class="btn btn-outline btn-sm" ${page <= 1 ? "disabled" : ""} onclick="${onclick}(${page - 1})"><i data-lucide="chevron-left"></i>Anterior</button>
                <span style="font-size:10px;color:#718078">Página ${page} de ${total}</span>
                <button class="btn btn-outline btn-sm" ${page >= total ? "disabled" : ""} onclick="${onclick}(${page + 1})">Próxima<i data-lucide="chevron-right"></i></button>
            </div>` : ""
    };
}

async function loadDataFromSupabase() {
    try {
        const userId = await getUserId();
        if (!userId) return null;

        const { data: professorData, error: profError } = await supabaseClient
            .from('professores')
            .select('*')
            .eq('user_id', userId)
            .maybeSingle();

        const { data: alunosData, error: alunosError } = await supabaseClient
            .from('alunos')
            .select('*')
            .eq('user_id', userId)
            .order('nome');

        const { data: evolucoesData, error: evoError } = await supabaseClient
            .from('evolucoes')
            .select('*')
            .eq('user_id', userId);

        const { data: consultasData, error: consError } = await supabaseClient
            .from('consultas')
            .select('*')
            .eq('user_id', userId);

        const { data: avaliacoesData, error: avError } = await supabaseClient
            .from('avaliacoes')
            .select('*')
            .eq('user_id', userId);

        const { data: resultadosData, error: resError } = await supabaseClient
            .from('resultados_avaliacoes')
            .select('*')
            .eq('user_id', userId);

        const { data: escolaData, error: escError } = await supabaseClient
            .from('escola')
            .select('*')
            .eq('user_id', userId);

        const { data: registrosEscolaData, error: regError } = await supabaseClient
            .from('registros_escola')
            .select('*')
            .eq('user_id', userId);

        const { data: agendaData, error: agendaError } = await supabaseClient
            .from('agenda')
            .select('*')
            .eq('user_id', userId)
            .order('data');

        const { data: transacoesData, error: transError } = await supabaseClient
            .from('transacoes')
            .select('*')
            .eq('user_id', userId);

        const { data: obsProfData, error: obsError } = await supabaseClient
            .from('observacoes_professor')
            .select('*')
            .eq('user_id', userId)
            .order('data', { ascending: false });

        const { data: evoProfData, error: evoProfError } = await supabaseClient
            .from('evolucoes_professor')
            .select('*')
            .eq('user_id', userId)
            .order('data', { ascending: false });

        const alunosNormalizados = (alunosData || []).map(mapAlunoFromDB);
        const evolucoesNorm = (evolucoesData || []).map(mapEvolucaoFromDB);
        const consultasNorm = (consultasData || []).map(mapConsultaFromDB);
        const avaliacoesNorm = (avaliacoesData || []).map(mapAvaliacaoFromDB);
        const resultadosNorm = (resultadosData || []).map(mapResultadoFromDB);
        const escolasNorm = (escolaData || []).map(mapEscolaFromDB);
        const registrosEscolaNorm = (registrosEscolaData || []).map(mapRegistroEscolaFromDB);

        alunosNormalizados.forEach(aluno => {
            aluno.evolucoes = evolucoesNorm.filter(e => e.aluno_id === aluno.id);
            aluno.consultas = consultasNorm.filter(c => c.aluno_id === aluno.id);
            aluno.avaliacoes = avaliacoesNorm.filter(a => a.aluno_id === aluno.id);
            aluno.avaliacoes.forEach(av => {
                av.resultados = resultadosNorm.filter(r => r.avaliacao_id === av.id);
            });
            const esc = escolasNorm.find(e => e.aluno_id === aluno.id);
            if (esc) {
                aluno.escola = {
                    id: esc.id,
                    aluno_id: esc.aluno_id,
                    nome: esc.nome || '',
                    professores: esc.professores || '',
                    registros: registrosEscolaNorm.filter(r => r.escola_id === esc.id)
                };
            } else {
                aluno.escola = { nome: '', professores: '', registros: [] };
            }
            ensureStudentModules(aluno);
        });

        const professorNormalizado = professorData
            ? mapProfessorFromDB(professorData)
            : {
                nome: "Professor ASAS",
                especialidade: "Psicopedagogia Clínica",
                bio: "Profissional dedicado ao desenvolvimento acadêmico, emocional e cognitivo.",
                foto: "",
                observacoes: [],
                evolucoesPessoais: [],
                configuracoes: { notificacoes: true, tema: "claro", lembretes: true }
            };

        if (obsProfData && !obsProfData.error) professorNormalizado.observacoes = obsProfData.map(mapObsProfFromDB);
        if (evoProfData && !evoProfData.error) professorNormalizado.evolucoesPessoais = evoProfData.map(mapEvoProfFromDB);

        const result = {
            session: true,
            professor: professorNormalizado,
            alunos: alunosNormalizados,
            agenda: (agendaData || []).map(mapAgendaFromDB),
            transacoes: (transacoesData || []).map(mapTransacaoFromDB)
        };

        isDataLoaded = true;
        return result;
    } catch (error) {
        console.error('Erro ao carregar dados:', error);
        notify('Erro ao carregar dados do servidor.');
        return null;
    }
}

const COLUMN_MAP = {
    'transacoes': ['id', 'user_id', 'agenda_id', 'aluno_id', 'data', 'descricao', 'valor', 'tipo', 'categoria'],
    'agenda': ['id', 'user_id', 'aluno_id', 'data', 'hora', 'tipo', 'status', 'presente', 'pago', 'updated_at'],
    'alunos': ['id', 'user_id', 'nome', 'idade', 'serie', 'responsavel', 'telefone', 'valor', 'foto', 'tags', 'observacoes', 'ativo', 'updated_at'],
    'professores': ['id', 'user_id', 'nome', 'especialidade', 'bio', 'foto', 'config_notificacoes', 'config_lembretes', 'vencimento_mensalidade', 'updated_at'],
    'evolucoes': ['id', 'user_id', 'aluno_id', 'data', 'titulo', 'texto'],
    'consultas': ['id', 'user_id', 'aluno_id', 'data', 'observacoes', 'acoes', 'pais', 'solicitacoes', 'comportamentos'],
    'avaliacoes': ['id', 'user_id', 'aluno_id', 'data', 'titulo', 'tipo', 'objetivo', 'questoes', 'finalizada'],
    'resultados_avaliacoes': ['id', 'user_id', 'avaliacao_id', 'data', 'respostas', 'resumo'],
    'escola': ['id', 'user_id', 'aluno_id', 'nome', 'professores', 'updated_at'],
    'registros_escola': ['id', 'user_id', 'escola_id', 'data', 'contato', 'tipo', 'assunto', 'relato'],
    'observacoes_professor': ['id', 'user_id', 'data', 'titulo', 'texto'],
    'evolucoes_professor': ['id', 'user_id', 'data', 'titulo', 'texto']
};

async function upsertSafe(tableName, payload, selectSingle = true) {
    let attempt = { ...payload };
    
    const knownColumns = COLUMN_MAP[tableName] || [];
    if (knownColumns.length > 0) {
        const filteredAttempt = {};
        knownColumns.forEach(col => {
            if (attempt[col] !== undefined) {
                filteredAttempt[col] = attempt[col];
            }
        });
        attempt = filteredAttempt;
    }

    for (let i = 0; i < 4; i++) {
        try {
            let query = supabaseClient.from(tableName).upsert(attempt);
            if (selectSingle) query = query.select().single();
            else query = query.select();
            const { data, error } = await query;
            if (!error) return data;
            
            if (error && (error.code === '42703' || /could not find the column/i.test(error.message || ''))) {
                const m = (error.message || '').match(/column "([^"]+)"/i) || (error.message || '').match(/([^"]+).*does not exist/i);
                const col = m ? m[1] : null;
                if (col && col in attempt) {
                    delete attempt[col];
                    continue;
                }
            }
            throw error;
        } catch (err) {
            if (i === 3) throw err;
            if (err.code === '42703' || /could not find the column/i.test(err.message || '')) {
                continue;
            }
            throw err;
        }
    }
    return null;
}

    } catch (error) {
        console.error('Erro ao salvar professor:', error);
        return null;
    }
}

// LOAD/SAVE PRINCIPAIS
// ============================================================

async function loadData() {
    const loaded = await loadDataFromSupabase();
    if (loaded) {
        if (!loaded.professor.observacoes) loaded.professor.observacoes = [];
        if (!loaded.professor.evolucoesPessoais) loaded.professor.evolucoesPessoais = [];
        if (!loaded.professor.configuracoes) {
            loaded.professor.configuracoes = { notificacoes: true, tema: "claro", lembretes: true };
        }
        loaded.alunos.forEach(s => ensureStudentModules(s));
        isDataLoaded = true;
        return loaded;
    }
    isDataLoaded = false;
    return defaultData();
}

async function saveData() {
    if (isSaving) return false;

    const isLoggedIn = await checkSession();
    if (!isLoggedIn) {
        console.warn('Usuário não está logado, dados não salvos.');
        return false;
    }

    isSaving = true;

    try {
        if (data.professor) await saveProfessor(data.professor);

        for (const aluno of (data.alunos || [])) {
            await saveAluno(aluno);
            for (const evo of (aluno.evolucoes || [])) {
                await saveEvolucao({ ...evo, aluno_id: aluno.id });
            }
            for (const consulta of (aluno.consultas || [])) {
                await saveConsulta({ ...consulta, aluno_id: aluno.id });
            }
            for (const av of (aluno.avaliacoes || [])) {
                const savedAv = await saveAvaliacao({ ...av, aluno_id: aluno.id });
                if (savedAv && av.resultados) {
                    for (const res of av.resultados) {
                        await saveResultadoAvaliacao({ ...res, avaliacao_id: savedAv.id });
                    }
                }
            }
            if (aluno.escola) {
                const savedEscola = await saveEscola({
                    id: aluno.escola.id || uid(),
                    aluno_id: aluno.id,
                    nome: aluno.escola.nome || '',
                    professores: aluno.escola.professores || ''
                });
                if (savedEscola) aluno.escola.id = savedEscola.id;
                if (aluno.escola.registros) {
                    for (const reg of aluno.escola.registros) {
                        await saveRegistroEscola({ ...reg, escola_id: aluno.escola.id });
                    }
                }
            }
        }

        const validAgenda = (data.agenda || []).filter(item => item && item.alunoId && getStudent(item.alunoId));
        for (const item of validAgenda) {
            await saveAgendaItem(item);
        }
        if (data.agenda) data.agenda = validAgenda;

        const validTrans = (data.transacoes || []).filter(t => {
            if (!t) return false;
            if (t.tipo === 'despesa') return true;
            return t.alunoId && getStudent(t.alunoId);
        });
        for (const trans of validTrans) {
            await saveTransacao(trans);
        }
        if (data.transacoes) data.transacoes = validTrans;

        for (const obs of (data.professor?.observacoes || [])) {
            await saveObservacaoProfessor(obs);
        }

        for (const evo of (data.professor?.evolucoesPessoais || [])) {
            await saveEvolucaoProfessor(evo);
        }

        return true;
    } catch (error) {
        console.error('Erro ao salvar dados:', error);
        notify('Erro ao salvar dados no servidor.');
        return false;
    } finally {
        isSaving = false;
    }
}

function navigate(page) {
    currentPage = page;
    currentStudent = null;

    document.querySelectorAll(".view").forEach(x => x.classList.remove("active"));
    const target = document.getElementById("page-" + page);
    if (target) target.classList.add("active");

    document.querySelectorAll(".nav button").forEach(x => {
        x.classList.toggle("active", x.dataset.page === page);
    });

    const info = {
        dashboard: ["layout-dashboard", "Dashboard"],
        alunos: ["users", "Alunos"],
        agenda: ["calendar-days", "Agenda"],
        avaliacoes: ["clipboard-check", "Avaliações"],
        financeiro: ["wallet-cards", "Financeiro"],
        perfil: ["user-round", "Meu Perfil"]
    };

    if (info[page]) {
        document.getElementById("pageTitle").innerHTML = `<i data-lucide="${info[page][0]}"></i>${info[page][1]}`;
    }

    if (page !== "avaliacoes") {
        avalStepMode = null;
        avalStepQuestions = [];
        avalStepCurrentIndex = 0;
        avalStepResponses = [];
        avalStepTemplateId = null;
        avalStepAlunoId = null;
    }

    renderPage();
    lucide.createIcons();
}

function renderPage() {
    if (!isDataLoaded || !data.session) {
        document.querySelectorAll(".view").forEach(view => {
            if (view.id !== "page-dashboard") {
                view.innerHTML = `<div class="empty"><b>Faça login</b><span>para visualizar seus dados.</span></div>`;
            }
        });
        return;
    }

    if (currentPage === "dashboard") renderDashboard();
    if (currentPage === "alunos") renderAlunos();
    if (currentPage === "agenda") renderAgenda();
    if (currentPage === "avaliacoes") renderAvaliacoes();
    if (currentPage === "financeiro") renderFinanceiro();
    if (currentPage === "perfil") renderPerfil();
}

function updateUser() {
    const p = data.professor;
    if (!p) return;
    document.getElementById("topUserName").textContent = p.nome;
    const a = document.getElementById("topAvatar");
    if (p.foto) {
        a.style.backgroundImage = `url('${p.foto}')`;

    } else {

    }
}

// ============================================================

async function login() {
    const user = document.getElementById("loginUser").value.trim();
    const pass = document.getElementById("loginPass").value;

    if (!user || !pass) { notify("Preencha usuário e senha."); return; }

    const result = await loginSupabase(user, pass);

    if (result) {
        try {
            const loadedData = await loadData();
            if (loadedData) {
                data = loadedData;
                data.session = true;
                isDataLoaded = true;
            } else {
                data = defaultData();
                data.session = true;
                isDataLoaded = false;
            }

            document.getElementById("loginScreen").style.display = "none";
            document.getElementById("app").style.display = "flex";

            updateUser();
            navigate("dashboard");
            notify(`Bem-vindo, ${data.professor?.nome || "Professor"}!`);
        } catch (error) {
            notify('Erro ao carregar dados. Tente novamente.');
        }
    }
}

async function logout() {
    if (data && data.session) {
        try { await saveData(); } catch (error) {}
    }

    try { await supabaseClient.auth.signOut(); } catch (error) {}

    data = defaultData();
    data.session = false;
    isDataLoaded = false;
    currentUserId = null;
    currentStudent = null;
    currentPage = "dashboard";

    document.getElementById("app").style.display = "none";
    document.getElementById("loginScreen").style.display = "grid";
    document.getElementById("loginPass").value = "";

    document.querySelectorAll(".view").forEach(view => {
        view.innerHTML = '';
        view.classList.remove('active');
    });

    const dashboardView = document.getElementById("page-dashboard");
    if (dashboardView) {
        dashboardView.classList.add('active');
        dashboardView.innerHTML = `
            <div class="empty" style="padding:50px;text-align:center">
                <p style="font-size:18px;color:#8a9892">👋 Logout realizado com sucesso!</p>
                <p style="font-size:13px;color:#a0aaa6;margin-top:6px">Faça login para visualizar seus dados.</p>
            </div>
        `;
    }

    document.getElementById("topUserName").textContent = "";
    const avatarEl = document.getElementById("topAvatar");
    avatarEl.style.backgroundImage = "";
    avatarEl.textContent = "?";

    notify("Logout realizado com sucesso!");
}

                            const s = getStudent(a.alunoId);
                            return s ? `
                                <div class="sidebar-row" onclick="openStudent('${s.id}')" style="cursor:pointer">

                                </div>
                            ` : '';

                    </div>

            </aside>

    `;

    lucide.createIcons();
}

function filterStudents() {
    const term = (document.getElementById('studentSearch')?.value || '').toLowerCase().trim();
    const mode = window.studentListFilter || 'active';
    const all = (data.alunos || []);
    
    let list = all.filter(a =>
        `${a.nome} ${a.responsavel} ${(a.tags || []).join(' ')}`.toLowerCase().includes(term)
    );
    
    if (mode === 'active') list = list.filter(a => a.ativo !== false);
    if (mode === 'attention') {
        list = list.filter(a => {
            const hasUpcomingUnpaid = activeAppointments().some(x => 
                x.alunoId === a.id && x.data >= today() && !x.pago
            );
            const hasEvolucoes = (a.evolucoes || []).length > 0;
            const hasRecentAval = (a.avaliacoes || []).some(av => 
                (av.resultados || []).some(r => r.data >= today())
            );
            return hasUpcomingUnpaid || !hasEvolucoes || !hasRecentAval;
        });
    }

    const grid = document.getElementById('studentGrid');
    if (!grid) return;
    
    if (!list.length) {
        grid.innerHTML = '<div class="empty" style="grid-column:1/-1"><b>Nenhum aluno encontrado</b><span>Tente ajustar o filtro ou a busca.</span></div>';
        return;
    }

    grid.innerHTML = list.sort((a, b) => a.nome.localeCompare(b.nome)).map(a => {
        const consultas = (a.consultas || []).length;
        const aval = (a.avaliacoes || []).length;
        const evos = (a.evolucoes || []).length;
        const next = activeAppointments().filter(x => x.alunoId === a.id && x.data >= today())
            .sort((x, y) => (x.data + x.hora).localeCompare(y.data + y.hora))[0];
        const status = a.ativo !== false ? 'Ativo' : 'Inativo';
        const hasAttention = (() => {
            const hasUpcomingUnpaid = activeAppointments().some(x => x.alunoId === a.id && x.data >= today() && !x.pago);
            return hasUpcomingUnpaid || evos === 0;
        })();

        return `
            <div class="card student-card ${a.ativo === false ? 'inactive' : ''}" onclick="openStudent('${a.id}')">
                <div class="student-card-top">
                    ${avatarHTML(a, 'student-avatar')}
                    <div style="min-width:0;flex:1">
                        <div class="student-name">${esc(a.nome)} ${hasAttention ? '⚠️' : ''}</div>
                        <div class="student-meta">${a.idade ? esc(a.idade) + ' anos' : ''}${a.serie ? ' · ' + esc(a.serie) : ''}</div>
                    </div>
                    <span class="status ${a.ativo !== false ? 'ok' : 'missed'}" style="font-size:7px;padding:2px 6px">${status}</span>
                </div>
                <div class="student-tags">
                    ${(a.tags || []).slice(0, 3).map(t => `<span class="tag">${esc(t)}</span>`).join('')}
                    ${(a.tags || []).length > 3 ? `<span class="tag">+${(a.tags || []).length - 3}</span>` : ''}
                </div>
                <div class="student-footer">
                    <span>${consultas} consultas · ${evos} evoluções</span>
                    <strong>${money(a.valor || 0)}</strong>
                </div>
                <div style="font-size:8px;color:#8a9792;margin-top:4px">
                    ${next ? 'Próximo: ' + fmtDate(next.data) + ' ' + next.hora : 'Sem agenda'}
                </div>
            </div>
        `;
    }).join('');

    lucide.createIcons();
}

function toggleStudentForm(forceShow) {
    const f = document.getElementById("newStudentForm");
    if (!f) return;
    if (typeof forceShow === "boolean") {
        f.style.display = forceShow ? "block" : "none";
    } else {
        f.style.display = f.style.display === "none" ? "block" : "none";
    }
    if (f.style.display === "block") f.scrollIntoView({ behavior: "smooth", block: "start" });
}

async function saveStudent() {
    const nome = document.getElementById("fNome").value.trim();
    if (!nome) { notify("Informe o nome do aluno."); return; }

    const student = {
        id: uid(),
        nome: nome,
        idade: Number(document.getElementById("fIdade").value) || 0,
        serie: document.getElementById("fSerie").value.trim(),
        responsavel: document.getElementById("fResponsavel").value.trim(),
        telefone: document.getElementById("fTelefone").value.trim(),
        valor: Number(document.getElementById("fValor").value) || 0,
        foto: document.getElementById("fFoto").value.trim(),
        tags: document.getElementById("fTags").value.split(",").map(x => x.trim()).filter(Boolean),
        observacoes: document.getElementById("fObs").value.trim(),
        ativo: true
    };

    data.alunos.push(student);
    ensureStudentModules(student);
    await saveData();
    notify("Aluno cadastrado com sucesso.");
    toggleStudentForm(false);
    renderAlunos();
}

    const s = getStudent(currentStudent);

    const c = {
        id: uid(),
        data: document.getElementById("consData").value || today(),
        observacoes: document.getElementById("consObs").value.trim(),
        acoes: document.getElementById("consAcoes").value.trim(),
        pais: document.getElementById("consPais").value.trim(),
        solicitacoes: document.getElementById("consSolic").value.trim(),
        comportamentos: {}
    };

    ["participacao", "atencao", "comunicacao", "autonomia", "comportamento", "emocional"].forEach(k => {

function toggleAgendaForm() {
    const f = document.getElementById("agendaForm");
    if (!f) return;
    f.style.display = f.style.display === "none" ? "block" : "none";
    if (f.style.display === "block") f.scrollIntoView({ behavior: "smooth", block: "center" });
}

async function saveAppointment() {
    const alunoId = document.getElementById("agAluno").value;
    const dataValue = document.getElementById("agData").value;
    const hora = document.getElementById("agHora").value;
    const tipo = document.getElementById("agTipo").value;

    if (!alunoId || !dataValue || !hora) {
        notify("Preencha aluno, data e horário.");
        return;
    }

    const aluno = getStudent(alunoId);
    if (!aluno) { notify("Aluno não encontrado."); return; }

    const occupied = activeAppointments().some(a => a.data === dataValue && a.hora === hora);
    if (occupied) { notify("Este horário já possui atendimento."); return; }

    const newAppointment = {
        id: uid(),
        alunoId: alunoId,
        data: dataValue,
        hora: hora,
        tipo: tipo,
        status: "agendado",
        presente: false,
        pago: false
    };

    data.agenda.push(newAppointment);
    await saveData();
    notify("Atendimento agendado com sucesso!");
    renderAgenda();
}

async function cancelAppointment(id) {
    const a = data.agenda.find(x => x.id === id);
    if (!a) return;
    if (!confirm("Cancelar este atendimento?")) return;
    a.status = "cancelado";
    await saveData();
    notify("Atendimento cancelado.");
    renderPage();
}

async function togglePresence(id) {
    const a = data.agenda.find(x => x.id === id);
    if (!a) return;
    a.presente = !a.presente;
    if (a.presente) a.status = "realizado";
    else a.status = "agendado";
    await saveData();
    notify(a.presente ? "Presença registrada." : "Presença removida.");
    renderPage();
}

async function togglePayment(id) {
    const a = data.agenda.find(x => x.id === id);
    if (!a) return;
    const s = getStudent(a.alunoId);
    if (!s) return;

    if (!a.pago) {
        a.pago = true;
        data.transacoes.push({
            id: uid(),
            data: a.data,
            agendaId: a.id,
            alunoId: s.id,
            descricao: `Sessão de ${s.nome}`,
            valor: Number(s.valor) || 0,
            tipo: "receita",
            categoria: "Sessão"
        });
        await saveData();
        notify(`Pagamento de ${money(s.valor)} registrado.`);
    } else {
        a.pago = false;
        data.transacoes = data.transacoes.filter(t => t.agendaId !== a.id);
        await saveData();
        notify("Pagamento revertido.");
    }
    renderPage();
}

function calendarPrev() { calendarDate.setDate(calendarDate.getDate() - 1); selectedDay = dateISO(calendarDate); renderAgenda(); }
function calendarNext() { calendarDate.setDate(calendarDate.getDate() + 1); selectedDay = dateISO(calendarDate); renderAgenda(); }
function calendarToday() { calendarDate = new Date(); selectedDay = today(); renderAgenda(); }
function setCalendarMode(mode) { calendarMode = mode; selectedDay = selectedDay || today(); renderAgenda(); }
function selectAgendaDay(day) { selectedDay = day; calendarDate = parseDate(day); renderAgenda(); }

}

function startAvalStepAnswer() {
    const alunoId = document.getElementById("stepAluno")?.value;
    const tplId = document.getElementById("stepTemplate")?.value;

    if (!alunoId) { notify("Selecione um aluno."); return; }
    if (!tplId) { notify("Selecione um instrumento."); return; }

    const aluno = getStudent(alunoId);
    const tpl = getTemplateById(tplId);
    if (!aluno || !tpl) { notify("Dados não encontrados."); return; }

    avalStepAlunoId = alunoId;
    avalStepTemplateId = tplId;
    avalStepCurrentIndex = 0;
    avalStepResponses = [];

    if (tpl.tipo === "anamnese" && tpl.campos) {
        avalStepQuestions = tpl.campos.flatMap(sec => sec.itens.map(it => ({
            secao: sec.secao,
            rotulo: it.rotulo,
            chave: it.chave,
            tipo: it.tipo,
            valor: ''
        })));
    } else {
        avalStepQuestions = (tpl.questoes || []).map((q, i) => ({
            index: i,
            texto: q,
            escala: tpl.escala || [{ valor: 0, rotulo: "Resposta" }]
        }));
    }

    avalStepMode = 'answering';
    renderAvaliacoes();
}

function renderAvalStepAnswer() {
    const total = avalStepQuestions.length;
    const idx = avalStepCurrentIndex;
    const q = avalStepQuestions[idx];
    if (!q || total === 0) { avalStepMode = 'done'; renderAvaliacoes(); return; }

    const isAnamnese = q.secao !== undefined;
    const pct = Math.round(((idx) / total) * 100);
    let content = '';

    if (isAnamnese) {
        content = `
            <div class="eyebrow">${esc(q.secao)}</div>
            <div class="question">${esc(q.rotulo)}</div>
            ${q.tipo === 'textarea' ? `<textarea id="stepAnswer" class="textarea" style="min-height:120px;font-size:13px" placeholder="Preencha esta informação..."></textarea>` : `<input id="stepAnswer" class="input" type="${q.tipo === 'date' ? 'date' : 'text'}" placeholder="Preencha esta informação...">`}
        `;
    } else {
        const escala = q.escala || [{ valor: 0, rotulo: 'Resposta' }];
        content = `
            <div class="eyebrow">Questão ${idx + 1} de ${total}</div>
            <div class="question">${esc(q.texto)}</div>
            <div class="answer-grid">
                ${escala.map(op => `
                    <label class="${avalStepResponses[idx] === op.valor ? 'selected' : ''}" onclick="selectAvalStepOption(${idx}, ${op.valor})">
                        <input type="radio" name="avalStepOpt" value="${op.valor}" ${avalStepResponses[idx] === op.valor ? 'checked' : ''} style="margin-right:7px;accent-color:var(--sage)">
                        ${esc(op.rotulo)}
                    </label>
                `).join('')}
            </div>
        `;
    }

    document.getElementById("page-avaliacoes").innerHTML = `
        <button class="btn btn-outline btn-sm" onclick="cancelAvalStep()" style="margin-bottom:14px"><i data-lucide="arrow-left"></i>Sair da aplicação</button>
        <div class="assessment-workspace">
            <div class="card" style="padding:24px">
                <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px">
                    <span style="font-size:10px;color:#909b96">${esc(getTemplateById(avalStepTemplateId)?.nome || 'Avaliação')}</span>
                    <span style="font-size:10px;color:#909b96">${esc(getStudent(avalStepAlunoId)?.nome || 'Aluno')}</span>
                </div>
                <div class="assessment-progress"><span>Página ${idx+1} de ${total}</span><span>${pct}% concluído</span></div>
                <div class="assessment-track"><div class="fill" style="width:${Math.max(4, pct)}%"></div></div>
                <div class="assessment-page">${content}</div>
                <div class="assessment-nav">
                    <button class="btn btn-outline" onclick="avalStepPrev()" ${idx === 0 ? 'disabled' : ''}><i data-lucide="chevron-left"></i> Anterior</button>
                    <span class="hint">Preencha e avance.</span>
                    <button class="btn btn-primary" onclick="avalStepNext()">${idx === total - 1 ? 'Concluir' : 'Próxima'} <i data-lucide="chevron-right"></i></button>
                </div>
            </div>
        </div>
    `;
    lucide.createIcons();
    if (isAnamnese) {
        const el = document.getElementById('stepAnswer');
        if (el && avalStepResponses[idx] !== undefined) el.value = avalStepResponses[idx] || '';
    }
}

function selectAvalStepOption(idx, value) {
    avalStepResponses[idx] = value;
    renderAvalStepAnswer();
}

function avalStepPrev() {
    if (avalStepCurrentIndex > 0) {
        avalStepCurrentIndex--;
        renderAvalStepAnswer();
    }
}

function avalStepNext() {
    const idx = avalStepCurrentIndex;
    const q = avalStepQuestions[idx];
    const isAnamnese = q.secao !== undefined;

    if (isAnamnese) {
        const el = document.getElementById("stepAnswer");
        if (el) avalStepResponses[idx] = el.value || '';
    } else {
        if (avalStepResponses[idx] === undefined || avalStepResponses[idx] === null) {
            notify("Selecione uma opção antes de continuar.");
            return;
        }
    }

    if (idx === avalStepQuestions.length - 1) {
        avalStepMode = 'done';
        renderAvaliacoes();
    } else {
        avalStepCurrentIndex++;
        renderAvalStepAnswer();
    }
}

function renderAvalStepDone() {
    const tpl = getTemplateById(avalStepTemplateId);
    const aluno = getStudent(avalStepAlunoId);

    if (!tpl || !aluno) { cancelAvalStep(); return; }

    let respostas = [];
    let questoes = [];

    if (tpl.tipo === "anamnese" && tpl.campos) {
        avalStepQuestions.forEach((q, i) => {
            respostas.push({ secao: q.secao, rotulo: q.rotulo, chave: q.chave, valor: avalStepResponses[i] || '' });
        });
        questoes = tpl.campos.flatMap(sec => sec.itens.map(it => it.rotulo));
    } else if (tpl.questoes) {
        avalStepQuestions.forEach((q, i) => {
            const val = avalStepResponses[i];
            const escala = q.escala || [];
            const op = escala.find(e => e.valor === val);
            respostas.push({ questao: q.texto, valor: val !== undefined ? val : null, rotulo: op ? op.rotulo : "Sem resposta" });
        });
        questoes = tpl.questoes.map((q, i) => ({ id: uid(), numero: i + 1, texto: q }));
    }

    const avId = uid();
    const novaAval = {
        id: avId,
        data: today(),
        titulo: tpl.nome,
        tipo: tpl.tipo,
        objetivo: tpl.descricao,
        questoes: questoes,
        resultados: [{
            id: uid(),
            data: today(),
            respostas: respostas,
            resumo: avalStepResumo || "Avaliação concluída."
        }],
        finalizada: true
    };

    if (aluno) {
        ensureStudentModules(aluno);
        aluno.avaliacoes.push(novaAval);
        saveData().then(() => {
            notify(`Avaliação "${tpl.nome}" aplicada a ${aluno.nome} com sucesso!`);
        });
    }

    document.getElementById("page-avaliacoes").innerHTML = `
        <div class="card" style="max-width:500px;margin:40px auto;text-align:center;padding:40px">
            <div style="font-size:48px;margin-bottom:12px">✅</div>
            <div class="section-title" style="font-size:20px">Avaliação concluída!</div>
            <div class="section-sub" style="font-size:13px;margin-top:6px">${esc(tpl.nome)} aplicada a ${esc(aluno.nome)}</div>
            <div style="margin-top:18px;display:flex;gap:8px;justify-content:center;flex-wrap:wrap">
                <button class="btn btn-primary" onclick="cancelAvalStep()"><i data-lucide="check"></i>Ver avaliações</button>
                <button class="btn btn-outline" onclick="openStudent('${aluno.id}')">Ver prontuário</button>
            </div>
        </div>
    `;
    lucide.createIcons();
}

function cancelAvalStep() {
    avalStepMode = null;
    avalStepQuestions = [];
    avalStepCurrentIndex = 0;
    avalStepResponses = [];
    avalStepTemplateId = null;
    avalStepAlunoId = null;
    avalStepResumo = '';
    avalStepExistingId = null;
    renderAvaliacoes();
}

        <div class="section-head"><div><div class="section-title">Histórico: ${esc(titulo)}</div><div class="section-sub">Alunos que receberam esta avaliação.</div></div></div>

function renderFinanceiro() {
    if (!isDataLoaded || !data || !data.transacoes) {
        document.getElementById("page-financeiro").innerHTML = `<div class="empty"><b>Carregando dados</b><span>Aguarde um momento...</span></div>`;
        return;
    }

    const now = new Date();
    if (typeof financeYear !== "number") financeYear = now.getFullYear();
    if (typeof financeMonth !== "number") financeMonth = now.getMonth();

    const label = new Date(financeYear, financeMonth, 1).toLocaleDateString("pt-BR", { month: "long", year: "numeric" });
    const tx = (data.transacoes || []).filter(t => {
        const d = parseDate(t.data);
        return d.getFullYear() === financeYear && d.getMonth() === financeMonth;
    }).sort((a, b) => b.data.localeCompare(a.data));

    const rec = tx.filter(t => (t.tipo || "receita") === "receita");
    const desp = tx.filter(t => t.tipo === "despesa");
    const received = rec.reduce((s, t) => s + Number(t.valor || 0), 0);
    const expenses = desp.reduce((s, t) => s + Number(t.valor || 0), 0);

    const ap = activeAppointments().filter(a => {
        const d = parseDate(a.data);
        return d.getFullYear() === financeYear && d.getMonth() === financeMonth;
    });
    const expected = ap.reduce((s, a) => s + Number(getStudent(a.alunoId)?.valor || 0), 0);
    const pending = ap.filter(a => !a.pago).reduce((s, a) => s + Number(getStudent(a.alunoId)?.valor || 0), 0);
    const rate = expected ? Math.round(received / expected * 100) : 0;

    document.getElementById("page-financeiro").innerHTML = `
        ${renderHelpBox("financeiro")}

        <div class="page-intro">
            <div class="page-intro-copy">
                <h1>Financeiro</h1>
                <p>${esc(label)} · o que entrou, o que saiu e o que ainda precisa ser recebido.</p>
            </div>
            <div class="page-intro-actions">
                <button class="btn btn-blue" onclick="generateFinancePDF()"><i data-lucide="file-down"></i>Relatório</button>
            </div>
        </div>

        <div class="card" style="padding:14px;margin-bottom:14px;display:flex;justify-content:space-between;align-items:center;gap:10px">
            <button class="btn btn-outline btn-sm" onclick="changeFinanceMonth(-1)"><i data-lucide="chevron-left"></i></button>
            <div style="text-align:center"><div class="section-title" style="text-transform:capitalize">${esc(label)}</div><div class="section-sub">Período selecionado</div></div>
            <button class="btn btn-outline btn-sm" onclick="changeFinanceMonth(1)"><i data-lucide="chevron-right"></i></button>
        </div>

        <div class="stats-grid">
            <div class="stat-card"><div class="stat-label">Saldo</div><div class="stat-value" style="color:${received - expenses >= 0 ? 'var(--sage2)' : 'var(--danger)'}">${money(received - expenses)}</div><div class="stat-sub">Recebido − despesas</div></div>
            <div class="stat-card"><div class="stat-label">Recebido</div><div class="stat-value">${money(received)}</div><div class="stat-sub">${rec.length} registro(s)</div></div>
            <div class="stat-card"><div class="stat-label">Despesas</div><div class="stat-value" style="color:#c0504d">${money(expenses)}</div><div class="stat-sub">${desp.length} registro(s)</div></div>
            <div class="stat-card"><div class="stat-label">A receber</div><div class="stat-value">${money(pending)}</div><div class="stat-sub">Taxa: ${rate}%</div></div>
        </div>

        <div class="finance-layout" style="margin-top:14px">
            <div>
                <div class="card" style="padding:18px">
                    <div class="section-head"><div><div class="section-title">Movimentação</div><div class="section-sub">Recebimentos do período.</div></div>
                        <button class="btn btn-primary btn-sm" onclick="showDespesaForm()"><i data-lucide="minus-circle"></i>Nova despesa</button>
                    </div>
                    <div id="despesaFormCard" style="display:none;margin-bottom:14px;padding:16px;background:#fbfdfc;border-radius:12px;border:1px solid var(--line)">
                        <div class="section-title" style="font-size:13px">Registrar despesa</div>
                        <div class="form-grid two" style="margin-top:10px">
                            <div class="field"><label class="label">Descrição</label><input id="despDescricao" class="input"></div>
                            <div class="field"><label class="label">Valor</label><input id="despValor" class="input" type="number" step="0.01"></div>
                            <div class="field"><label class="label">Data</label><input id="despData" class="input" type="date" value="${today()}"></div>
                            <div class="field"><label class="label">Categoria</label><select id="despCategoria" class="select"><option>Material didático</option><option>Aluguel / Espaço</option><option>Equipamentos</option><option>Capacitação</option><option>Marketing</option><option>Transporte</option><option>Impostos</option><option>Outros</option></select></div>
                        </div>
                        <div class="form-actions"><button class="btn btn-primary" onclick="saveDespesa()">Salvar</button><button class="btn btn-outline" onclick="document.getElementById('despesaFormCard').style.display='none'">Cancelar</button></div>
                    </div>
                    ${rec.length ? rec.slice(0, 15).map(t => {
                        const s = getStudent(t.alunoId);
                        return `<div class="eval-row"><div><b>${esc(s?.nome || 'Recebimento')}</b><span>${fmtDate(t.data)} · ${esc(t.descricao || 'Sessão')}</span></div><strong style="color:var(--sage2)">${money(t.valor)}</strong></div>`;
                    }).join('') : '<div class="empty">Nenhuma receita registrada.</div>'}
                </div>
            </div>
            <div class="finance-side">
                <div class="side-card">
                    <div class="sc-title">Pendências</div>
                    ${ap.filter(a => !a.pago).length ? ap.filter(a => !a.pago).slice(0, 8).map(a => {
                        const s = getStudent(a.alunoId);
                        return `<div class="sc-row"><span>${esc(s?.nome || 'Aluno')} · ${fmtDate(a.data)}</span><span class="sc-val" style="color:#9a6b30">${money(s?.valor || 0)}</span></div>`;
                    }).join('') : '<div class="empty" style="padding:8px 0;font-size:10px">Nenhuma pendência.</div>'}
                </div>
                <div class="side-card">
                    <div class="sc-title">Despesas por categoria</div>
                    ${desp.length ? Object.entries(desp.reduce((acc, t) => {
                        const cat = t.categoria || 'Outros';
                        acc[cat] = (acc[cat] || 0) + Number(t.valor || 0);
                        return acc;
                    }, {})).sort((a, b) => b[1] - a[1]).map(([cat, val]) => `
                        <div class="sc-row"><span>${esc(cat)}</span><span class="sc-val" style="color:#c0504d">${money(val)}</span></div>
                    `).join('') : '<div class="empty" style="padding:8px 0;font-size:10px">Nenhuma despesa.</div>'}
                </div>
            </div>
        </div>
    `;
    lucide.createIcons();
}

function showDespesaForm() {
    const card = document.getElementById("despesaFormCard");
    if (card) {
        card.style.display = "block";
        card.scrollIntoView({ behavior: "smooth", block: "center" });
    }
}

async function saveDespesa() {
    const descricao = document.getElementById("despDescricao")?.value.trim();
    const valor = Number(document.getElementById("despValor")?.value) || 0;
    const dataVal = document.getElementById("despData")?.value || today();
    const categoria = document.getElementById("despCategoria")?.value || "Outros";

    if (!descricao) { notify("Descreva a despesa."); return; }
    if (valor <= 0) { notify("Informe um valor válido."); return; }

    if (!data.transacoes) data.transacoes = [];
    data.transacoes.push({ id: uid(), data: dataVal, agendaId: null, alunoId: null, descricao, valor, tipo: "despesa", categoria });
    await saveData();
    notify("Despesa registrada.");
    renderFinanceiro();
}

function changeFinanceMonth(delta) {
    const d = new Date(financeYear, financeMonth + delta, 1);
    financeYear = d.getFullYear();
    financeMonth = d.getMonth();
    financePage = 1;
    renderFinanceiro();
}

function generateFinancePDF() {
    const doc = new window.jspdf.jsPDF({ unit: "mm", format: "a4" });
    const pageW = doc.internal.pageSize.getWidth();
    let y = 20;
    doc.setFont("helvetica", "bold");
    doc.setFontSize(18);
    doc.text("ASAS - Relatório Financeiro", pageW / 2, y, { align: "center" });
    y += 8;
    doc.setFontSize(12);
    const label = new Date(financeYear, financeMonth, 1).toLocaleDateString("pt-BR", { month: "long", year: "numeric" });
    doc.text(label, pageW / 2, y, { align: "center" });
    y += 10;
    doc.setFont("helvetica", "normal");
    doc.setFontSize(10);
    doc.text(`Gerado em ${fmtDate(today())}`, 20, y);
    y += 8;
    doc.save(`relatorio-financeiro-${financeYear}-${String(financeMonth + 1).padStart(2, "0")}.pdf`);
    notify("Relatório financeiro salvo em PDF.");
}

function renderPerfil() {
    if (!isDataLoaded || !data || !data.professor) {
        document.getElementById("page-perfil").innerHTML = `<div class="empty"><b>Carregando perfil</b><span>Aguarde um momento...</span></div>`;
        return;
    }

    const p = data.professor;
    const raw = p.vencimentoMensalidade || p.vencimento_mensalidade || '';
    const exp = raw ? parseDate(raw) : null;
    const days = exp && !isNaN(exp) ? Math.ceil((exp - parseDate(today())) / 86400000) : null;
    const safeDays = days === null ? 0 : Math.max(0, days);
    const pct = days === null ? 0 : Math.max(0, Math.min(100, (safeDays / 30) * 100));
    const status = days === null ? 'Defina a data' : days < 0 ? 'Vencida' : days <= 5 ? 'Vence em breve' : 'Em dia';
    const statusClass = days === null ? 'pending' : days <= 5 ? 'pending' : 'ok';

    document.getElementById("page-perfil").innerHTML = `
        ${renderHelpBox("perfil")}

        <div class="profile-editor">
            <div class="card">
                <div class="eyebrow">Minha conta</div>
                <div style="display:flex;justify-content:space-between;gap:12px;align-items:flex-start;flex-wrap:wrap;margin-top:6px">
                    <div><div class="profile-name-big">${esc(p.nome || 'Professor ASAS')}</div><div class="section-sub">Dados básicos da sua conta.</div></div>
                    <span class="status ${statusClass}">${status}</span>
                </div>
                <div class="profile-expiry" style="--pct:${pct}%">
                    <div class="profile-expiry-ring" style="--pct:${pct}%">
                        <div>${days === null ? '<strong>—</strong><small>definir</small>' : `<strong>${safeDays}</strong><small>${safeDays === 1 ? 'dia' : 'dias'}</small>`}</div>
                    </div>
                    <div class="profile-expiry-info">
                        <b>Próxima mensalidade</b>
                        <span>${exp && !isNaN(exp) ? `Vencimento em <strong>${fmtDate(raw)}</strong>.` : 'Cadastre uma data para acompanhar o vencimento.'}</span>
                    </div>
                </div>
                <div class="profile-edit-row">
                    <div class="field"><label class="label">Nome</label><input id="profNome" class="input" value="${esc(p.nome || 'Professor ASAS')}"></div>
                    <div class="field"><label class="label">Vencimento mensalidade</label><input id="profVencimento" class="input" type="date" value="${esc(raw || '')}"></div>
                </div>
                <div class="form-actions"><button class="btn btn-primary" onclick="saveProfile()"><i data-lucide="save"></i>Salvar alterações</button></div>
            </div>
        </div>
    `;
    lucide.createIcons();
}

async function saveProfile() {
    const p = data.professor || (data.professor = {});
    p.nome = document.getElementById("profNome")?.value.trim() || "Professor ASAS";
    p.vencimentoMensalidade = document.getElementById("profVencimento")?.value || '';
    p.especialidade = p.especialidade || '';
    p.bio = p.bio || '';
    p.foto = p.foto || '';
    await saveData();
    updateUser();
    notify("Dados da conta atualizados.");
    renderPerfil();
}

// INICIALIZAÇÃO
// ============================================================

async function init() {
    lucide.createIcons();

    const isLoggedIn = await checkSession();

    if (isLoggedIn) {
        const loadedData = await loadData();
        if (loadedData) {
            data = loadedData;
            data.session = true;
            isDataLoaded = true;
        } else {
            data = defaultData();
        }

        document.getElementById("loginScreen").style.display = "none";
        document.getElementById("app").style.display = "flex";
        updateUser();
        navigate("dashboard");
        if (isDataLoaded) notify("Bem-vindo de volta!");
    } else {
        document.getElementById("loginScreen").style.display = "grid";
        document.getElementById("app").style.display = "none";
        isDataLoaded = false;
    }
}
