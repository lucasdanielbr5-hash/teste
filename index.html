<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Legado Que Ensina · Gestão Psicopedagógica</title>
<link rel="icon" type="image/png" href="https://i.imgur.com/AUoGLEq.png">
<script src="https://unpkg.com/lucide@latest"></script>
<script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;font-family:Inter,sans-serif;background:#f7f9f8;color:#263238}
body{overflow:hidden}
button,input,select,textarea{font-family:inherit;font-size:inherit}
button{cursor:pointer;border:0;background:none}
::-webkit-scrollbar{width:6px;height:6px}
::-webkit-scrollbar-thumb{background:#cbd5d1;border-radius:20px}
::-webkit-scrollbar-track{background:transparent}
:root{--sage:#5f8f7a;--sage-dark:#477363;--sage-light:#eaf3ee;--blue:#6288a8;--blue-light:#edf4f8;--ink:#263238;--line:#e6ece9}

/* LOGIN */
.login-screen{min-height:100vh;display:grid;place-items:center;padding:28px;background:radial-gradient(circle at 15% 20%,rgba(95,143,122,.13),transparent 30%),radial-gradient(circle at 85% 80%,rgba(98,136,168,.10),transparent 30%),#f5f8f6}
.login-box{width:min(420px,100%);background:#fff;border:1px solid #e4ebe7;border-radius:22px;padding:38px;box-shadow:0 24px 70px rgba(38,50,56,.10)}
.login-box .logo-area{text-align:center;margin-bottom:26px}
.login-box .logo-img{width:64px;height:64px;object-fit:contain;border-radius:16px;margin-bottom:14px}
.login-box .brand-name{font-size:23px;font-weight:800;color:#20362d;letter-spacing:-.03em}
.login-box .brand-name span{color:var(--sage)}
.login-box .brand-sub{font-size:11px;color:#82918a;margin-top:5px}
.login-box .login-sub{color:#66756f;font-size:13px;margin-bottom:20px}
.login-box .field{margin-bottom:14px}
.login-box .label{display:block;font-size:12px;font-weight:600;color:#4c5f57;margin-bottom:6px}
.login-box .input{width:100%;min-height:46px;padding:12px 14px;border:1px solid #dce6e1;border-radius:11px;font-size:14px;background:#fbfcfc;outline:0;transition:.2s}
.login-box .input:focus{border-color:#76a18e;background:#fff;box-shadow:0 0 0 4px rgba(95,143,122,.10)}
.login-box .login-btn{width:100%;min-height:48px;padding:13px;border:0;border-radius:11px;font-size:14px;font-weight:700;background:var(--sage);color:#fff;display:flex;align-items:center;justify-content:center;gap:8px;margin-top:6px;cursor:pointer;transition:.2s}
.login-box .login-btn:hover{background:var(--sage-dark)}
.login-box .login-note{display:flex;gap:9px;margin-top:20px;padding:11px;border:1px solid #e7eee9;border-radius:11px;background:#f8faf9;color:#788881;font-size:11px;align-items:center}

/* LAYOUT PRINCIPAL 3 COLUNAS */
.app{height:100vh;display:grid;grid-template-columns:218px 1fr 320px;overflow:hidden}

/* SIDEBAR ESQUERDA */
.sidebar{background:#fff;border-right:1px solid var(--line);display:flex;flex-direction:column;padding:18px 12px;overflow-y:auto}
.brand{display:flex;align-items:center;gap:11px;padding:8px 10px;margin-bottom:18px}
.brand-mark{width:34px;height:34px;border-radius:10px;overflow:hidden;flex-shrink:0}
.brand-mark img{width:100%;height:100%;object-fit:contain}
.brand-text{display:flex;flex-direction:column;line-height:1.15}
.brand-text .main{font-size:13px;font-weight:700;color:var(--sage-dark)}
.brand-text .sub{font-size:8px;color:#8a9892;letter-spacing:.02em}
.nav{display:flex;flex-direction:column;gap:2px}
.nav button{color:#718096;border-radius:10px;min-height:40px;padding:0 12px;display:flex;align-items:center;gap:11px;font-size:13px;font-weight:500;text-align:left;transition:all .18s}
.nav button:hover{background:#f3f6f5;color:var(--ink)}
.nav button.active{background:var(--sage-light);color:var(--sage-dark);font-weight:600}
.nav button svg{width:18px;min-width:18px}
.side-bottom{margin-top:auto;padding-top:16px}

/* CONTEÚDO CENTRAL */
.main{display:flex;flex-direction:column;overflow:hidden;background:#f7f9f8}
.topbar{height:64px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 28px;flex-shrink:0}
.page-title{display:flex;align-items:center;gap:9px;font-size:16px;font-weight:600;letter-spacing:-.01em}
.page-title svg{color:var(--sage);width:18px}
.user-mini{display:flex;align-items:center;gap:10px}
.avatar{width:36px;height:36px;border-radius:50%;background:var(--sage-light);color:var(--sage-dark);display:grid;place-items:center;font-weight:700;font-size:13px;overflow:hidden;background-size:cover;background-position:center;flex-shrink:0}
.content{flex:1;overflow-y:auto;padding:22px 28px 40px}
.view{display:none}
.view.active{display:block}

/* PAINEL DIREITO — CALENDÁRIO FIXO */
.side-panel{background:#fff;border-left:1px solid var(--line);padding:20px 18px;overflow-y:auto;display:flex;flex-direction:column;gap:16px}
.panel-title{font-size:12px;font-weight:700;color:#34413c;text-transform:uppercase;letter-spacing:.06em}
.cal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.cal-month{font-size:13px;font-weight:700;color:#34413c;text-transform:capitalize}
.cal-nav{display:flex;gap:4px}
.cal-nav button{width:26px;height:26px;border-radius:8px;display:grid;place-items:center;color:#6b7a73;transition:.15s}
.cal-nav button:hover{background:#f3f6f5;color:var(--ink)}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px}
.cal-dow{font-size:10px;font-weight:700;color:#98a49f;text-align:center;padding:6px 0;text-transform:uppercase}
.cal-day{aspect-ratio:1;border-radius:9px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:12px;font-weight:500;color:#34413c;cursor:pointer;position:relative;transition:.15s;gap:2px}
.cal-day:hover{background:#f3f6f5}
.cal-day.other{color:#c8d0cd}
.cal-day.today{background:var(--sage-light);color:var(--sage-dark);font-weight:800}
.cal-day.selected{background:var(--sage);color:#fff;font-weight:800}
.cal-day.selected.today{background:var(--sage);color:#fff}
.cal-dots{display:flex;gap:2px;position:absolute;bottom:3px}
.cal-dot{width:4px;height:4px;border-radius:50%}
.cal-dot.psico{background:#8db0c8}
.cal-dot.psicopeg{background:#8eb29d}
.cal-dot.aula{background:#ad94b9}
.cal-day.selected .cal-dot{background:#fff;opacity:.85}
.cal-day.today .cal-dot{opacity:.9}

/* COMPONENTES GENÉRICOS */
.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:18px}
.section-head{display:flex;align-items:center;justify-content:space-between;gap:14px;margin-bottom:14px}
.section-title{font-size:14px;font-weight:700;color:#34413c}
.section-sub{font-size:11px;color:#89968f;margin-top:2px}
.grid{display:grid;gap:14px}

/* BOTÕES */
.btn{border-radius:9px;padding:8px 13px;font-size:12px;font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:6px;transition:.18s;min-height:34px;border:1px solid transparent}
.btn svg{width:14px;height:14px}
.btn-primary{background:var(--sage);color:#fff}
.btn-primary:hover{background:var(--sage-dark)}
.btn-soft{background:var(--sage-light);color:var(--sage-dark)}
.btn-soft:hover{background:#d5e8df}
.btn-blue{background:var(--blue-light);color:#557994}
.btn-blue:hover{background:#d5e4ee}
.btn-danger{background:#fff0f0;color:#b85b5b}
.btn-danger:hover{background:#fdd}
.btn-outline{background:#fff;border-color:var(--line);color:#53615c}
.btn-outline:hover{background:#f7faf8}
.btn-outline:disabled{opacity:.45;cursor:not-allowed}
.btn-sm{padding:6px 10px;font-size:11px;min-height:30px}
.btn-sm svg{width:13px;height:13px}

/* FORMULÁRIOS */
.input,.select,.textarea{width:100%;border:1px solid #dfe7e3;background:#fbfcfc;border-radius:9px;padding:9px 11px;outline:0;font-size:13px;color:var(--ink);min-height:38px;transition:.15s}
.input:focus,.select:focus,.textarea:focus{border-color:#8eb2a3;background:#fff;box-shadow:0 0 0 3px rgba(95,143,122,.09)}
.textarea{resize:vertical;min-height:90px}
.label{display:block;font-size:11px;font-weight:600;color:#66756f;margin-bottom:5px}
.field{margin-bottom:12px}
.form-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.form-grid.two{grid-template-columns:repeat(2,minmax(0,1fr))}
.form-actions{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}

/* DASHBOARD — números + hoje (sem repetição) */
.stat-row{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:18px}
.stat{background:#fff;border:1px solid var(--line);border-radius:14px;padding:16px;position:relative}
.stat .st-label{font-size:10px;text-transform:uppercase;letter-spacing:.06em;color:#91a09a;font-weight:700}
.stat .st-value{font-size:22px;font-weight:800;color:#263238;margin-top:5px;letter-spacing:-.02em}
.stat .st-sub{font-size:10px;color:#9aa6a1;margin-top:3px}
.stat .st-icon{position:absolute;top:14px;right:14px;width:32px;height:32px;border-radius:9px;display:grid;place-items:center;background:#f4f8f6;color:var(--sage)}
.stat .st-icon svg{width:16px;height:16px}
.today-item{display:flex;align-items:center;gap:11px;padding:11px 12px;border:1px solid var(--line);border-radius:12px;background:#fff;margin-bottom:7px;cursor:pointer;transition:.15s}
.today-item:hover{border-color:#c8ddd3;background:#fafcfb}
.today-item .ti-time{font-size:11px;font-weight:800;color:var(--sage-dark);min-width:42px}
.today-item .ti-info{flex:1;min-width:0}
.today-item .ti-name{font-size:12px;font-weight:700;color:#2e3d37;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.today-item .ti-type{font-size:10px;color:#8a9892;margin-top:1px}
.student-avatar{width:38px;height:38px;border-radius:11px;background:var(--sage-light);color:var(--sage-dark);display:grid;place-items:center;font-weight:700;font-size:14px;overflow:hidden;background-size:cover;background-position:center;flex-shrink:0}

/* ALUNOS */
.student-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}
.student{background:#fff;border:1px solid var(--line);border-radius:14px;padding:15px;cursor:pointer;transition:.2s}
.student:hover{border-color:#c8ddd3;transform:translateY(-2px);box-shadow:0 8px 22px rgba(50,90,70,.08)}
.student-top{display:flex;gap:11px;align-items:center}
.student-name{font-weight:700;font-size:13px;color:#2e3d37;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.student-meta{font-size:10px;color:#89968f;margin-top:2px}
.tags{display:flex;flex-wrap:wrap;gap:4px;margin-top:10px}
.tag{font-size:9px;padding:3px 7px;border-radius:20px;background:#edf4f8;color:#597b96;font-weight:600}
.student-footer{display:flex;justify-content:space-between;margin-top:12px;padding-top:10px;border-top:1px solid #f0f3f2;font-size:10px;color:#8a9892}
.student-footer strong{font-size:12px;color:#34413c}

/* AGENDA */
.agenda-toolbar{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.week-grid{display:grid;grid-template-columns:55px repeat(5,minmax(90px,1fr));min-width:520px}
.week-head{background:#fafcfb;border-bottom:1px solid var(--line);padding:7px 4px;text-align:center;font-size:10px;font-weight:700;color:#68766f}
.week-head .wnum{font-size:13px;color:#34413c;font-weight:800;display:block;margin-top:1px}
.time-cell{height:46px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);padding:4px 6px;font-size:9px;color:#97a39e;text-align:right}
.slot{height:46px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);padding:2px;background:#fff;cursor:pointer;position:relative}
.slot:hover{background:#f8fbf9}
.slot .empty-slot{height:100%;display:grid;place-items:center;color:#d0d8d4;font-size:13px;opacity:0}
.slot:hover .empty-slot{opacity:1}
.event{padding:3px 5px;border-radius:6px;font-size:9px;line-height:1.2;cursor:pointer;overflow:hidden;margin-bottom:2px}
.event.psico{background:#edf4f8;color:#557792}
.event.psicopeg{background:#f0f5ec;color:#5d806c}
.event.aula{background:#f5f0f8;color:#80678c}
.event strong{display:block;font-size:9px;margin-bottom:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:800}
.event-actions{display:flex;gap:2px;margin-top:2px}
.event-actions button{background:rgba(255,255,255,.75);border-radius:3px;padding:1px 3px;font-size:8px;color:inherit}
.month-grid{display:grid;grid-template-columns:repeat(7,1fr);border:1px solid var(--line);border-radius:12px;overflow:hidden;background:#fff}
.month-head{padding:8px 4px;text-align:center;font-size:10px;font-weight:700;color:#68766f;background:#fafcfb;border-bottom:1px solid var(--line)}
.month-day{min-height:68px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);padding:5px;cursor:pointer;transition:.15s}
.month-day:hover{background:#fafcfb}
.month-day.other{background:#fafafa;color:#c8d0cd}
.day-number{font-size:11px;font-weight:700;color:#34413c}
.month-day.other .day-number{color:#c8d0cd}
.dot-row{display:flex;flex-wrap:wrap;gap:2px;margin-top:4px}
.dot{width:5px;height:5px;border-radius:50%}
.dot.psico{background:#8db0c8}
.dot.psicopeg{background:#8eb29d}
.dot.aula{background:#ad94b9}
.day-events{margin-top:3px;display:flex;flex-direction:column;gap:2px}
.day-event{font-size:8px;padding:1px 3px;border-radius:3px;background:#edf4f8;color:#557792;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* FINANCEIRO */
.fin-cards{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:16px}
.fin-card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:16px;position:relative}
.fin-card .fc-label{font-size:10px;text-transform:uppercase;color:#91a09a;font-weight:700;letter-spacing:.05em}
.fin-card .fc-value{font-size:20px;font-weight:800;margin-top:5px;letter-spacing:-.02em}
.fin-card .fc-sub{font-size:10px;color:#9aa6a1;margin-top:3px}
.fin-card.positive .fc-value{color:var(--sage-dark)}
.fin-card.negative .fc-value{color:#c0504d}
.fin-card .fc-icon{position:absolute;top:14px;right:14px;width:30px;height:30px;border-radius:9px;display:grid;place-items:center;background:#f4f8f6;color:var(--sage)}
.fin-card.negative .fc-icon{background:#fff0f0;color:#c0504d}
.fin-card.blue .fc-icon{background:#edf4f8;color:var(--blue)}
.charts-grid{display:grid;grid-template-columns:1.4fr 1fr;gap:14px;margin-bottom:16px}
.charts-grid.equal{grid-template-columns:1fr 1fr}
.chart-panel{background:#fff;border:1px solid var(--line);border-radius:14px;padding:16px}
.chart-panel .cp-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.chart-panel .cp-title{font-size:13px;font-weight:700;color:#34413c}
.chart-panel .cp-sub{font-size:10px;color:#8a9892;margin-top:2px}
.chart-wrap{position:relative;height:200px}
.chart-wrap.small{height:165px}
.fin-table{width:100%;border-collapse:collapse}
.fin-table th{text-align:left;font-size:9px;color:#87948e;text-transform:uppercase;padding:8px;border-bottom:1px solid var(--line);font-weight:700}
.fin-table td{padding:10px 8px;border-bottom:1px solid #f0f3f2;font-size:11px}
.pay-badge{display:inline-flex;font-size:9px;font-weight:600;padding:3px 7px;border-radius:11px;background:#e8f0fe;color:#3a6cb8}
.pending-item{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid #f0f3f2}
.pending-item .pi-info{flex:1;min-width:0}
.pending-item .pi-name{font-size:11px;font-weight:700;color:#2e3d37}
.pending-item .pi-date{font-size:9px;color:#8a9892;margin-top:1px}
.pending-item .pi-value{font-size:12px;font-weight:800;color:#34413c}
.inline-form{background:#f8fbf9;border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:14px}
.inline-form .if-title{font-size:13px;font-weight:700;color:#2e3d37;margin-bottom:10px}

/* AVALIAÇÕES */
.assess-metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:16px}
.assess-metric{background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px}
.assess-metric .am-label{font-size:9px;text-transform:uppercase;color:#89968f;font-weight:700;letter-spacing:.05em}
.assess-metric .am-value{font-size:20px;font-weight:800;color:#263238;margin-top:5px}
.assess-metric .am-sub{font-size:9px;color:#9aa6a1;margin-top:2px}
.instrument-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.instrument{background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px;transition:.15s}
.instrument:hover{border-color:#c4d8ce}
.instrument-head{display:flex;justify-content:space-between;gap:10px;margin-bottom:8px}
.instrument-title{font-size:13px;font-weight:800;color:#2e3d37}
.instrument-desc{font-size:10px;color:#7d8b85;line-height:1.5;margin-top:4px}
.instrument-meta{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.assess-badge{font-size:9px;font-weight:600;padding:3px 8px;border-radius:11px;background:#eaf3ee;color:#3d8a6b}
.assess-badge.screening{background:#fef3e8;color:#b8732a}
.assess-badge.anamnese{background:#e8f0fe;color:#3a6cb8}
.assess-table{width:100%;border-collapse:collapse}
.assess-table th{font-size:9px;text-transform:uppercase;color:#8b9892;text-align:left;padding:9px 10px;border-bottom:1px solid var(--line)}
.assess-table td{padding:11px 10px;border-bottom:1px solid #edf1ef;font-size:11px;color:#52605a}
.assess-status{display:inline-flex;padding:3px 7px;border-radius:6px;font-size:9px;font-weight:700;background:#edf5f0;color:#4b7863}
.aval-step{max-width:620px;margin:0 auto}
.step-card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:22px}
.step-question{font-size:15px;font-weight:700;margin:8px 0 14px;color:#263238;line-height:1.5}
.step-options{display:flex;flex-direction:column;gap:7px}
.step-options label{display:flex;align-items:center;gap:10px;padding:11px 13px;border:2px solid var(--line);border-radius:11px;cursor:pointer;font-size:12px;transition:.15s}
.step-options label:hover{border-color:#b8ccc2;background:#f8fbf9}
.step-options label.selected{border-color:var(--sage);background:var(--sage-light)}
.step-nav{display:flex;justify-content:space-between;margin-top:18px;gap:8px}
.step-nav button{padding:9px 18px;border:0;border-radius:9px;font-weight:600;font-size:12px;cursor:pointer;background:var(--sage);color:#fff}
.step-nav button[style*="background:#f5f8f7"]{background:#f5f8f7!important;color:#5a6b64!important}
.step-progress{height:4px;background:#edf1ef;border-radius:6px;overflow:hidden;margin:6px 0 16px}
.step-progress span{display:block;height:100%;background:var(--sage);border-radius:6px;transition:width .25s}

/* PRONTUÁRIO */
.profile-cover{height:100px;border-radius:14px 14px 0 0;background:linear-gradient(135deg,#eaf3ee,#edf4f8)}
.profile-head{display:flex;gap:16px;align-items:flex-end;margin-top:-38px;padding:0 22px}
.profile-avatar{width:84px;height:84px;border-radius:22px;background:#eaf3ee;border:5px solid #fff;display:grid;place-items:center;font-size:26px;font-weight:700;color:var(--sage-dark);overflow:hidden;background-size:cover;flex-shrink:0}
.profile-name{font-size:20px;font-weight:700;color:#263832}
.profile-meta{font-size:11px;color:#81908a;margin-top:3px}
.profile-actions{margin-left:auto;display:flex;gap:6px;flex-wrap:wrap}
.profile-body{padding:18px 22px}
.evolution{border:1px solid var(--line);border-radius:11px;padding:12px;background:#fbfcfc;margin-top:8px}
.evolution-date{font-size:9px;color:#91a09a;font-weight:600;text-transform:uppercase;letter-spacing:.04em}
.evolution-title{font-size:12px;font-weight:700;margin:4px 0;color:#34413c}
.evolution-text{font-size:11px;line-height:1.6;color:#596761;white-space:pre-wrap}

const monthName = d => d.toLocaleDateString("pt-BR",{month:"long",year:"numeric"});

function ensureStudentModules(s){ if(!s)return; s.consultas=s.consultas||[]; s.avaliacoes=s.avaliacoes||[]; s.evolucoes=s.evolucoes||[]; s.escola=s.escola||{nome:"",professores:"",registros:[]}; s.escola.registros=s.escola.registros||[]; s.calendarioAcademico=s.calendarioAcademico||{}; s.faltas=s.faltas||[]; }
function activeAppointments(){ return (data.agenda||[]).filter(x=>x.status!=="cancelado" && getStudent(x.alunoId)); }
function defaultData(){ return { session:false, professor:{ nome:"Professor", especialidade:"Psicopedagogia Clínica", bio:"", foto:"", cargo:"Professor", ativo:true, plano:'mensal', observacoes:[], evolucoesPessoais:[], configuracoes:{ horarioTrabalho:{dias:[1,2,3,4,5],inicio:"08:00",fim:"18:00",pausaInicio:"12:00",pausaFim:"13:00"}, valorSessaoPadrao:0, formasPagamento:["pix","cartao"] } }, alunos:[], agenda:[], transacoes:[], listaEspera:[] }; }
function weekStart(d){ const x=new Date(d); const day=x.getDay(); x.setDate(x.getDate()+(day===0?-6:1-day)); x.setHours(0,0,0,0); return x; }
function weekDates(d){ const s=weekStart(d); return WEEK.map((_,i)=>{ const x=new Date(s); x.setDate(s.getDate()+i); return x; }); }
function weekPending(){ const keys=weekDates(new Date()).map(dateISO); return activeAppointments().filter(a=>keys.includes(a.data)&&!a.pago).reduce((s,a)=>s+(getStudent(a.alunoId)?.valor||0),0); }
function monthPaid(){ const y=new Date().getFullYear(),m=new Date().getMonth(); return (data.transacoes||[]).filter(t=>{ const d=parseDate(t.data); return d.getFullYear()===y&&d.getMonth()===m&&(t.tipo||"receita")==="receita"; }).reduce((s,t)=>s+Number(t.valor),0); }
function monthDone(){ const y=new Date().getFullYear(),m=new Date().getMonth(); return activeAppointments().filter(a=>{ const d=parseDate(a.data); return d.getFullYear()===y&&d.getMonth()===m&&a.presente; }).length; }

// ============================================================

// ============================================================
function renderPanelCalendar(){
    const y=panelCalDate.getFullYear(), m=panelCalDate.getMonth();
    document.getElementById('panelCalMonth').textContent=panelCalDate.toLocaleDateString('pt-BR',{month:'long',year:'numeric'});
    const grid=document.getElementById('panelCalGrid');
    const first=new Date(y,m,1), last=new Date(y,m+1,0);
    let start=first.getDay(); start=start===0?6:start-1;
    const total=Math.ceil((start+last.getDate())/7)*7;
    let h='';
    ['S','T','Q','Q','S','S','D'].forEach(d=>{ h+=`<div class="cal-dow">${d}</div>`; });
    for(let i=0;i<total;i++){
        const d=new Date(y,m,i-start+1);
        const inM=d.getMonth()===m;
        const iso=dateISO(d);
        const evs=activeAppointments().filter(a=>a.data===iso);
        const isToday=iso===today();
        const isSel=iso===panelSelectedDay;
        const cls=['cal-day'];
        if(!inM)cls.push('other');
        if(isToday)cls.push('today');
        if(isSel)cls.push('selected');
        const dotHtml = evs.length ? `<div class="cal-dots">${evs.slice(0,3).map(a=>`<span class="cal-dot ${TYPES[a.tipo]?.cls||''}"></span>`).join('')}</div>` : '';
        h+=`<div class="${cls.join(' ')}" onclick="panelSelectDay('${iso}')">${d.getDate()}${dotHtml}</div>`;
    }
    grid.innerHTML=h;
}
function panelSelectDay(iso){ panelSelectedDay=iso; renderPanelCalendar(); }
function panelCalPrev(){ panelCalDate.setMonth(panelCalDate.getMonth()-1); renderPanelCalendar(); }

            document.getElementById("loginScreen").style.display="none";
            document.getElementById("expiredScreen").style.display="none";
            document.getElementById("app").style.display="grid";
            document.getElementById("topUserName").textContent="Suporte";
            document.getElementById("topAvatar").textContent="S";
            renderPanelCalendar();
            navigate("master"); notify("Acesso MASTER liberado."); return;
        }
        document.getElementById("masterNav").style.display="none";
        const loaded=await loadData();
        if(!loaded){ await supabaseClient.auth.signOut(); notify("Cadastro não encontrado."); return; }
        data=loaded; data.session=true; isDataLoaded=true;
        const lic=isLicenseValid(data.professor);
        if(!lic.ok){ await supabaseClient.auth.signOut(); data=defaultData(); data.session=false; isDataLoaded=false; showExpiredScreen(lic.reason); return; }
        document.getElementById("loginScreen").style.display="none";
        document.getElementById("expiredScreen").style.display="none";
        document.getElementById("app").style.display="grid";
        updateUser(); renderPanelCalendar(); navigate("dashboard");
        notify(`Bem-vindo, ${data.professor?.nome||"Professor"}!`);
    }catch(err){ console.error(err); notify('Erro ao carregar dados.'); }
}
async function logout(){
    if(data&&data.session){ try{ await saveData(); }catch(e){} }
    try{ await supabaseClient.auth.signOut(); }catch(e){}
    data=defaultData(); data.session=false; isMaster=false;
    document.getElementById("masterNav").style.display="none";
    isDataLoaded=false; currentUserId=null; currentStudent=null; currentPage="dashboard";
    dashboardSubPage="overview"; alunosSubPage="lista";
    document.getElementById("app").style.display="none";
    document.getElementById("loginScreen").style.display="grid";
    document.getElementById("expiredScreen").style.display="none";
    document.getElementById("loginPass").value="";
    document.querySelectorAll(".view").forEach(v=>{v.innerHTML='';v.classList.remove('active');});
    document.getElementById("page-dashboard").classList.add("active");
    document.getElementById("topUserName").textContent="";
    document.getElementById("topAvatar").textContent="?";
    document.getElementById("loginUser").value="";
    notify("Logout realizado!");
}
function updateUser(){

function showExpiredScreen(reason){ document.getElementById('app').style.display='none'; document.getElementById('loginScreen').style.display='none'; document.getElementById('expiredScreen').style.display='grid'; }

function navigate(page){
    currentPage=page; currentStudent=null;
    document.querySelectorAll(".view").forEach(x=>x.classList.remove("active"));
    const target=document.getElementById("page-"+page);
    if(target)target.classList.add("active");
    document.querySelectorAll(".nav button").forEach(x=>x.classList.toggle("active",x.dataset.page===page));
    const info={ dashboard:["layout-dashboard","Dashboard"], alunos:["users","Alunos"], agenda:["calendar-days","Agenda"], avaliacoes:["clipboard-check","Avaliações"], financeiro:["wallet-cards","Financeiro"], master:["shield-check","Suporte"], prontuario:["notebook-tabs","Prontuário"] };
    if(info[page])document.getElementById("pageTitle").innerHTML=`<i data-lucide="${info[page][0]}"></i>${info[page][1]}`;
    if(page!=="avaliacoes"){ avalStepMode=null; avalStepQuestions=[]; avalStepCurrentIndex=0; avalStepResponses=[]; avalStepTemplateId=null; avalStepAlunoId=null; }
    if(page==="dashboard") dashboardSubPage="overview";
    if(page==="alunos") alunosSubPage="lista";
    if(page!=="financeiro") destroyCharts();
    renderPage(); try{lucide.createIcons();}catch(e){}
    renderPanelCalendar();
}
function setDashboardSubPage(sub){ dashboardSubPage=sub; renderDashboard(); if(sub==="recados")renderRecados(); else if(sub==="perfil")renderPerfil(); try{lucide.createIcons();}catch(e){} }
function setAlunosSubPage(sub){ alunosSubPage=sub; renderAlunos(); try{lucide.createIcons();}catch(e){} }
function renderPage(){
    if(currentPage==="master"&&!isMaster){navigate("dashboard");return;}
    if(!isDataLoaded||!data.session){ document.querySelectorAll(".view").forEach(v=>{ if(v.id!=="page-dashboard")v.innerHTML=`<div class="empty">Faça login.</div>`; }); return; }
    if(currentPage==="dashboard") renderDashboard();
    if(currentPage==="alunos") renderAlunos();
    if(currentPage==="agenda")renderAgenda();
    if(currentPage==="avaliacoes")renderAvaliacoes();
    if(currentPage==="financeiro")renderFinanceiro();
    if(currentPage==="master"&&isMaster)renderMasterDashboard();
}

function renderWaitlistRows(lista){
    if(!lista.length) return `<div class="wl-empty">Nenhum interessado. <button class="btn btn-primary btn-sm" style="margin-top:10px" onclick="openWaitlistForm(-1)">+ Novo</button></div>`;

        </div>
        <span class="wl-badge ${esc(w.prioridade||'media')}">${w.prioridade==='alta'?'Alta':w.prioridade==='baixa'?'Baixa':'Média'}</span>
    </div>`).join('');
}
function filterWaitlist(){
    const q=(document.getElementById('waitlistSearch')?.value||'').trim().toLowerCase();
    const pr=document.getElementById('waitlistPriorityFilter')?.value||'todos';
    const list=(data.listaEspera||[]).filter(w=>{
        const hay=[w.nome,w.telefone,w.area,w.horario,w.observacoes].join(' ').toLowerCase();
        return (!q||hay.includes(q))&&(pr==='todos'||w.prioridade===pr);
    });
    const el=document.getElementById('waitlistList');
    if(el){el.innerHTML=renderWaitlistRows(list);try{lucide.createIcons();}catch(e){}}

function openWaitlistForm(index=null){ waitlistEditIndex=index; waitlistDetailIndex=null; renderListaEspera(); }
function closeWaitlistForm(){ waitlistEditIndex=null; renderListaEspera(); }
function openWaitlistDetail(i){ waitlistDetailIndex=i; waitlistEditIndex=null; renderListaEspera(); }
function closeWaitlistDetail(){ waitlistDetailIndex=null; renderListaEspera(); }
function saveWaitlist(){
    const nome=document.getElementById('wlNome')?.value.trim(); if(!nome){notify('Informe o nome.');return;}
    if(!data.listaEspera)data.listaEspera=[];
    const idx=waitlistEditIndex;
    const previous=idx>=0?data.listaEspera[idx]:null;
    const item={id:previous?.id||uid(),nome,telefone:document.getElementById('wlTelefone').value.trim(),idade:Number(document.getElementById('wlIdade').value)||0,area:document.getElementById('wlArea').value,horario:document.getElementById('wlHorario').value.trim(),prioridade:document.getElementById('wlPrioridade').value,observacoes:document.getElementById('wlObs').value.trim(),criadoEm:previous?.criadoEm||today()};
    if(idx>=0)data.listaEspera[idx]=item;else data.listaEspera.push(item);
    try{localStorage.setItem('waitlist_'+currentUserId,JSON.stringify(data.listaEspera));}catch(e){}
    waitlistEditIndex=null; renderListaEspera(); notify(idx>=0?'Atualizado.':'Adicionado.');
}
function promoteWaitlist(i){
    const w=(data.listaEspera||[])[i];if(!w)return;
    if(!confirm(`Transformar ${w.nome} em aluno?`))return;

function renderWeek(){
    const dates=weekDates(calendarDate);
    let h=`<div style="overflow:auto"><div class="week-grid"><div class="week-head"></div>`;
    dates.forEach(d=>{h+=`<div class="week-head">${d.toLocaleDateString("pt-BR",{weekday:"short"})}<span class="wnum">${d.getDate()}</span></div>`;});
    HOURS.forEach(hr=>{ h+=`<div class="time-cell">${hr}</div>`; dates.forEach(d=>{ const iso=dateISO(d); const aps=activeAppointments().filter(a=>a.data===iso&&a.hora===hr);
        if(!aps.length) h+=`<div class="slot" onclick="quickSchedule('${iso}','${hr}')"><div class="empty-slot">+</div></div>`;
        else{ h+=`<div class="slot">`; aps.forEach(a=>{const s=getStudent(a.alunoId); if(!s)return; const t=TYPES[a.tipo]; h+=`<div class="event ${t?.cls||''}"><strong onclick="openStudent('${s.id}')" style="cursor:pointer">${esc(s.nome.split(' ')[0])}</strong>${t?.label||a.tipo}<div class="event-actions"><button onclick="event.stopPropagation();togglePresence('${a.id}')">${a.presente?"✓":"○"}</button><button onclick="event.stopPropagation();togglePayment('${a.id}')">${a.pago?"R$":"$"}</button><button onclick="event.stopPropagation();cancelAppointment('${a.id}')">×</button></div></div>`; }); h+=`</div>`; }
    }); });
    h+=`</div></div>`; return h;
}
function renderMonth(){
    const y=calendarDate.getFullYear(),m=calendarDate.getMonth();
    const first=new Date(y,m,1),last=new Date(y,m+1,0);
    let start=first.getDay(); start=start===0?6:start-1;
    const total=Math.ceil((start+last.getDate())/7)*7;
    let h=`<div style="overflow:auto"><div class="month-grid">`;
    ["Seg","Ter","Qua","Qui","Sex","Sáb","Dom"].forEach(d=>{h+=`<div class="month-head">${d}</div>`;});
    for(let i=0;i<total;i++){ const d=new Date(y,m,i-start+1); const inM=d.getMonth()===m; const iso=dateISO(d); const evs=activeAppointments().filter(a=>a.data===iso);
        h+=`<div class="month-day ${inM?"":"other"}" onclick="${inM?`selectMonthDay('${iso}')`:""}"><div class="day-number">${d.getDate()}</div><div class="dot-row">${evs.slice(0,7).map(a=>`<span class="dot ${TYPES[a.tipo]?.cls||''}"></span>`).join("")}</div></div>`;
    }
    h+=`</div></div>`; return h;
}

function renderDayPanel(day){

function toggleAgendaForm(){ const f=document.getElementById("agendaForm"); if(!f)return; f.style.display=f.style.display==="none"?"block":"none"; if(f.style.display==="block")f.scrollIntoView({behavior:"smooth"}); }
function quickSchedule(date,hour){ const f=document.getElementById("agendaForm"); if(!f)return; f.style.display="block"; document.getElementById("agData").value=date; document.getElementById("agHora").value=hour; f.scrollIntoView({behavior:"smooth"}); }
async function saveAppointment(){
    const aId=document.getElementById("agAluno").value, dt=document.getElementById("agData").value, hr=document.getElementById("agHora").value, tp=document.getElementById("agTipo").value;
    if(!aId||!dt||!hr){notify("Preencha tudo.");return;}
    if(!getStudent(aId)){notify("Aluno não encontrado.");return;}
    if(activeAppointments().some(a=>a.data===dt&&a.hora===hr)){notify("Horário ocupado.");return;}
    const na={id:uid(),alunoId:aId,data:dt,hora:hr,tipo:tp,status:"agendado",presente:false,pago:false};
    data.agenda.push(na);
    const ok=await saveData();
    if(ok){notify("Agendado!");renderAgenda();renderPanelCalendar();}
    else{data.agenda=data.agenda.filter(a=>a.id!==na.id);notify("Erro.");}
}
async function cancelAppointment(id){
    const a=data.agenda.find(x=>x.id===id); if(!a||!confirm("Cancelar?"))return;
    a.status="cancelado"; await saveData(); notify("Cancelado."); renderPage(); renderPanelCalendar();
}
async function togglePresence(id){
    const a=data.agenda.find(x=>x.id===id); if(!a)return;
    a.presente=!a.presente; a.status=a.presente?"realizado":"agendado";
    if(!a.presente&&a.data<=today()){ a.status="falta"; const s=getStudent(a.alunoId); if(s){ensureStudentModules(s);s.faltas.push({data:a.data,agendaId:a.id});} }
    await saveData(); notify(a.presente?"Presença.":"Falta."); renderPage(); renderPanelCalendar();
}
async function togglePayment(id){
    const a=data.agenda.find(x=>x.id===id); if(!a)return;
    const s=getStudent(a.alunoId); if(!s)return;
    if(a.pago){
        if(!confirm("Desmarcar este pagamento?")) return;
        a.pago=false;
        data.transacoes=(data.transacoes||[]).filter(t=>t.agendaId!==a.id);
        await saveData(); notify("Desmarcado."); renderPage(); return;
    }
    openPaymentModal(a, s);
}

function selectPayMethod(el, v){

function buildFinanceCharts(receitas,totalRecebido,totalDespesas,pending){
    if(typeof Chart === 'undefined') return;
    const months=[], revData=[], despData=[];
    for(let i=5;i>=0;i--){
        const d=new Date(financeYear, financeMonth-i, 1);
        months.push(d.toLocaleDateString('pt-BR',{month:'short'}).replace('.',''));
        const totRev=(data.transacoes||[]).filter(t=>{const dd=parseDate(t.data); return dd.getFullYear()===d.getFullYear()&&dd.getMonth()===d.getMonth()&&(t.tipo||'receita')==='receita';}).reduce((s,t)=>s+Number(t.valor||0),0);
        const totDesp=(data.transacoes||[]).filter(t=>{const dd=parseDate(t.data); return dd.getFullYear()===d.getFullYear()&&dd.getMonth()===d.getMonth()&&t.tipo==='despesa';}).reduce((s,t)=>s+Number(t.valor||0),0);
        revData.push(totRev); despData.push(totDesp);
    }
    const c1=document.getElementById('chartReceitas');
    if(c1) charts.receitas=new Chart(c1.getContext('2d'), { type:'bar', data:{ labels:months, datasets:[
        { label:'Receitas', data:revData, backgroundColor:'#5f8f7a', borderRadius:6, maxBarThickness:20 },
        { label:'Despesas', data:despData, backgroundColor:'#e8a0a0', borderRadius:6, maxBarThickness:20 }
    ]}, options:{ responsive:true, maintainAspectRatio:false, plugins:{ legend:{ position:'bottom', labels:{ boxWidth:10, font:{ size:10 } } } }, scales:{ y:{ beginAtZero:true, ticks:{ callback:v=>'R$'+v, font:{ size:9 } } }, x:{ ticks:{ font:{ size:9 } } } } } });
    const c2=document.getElementById('chartPizza');
    if(c2) charts.pizza=new Chart(c2.getContext('2d'), { type:'doughnut', data:{ labels:['Recebido','Pendente','Despesas'], datasets:[{ data:[totalRecebido,pending,totalDespesas], backgroundColor:['#5f8f7a','#6288a8','#e8a0a0'], borderWidth:0 }] }, options:{ responsive:true, maintainAspectRatio:false, cutout:'62%', plugins:{ legend:{ position:'bottom', labels:{ boxWidth:10, font:{ size:10 } } } } } });
    const metLabels=['PIX','Dinheiro','Cartão','Parcelado'], metKeys=['pix','dinheiro','cartao','cartao_parcelado'];
    const metData=metKeys.map(k=>receitas.filter(t=>t.metodo_pagamento===k).reduce((s,t)=>s+Number(t.valor||0),0));
    const c3=document.getElementById('chartMetodos');
    if(c3) charts.metodos=new Chart(c3.getContext('2d'), { type:'bar', data:{ labels:metLabels, datasets:[{ data:metData, backgroundColor:['#5f8f7a','#8eb29d','#6288a8','#a4b9d1'], borderRadius:6, maxBarThickness:20 }] }, options:{ indexAxis:'y', responsive:true, maintainAspectRatio:false, plugins:{ legend:{ display:false } }, scales:{ x:{ beginAtZero:true, ticks:{ callback:v=>'R$'+v, font:{ size:9 } } }, y:{ ticks:{ font:{ size:9 } } } } } });
    const c4=document.getElementById('chartProgresso');
    if(c4) charts.progresso=new Chart(c4.getContext('2d'), { type:'doughnut', data:{ labels:['Recebido','A receber'], datasets:[{ data:[totalRecebido, Math.max(0, totalRecebido+pending-totalRecebido)], backgroundColor:['#5f8f7a','#e8efeb'], borderWidth:0 }] }, options:{ responsive:true, maintainAspectRatio:false, cutout:'72%', plugins:{ legend:{ position:'bottom', labels:{ boxWidth:10, font:{ size:10 } } } } } });
}

function changeFinanceMonth(d){ const dt=new Date(financeYear,financeMonth+d,1); financeYear=dt.getFullYear(); financeMonth=dt.getMonth(); renderFinanceiro(); }
function generateFinancePDF(){
    const doc=new window.jspdf.jsPDF({unit:'mm',format:'a4'});
    const W=doc.internal.pageSize.getWidth(); let y=20;
    doc.setFont('helvetica','bold'); doc.setFontSize(16); doc.text('Legado Que Ensina - Financeiro',W/2,y,{align:'center'}); y+=10;
    doc.setFont('helvetica','normal'); doc.setFontSize(10);
    const monthLabel=new Date(financeYear,financeMonth,1).toLocaleDateString("pt-BR",{month:"long",year:"numeric"});
    doc.text(`Período: ${monthLabel}`,20,y); y+=8;
    const allTrans=(data.transacoes||[]).filter(t=>{const d=parseDate(t.data); return d.getFullYear()===financeYear&&d.getMonth()===financeMonth;});
    const receitas=allTrans.filter(t=>(t.tipo||"receita")==="receita");
    const despesas=allTrans.filter(t=>t.tipo==="despesa");
    const tr=receitas.reduce((s,t)=>s+Number(t.valor||0),0);
    const td=despesas.reduce((s,t)=>s+Number(t.valor||0),0);
    doc.text(`Recebido: ${money(tr)}`,20,y); y+=6;
    doc.text(`Despesas: ${money(td)}`,20,y); y+=6;
    doc.text(`Saldo: ${money(tr-td)}`,20,y); y+=8;
    receitas.forEach(t=>{ const s=getStudent(t.alunoId); doc.text(`${fmtDate(t.data)} - ${s?.nome||'—'} - ${money(t.valor)}`,25,y); y+=5; if(y>270){doc.addPage();y=20;} });
    doc.save(`relatorio-financeiro.pdf`); notify("PDF gerado!");
}

function startAvalStepAnswer(){
    const alunoId=document.getElementById("stepAluno")?.value;
    const tplId=document.getElementById("stepTemplate")?.value;
    if(!alunoId||!tplId){ notify("Selecione aluno e instrumento."); return; }
    const tpl=getTemplateById(tplId); if(!tpl) return;
    avalStepAlunoId=alunoId; avalStepTemplateId=tplId; avalStepCurrentIndex=0; avalStepResponses=[];
    if(tpl.tipo==="anamnese"&&tpl.campos){
        const all=[];
        tpl.campos.forEach(sec=>{ sec.itens.forEach(it=>{ all.push({secao:sec.secao,rotulo:it.rotulo,chave:it.chave,tipo:it.tipo}); }); });
        avalStepQuestions=all;
    } else if(tpl.questoes){
        avalStepQuestions=tpl.questoes.map((q,i)=>({index:i,texto:q,escala:tpl.escala||[{valor:0,rotulo:"Resposta"}]}));
    } else { avalStepQuestions=[]; }
    avalStepMode='answering';

function renderAvalStepAnswer(){
    const total=avalStepQuestions.length, idx=avalStepCurrentIndex;
    const q=avalStepQuestions[idx];
    if(!q||total===0){ avalStepMode='done'; renderAvaliacoes(); return; }
    const isAnam=q.secao!==undefined;
    let content;
    if(isAnam){
        content=`<div style="font-size:10px;color:#8a9892;font-weight:600;text-transform:uppercase;margin-bottom:4px">${esc(q.secao)}</div><div class="step-question">${esc(q.rotulo)}</div><textarea id="stepAnswer" class="textarea" style="min-height:90px"></textarea>`;
    } else {
        const escala=q.escala||[];
        content=`<div style="font-size:10px;color:#8a9892;font-weight:600">Questão ${idx+1} de ${total}</div><div class="step-question">${esc(q.texto)}</div><div class="step-options">${escala.map(op=>`<label class="${avalStepResponses[idx]===op.valor?'selected':''}" onclick="selectAvalStepOption(${idx},${op.valor})"><input type="radio" name="avalStepOpt" ${avalStepResponses[idx]===op.valor?'checked':''}>${esc(op.rotulo)}</label>`).join("")}</div>`;
    }
    document.getElementById("page-avaliacoes").innerHTML=`
        <button class="btn btn-outline btn-sm" onclick="cancelAvalStep()" style="margin-bottom:12px">← Cancelar</button>
        <div class="aval-step">
            <div style="font-size:10px;font-weight:700;color:#6d7b75">Item ${idx+1} de ${total}</div>
            <div class="step-progress"><span style="width:${Math.round(((idx+1)/total)*100)}%"></span></div>
            <div class="step-card">${content}<div class="step-nav">
                <button style="background:#f5f8f7;color:#5a6b64" onclick="avalStepPrev()" ${idx===0?'disabled':''}>Anterior</button>
                <button onclick="avalStepNext()">${idx===total-1?'Finalizar':'Próxima'}</button>
            </div></div>
        </div>`;
    try{lucide.createIcons();}catch(e){}
    if(isAnam && avalStepResponses[idx]!==undefined){ const el=document.getElementById("stepAnswer"); if(el) el.value=avalStepResponses[idx]||''; }
}
function selectAvalStepOption(idx,value){ avalStepResponses[idx]=value; renderAvalStepAnswer(); }
function avalStepPrev(){ if(avalStepCurrentIndex>0){ avalStepCurrentIndex--; renderAvalStepAnswer(); } }
function avalStepNext(){
    const idx=avalStepCurrentIndex, q=avalStepQuestions[idx], isAnam=q.secao!==undefined;
    if(isAnam){ const el=document.getElementById("stepAnswer"); if(el) avalStepResponses[idx]=el.value||''; }
    else if(avalStepResponses[idx]===undefined){ notify("Selecione uma opção."); return; }
    if(idx===avalStepQuestions.length-1){ avalStepMode='done'; renderAvaliacoes(); }
    else { avalStepCurrentIndex++; renderAvalStepAnswer(); }
}
function renderAvalStepDone(){
    const tpl=getTemplateById(avalStepTemplateId);
    const aluno=getStudent(avalStepAlunoId);
    if(!tpl||!aluno){ cancelAvalStep(); return; }
    let respostas=[], questoes=[];
    if(tpl.tipo==="anamnese"&&tpl.campos){
        avalStepQuestions.forEach((q,i)=>{ respostas.push({secao:q.secao,rotulo:q.rotulo,chave:q.chave,valor:avalStepResponses[i]||''}); });
        questoes=tpl.campos.flatMap(sec=>sec.itens.map((it,i)=>({id:uid(),numero:i+1,texto:it.rotulo})));
    } else if(tpl.questoes){
        avalStepQuestions.forEach((q,i)=>{ const val=avalStepResponses[i]; const op=(q.escala||[]).find(e=>e.valor===val); respostas.push({questao:q.texto,valor:val,rotulo:op?op.rotulo:"—"}); });
        questoes=tpl.questoes.map((q,i)=>({id:uid(),numero:i+1,texto:q}));
    }
    const avId=uid();
    aluno.avaliacoes.push({id:avId,data:today(),titulo:tpl.nome,tipo:tpl.tipo,objetivo:tpl.descricao,questoes,resultados:[{id:uid(),data:today(),respostas,resumo:"Avaliação concluída."}],finalizada:true});
    saveData().then(()=>notify(`"${tpl.nome}" aplicada a ${aluno.nome}!`));
    document.getElementById("page-avaliacoes").innerHTML=`
        <div class="card" style="max-width:560px;margin:40px auto;text-align:center;padding:36px">
            <div style="font-size:44px;margin-bottom:14px">✓</div>
            <div class="section-title" style="font-size:18px">Avaliação concluída!</div>
            <div class="section-sub" style="font-size:13px;margin-top:6px">${esc(tpl.nome)} aplicada a ${esc(aluno.nome)}</div>
            <div style="margin-top:18px;display:flex;gap:8px;justify-content:center;flex-wrap:wrap">
                <button class="btn btn-primary btn-sm" onclick="cancelAvalStep()">Ver avaliações</button>
                <button class="btn btn-outline btn-sm" onclick="gerarPDFAvaliacao('${aluno.id}','${avId}')">PDF</button>
                <button class="btn btn-soft btn-sm" onclick="cancelAvalStep();openStudent('${aluno.id}')">Prontuário</button>
            </div>
        </div>`;
    try{lucide.createIcons();}catch(e){}
}
function cancelAvalStep(){ avalStepMode=null; avalStepQuestions=[]; avalStepCurrentIndex=0; avalStepResponses=[]; avalStepTemplateId=null; avalStepAlunoId=null; currentAvalMode="list"; renderAvaliacoes(); }
function viewAvaliacaoResultado(alunoId,avalId){
    const s=getStudent(alunoId); if(!s) return;
    currentStudent=alunoId; currentAssessment=avalId;
    document.querySelectorAll(".view").forEach(x=>x.classList.remove("active"));
    document.getElementById("page-prontuario").classList.add("active");
    document.querySelectorAll(".nav button").forEach(x=>x.classList.remove("active"));
    document.getElementById("pageTitle").innerHTML=`<i data-lucide="notebook-tabs"></i>Prontuário`;
    renderStudentProfile("resultado");
}
function gerarPDFAvaliacao(alunoId,avalId){
    const s=getStudent(alunoId); if(!s) return;
    const av=s.avaliacoes.find(x=>x.id===avalId); if(!av) return;
    const doc=new window.jspdf.jsPDF({unit:'mm',format:'a4'});
    const W=doc.internal.pageSize.getWidth(); let y=20;
    doc.setFont('helvetica','bold'); doc.setFontSize(16); doc.text('Legado Que Ensina - Avaliação',W/2,y,{align:'center'}); y+=10;
    doc.setFontSize(12); doc.text(String(av.titulo||''),W/2,y,{align:'center'}); y+=8;
    doc.setFont('helvetica','normal'); doc.setFontSize(10);
    doc.text(`Aluno: ${s.nome||''}`,20,y); y+=6;
    doc.text(`Data: ${fmtDate(av.data)}`,20,y); y+=6;
    const res=av.resultados?.[av.resultados.length-1];
    if(av.questoes) av.questoes.forEach((q,i)=>{
        const raw=res?.respostas?.[i]||'';
        const r=raw&&typeof raw==='object'?(raw.rotulo||raw.valor||'—'):raw;
        const text=`${q.numero||i+1}. ${q.texto}\nResposta: ${r||'—'}`;
        const lines=doc.splitTextToSize(text,W-40);
        lines.forEach(l=>{ if(y>270){doc.addPage();y=20;} doc.text(l,20,y); y+=5; });
        y+=2;
    });
    doc.save(`avaliacao-${s.nome}-${av.titulo}.pdf`); notify("PDF gerado!");
}

async function loadDataFromSupabase() {
    try {
        const userId = await getUserId(); if (!userId) return null;
        const pR = await supabaseClient.from('professores').select('*').eq('user_id', userId).maybeSingle();
        const aR = await supabaseClient.from('alunos').select('*').eq('user_id', userId).order('nome');
        const eR = await supabaseClient.from('evolucoes').select('*').eq('user_id', userId);
        const cR = await supabaseClient.from('consultas').select('*').eq('user_id', userId);
        const avR = await supabaseClient.from('avaliacoes').select('*').eq('user_id', userId);
        const rrR = await supabaseClient.from('resultados_avaliacoes').select('*').eq('user_id', userId);
        const esR = await supabaseClient.from('escola').select('*').eq('user_id', userId);
        const rgR = await supabaseClient.from('registros_escola').select('*').eq('user_id', userId);
        const agR = await supabaseClient.from('agenda').select('*').eq('user_id', userId).order('data');
        const tR = await supabaseClient.from('transacoes').select('*').eq('user_id', userId);
        const alunos = (aR.data || []).map(mapAlunoFromDB);
        const evol = (eR.data || []).map(mapEvolucaoFromDB);
        const cons = (cR.data || []).map(mapConsultaFromDB);
        const avs = (avR.data || []).map(mapAvaliacaoFromDB);
        const rrs = (rrR.data || []).map(mapResultadoFromDB);
        const escs = (esR.data || []).map(mapEscolaFromDB);
        const regs = (rgR.data || []).map(mapRegistroEscolaFromDB);
        alunos.forEach(a => {
            a.evolucoes = evol.filter(e => e.aluno_id === a.id);
            a.consultas = cons.filter(c => c.aluno_id === a.id);
            a.avaliacoes = avs.filter(av => av.aluno_id === a.id);
            a.avaliacoes.forEach(av => { av.resultados = rrs.filter(r => r.avaliacao_id === av.id); });
            const e = escs.find(x => x.aluno_id === a.id);
            if (e) a.escola = { id: e.id, aluno_id: e.aluno_id, nome: e.nome || '', professores: e.professores || '', registros: regs.filter(r => r.escola_id === e.id) };
            ensureStudentModules(a);
        });
        const prof = pR.data ? mapProfessorFromDB(pR.data) : defaultData().professor;
        isDataLoaded = true;
        let lw = [];
        try { lw = JSON.parse(localStorage.getItem('waitlist_' + userId) || '[]') || []; } catch(e) {}
        return { session: true, professor: prof, alunos, agenda: (agR.data || []).map(mapAgendaFromDB), transacoes: (tR.data || []).map(mapTransacaoFromDB), listaEspera: lw };
    } catch (error) { console.error('Erro load:', error); notify('Erro ao carregar.'); return null; }
}
async function loadData() {
    const l = await loadDataFromSupabase();
    if (l) { if (!l.professor.configuracoes) l.professor.configuracoes = defaultData().professor.configuracoes; l.alunos.forEach(s => ensureStudentModules(s)); isDataLoaded = true; return l; }
    isDataLoaded = false;
    return defaultData();
}
const COLUMN_MAP = {
    'transacoes': ['id','user_id','agenda_id','aluno_id','data','descricao','valor','tipo','categoria','parcelas','metodo_pagamento'],
    'agenda': ['id','user_id','aluno_id','data','hora','tipo','status','presente','pago'],
    'alunos': ['id','user_id','nome','idade','serie','responsavel','telefone','valor','foto','tags','observacoes','ativo'],
    'professores': ['id','user_id','nome','especialidade','bio','foto','cargo','ativo','licenca_inicio','licenca_fim','plano','valor_sessao_padrao','formas_pagamento','config_horario_trabalho'],
    'evolucoes': ['id','user_id','aluno_id','data','titulo','texto'],
    'consultas': ['id','user_id','aluno_id','data','observacoes','acoes','pais','solicitacoes','comportamentos'],
    'avaliacoes': ['id','user_id','aluno_id','data','titulo','tipo','objetivo','questoes','finalizada'],
    'resultados_avaliacoes': ['id','user_id','avaliacao_id','data','respostas','resumo'],
    'escola': ['id','user_id','aluno_id','nome','professores'],
    'registros_escola': ['id','user_id','escola_id','data','contato','tipo','assunto','relato']
};
async function upsertSafe(t, payload) {
    let at = { ...payload };
    const k = COLUMN_MAP[t] || [];
    if (k.length) { const f = {}; k.forEach(c => { if (at[c] !== undefined) f[c] = at[c]; }); at = f; }
    for (let i = 0; i < 4; i++) {
        try {
            const { data, error } = await supabaseClient.from(t).upsert(at).select().single();
            if (!error) return data;
            if (error && (error.code === '42703' || /could not find the column/i.test(error.message || ''))) {
                const m = (error.message || '').match(/column "([^"]+)"/i);
                if (m && m[1] in at) { delete at[m[1]]; continue; }
            }
            throw error;
        } catch (e) {
            if (i === 3) throw e;
            if (e.code === '42703' || /could not find the column/i.test(e.message || '')) continue;
            throw e;
        }
    }
    return null;
}

const saveResultado = async r => { try { const u = await getUserId(); return await upsertSafe('resultados_avaliacoes', { id: r.id || uid(), user_id: u, avaliacao_id: r.avaliacao_id, data: r.data || today(), respostas: r.respostas || [], resumo: r.resumo || '' }); } catch(e) { return null; } };
const saveEscola = async e => { try { const u = await getUserId(); return await upsertSafe('escola', { id: e.id || uid(), user_id: u, aluno_id: e.aluno_id, nome: e.nome || '', professores: e.professores || '' }); } catch(e) { return null; } };
const saveRegistroEscola = async r => { try { const u = await getUserId(); return await upsertSafe('registros_escola', { id: r.id || uid(), user_id: u, escola_id: r.escola_id, data: r.data || today(), contato: r.contato || '', tipo: r.tipo || 'Conversa', assunto: r.assunto || '', relato: r.relato }); } catch(e) { return null; } };
const saveAgendaItem = async i => { try { if (!i || !i.alunoId || !getStudent(i.alunoId)) return null; const u = await getUserId(); return await upsertSafe('agenda', { id: i.id || uid(), user_id: u, aluno_id: i.alunoId, data: i.data, hora: i.hora, tipo: i.tipo, status: i.status || 'agendado', presente: i.presente || false, pago: i.pago || false }); } catch(e) { return null; } };
const saveTransacao = async t => { try { if (!t) return null; const u = await getUserId(); const p = { id: t.id || uid(), user_id: u, data: t.data || today(), descricao: t.descricao || '', valor: Number(t.valor) || 0, tipo: t.tipo || 'receita' }; if (t.parcelas) p.parcelas = t.parcelas; if (t.agendaId) p.agenda_id = t.agendaId; if (t.alunoId) p.aluno_id = t.alunoId; if (t.categoria) p.categoria = t.categoria; if (t.metodo_pagamento) p.metodo_pagamento = t.metodo_pagamento; return await upsertSafe('transacoes', p); } catch(e) { return null; } };
async function saveProfessor(p) { try { const u = await getUserId(); return await upsertSafe('professores', { id: p.id || u, user_id: u, nome: p.nome, especialidade: p.especialidade || '', bio: p.bio || '', foto: p.foto || '', cargo: p.cargo || 'Professor', ativo: p.ativo !== false, licenca_inicio: p.licenca_inicio || null, licenca_fim: p.licenca_fim || null, plano: p.plano || 'mensal', valor_sessao_padrao: Number(p.configuracoes?.valorSessaoPadrao || 0), formas_pagamento: p.configuracoes?.formasPagamento || [], config_horario_trabalho: p.configuracoes?.horarioTrabalho || null }); } catch(e) { return null; } }
async function saveData() {
    if (isSaving) return false;
    const ok = await checkSession(); if (!ok) return false;
    isSaving = true;
    try {
        if (data.professor) await saveProfessor(data.professor);
        for (const a of (data.alunos || [])) {
            await saveAluno(a);
            for (const e of (a.evolucoes || [])) await saveEvolucao({ ...e, aluno_id: a.id });
            for (const c of (a.consultas || [])) await saveConsulta({ ...c, aluno_id: a.id });
            for (const av of (a.avaliacoes || [])) { const sv = await saveAvaliacao({ ...av, aluno_id: a.id }); if (sv && av.resultados) for (const r of av.resultados) await saveResultado({ ...r, avaliacao_id: sv.id }); }
            if (a.escola) { const se = await saveEscola({ id: a.escola.id || uid(), aluno_id: a.id, nome: a.escola.nome || '', professores: a.escola.professores || '' }); if (se) a.escola.id = se.id; if (a.escola.registros) for (const r of a.escola.registros) await saveRegistroEscola({ ...r, escola_id: a.escola.id }); }
        }
        const vA = (data.agenda || []).filter(i => i && i.alunoId && getStudent(i.alunoId));
        for (const i of vA) await saveAgendaItem(i);
        if (data.agenda) data.agenda = vA;
        const vT = (data.transacoes || []).filter(t => { if (!t) return false; if (t.tipo === 'despesa') return true; return t.alunoId && getStudent(t.alunoId); });
        for (const t of vT) await saveTransacao(t);
        if (data.transacoes) data.transacoes = vT;
        try{ if(data.listaEspera) localStorage.setItem('waitlist_'+currentUserId, JSON.stringify(data.listaEspera)); }catch(e){}
        return true;
    } catch (e) { console.error('Erro save:', e); return false; }
    finally { isSaving = false; }
}
