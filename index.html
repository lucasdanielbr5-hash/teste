<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Gestão Psicopedagógica</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.9/dist/chart.umd.min.js"></script>
<script src="https://unpkg.com/lucide@latest"></script>
<style>
:root{--bg:#f6f8f7;--surface:#fff;--ink:#26342f;--muted:#7b8983;--line:#e3ebe7;--primary:#5f8f7a;--primary2:#477363;--soft:#eaf3ee;--blue:#668cab;--blueSoft:#edf4f8;--danger:#b85b5b;--dangerSoft:#fff0f0;--warn:#b87831;--warnSoft:#fff7ed;--shadow:0 10px 30px rgba(28,48,40,.07)}
*{box-sizing:border-box}html,body{margin:0;height:100%;font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif;background:var(--bg);color:var(--ink)}button,input,select,textarea{font:inherit}button{cursor:pointer}svg{width:18px;height:18px}.hidden{display:none!important}
.app{min-height:100vh;display:flex}.sidebar{width:248px;background:#fff;border-right:1px solid var(--line);padding:20px 14px;display:flex;flex-direction:column;position:fixed;inset:0 auto 0 0;z-index:10}.brand{display:flex;align-items:center;gap:11px;padding:4px 10px 22px;border-bottom:1px solid var(--line)}.brand-mark{width:40px;height:40px;border-radius:13px;background:var(--soft);display:grid;place-items:center;color:var(--primary2);font-weight:800}.brand strong{display:block;font-size:14px}.brand small{color:var(--muted);font-size:9px}.nav{padding-top:18px;display:grid;gap:5px}.nav button,.subnav button{border:0;background:transparent;color:var(--muted);text-align:left;border-radius:11px;padding:11px 12px;display:flex;align-items:center;gap:11px;font-size:13px}.nav button:hover,.subnav button:hover{background:#f5f8f6;color:var(--ink)}.nav button.active{background:var(--soft);color:var(--primary2);font-weight:700}.nav-group{margin-top:5px}.nav-group-title{padding:10px 12px 5px;color:#a0aaa5;font-size:9px;font-weight:800;letter-spacing:.1em;text-transform:uppercase}.subnav{display:grid;gap:2px;padding-left:12px}.subnav button{font-size:12px;padding:8px 12px}.side-bottom{margin-top:auto;border-top:1px solid var(--line);padding-top:12px}.logout{width:100%;border:0;background:transparent;color:var(--muted);padding:11px 12px;text-align:left;border-radius:11px;display:flex;gap:10px;align-items:center}.logout:hover{background:var(--dangerSoft);color:var(--danger)}
.main{margin-left:248px;width:calc(100% - 248px);min-width:0}.topbar{height:72px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 30px;position:sticky;top:0;z-index:5}.crumb{display:flex;align-items:center;gap:9px}.crumb svg{color:var(--primary)}.crumb strong{font-size:17px}.user{display:flex;align-items:center;gap:10px}.avatar{width:38px;height:38px;border-radius:50%;background:var(--soft);display:grid;place-items:center;color:var(--primary2);font-weight:800}.user span{font-size:12px;color:var(--muted)}.content{padding:28px 30px 50px;max-width:1500px;margin:auto}.page-head{display:flex;justify-content:space-between;align-items:flex-start;gap:20px;margin-bottom:22px}.eyebrow{font-size:10px;color:var(--primary);font-weight:800;letter-spacing:.13em;text-transform:uppercase}.page-head h1{margin:5px 0 6px;font-size:28px;letter-spacing:-.035em}.page-head p{margin:0;color:var(--muted);font-size:13px}.actions{display:flex;gap:8px;flex-wrap:wrap}.btn{border:0;border-radius:10px;padding:10px 14px;display:inline-flex;align-items:center;justify-content:center;gap:7px;font-size:12px;font-weight:700;min-height:38px}.primary{background:var(--primary);color:#fff}.primary:hover{background:var(--primary2)}.outline{background:#fff;border:1px solid var(--line);color:#53615c}.soft{background:var(--soft);color:var(--primary2)}.danger{background:var(--dangerSoft);color:var(--danger)}.blue{background:var(--blueSoft);color:#52738e}.card{background:#fff;border:1px solid var(--line);border-radius:17px;box-shadow:0 2px 12px rgba(28,48,40,.025);padding:20px}.grid{display:grid;gap:16px}.metrics{grid-template-columns:repeat(4,minmax(0,1fr))}.metric{padding:19px}.metric-top{display:flex;justify-content:space-between;align-items:center}.metric-icon{width:38px;height:38px;border-radius:12px;background:var(--soft);display:grid;place-items:center;color:var(--primary2)}.metric-label{font-size:11px;color:var(--muted);font-weight:700}.metric-value{font-size:28px;font-weight:800;margin-top:7px}.metric-note{font-size:11px;color:#9aa6a1;margin-top:4px}.two-col{grid-template-columns:minmax(0,1.35fr) minmax(320px,.65fr)}.three-col{grid-template-columns:repeat(3,minmax(0,1fr))}.section-title{font-size:15px;font-weight:800}.section-sub{font-size:11px;color:var(--muted);margin-top:3px}.section-head{display:flex;justify-content:space-between;gap:15px;align-items:center;margin-bottom:15px}.list{display:grid}.list-row{padding:13px 0;border-bottom:1px solid #edf1ef;display:flex;align-items:center;gap:12px}.list-row:last-child{border-bottom:0}.list-main{min-width:0;flex:1}.list-main strong{display:block;font-size:12px}.list-main span{display:block;color:var(--muted);font-size:11px;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.badge{display:inline-flex;padding:5px 8px;border-radius:20px;font-size:10px;font-weight:700;background:#f1f4f2;color:#64716c}.badge.ok{background:#eaf5ee;color:#477d63}.badge.pending{background:var(--warnSoft);color:var(--warn)}.badge.cancel{background:var(--dangerSoft);color:var(--danger)}.badge.blue{background:var(--blueSoft);color:#52738e}.table-wrap{overflow:auto}.table{width:100%;border-collapse:collapse}.table th{font-size:10px;color:#8c9893;text-align:left;padding:11px;border-bottom:1px solid var(--line);text-transform:uppercase;letter-spacing:.06em}.table td{padding:13px 11px;border-bottom:1px solid #edf1ef;font-size:12px}.table tr:hover td{background:#fbfcfb}.searchbar{display:flex;gap:9px;align-items:center;margin-bottom:14px}.input,.select,.textarea{width:100%;border:1px solid #dce6e1;border-radius:10px;background:#fbfcfc;padding:10px 11px;color:var(--ink);outline:0;font-size:12px}.textarea{min-height:100px;resize:vertical}.input:focus,.select:focus,.textarea:focus{border-color:#8fb2a3;box-shadow:0 0 0 3px rgba(95,143,122,.09)}.search{max-width:380px}.field label{display:block;font-size:10px;font-weight:800;color:#65736d;margin:0 0 5px}.form-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:13px}.form-grid.two{grid-template-columns:repeat(2,minmax(0,1fr))}.full{grid-column:1/-1}.form-actions{display:flex;gap:8px;margin-top:5px}.tabs{display:flex;gap:5px;border-bottom:1px solid var(--line);margin-bottom:18px;overflow:auto}.tab{border:0;background:transparent;padding:10px 13px;color:var(--muted);font-size:12px;font-weight:700;border-bottom:2px solid transparent;white-space:nowrap}.tab.active{color:var(--primary2);border-bottom-color:var(--primary)}.empty{text-align:center;padding:35px 20px;color:#98a39e;font-size:12px}.help{background:#f3f8f5;border:1px solid #dce9e2;color:#5e6e67;border-radius:12px;padding:12px 14px;font-size:11px;line-height:1.6;margin-bottom:15px}.inline-form{margin-bottom:18px}.inline-form .card{box-shadow:none;background:#fbfdfc}.danger-text{color:var(--danger)}.chart-card{min-height:340px}.chart-wrap{height:270px;position:relative}.finance-kpi{display:flex;justify-content:space-between;align-items:flex-end}.finance-kpi strong{font-size:24px}.finance-kpi small{font-size:11px;color:var(--muted)}.login{position:fixed;inset:0;background:#f6f8f7;display:grid;place-items:center;z-index:100}.login-box{width:min(430px,calc(100% - 36px));background:#fff;border:1px solid var(--line);border-radius:22px;padding:34px;box-shadow:var(--shadow)}.login-logo{width:48px;height:48px;border-radius:15px;background:var(--soft);display:grid;place-items:center;color:var(--primary2);font-weight:900;margin-bottom:22px}.login h1{font-size:25px;margin:0 0 7px}.login p{font-size:12px;color:var(--muted);line-height:1.6;margin:0 0 24px}.login .field{margin-bottom:14px}.login .btn{width:100%;margin-top:7px}.error{color:var(--danger);font-size:11px;margin-top:10px}.toast{position:fixed;right:20px;bottom:20px;background:#243a31;color:#fff;padding:12px 16px;border-radius:11px;font-size:12px;z-index:200;box-shadow:var(--shadow);opacity:0;transform:translateY(8px);transition:.25s}.toast.show{opacity:1;transform:none}.mobile-toggle{display:none}
@media(max-width:1100px){.metrics{grid-template-columns:repeat(2,1fr)}.two-col{grid-template-columns:1fr}.form-grid{grid-template-columns:repeat(2,1fr)}}@media(max-width:780px){.sidebar{width:72px;padding:15px 8px}.brand{justify-content:center;padding:3px 0 17px}.brand>div:not(.brand-mark){display:none}.nav button span,.nav-group-title,.subnav{display:none}.nav button{justify-content:center;padding:11px}.main{margin-left:72px;width:calc(100% - 72px)}.topbar{padding:0 16px}.content{padding:20px 15px 35px}.user>span{display:none}.page-head{flex-direction:column}.form-grid,.form-grid.two,.three-col{grid-template-columns:1fr}.metrics{grid-template-columns:1fr 1fr}.full{grid-column:auto}}@media(max-width:480px){.metrics{grid-template-columns:1fr}.card{padding:15px}.page-head h1{font-size:23px}.topbar{height:64px}}
</style>
</head>
<body>
<div id="login" class="login">
  <form id="loginForm" class="login-box">
    <div class="login-logo">LQ</div>
    <h1>Gestão psicopedagógica</h1>
    <p>Entre para acessar alunos, agenda, avaliações e financeiro.</p>
    <div class="field"><label>E-mail</label><input id="email" class="input" type="email" required autocomplete="email"></div>
    <div class="field"><label>Senha</label><input id="password" class="input" type="password" required autocomplete="current-password"></div>
    <button class="btn primary" type="submit">Entrar <i data-lucide="arrow-right"></i></button>
    <div id="loginError" class="error"></div>
  </form>
</div>
<div id="app" class="app hidden">
  <aside class="sidebar">
    <div class="brand"><div class="brand-mark">LQ</div><div><strong>Legado que Ensina</strong><small>Gestão psicopedagógica</small></div></div>
    <nav class="nav">
      <button data-nav="dashboard" class="active"><i data-lucide="layout-dashboard"></i><span>Dashboard</span></button>
      <div class="nav-group"><div class="nav-group-title">Dashboard</div><div class="subnav"><button data-nav="agenda"><i data-lucide="calendar-days"></i>Agenda</button><button data-nav="perfil"><i data-lucide="user-round-cog"></i>Meu perfil</button></div></div>
      <button data-nav="alunos"><i data-lucide="users"></i><span>Alunos</span></button>
      <div class="nav-group"><div class="nav-group-title">Alunos</div><div class="subnav"><button data-nav="waitlist"><i data-lucide="list-ordered"></i>Lista de espera</button></div></div>
      <button data-nav="avaliacoes"><i data-lucide="clipboard-check"></i><span>Avaliações</span></button>
      <button data-nav="financeiro"><i data-lucide="wallet-cards"></i><span>Financeiro</span></button>
      <button data-nav="recados"><i data-lucide="message-square"></i><span>Recados</span></button>
    </nav>
    <div class="side-bottom"><button id="logout" class="logout"><i data-lucide="log-out"></i><span>Sair</span></button></div>
  </aside>
  <main class="main">
    <header class="topbar"><div class="crumb"><i id="topIcon" data-lucide="layout-dashboard"></i><strong id="topTitle">Dashboard</strong></div><div class="user"><div id="avatar" class="avatar">P</div><span id="userName">Profissional</span></div></header>
    <div id="content" class="content"></div>
  </main>
</div>
<div id="toast" class="toast"></div>
<script>
const SUPABASE_URL='https://teujmiojdyytzpavritf.supabase.co';
const SUPABASE_ANON_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InRldWptaW9qZHl5dHpwYXZyaXRmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODc5NTYxMjUsImV4cCI6MjEwMzUzMjEyNX0.rGLzx-B1bdrlcaa9a_gAOHrDv52UGHQfg-dquLJtyIk';
const sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY);
const state={user:null,profile:null,view:'dashboard',studentTab:'all',students:[],waitlist:[],appointments:[],evaluations:[],payments:[],chart:null};
const titles={dashboard:['Dashboard','layout-dashboard'],agenda:['Agenda','calendar-days'],perfil:['Meu perfil','user-round-cog'],alunos:['Alunos','users'],waitlist:['Lista de espera','list-ordered'],avaliacoes:['Avaliações','clipboard-check'],financeiro:['Financeiro','wallet-cards'],recados:['Recados','message-square'],student:['Perfil do aluno','user-round']};
const $=s=>document.querySelector(s), esc=v=>String(v??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#039;','"':'&quot;'}[c]));
const money=v=>new Intl.NumberFormat('pt-BR',{style:'currency',currency:'BRL'}).format(Number(v||0));
const date=v=>v?new Date(v+'T00:00:00').toLocaleDateString('pt-BR'):'—';
const time=v=>v?String(v).slice(0,5):'—';
const today=()=>new Date().toISOString().slice(0,10);
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2600)}
function setTitle(k){const x=titles[k]||titles.dashboard;$('#topTitle').textContent=x[0];$('#topIcon').setAttribute('data-lucide',x[1]);lucide.createIcons()}
function status(v){const n=String(v||'pending').toLowerCase();if(['completed','paid','confirmado','concluido'].includes(n))return '<span class="badge ok">Concluído</span>';if(['cancelled','canceled'].includes(n))return '<span class="badge cancel">Cancelado</span>';return '<span class="badge pending">Pendente</span>'}
function nav(k){state.view=k;document.querySelectorAll('[data-nav]').forEach(b=>b.classList.toggle('active',b.dataset.nav===k));setTitle(k);render()}
async function select(table, filters={}, order='created_at', ascending=false){let q=sb.from(table).select('*');for(const [k,v] of Object.entries(filters)){if(v!==undefined&&v!==null&&v!=='')q=q.eq(k,v)}if(order)q=q.order(order,{ascending});const {data,error}=await q;if(error)throw error;return data||[]}
async function insert(table,payload){const row={...payload,user_id:state.user.id};const {data,error}=await sb.from(table).insert(row).select().single();if(error)throw error;return data}
async function update(table,id,payload){const {data,error}=await sb.from(table).update(payload).eq('id',id).eq('user_id',state.user.id).select().single();if(error)throw error;return data}
async function remove(table,id){const {error}=await sb.from(table).delete().eq('id',id).eq('user_id',state.user.id);if(error)throw error}
async function loadProfile(){const {data,error}=await sb.from('profiles').select('*').eq('id',state.user.id).maybeSingle();if(!error)state.profile=data||null;const name=state.profile?.full_name||state.user.user_metadata?.full_name||state.user.email?.split('@')[0]||'Profissional';$('#userName').textContent=name;$('#avatar').textContent=name.charAt(0).toUpperCase()}
function shell(head,body){return `<div class="page-head"><div><div class="eyebrow">GESTÃO PSICOPEDAGÓGICA</div><h1>${head}</h1></div></div>${body}`}
async function render(){try{if(state.view==='dashboard')return dashboard();if(state.view==='agenda')return agenda();if(state.view==='perfil')return profile();if(state.view==='alunos')return students();if(state.view==='waitlist')return waitlist();if(state.view==='avaliacoes')return evaluations();if(state.view==='financeiro')return finance();if(state.view==='recados')return messages();if(state.view==='student')return studentProfile()}catch(e){console.error(e);$('#content').innerHTML=`<div class="card"><div class="empty">Não foi possível carregar esta página.<br><small>${esc(e.message)}</small></div></div>`}}
async function dashboard(){const [st,ap,ev,py]=await Promise.all([select('students',{user_id:state.user.id},'name',true),select('appointments',{user_id:state.user.id,appointment_date:today()},'start_time',true),select('evaluations',{user_id:state.user.id},'evaluation_date',false),select('payments',{user_id:state.user.id},'payment_date',false)]);state.students=st;state.appointments=ap;state.evaluations=ev;state.payments=py;const pending=ev.filter(x=>!['completed','cancelled'].includes(String(x.status||'pending').toLowerCase())).length;const paid=py.filter(x=>['paid','pago','completed'].includes(String(x.status||'paid').toLowerCase())).reduce((s,x)=>s+Number(x.amount??x.value??0),0);$('#content').innerHTML=`<div class="page-head"><div><div class="eyebrow">VISÃO GERAL</div><h1>Olá, ${esc((state.profile?.full_name||state.user.email||'Profissional').split(' ')[0])} 👋</h1><p>Acompanhe sua prática em um só lugar.</p></div><div class="actions"><button class="btn soft" onclick="nav('alunos')"><i data-lucide="user-plus"></i>Novo aluno</button><button class="btn primary" onclick="nav('agenda')"><i data-lucide="calendar-plus"></i>Agendar</button></div></div><div class="grid metrics"><div class="card metric"><div class="metric-top"><span class="metric-label">Alunos</span><div class="metric-icon"><i data-lucide="users"></i></div></div><div class="metric-value">${st.length}</div><div class="metric-note">Cadastros ativos</div></div><div class="card metric"><div class="metric-top"><span class="metric-label">Hoje</span><div class="metric-icon"><i data-lucide="calendar-check"></i></div></div><div class="metric-value">${ap.length}</div><div class="metric-note">Atendimentos na agenda</div></div><div class="card metric"><div class="metric-top"><span class="metric-label">Avaliações</span><div class="metric-icon"><i data-lucide="clipboard-clock"></i></div></div><div class="metric-value">${pending}</div><div class="metric-note">Pendentes</div></div><div class="card metric"><div class="metric-top"><span class="metric-label">Recebido</span><div class="metric-icon"><i data-lucide="wallet"></i></div></div><div class="metric-value">${money(paid)}</div><div class="metric-note">Total registrado</div></div></div><div class="grid two-col" style="margin-top:16px"><div class="card"><div class="section-head"><div><div class="section-title">Agenda de hoje</div><div class="section-sub">Seus próximos atendimentos</div></div><button class="btn outline btn-sm" onclick="nav('agenda')">Ver agenda</button></div>${ap.length?`<div class="list">${ap.map(a=>`<div class="list-row"><div class="metric-icon"><i data-lucide="clock"></i></div><div class="list-main"><strong>${time(a.start_time)} · ${esc(a.student_name||'Atendimento')}</strong><span>${esc(a.type||a.notes||'Atendimento')}</span></div>${status(a.status)}</div>`).join('')}</div>`:'<div class="empty">Nenhum atendimento hoje.</div>'}</div><div class="card"><div class="section-head"><div><div class="section-title">Ações rápidas</div><div class="section-sub">Acesse os fluxos mais usados</div></div></div><div class="list"><button class="list-row" style="border:0;background:none;width:100%;text-align:left" onclick="nav('avaliacoes')"><div class="metric-icon"><i data-lucide="clipboard-check"></i></div><div class="list-main"><strong>Registrar avaliação</strong><span>Adicionar observações e resultados</span></div><i data-lucide="chevron-right"></i></button><button class="list-row" style="border:0;background:none;width:100%;text-align:left" onclick="nav('financeiro')"><div class="metric-icon"><i data-lucide="wallet-cards"></i></div><div class="list-main"><strong>Ver financeiro</strong><span>Receitas, pagamentos e gráficos</span></div><i data-lucide="chevron-right"></i></button><button class="list-row" style="border:0;background:none;width:100%;text-align:left" onclick="nav('waitlist')"><div class="metric-icon"><i data-lucide="list-ordered"></i></div><div class="list-main"><strong>Lista de espera</strong><span>Organizar novos interessados</span></div><i data-lucide="chevron-right"></i></button></div></div></div>`;lucide.createIcons()}
function studentForm(s={}){return `<div class="card inline-form"><div class="section-head"><div><div class="section-title">${s.id?'Editar aluno':'Cadastrar novo aluno'}</div><div class="section-sub">Preencha os dados diretamente nesta página.</div></div>${s.id?'<button class="btn outline" onclick="students()">Cancelar</button>':''}</div><form id="studentForm"><input type="hidden" name="id" value="${esc(s.id||'')}"><div class="form-grid"><div class="field"><label>Nome completo *</label><input class="input" name="name" required value="${esc(s.name||s.full_name||'')}"></div><div class="field"><label>Data de nascimento</label><input class="input" type="date" name="birth_date" value="${esc(s.birth_date||s.date_of_birth||'')}"></div><div class="field"><label>Telefone</label><input class="input" name="phone" value="${esc(s.phone||'')}"></div><div class="field"><label>E-mail</label><input class="input" type="email" name="email" value="${esc(s.email||'')}"></div><div class="field"><label>Responsável</label><input class="input" name="responsible_name" value="${esc(s.responsible_name||s.guardian_name||s.parent_name||'')}"></div><div class="field"><label>Telefone do responsável</label><input class="input" name="responsible_phone" value="${esc(s.responsible_phone||'')}"></div><div class="field full"><label>Observações</label><textarea class="textarea" name="notes">${esc(s.notes||s.observations||'')}</textarea></div></div><div class="form-actions"><button class="btn primary">${s.id?'Salvar alterações':'Cadastrar aluno'}</button></div></form></div>`}

async function finance(){state.students=await select('students',{user_id:state.user.id},'name',true);state.payments=await select('payments',{user_id:state.user.id},'payment_date',false);const paid=state.payments.filter(p=>['paid','pago','completed'].includes(String(p.status||'paid').toLowerCase()));const pending=state.payments.filter(p=>!['paid','pago','completed'].includes(String(p.status||'paid').toLowerCase()));const total=paid.reduce((s,p)=>s+Number(p.amount??p.value??0),0);const pendingValue=pending.reduce((s,p)=>s+Number(p.amount??p.value??0),0);const month=new Date().toISOString().slice(0,7);const monthTotal=paid.filter(p=>String(p.payment_date||'').startsWith(month)).reduce((s,p)=>s+Number(p.amount??p.value??0),0);$('#content').innerHTML=`<div class="page-head"><div><div class="eyebrow">GESTÃO FINANCEIRA</div><h1>Financeiro</h1><p>Visão completa das receitas e recebimentos.</p></div></div><div class="grid metrics"><div class="card metric"><div class="metric-label">Recebido total</div><div class="metric-value">${money(total)}</div><div class="metric-note">Pagamentos confirmados</div></div><div class="card metric"><div class="metric-label">Recebido no mês</div><div class="metric-value">${money(monthTotal)}</div><div class="metric-note">${new Date().toLocaleDateString('pt-BR',{month:'long'})}</div></div><div class="card metric"><div class="metric-label">A receber</div><div class="metric-value">${money(pendingValue)}</div><div class="metric-note">Pagamentos pendentes</div></div><div class="card metric"><div class="metric-label">Lançamentos</div><div class="metric-value">${state.payments.length}</div><div class="metric-note">Registros financeiros</div></div></div>${paymentForm()}<div class="grid two-col"><div class="card chart-card"><div class="section-head"><div><div class="section-title">Receita por mês</div><div class="section-sub">Últimos 6 meses</div></div></div><div class="chart-wrap"><canvas id="financeChart"></canvas></div></div><div class="card"><div class="section-head"><div><div class="section-title">Últimos lançamentos</div><div class="section-sub">Movimentações recentes</div></div></div>${state.payments.slice(0,8).map(p=>`<div class="list-row"><div class="list-main"><strong>${esc(p.description||p.student_name||'Pagamento')}</strong><span>${date(p.payment_date)} · ${esc(p.method||'')}</span></div><strong>${money(p.amount??p.value)}</strong></div>`).join('')||'<div class="empty">Nenhum pagamento registrado.</div>'}</div></div>`;document.getElementById('paymentForm').onsubmit=savePayment;const labels=[],vals=[];for(let i=5;i>=0;i--){const d=new Date();d.setMonth(d.getMonth()-i);const key=d.toISOString().slice(0,7);labels.push(d.toLocaleDateString('pt-BR',{month:'short'}));vals.push(paid.filter(p=>String(p.payment_date||'').startsWith(key)).reduce((s,p)=>s+Number(p.amount??p.value??0),0))}if(state.chart)state.chart.destroy();state.chart=new Chart(document.getElementById('financeChart'),{type:'bar',data:{labels,datasets:[{label:'Receita',data:vals,borderWidth:0,borderRadius:8}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}},scales:{y:{beginAtZero:true,ticks:{callback:v=>'R$ '+Number(v).toLocaleString('pt-BR')}},x:{grid:{display:false}}}}});lucide.createIcons()}

async function profile(){const p=state.profile||{};$('#content').innerHTML=`<div class="page-head"><div><div class="eyebrow">DASHBOARD · PERFIL</div><h1>Meu perfil</h1><p>Atualize seus dados diretamente na página.</p></div></div><div class="card"><form id="profileForm"><div class="form-grid two"><div class="field"><label>Nome completo</label><input class="input" name="full_name" value="${esc(p.full_name||state.user.user_metadata?.full_name||'')}"></div><div class="field"><label>E-mail</label><input class="input" value="${esc(state.user.email||'')}" disabled></div><div class="field"><label>Telefone</label><input class="input" name="phone" value="${esc(p.phone||'')}"></div><div class="field"><label>Especialidade</label><input class="input" name="specialty" value="${esc(p.specialty||'Psicopedagogia')}"></div><div class="field full"><label>Apresentação</label><textarea class="textarea" name="bio">${esc(p.bio||'')}</textarea></div></div><div class="form-actions"><button class="btn primary">Salvar alterações</button></div></form></div>`;document.getElementById('profileForm').onsubmit=saveProfile;lucide.createIcons()}
async function saveProfile(e){e.preventDefault();const f=new FormData(e.currentTarget);try{const payload={id:state.user.id,full_name:f.get('full_name')||'',phone:f.get('phone')||'',specialty:f.get('specialty')||'',bio:f.get('bio')||''};const {error}=await sb.from('profiles').upsert(payload,{onConflict:'id'});if(error)throw error;await loadProfile();toast('Perfil atualizado.');profile()}catch(err){toast('Erro: '+err.message)}}
async function messages(){const rows=await select('messages',{user_id:state.user.id},'created_at',false);$('#content').innerHTML=`<div class="page-head"><div><div class="eyebrow">COMUNICAÇÃO</div><h1>Recados</h1><p>Registre observações e comunicações importantes.</p></div></div><div class="card inline-form"><div class="section-title">Novo recado</div><form id="messageForm" style="margin-top:14px"><div class="form-grid two"><div class="field"><label>Título *</label><input class="input" name="title" required></div><div class="field"><label>Tipo</label><input class="input" name="type" placeholder="Responsável, interno..." ></div><div class="field full"><label>Mensagem *</label><textarea class="textarea" name="message" required></textarea></div></div><div class="form-actions"><button class="btn primary">Salvar recado</button></div></form></div><div class="card"><div class="section-title">Histórico</div>${rows.map(r=>`<div class="list-row"><div class="list-main"><strong>${esc(r.title||'Recado')}</strong><span>${date(String(r.created_at||'').slice(0,10))} · ${esc(r.message||'')}</span></div></div>`).join('')||'<div class="empty">Nenhum recado registrado.</div>'}</div>`;document.getElementById('messageForm').onsubmit=async e=>{e.preventDefault();const f=new FormData(e.currentTarget);try{await insert('messages',{title:f.get('title'),type:f.get('type')||'',message:f.get('message'),read:false});toast('Recado salvo.');messages()}catch(err){toast('Erro: '+err.message)}};lucide.createIcons()}
const _showStudentFormInline=showStudentForm;
window.showStudentForm=async(s={})=>{await students();_showStudentFormInline(s)};
$('#loginForm').onsubmit=async e=>{e.preventDefault();$('#loginError').textContent='';try{const {data,error}=await sb.auth.signInWithPassword({email:$('#email').value.trim(),password:$('#password').value});if(error)throw error;state.user=data.user;await loadProfile();$('#login').classList.add('hidden');$('#app').classList.remove('hidden');nav('dashboard')}catch(err){$('#loginError').textContent=err.message||'Não foi possível entrar.'}};
$('#logout').onclick=async()=>{await sb.auth.signOut();location.reload()};
document.querySelectorAll('[data-nav]').forEach(b=>b.onclick=()=>nav(b.dataset.nav));
(async()=>{lucide.createIcons();const {data}=await sb.auth.getSession();if(data.session){state.user=data.session.user;await loadProfile();$('#login').classList.add('hidden');$('#app').classList.remove('hidden');render()}})();
</script>
</body></html>
