function pdfSafe(v) { return String(v ?? "").replace(/[\r\n]+/g, " ").trim(); }

function pdfInstance() {
    if (!window.jspdf || !window.jspdf.jsPDF) { notify("A biblioteca de PDF não foi carregada."); return null; }
    return new window.jspdf.jsPDF({ unit: "mm", format: "a4" });
}

function pdfText(doc, text, x, y, maxWidth, lineHeight = 5) {
    const lines = doc.splitTextToSize(pdfSafe(text), maxWidth);
    lines.forEach(line => { if (y > 280) { doc.addPage(); y = 18; } doc.text(line, x, y); y += lineHeight; });
    return y;
}

function generateStudentPDF(id) {
    const s = getStudent(id);
    if (!s) return;
    ensureStudentModules(s);

    const doc = pdfInstance();
    if (!doc) return;
    const pageW = doc.internal.pageSize.getWidth();
    let y = 18;

    const heading = (title, size = 12) => {
        if (y > 270) { doc.addPage(); y = 18; }
        doc.setFont("helvetica", "bold");
        doc.setFontSize(size);
        doc.text(pdfSafe(title), 15, y);
        y += 6;
        doc.setFont("helvetica", "normal");
        doc.setFontSize(10);
    };
    const para = (value) => {
        y = pdfText(doc, String(value || "Não informado"), 15, y, pageW - 30);
        y += 4;
    };

    doc.setFont("helvetica", "bold");
    doc.setFontSize(18);
    doc.text("ASAS", 15, y);
    y += 8;
    doc.setFontSize(14);
    doc.text("Relatório clínico e pedagógico", 15, y);
    y += 8;
    doc.setFont("helvetica", "normal");
    doc.setFontSize(9);
    doc.text(`Gerado em ${fmtDate(today())}`, 15, y);
    y += 9;
    doc.setFont("helvetica", "bold");
    doc.setFontSize(13);
    doc.text(pdfSafe(s.nome), 15, y);
    y += 7;
    doc.setFont("helvetica", "normal");
    doc.setFontSize(10);
    para(`Idade: ${s.idade || "Não informada"} · Série/Ano: ${s.serie || "Não informado"}`);
    para(`Responsável: ${s.responsavel || "Não informado"}`);
    if ((s.tags || []).length) para(`Marcadores: ${s.tags.join(", ")}`);

    heading("Observações gerais");
    para(s.observacoes || "Nenhuma observação registrada.");

    heading("Histórico de evolução");
    const evs = (s.evolucoes || []).slice().sort((a, b) => (a.data || '').localeCompare(b.data || ''));
    if (!evs.length) para("Nenhuma evolução registrada.");
    evs.forEach(e => {
        heading(`${fmtDate(e.data)} · ${e.titulo || "Registro"}`, 10);
        para(e.texto);
    });

    heading("Comportamento observado nas consultas");
    const br = s.consultas.slice().sort((a, b) => (a.data || '').localeCompare(b.data || ''));
    if (!br.length) para("Nenhum registro de comportamento.");
    br.forEach(r => {
        heading(`Consulta de ${fmtDate(r.data)}`, 10);
        const labels = { participacao: "Participação", atencao: "Atenção", comunicacao: "Comunicação", autonomia: "Autonomia", comportamento: "Comportamento", emocional: "Aspecto emocional" };
        Object.entries(r.comportamentos || {}).forEach(([k, v]) => para(`${labels[k] || k}: ${v}`));
        if (r.observacoes) para(r.observacoes);
    });

    heading("Avaliações e atividades");
    const avs = s.avaliacoes || [];
    if (!avs.length) para("Nenhuma avaliação registrada.");
    avs.forEach(a => {
        heading(`${a.titulo} · ${fmtDate(a.data)}`, 10);
        if (a.objetivo) para(`Objetivo: ${a.objetivo}`);
        (a.resultados || []).forEach(r => {
            if (y > 260) { doc.addPage(); y = 18; }
            doc.setFont("helvetica", "bold");
            doc.setFontSize(9);
            doc.text(`Aplicação — ${fmtDate(r.data)}`, 15, y);
            y += 5;
            (a.questoes || []).forEach((q, i) => para(`${q.numero}. ${q.texto}\nResposta: ${r.respostas?.[i] || ""}`));
            if (r.resumo) para(`Resumo: ${r.resumo}`);
        });
    });

    heading("Informações recebidas da escola");
    if (s.escola.nome) para(`Escola: ${s.escola.nome}`);
    if (s.escola.professores) para(`Equipe/professora: ${s.escola.professores}`);
    const school = s.escola.registros.slice().sort((a, b) => (a.data || '').localeCompare(b.data || ''));
    if (!school.length) para("Nenhum contato com a escola registrado.");
    school.forEach(r => {
        heading(`${fmtDate(r.data)} · ${r.tipo || "Contato"} · ${r.assunto || "Registro escolar"}`, 10);
        para(`Contato: ${r.contato || "Não informado"}`);
        para(r.relato);
    });

    const safeName = (s.nome || "aluno").replace(/[^a-z0-9à-ÿ]+/gi, "-").replace(/^-|-$/g, "");
    doc.save(`relatorio-clinico-${safeName || "aluno"}.pdf`);
    notify("Relatório clínico e pedagógico salvo em PDF.");
}

function generateFinancePDF() {
    const doc = pdfInstance();
    if (!doc) return;
    const year = financeYear, m = financeMonth;

    const monthTx = (data.transacoes || []).filter(t => {
        const d = parseDate(t.data);
        return d.getFullYear() === year && d.getMonth() === m;
    }).sort((a, b) => (b.data || '').localeCompare(a.data || ''));

    const monthAppts = activeAppointments().filter(a => {
        const d = parseDate(a.data);
        return d.getFullYear() === year && d.getMonth() === m;
    }).sort((a, b) => (a.data + a.hora).localeCompare(b.data + b.hora));

    const received = monthTx.reduce((sum, t) => sum + Number(t.valor || 0), 0);
    const expected = monthAppts.reduce((sum, a) => sum + Number(getStudent(a.alunoId)?.valor || 0), 0);
    const pending = monthAppts.filter(a => !a.pago).reduce((sum, a) => sum + Number(getStudent(a.alunoId)?.valor || 0), 0);

    const pageW = doc.internal.pageSize.getWidth();
    let cursor = 18;

    doc.setFont("helvetica", "bold");
    doc.setFontSize(18);
    doc.text("ASAS", 15, cursor);
    cursor += 8;
    doc.setFontSize(14);
    doc.text(`Relatório financeiro — ${new Date(year, m, 1).toLocaleDateString("pt-BR", { month: "long", year: "numeric" })}`, 15, cursor);
    cursor += 8;
    doc.setFont("helvetica", "normal");
    doc.setFontSize(10);
    cursor = pdfText(doc, `Gerado em ${fmtDate(today())}`, 15, cursor, pageW - 30);
    cursor += 4;
    doc.setFont("helvetica", "bold");
    doc.text("Resumo", 15, cursor);
    cursor += 6;
    doc.setFont("helvetica", "normal");
    cursor = pdfText(doc, `Recebido: ${money(received)} · Previsto: ${money(expected)} · Pendente: ${money(pending)}`, 15, cursor, pageW - 30);
    cursor += 6;
    doc.setFont("helvetica", "bold");
    doc.text("Recebimentos confirmados", 15, cursor);
    cursor += 6;
    doc.setFont("helvetica", "normal");
    if (!monthTx.length) cursor = pdfText(doc, "Nenhum recebimento confirmado neste mês.", 15, cursor, pageW - 30);
    monthTx.forEach(t => {
        const st = getStudent(t.alunoId);
        cursor = pdfText(doc, `${fmtDate(t.data)} · ${st?.nome || "Aluno removido"} · ${t.descricao || "Recebimento"} · ${money(t.valor)} · Recebido`, 15, cursor, pageW - 30);
    });
    if (cursor > 260) { doc.addPage(); cursor = 18; }
    cursor += 5;
    doc.setFont("helvetica", "bold");
    doc.text("Pendências do mês", 15, cursor);
    cursor += 6;
    doc.setFont("helvetica", "normal");
    const pendingRows = monthAppts.filter(a => !a.pago);
    if (!pendingRows.length) cursor = pdfText(doc, "Nenhuma pendência no mês.", 15, cursor, pageW - 30);
    pendingRows.forEach(a => {
        const st = getStudent(a.alunoId);
        cursor = pdfText(doc, `${fmtDate(a.data)} ${a.hora} · ${st?.nome || "Aluno removido"} · ${money(st?.valor || 0)} · Pendente`, 15, cursor, pageW - 30);
    });
    if (cursor > 260) { doc.addPage(); cursor = 18; }
    cursor += 5;
    doc.setFont("helvetica", "bold");
    doc.text("Histórico financeiro do mês", 15, cursor);
    cursor += 6;
    doc.setFont("helvetica", "normal");
    monthAppts.forEach(a => {
        const st = getStudent(a.alunoId);
        cursor = pdfText(doc, `${fmtDate(a.data)} ${a.hora} · ${st?.nome || "Aluno removido"} · ${money(st?.valor || 0)} · ${a.pago ? "Pago" : "Pendente"}`, 15, cursor, pageW - 30);
    });

    doc.save(`relatorio-financeiro-${year}-${String(m + 1).padStart(2, "0")}.pdf`);
    notify("Relatório financeiro do mês salvo em PDF.");
}

function filterStudents(){
  const term=(document.getElementById('studentSearch')?.value||'').toLowerCase().trim();
  const mode=window.studentListFilter||'active';
  const all=(data.alunos||[]);
  let list=all.filter(a=>`${a.nome} ${a.responsavel} ${(a.tags||[]).join(' ')}`.toLowerCase().includes(term));
  if(mode==='active') list=list.filter(a=>a.ativo!==false);
  if(mode==='attention') list=list.filter(a=>{
    const upcoming=activeAppointments().some(x=>x.alunoId===a.id && x.data>=today() && !x.pago);
    return upcoming || !(a.evolucoes||[]).length;
  });
  const grid=document.getElementById('studentGrid'); if(!grid)return;
  if(!list.length){grid.innerHTML='<div class="card empty" style="grid-column:1/-1">Nenhum aluno encontrado com esse filtro.</div>';return;}
  grid.innerHTML=list.sort((a,b)=>a.nome.localeCompare(b.nome)).map(a=>{
    const consultas=(a.consultas||[]).length, aval=(a.avaliacoes||[]).length, evos=(a.evolucoes||[]).length;
    const next=activeAppointments().filter(x=>x.alunoId===a.id&&x.data>=today()).sort((x,y)=>(x.data+x.hora).localeCompare(y.data+y.hora))[0];
    const status=a.ativo!==false?'Ativo':'Inativo';
    return `<article class="card student-card-new ${a.ativo===false?'inactive':''}" onclick="openStudent('${a.id}')">
      <div class="student-card-top">${avatarHTML(a)}<div style="min-width:0;flex:1"><div class="student-name">${esc(a.nome)}</div><div class="student-card-meta">${a.idade?esc(a.idade)+' anos · ':''}${esc(a.serie||'Série não informada')}</div></div><span class="student-status ${a.ativo===false?'off':''}">${status}</span></div>
      <div class="tags">${(a.tags||[]).slice(0,3).map(t=>`<span class="tag">${esc(t)}</span>`).join('')||'<span class="student-card-meta">Sem marcadores</span>'}</div>
      <div class="student-card-body">
        <div class="student-info-box"><span>Consultas</span><b>${consultas}</b></div>
        <div class="student-info-box"><span>Evoluções</span><b>${evos}</b></div>
        <div class="student-info-box"><span>Avaliações</span><b>${aval}</b></div>
        <div class="student-info-box"><span>Próximo</span><b>${next?fmtDate(next.data)+' · '+next.hora:'Sem agenda'}</b></div>

    </article>`;
  }).join('');
  lucide.createIcons();

function getSavedVencimento(){
  try { return localStorage.getItem('asas_vencimento_mensalidade') || ''; } catch(e){ return ''; }
}
function setSavedVencimento(v){
  try { if(v) localStorage.setItem('asas_vencimento_mensalidade',v); else localStorage.removeItem('asas_vencimento_mensalidade'); } catch(e){}
}

  const p=data.professor||{};

async function saveProfile(){
  const p=data.professor||(data.professor={});
  p.nome=document.getElementById('profNome')?.value.trim()||'Professor ASAS';
  p.vencimentoMensalidade=document.getElementById('profVencimento')?.value||'';
  setSavedVencimento(p.vencimentoMensalidade);
  p.especialidade=p.especialidade||''; p.bio=p.bio||''; p.foto=p.foto||'';
  await saveData();
  updateUser();
  notify('Dados da conta atualizados.');
  renderPerfil();
}

      <div class="card panel"><div class="section-head"><div><div class="section-title">Movimentação</div><div class="section-sub">Lista limitada à área interna para não estourar a página.</div></div><button class="btn btn-primary btn-sm" onclick="showDespesaForm()"><i data-lucide="plus"></i>Nova despesa</button></div>
        <div class="finance-movement">${rec.length?rec.map(t=>{const s=getStudent(t.alunoId);return `<div class="eval-row"><div><b>${esc(s?.nome||'Recebimento')}</b><span>${fmtDate(t.data)} · ${esc(t.descricao||'Sessão')}</span></div><strong style="color:var(--sage2)">${money(t.valor)}</strong></div>`}).join(''):'<div class="empty">Nenhuma movimentação recebida neste mês.</div>'}</div>
        <div id="despesaFormCard" class="card panel" style="display:none;margin-top:14px;background:#fbfdfc"><div class="section-title">Registrar despesa</div><div class="form-grid two" style="margin-top:12px"><div class="field"><label class="label">Descrição</label><input id="despDescricao" class="input"></div><div class="field"><label class="label">Valor</label><input id="despValor" class="input" type="number" step="0.01"></div><div class="field"><label class="label">Data</label><input id="despData" class="input" type="date" value="${today()}"></div><div class="field"><label class="label">Categoria</label><select id="despCategoria" class="select"><option>Material didático</option><option>Aluguel / Espaço</option><option>Equipamentos</option><option>Capacitação / Cursos</option><option>Marketing / Divulgação</option><option>Transporte</option><option>Impostos</option><option>Outros</option></select></div></div><div class="form-actions"><button class="btn btn-primary" onclick="saveDespesa()">Salvar despesa</button><button class="btn btn-outline" onclick="document.getElementById('despesaFormCard').style.display='none'">Cancelar</button></div></div>
      </div>
      <div class="card panel"><div class="section-head"><div><div class="section-title">Pendências</div><div class="section-sub">Recebimentos ainda não confirmados.</div></div></div><div class="finance-pending">${ap.filter(a=>!a.pago).length?ap.filter(a=>!a.pago).map(a=>{const s=getStudent(a.alunoId);return `<div class="activity"><div class="activity-time">${a.hora}</div><div class="activity-dot" style="background:var(--amber)"></div><div class="activity-main"><b>${esc(s?.nome||'Aluno')}</b><span>${fmtDate(a.data)}</span></div><strong>${money(s?.valor||0)}</strong><button class="btn btn-primary btn-sm" onclick="togglePayment('${a.id}')">Receber</button></div>`}).join(''):'<div class="agenda-empty"><b>Nenhum pagamento pendente</b><span>O período está em dia.</span></div>'}</div></div>
    </div>`;
  lucide.createIcons();
}
</script></body></html>
